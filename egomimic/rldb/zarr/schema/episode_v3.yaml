# The declarative portion of the episode contract.
#
# This file selects fields and named checks, supplies their parameters, and
# assigns each rule a severity class. `validate.py` implements the schema
# interpreter and the named check predicates referenced here.
#
# Run it with:
#   python -m egomimic.rldb.zarr.validate <episode.zarr> [RULE FLAGS]
#
# ---------------------------------------------------------------------------
# attributes
#   required   true | false. A missing required attribute or array emits a
#              finding. An optional field emits no finding when absent.
#   severity   integrity | adoption | coverage | diagnostic
#              Integrity findings are always errors. Adoption and coverage
#              findings are warnings unless their named rule is required for this
#              invocation. Diagnostic findings are always warnings. Present fields must meet their declared type and
#              shape even when their presence requirement is waived.
#   name       Stable rule name when the attribute or key is not the desired
#              CLI flag stem. Dashes replace underscores in CLI flags.
#   why        User-facing reason for a waivable rule. This is required because
#              the schema generates CLI help and must explain what accepting a
#              gap gives up without relying on a separate rollout document.
#   type       str | int | bool | mapping
#   min        smallest accepted value for an int
#   choices    the accepted values
#   check      an attribute predicate implemented in `validate.py`
#
# checks
#   name       a predicate implemented in `validate.py`
#   required   whether a predicate failure emits a finding
#   severity   controls whether that finding can be waived, as described above
#   <other>    predicate-specific parameters
#
# arrays
#   key        an array key. `{side}` expands over arity-derived candidates,
#              filtered by resolved end-effectors; `*` selects stored matches.
#   required   true | false, as above. A wildcard key is never required.
#   severity   controls missing-key severity. Shape and dtype failures are
#              integrity errors for every array, including a waived one.
#   when       conditions on the resolved embodiment; skip the rule when any
#              condition does not hold
#   shape      expected dimensions, see below
#   dtype      int | float | object | any
#
# shape dimensions
#   T          `total_frames`. Axis 0 may be longer, because a stored array may
#              carry a padded tail; every other axis is exact.
#   arm_dof    the platform's joints per arm
#   aux_dof    the platform's auxiliary chain
#   ee_dof     the side's end-effector joints
#   kp3        three coordinates per slot in the side's keypoint topology
#   tactile    the side's declared taxels times its declared channels
#   <int>      exactly that many
#   "*"        any
#
# when conditions
#   platform_kind        robot | human
#   has_arm_chain        the platform declares `arm_dof`
#   has_aux_chain        the platform declares `aux`
#   end_effector_class   parallel_jaw | human_hand | dexterous_hand
# ---------------------------------------------------------------------------

version: v3.1
known_versions: [v3.0, v3.1]

attributes:
  embodiment:
    required: true
    severity: integrity
    type: str
    check: embodiment_name
  total_frames:
    required: true
    severity: integrity
    type: int
    min: 1
  fps:
    required: true
    severity: integrity
    type: int
    min: 1
  data_status:
    required: true
    severity: adoption
    why: >-
      Require an explicit data status so an incomplete structural sample
      cannot inherit the legacy "complete" default and enter training.
    type: str
    choices: [complete, structural_sample]
  task_name:
    required: true
    severity: integrity
    type: str
  task_description:
    required: false
    severity: integrity
    type: str
  features:
    required: true
    severity: integrity
    type: mapping
  schema_version:
    required: true
    severity: adoption
    why: >-
      Require a schema version so readers can select the episode contract
      explicitly instead of inferring it from whichever fields are present.
    type: str
    check: schema_version
  morphology:
    required: false
    severity: integrity
    type: mapping
    check: morphology
  calibration:
    name: calibration_block
    required: true
    severity: adoption
    why: >-
      Require the calibration block so camera models, distortion, resolution,
      and frame relationships are explicit. Legacy readers and consumer-specific
      fallbacks remain available without a new block.
    type: mapping
    check: calibration
  intrinsics:
    required: false
    severity: integrity
    # The compatibility reader accepts a bare matrix or camera-name mapping.
    check: calibration
  extrinsics:
    required: false
    severity: integrity
    type: mapping

checks:
  # Report missing calibration without rejecting usable stored data.
  - name: calibration_present
    required: true
    severity: coverage
    why: Require at least one camera matrix for consumers that need projection.

  # Match each stored `images.<camera>` stream to a camera entry carrying K.
  - name: camera_coverage
    required: true
    severity: coverage
    why: >-
      Require camera matrices for every stored view only for operations needing
      every view. Ego-only overlays do not require wrist camera calibration.

  # For a listed 7D pose track with at least two retained rows, report identical
  # rows or more than 1% exact +identity/-identity quaternions.
  - name: pose_degeneracy
    required: true
    severity: diagnostic
    suffixes: [obs_ee_pose, cmd_ee_pose, obs_head_pose]
    identity_rotation_fraction: 0.01

  # Report an exact identity pose stored for a non-reference camera, or a
  # numerically identity `base_T_cam` composed for an arm and the default camera.
  - name: calibration_degeneracy
    required: true
    severity: diagnostic

  # Report the exact synthetic-intrinsics signature `fx == fy == width`,
  # `cx == width / 2`, and `cy == height / 2`.
  - name: intrinsics_signature
    required: true
    severity: diagnostic

  # Reject non-increasing retained timestamps, stored keys containing
  # `relative_timestamp`, and a power-of-two step GCD of at least 64 ns (the
  # heuristic signature of float seconds converted to integer nanoseconds).
  - name: timestamps
    required: true
    severity: integrity
    key: obs_rgb_timestamps_ns
    banned_key_substrings: [relative_timestamp]

  # Validate declared spans; there is no annotation coverage floor.
  - name: annotation_intervals
    required: true
    severity: integrity
    key: annotations

  # For each side whose registry entry declares a URDF, sample at most 64
  # evenly spaced retained rows. Transform `obs_hand_keypoints` from the
  # episode frame into the hand-root frame defined by `obs_ee_pose`, compare
  # the valid slots with FK over `obs_hand_joints`, and reject a maximum
  # Euclidean distance above the registry's `fk_tolerance_m`.
  - name: fk_residual
    required: true
    severity: integrity
    joints_suffix: obs_hand_joints
    keypoints_suffix: obs_hand_keypoints
    pose_suffix: obs_ee_pose
    sample_frames: 64

  # A stored tactile array requires the side's end-effector registry entry to
  # declare its taxel count, channel count, and physical unit.
  - name: tactile_declaration
    required: true
    severity: integrity
    suffix: obs_tactile

  # Forbid the exact substring ` | ` in annotation text and task_description;
  # structured metadata needs a separate schema field.
  - name: annotation_text
    required: true
    severity: integrity
    key: annotations
    banned_delimiters: [" | "]

arrays:
  - key: "{side}.obs_ee_pose"
    required: true
    severity: integrity
    shape: [T, 7]
    dtype: float
    # Observed end-effector-root pose. Require one for every resolved side,
    # independent of the end-effector class.

  - key: "{side}.cmd_ee_pose"
    required: false
    severity: integrity
    shape: [T, 7]
    dtype: float

  - key: "{side}.obs_joints"
    when: {has_arm_chain: true}
    required: false
    severity: integrity
    shape: [T, arm_dof]
    dtype: float

  - key: "{side}.cmd_joints"
    when: {has_arm_chain: true}
    required: false
    severity: integrity
    shape: [T, arm_dof]
    dtype: float

  - key: "{side}.obs_gripper"
    when: {end_effector_class: parallel_jaw}
    required: true
    severity: integrity
    shape: [T, 1]
    dtype: float

  - key: "{side}.cmd_gripper"
    when: {end_effector_class: parallel_jaw}
    required: true
    severity: integrity
    shape: [T, 1]
    dtype: float

  - key: "{side}.obs_hand_joints"
    when: {end_effector_class: dexterous_hand}
    required: true
    severity: integrity
    shape: [T, ee_dof]
    dtype: float
    # Observed joint values in registry `joint_names` order. Revolute and
    # continuous joints use radians; prismatic joints use metres.

  - key: "{side}.cmd_hand_joints"
    when: {end_effector_class: dexterous_hand}
    required: true
    severity: integrity
    shape: [T, ee_dof]
    dtype: float
    # Commanded joint values use the same column order and units as
    # `obs_hand_joints`.

  - key: "{side}.obs_hand_keypoints"
    when: {end_effector_class: dexterous_hand}
    required: true
    severity: integrity
    shape: [T, kp3]
    dtype: float
    # Observed robot-hand XYZ positions, flattened in the registry topology's
    # slot order and expressed in the same episode frame as `obs_ee_pose`.

  - key: "{side}.obs_keypoints"
    when: {end_effector_class: human_hand}
    required: false
    severity: integrity
    shape: [T, kp3]
    dtype: float

  - key: "{side}.obs_aria_keypoints"
    when: {end_effector_class: human_hand}
    required: false
    severity: integrity
    shape: [T, kp3]
    dtype: float

  - key: obs_aux_joints
    when: {has_aux_chain: true}
    required: true
    severity: integrity
    shape: [T, aux_dof]
    dtype: float
    # Observed platform auxiliary-chain joints. Columns follow the registry's
    # `aux.joint_names` order when names are declared.

  - key: cmd_aux_joints
    when: {has_aux_chain: true}
    required: true
    severity: integrity
    shape: [T, aux_dof]
    dtype: float
    # Commanded auxiliary-chain joints use the same column order as
    # `obs_aux_joints`.

  - key: "{side}.obs_tactile"
    required: false
    severity: integrity
    shape: [T, tactile]
    dtype: float
    # Flattened taxel channels. The registry supplies the expected width and
    # physical unit.

  - key: obs_head_pose
    required: false
    severity: integrity
    shape: [T, 7]
    dtype: float

  # Canonical RGB timestamp array. When present it must be one-dimensional,
  # integer-valued, and at least `total_frames` long.
  - key: obs_rgb_timestamps_ns
    name: rgb_timestamps
    required: true
    severity: coverage
    why: >-
      Require integer UTC-nanosecond RGB timestamps so streams can be aligned
      without reconstructing the capture clock after the recording is over.
    shape: [T]
    dtype: int

  - key: "images.*"
    required: false
    severity: integrity
    shape: [T]
    dtype: object

  - key: annotations
    required: false
    severity: integrity
    shape: ["*"]
    dtype: object
