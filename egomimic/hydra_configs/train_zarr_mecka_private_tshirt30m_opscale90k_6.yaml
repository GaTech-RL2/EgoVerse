# train_zarr_mecka_private_tshirt30m_opscale_6 extended to 90k steps (the 30-min ops10 2x
# length), resumed from its 30m2x pre-decay checkpoint by
# logs/mecka_private_opscale30m90k/launch_pair.sbatch.
defaults:
  - train_zarr_mecka_private_tshirt30m_opscale_6
  - _self_

trainer:
  max_epochs: 900
  min_epochs: 900

# Every 10%; the 80% one is the decay start.
callbacks:
  model_checkpoint:
    every_n_epochs: 90
