# Composed recipe: ABC-DiT (DINOv3 + CLIP text -> cross-attention DiT) BC on
# the 144-D wrist-frame MANO keypoint action, mecka FLAGSHIP fold-clothes,
# seen/unseen operator split. Same data, evaluators and val heads as
# train_zarr_mecka_flagship_kp_{hpt,qwenvla,flowvla}, so runs compare directly
# with those arms.
#
#   python egomimic/trainHydra.py --config-name=train_zarr_mecka_flagship_kp_abc_dit \
#     model=abc_dit_bc_mecka_kp_b data=mecka_fold_flagship_top3_hpt_keypoints \
#     norm_stats.precomputed_norm_path=<out>/norm_stats
#
# The size is the model config: abc_dit_bc_mecka_kp_{s,b,l,xl} (153M / 290M /
# 746M / 2.0B including the 85.7M DINOv3 tower). This recipe selects b, the
# rung closest to the HPT-300M reference arm; every other rung is a one-word
# `model=` override.
#
# The flagship annotations are empty, so every prompt is "fold clothes";
# embodiment_label is off, so the string matches the HPT arm's exactly.
#
# Norm stats are data-only: reuse the baseline's
# logs/hpt_architecture/norm_stats/mecka_fold_flagship_top3_hpt_keypoints/norm_stats.
defaults:
  - train_zarr_cartesian
  - evaluator@train_viz_evaluator: train_viz_hpt_keypoints_wrist
  - override model: abc_dit_bc_mecka_kp_b
  - override data: mecka_fold_flagship_opsplit_hpt_keypoints
  - override evaluator: eval_hpt_keypoints_wrist
  - _self_

model:
  robomimic_model:
    default_prompt: "fold clothes"
