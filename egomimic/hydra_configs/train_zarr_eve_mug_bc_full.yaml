# real_mug BC on the single-arm Franka + ORCA rig. Clone of
# train_zarr_eve_obj_bc_full.yaml with the single-wrist-camera model / schematic.
defaults:
  - model: hpt_bc_flow_eve_right_arm_rwrist_full
  - visualization: eve_right_arm_cartesian_mug
  - paths: default
  - trainer: ddp
  - debug: null
  - logger: wandb_offline
  - data: mug_eve_local_full
  - callbacks: checkpoints_full
  - data_schematic: eve_right_arm_rwrist
  - evaluator: eval_hpt
  - override hydra/launcher: submitit
  - _self_

name: ${oc.env:RUN_NAME,mug_BC_full}
description: ${oc.env:RUN_NAME,mug_BC_full}
ckpt_path: null
mode: train

hydra:
  run:
    dir: ${oc.env:EVE_HYDRA_RUN_DIR,./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}}
  sweep:
    dir: ${oc.env:EVE_HYDRA_RUN_DIR,./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}}

launch_params:
  gpus_per_node: 4
  nodes: 1

seed: 42

trainer:
  max_epochs: 2000
  min_epochs: 1
  check_val_every_n_epoch: 100
  num_sanity_val_steps: 0
  limit_train_batches: 100
  limit_val_batches: 64
  precision: bf16-mixed

norm_stats:
  sample_frac: 0.1
  num_workers: 4
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
reject_outliers: false
