# DFoT val-data evaluator. Teacher-forced action prediction over val
# episodes with two modes overlaid in a single mp4 per episode:
#   * full_chunk: one-shot DDIM denoising over the entire episode action
#     sequence.
#   * ar (staircase): rolling causal-AR denoising; configurable staircase
#     geometry via ar_chunk_size (width) and ar_step_size (height).
#
# Use with packed val data (tsimulation_full.yaml / tsimulation.yaml).
# Does NOT touch a simulator — for closed-loop coverage use eval_hnet_sim.

_target_: egomimic.eval.eval_dfot_val.DFoTValEval

# ---- mode toggles ----
do_full_chunk: true
do_ar: true

# ---- full-chunk knobs ----
# DDIM steps over the full episode. Higher = better but slower per val pass.
n_chunk_steps: 50

# ---- AR / staircase knobs ----
# chunk_size = staircase "width" — tokens that share a rung's noise level.
#   1 = vanilla causal-AR (one token per rung)
#   k = k tokens denoise together as a rung
# step_size = staircase "height" — denoising steps per rung.
#   1 = each step advances all tokens by one schedule unit
#   k = k denoise iterations per rung before the chunk commits
ar_chunk_size: 1
ar_step_size: 1

# ---- shared knobs (match eval_hnet_sim shape) ----
limit_val_batches: 4
max_videos: 2
coverage_threshold: 0.7   # ignored; present for config-shape parity
embodiment_name: pushshapes_sim
env_kwargs: null          # ignored; present for config-shape parity
viz_func: null
transform_lists: null
