# Default Pi train_viz head around eval_pi. Optional: train_viz wraps the
# canonical evaluator by default; select this to pin a different base with
# `+evaluator@train_viz_evaluator=train_viz_pi`. See
# egomimic/eval/eval_train_viz.py.
defaults:
  - /evaluator@base: eval_pi
  - _self_

_target_: egomimic.eval.eval_train_viz.PrefixedEvalVideo
