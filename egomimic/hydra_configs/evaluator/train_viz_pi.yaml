# Wraps the default Pi evaluator (eval_pi) so the same forward/metric/viz
# logic runs a second time against the `train_viz` dataloader. The wrapped
# `base` evaluator owns compute_metrics_and_viz; this wrapper writes videos to
# `videos_train_viz/` and prefixes metric keys with `train_viz/`.
#
# Optional: the train_viz head is on by default (train_viz=true) and wraps
# the canonical `evaluator` over `train_viz_datasets`, or the train split
# when the data config declares none. Select this explicitly only to pin a
# different base:
#   `+evaluator@train_viz_evaluator=train_viz_pi`
#
# `base` is composed separately from the canonical `evaluator`, so CLI
# overrides of `evaluator.viz_every_n_epochs` / `viz_max_batches` do NOT
# reach this head; override `train_viz_evaluator.base.<key>` as well.

defaults:
  - /evaluator@base: eval_pi
  - _self_

_target_: egomimic.eval.eval_train_viz.TrainVizEvalVideo

# Cap on batches consumed from the train_viz loader per validation epoch in
# eval-only mode. During fit-validation the trainer's limit_val_batches
# applies per-dataloader.
limit_val_batches: 50
