# Standard validation evaluator for HNet-style models on pushshapes_sim.
#
# Layout (top-level EvalList runs both sub-evals; each emits its own .mp4):
#   1. ``composite`` — EvalListSideBySide([
#          HNetEvalVideo,        # teacher-forced trajectory overlay
#          PCATokenEval,         # PCA scatter trail of action-out tokens
#          BoundaryStripEval,    # chunker P(boundary) gradient strip
#      ]) — saves one wide .mp4 with the three panels side-by-side.
#      BoundaryStripEval gracefully skips embodiments where the policy
#      has no chunker (e.g. FlatFusedPolicy) so the same config works
#      for both stage-based and flat H-Net variants.
#   2. ``sim`` — SimRolloutEval — closed-loop sim rollout via
#      PushShapesEnv, replay-init mode. Saves a separate .mp4.

_target_: egomimic.eval.eval_composite.EvalList

evals:
  - _target_: egomimic.eval.eval_composite.EvalListSideBySide
    pad_h: max    # pad short panels to the tallest, instead of cropping
                  # tall ones — the boundary strip is window*pps (256px)
                  # while PCA and the HNet video are taller; ``min`` was
                  # clipping ~1/3 of the height off them.
    limit_val_batches: 4
    evals:
      - _target_: egomimic.eval.eval_hnet.HNetEvalVideo
        limit_val_batches: 4
        viz_func:
          pushshapes_sim:
            _target_: hydra.utils.get_method
            path: egomimic.rldb.embodiment.pushshapes.viz_gt_preds
      - _target_: egomimic.eval.eval_pca_tokens.PCATokenEval
        limit_val_batches: 4
        panel_h: 384
        panel_w: 384
        n_components: 2
      - _target_: egomimic.eval.eval_boundary_strip.BoundaryStripEval
        limit_val_batches: 4
        window: 256
        strip_width: 24
        pixels_per_step: 1
  - _target_: egomimic.eval.eval_sim.SimRolloutEval
    limit_val_batches: 4
    embodiment_name: pushshapes_sim
    init_mode: replay
    max_steps: null    # use recorded episode length
    coverage_threshold: 0.7
    env_kwargs:
      object_shape: T
      pusher_shape: circle
      obstacle_level: 0
      image_size: 96
