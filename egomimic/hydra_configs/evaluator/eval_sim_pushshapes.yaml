# Sim rollout eval for the 11-embodiment PushShapes cotrain.
#
# Without this the run reports train/val loss only. A seen-BC vs unseen-
# embodiment comparison is defined in terms of task success, so loss alone
# cannot answer it -- the launcher previously passed ~evaluator, which silently
# produced runs with no SR at all.
#
# One SimRolloutEval per embodiment, composed with EvalVideoList (which already
# exists; there is no MultiEvaluatorWrapper). The 11 trained embodiments give
# seen-embodiment BC. circle_small and suction are NOT in the training mixture
# and give unseen generalization -- circle_small is mechanically near-identical
# to circle (interpolation) while suction is the only non-pushing mechanism
# (extrapolation), so the pair brackets the transfer question.
#
# coverage_threshold matches the simulator's own SUCCESS_THRESHOLD (0.95 IoU).
# A lower bar would report successes the environment does not count.

_target_: egomimic.eval.core.eval_composite.EvalVideoList
evals:
  - _target_: egomimic.eval.core.eval_sim.SimRolloutEval
    embodiment_name: pushshapes_sim_L
    env_kwargs:
      object_shape: T
      pusher_shape: L
      obstacle_level: 0
      image_size: 96
    init_mode: seeds
    init_seeds: [0, 1, 2, 3, 4, 5, 6, 7]
    max_steps: 600
    coverage_threshold: 0.95
    limit_val_batches: 8
    max_videos: 1
  - _target_: egomimic.eval.core.eval_sim.SimRolloutEval
    embodiment_name: pushshapes_sim_chain_gripper
    env_kwargs:
