# Cam-frame all-cartesian Pi train_viz head around eval_pi_camframe_6d (needs
# the human transform mode overridden to `cartesian_6d`). Optional: train_viz
# wraps the canonical evaluator by default; select this to pin a different base
# with `+evaluator@train_viz_evaluator=train_viz_pi_camframe_6d`. See
# egomimic/eval/eval_train_viz.py.
defaults:
  - /evaluator@base: eval_pi_camframe_6d
  - _self_

_target_: egomimic.eval.eval_train_viz.PrefixedEvalVideo
