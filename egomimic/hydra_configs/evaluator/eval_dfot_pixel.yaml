# DFoT pixel-space evaluator (no VAE decode needed).
#
# Single sub-eval: DFoTPixelVideoRolloutEval -- generates video frames
# directly from the pixel diffusion model + per-step MSE vs GT frames.

_target_: egomimic.eval.core.eval_composite.EvalList

evals:
  - _target_: egomimic.eval.dfot.eval_dfot_pixel_video_rollout.DFoTPixelVideoRolloutEval
    rollout_steps: 9
    upscale_to: 384
    max_videos: 2
    limit_val_batches: 4
    embodiment_name: "pushshapes_sim"
    image_key: "front_img_1"
    recon_loss_n_frames: 9
    mode: "chunk"
    n_chunk_steps: 50
    cfg_scale: 1.0
    video_subdir: "videos_pixel_rollout"
