# Action-prediction eval for the 2D policy: clean obs history -> predict next
# action chunk, compare predicted future actions to GT (action MSE) + decode
# predicted latents into a [GT|pred] video.
_target_: egomimic.eval.core.eval_composite.EvalList

evals:
  - _target_: egomimic.eval.dfot.eval_dfot_policy.DFoTPolicyActionEval
    n_context_frames: 4
    rollout_steps: 32
    n_chunk_steps: 50
    embodiment_name: "pushshapes_sim"
    image_key: "front_img_1"
    recon_loss_n_frames: 20
    upscale_to: 384
    max_videos: 2
    limit_val_batches: 4
    video_subdir: "videos_policy_action"
