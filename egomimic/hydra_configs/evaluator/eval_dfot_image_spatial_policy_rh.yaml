# Receding-horizon action eval for the 2D policy. Slides an anchor across each
# episode, predicts the next k=1,2 actions from CLEAN GT history (short T=n_ctx+k
# rollout), scores vs GT in normalized action space, pooled over all anchors x
# max_episodes. Headline: rh_k1_action_mse_overall. Decoupled max_episodes (NOT
# max_videos) so statistics aren't limited to 2 episodes.
_target_: egomimic.eval.core.eval_composite.EvalList

evals:
  - _target_: egomimic.eval.dfot.eval_dfot_policy_receding_horizon.DFoTPolicyRecedingHorizonEval
    n_context_frames: 4
    n_chunk_steps: 50
    k_actions: [1, 2]
    max_episodes: 12
    anchor_stride: 2
    embodiment_name: "pushshapes_sim"
    image_key: "front_img_1"
    limit_val_batches: 4
    max_videos: 2
    video_subdir: "videos_policy_rh"
