# Robot-only teacher-forced Fold overlay and fully denoised action metrics.
_target_: egomimic.eval.human_robot_overlay_eval.HumanRobotOverlayEval

viz_func:
  eva_bimanual:
    _target_: egomimic.rldb.embodiment.eva.Eva.viz_gt_preds
    _partial_: true
    image_key: front_img_1
    action_key: actions_cartesian
    mode: traj
    intrinsics_batch_key: front_intrinsics
    extrinsics_batch_keys:
      left: left_camera_extrinsics
      right: right_camera_extrinsics

transform_lists:
  eva_bimanual:
    _target_: egomimic.rldb.embodiment.eva.build_fold_cartesian_wristframe_revert_transform_list

limit_val_batches: 2
chunk_len: 100
image_key: front_img_1
frame_stride: 10
max_frames: 120
