defaults:
  - viz@viz_func: pi_cartesian_lang
  - _self_

_target_: egomimic.eval.eval_pi.PIEvalVideo

# Render the val viz video only when (current_epoch + 1) is a multiple of
# this; metrics still log on every validation pass. Keep it a multiple of
# trainer.check_val_every_n_epoch or viz never coincides with a validation run.
viz_every_n_epochs: 100

# Per-embodiment revert transform. Applied once during validation to project
# the model's wrist-frame action chunks back to cam (head) frame, then reused
# for both the cam-frame MSE and the viz video. Each value resolves to a
# list[Transform] via its ``_target_``. Must match whichever viz config is
# mounted above.
transform_lists:
  eva_bimanual:
    _target_: egomimic.rldb.embodiment.eva._build_eva_bimanual_revert_eef_frame_transform_list
    is_quat: false
  human_bimanual:
    _target_: egomimic.rldb.embodiment.human._build_human_cartesian_revert_eef_frame_transform_list
    is_quat: false
