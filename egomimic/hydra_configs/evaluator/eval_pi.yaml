defaults:
  - eval_pi_camframe_6d
  - _self_

# Back-compat alias so `evaluator=eval_pi` (the train_zarr_cartesian_pi default
# on main) keeps composing. PI now only trains on the continuous-6D action
# layout, so the xyz+ypr wrist-frame revert this file used to carry matches no
# PI data config any more. It resolves to the cam-frame 6D evaluator — the new
# train_zarr_cartesian_pi default, paired with the `cartesian_6d` data mode
# (the cotrain_pi_base default). For wrist-frame data
# (`cartesian_wristframe_6d`) use evaluator=eval_pi_wristframe_6d instead.
