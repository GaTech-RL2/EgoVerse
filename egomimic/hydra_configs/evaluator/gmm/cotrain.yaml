# @package evaluator
# Combined eval: overlay(traj)+PCA+boundary-strip-below + open-loop-8 sim.
_target_: egomimic.eval.core.eval_composite.EvalList
evals:
  - _target_: egomimic.eval.core.eval_composite.EvalVideoList
    pad_h: max
    below_indices: [2]
    limit_val_batches: 2
    evals:
      - _target_: egomimic.eval.core.eval_hnet.HNetEvalVideo
        limit_val_batches: 2
        max_videos: 2
        viz_func:
          pushshapes_sim:
            _target_: hydra.utils.get_method
            path: egomimic.rldb.embodiment.pushshapes.viz_gt_preds
          pushshapes_sim_small_circle:
            _target_: hydra.utils.get_method
            path: egomimic.rldb.embodiment.pushshapes.viz_gt_preds
      - _target_: egomimic.eval.probes.eval_pca_tokens.PCATokenEval
        limit_val_batches: 2
        max_videos: 2
        panel_h: 384
        panel_w: 384
        n_components: 2
      - _target_: egomimic.eval.probes.eval_boundary_strip.BoundaryStripEval
        limit_val_batches: 2
        max_videos: 2
        window: 256
        strip_width: 24
        pixels_per_step: 1
  - _target_: egomimic.eval.core.eval_sim.HNetSimEval
    limit_val_batches: 2
    max_videos: 2
    env_kwargs:
      object_shape: "T"
      pusher_shape: "circle"
      obstacle_level: 0
      image_size: 96
    init_mode: "replay"
