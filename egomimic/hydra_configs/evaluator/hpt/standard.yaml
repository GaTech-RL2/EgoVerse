# @package evaluator
# Standard validation evaluator for HPT on pushshapes_sim.
#
# Skips the composite (trajectory-overlay + PCA + boundary-strip) since:
#  - HPT has no chunker → BoundaryStripEval has nothing to render.
#  - HPT's trajectory-overlay viz path differs from HNet's; can be wired
#    in later via an ``HPTEvalVideo`` analog of ``HNetEvalVideo``.
#
# For now HPT only gets the closed-loop sim rollout, which IS algo-agnostic.

_target_: egomimic.eval.core.eval_sim.HPTSimEval
limit_val_batches: 4
embodiment_name: pushshapes_sim
init_mode: replay
max_steps: 1200
coverage_threshold: 0.7
env_kwargs:
  object_shape: T
  pusher_shape: circle
  obstacle_level: 0
  image_size: 96
