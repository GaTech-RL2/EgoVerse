# Closed-loop sim rollout for the ARC-TOK HPT policy.
#
# The policy's (M+1, A) output carries no time base, so every chunk is
# DETOKENIZED before execution: the velocity token turns the chunk's chord into
# a duration, and the M waypoints are resampled onto the dt grid
# (expand_arc_chunk_to_time — inverse of the dataloader's
# TokenizePushShapesArcLength). ArcSimEval asserts the ckpt's arc_tok grid
# matches the values below and logs what the detokenizer produced:
# Valid/emb*_arc_frames_per_chunk / _arc_chunk_duration_s / _arc_replans /
# _arc_maxframes_frac.
#
# arc_min_distance_unit / arc_points MUST equal the tokenizer's
# min_distance_unit / resampled_vector_length in
# data/pushshapes/pusht/*_arc.yaml, and the rollout knobs below must match
# evaluator/hpt/sim_pusht.yaml or the arc-vs-nonarc numbers aren't comparable.
_target_: egomimic.eval.hpt.eval_sim_arc.ArcSimEval

arc_min_distance_unit: 100.0
arc_dt: 0.033333
arc_points: 40
require_arc_tok: true

limit_val_batches: 25
max_videos: 4
embodiment_name: pushshapes_sim

init_mode: seeds
init_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
             1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
             1020, 1021, 1022, 1023, 1024]

max_steps: 600
rollout_timeout_s: 600
report_max_coverage: true
coverage_threshold: 0.95
run_full_horizon: true
video_fps: 30
viz_func: null

env_kwargs:
  object_shape: T
  pusher_shape: circle
  obstacle_level: 0
  image_size: 96
