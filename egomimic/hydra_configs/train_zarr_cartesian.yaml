defaults:
  - model: hpt/bc_flow_eva
  - paths: default
  - trainer: ddp/base
  - debug: null
  - logger: wandb/base
  - data: debug/single_episode/eva_cartesian
  - callbacks: checkpoint/base
  - evaluator: hpt/base
  - override hydra/launcher: submitit
  - _self_

name: test
description: test
ckpt_path: null
mode: train

hydra:
  run:
    # Dir should be experiment_name/description_{timestamp}
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

launch_params:
  gpus_per_node: 1
  nodes: 1

seed: 42

# Arc-length tokenizer defaults. Data configs read ${arc_tokenizer.*} to keep
# tokenization params consistent between train and eval — override per-run to
# retokenize (e.g. arc_tokenizer.min_distance_unit=0.4 for D40).
arc_tokenizer:
  min_distance_unit: 0.20
  resampled_vector_length: 15

# Normalization and norm-stat cache settings (override per-run as needed).
norm_stats:
  norm_mode: quantile
  sample_frac: 1.0
  num_workers: 4
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
reject_outliers: true
