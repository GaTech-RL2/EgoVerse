defaults:
  - model: hpt_bc_flow_eva
  - paths: default
  - trainer: ddp
  - debug: null
  - logger: wandb
  - data: eva
  - callbacks: checkpoints
  - evaluator: eval_hpt
  - override hydra/launcher: submitit
  - _self_

name: test
description: test
ckpt_path: null
mode: train

# When mode=eval, keep the configured logger (e.g. wandb) so validation metrics
# are pushed to the dashboard instead of only printing. Set false to restore the
# historical "eval disables logger" behavior.
eval_logger: true

# Optional second evaluator that runs against the train_viz dataloader.
# Set via override, e.g. `+train_viz_evaluator=train_viz_pi`, together with a
# data config that defines `train_viz_datasets`.
train_viz_evaluator: null

# When true, run a single validation pass (metrics + viz) at epoch 0 before any
# parameter updates, as a pre-fit baseline. Uses the in-memory init weights, so
# this is the untrained/pretrained-backbone baseline. Skipped on SLURM requeue.
val_at_start: false

hydra:
  run:
    # Dir should be experiment_name/description_{timestamp}
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

launch_params:
  gpus_per_node: 4
  nodes: 1

seed: 42

# Normalization and norm-stat cache settings (override per-run as needed).
norm_stats:
  norm_mode: quantile
  sample_frac: 0.2
  num_workers: 6
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: /storage/project/r-dxu345-0/rco3/EgoVerse/logs/norm_stats
reject_outliers: true
