# Full private fold_tshirt: all 10 operators, 5 held out each.
# Recipe of train_zarr_mecka_private_tshirt_opscale_10 (RDT-1B keypoints, 4 GPUs x
# 32, EMA, WSD LR decaying over the last 20%). Generated by make_full_configs.py.
defaults:
  - train_zarr_mecka_freeform_fold_kp_rdt_op2
  - override data: mecka_private_tshirt_full
  - _self_

model:
  ema:
    enabled: true
  scheduler:
    stable: 131000
    decay: 33000

trainer:
  max_epochs: 1650
  min_epochs: 1650

# Two checkpoints: each is ~23 GB on NFS with the EMA weights.
callbacks:
  model_checkpoint:
    every_n_epochs: 825
