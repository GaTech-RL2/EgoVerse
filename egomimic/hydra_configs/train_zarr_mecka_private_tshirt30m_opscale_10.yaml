# train_zarr_mecka_private_tshirt_opscale_10 on the 30-min-per-operator data:
# 450 x 100 steps, val every 1000 steps, WSD with 500-step warmup.
# Generated; see data/mecka_private_tshirt30m_opscale_10.
defaults:
  - train_zarr_mecka_private_tshirt_opscale_10
  - override data: mecka_private_tshirt30m_opscale_10
  - _self_

trainer:
  max_epochs: 450
  min_epochs: 450
  check_val_every_n_epoch: 10

callbacks:
  model_checkpoint:
    every_n_epochs: 225

model:
  scheduler:
    warmup: 500
    stable: 35500
    decay: 9000
