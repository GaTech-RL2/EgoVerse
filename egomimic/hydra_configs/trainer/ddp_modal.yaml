defaults:
  - default

# Modal is always single-node. Set launch_params.gpus_per_node on the CLI
# to match the GPU count requested (e.g. +modal_gpu=A100:4 → gpus_per_node=4).
strategy: ddp_find_unused_parameters_true

accelerator: gpu
devices: ${launch_params.gpus_per_node}
num_nodes: 1
sync_batchnorm: True
check_val_every_n_epoch: 5
num_sanity_val_steps: 0

# Sentinel: trainHydra.py detects this and auto-submits to Modal instead of
# running locally. Do NOT set this in any other trainer config.
_modal: true
