defaults:
  - default

strategy: ddp_find_unused_parameters_true

accelerator: gpu
devices: ${eval:'${launch_params.gpus_per_node} * ${launch_params.nodes}'}
num_nodes: ${launch_params.nodes}
sync_batchnorm: True
# eval every 50 epochs; viz (viz_every_n_epochs: 100 in the pi evaluators)
# fires on every 2nd val, alongside the checkpoint save (every_n_epochs: 100).
check_val_every_n_epoch: 50
num_sanity_val_steps: 0