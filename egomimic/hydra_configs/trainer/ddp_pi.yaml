defaults:
  - default

strategy: ddp_find_unused_parameters_true

# Validate under torch.no_grad instead of torch.inference_mode: the compiled
# pi sampler (max-autotune -> cudagraphs) does in-place setup on its static
# buffers during graph capture, which is illegal on inference tensors
# ("Inplace update to inference tensor outside InferenceMode"). Triggered by
# the M-sample val metrics' repeated sample_actions calls. no_grad is
# functionally equivalent for eval and creates no inference tensors.
inference_mode: false

accelerator: gpu
devices: ${eval:'${launch_params.gpus_per_node} * ${launch_params.nodes}'}
num_nodes: ${launch_params.nodes}
sync_batchnorm: True
# eval every 50 epochs; viz (viz_every_n_epochs: 100 in the pi evaluators)
# fires on every 2nd val, alongside the checkpoint save (every_n_epochs: 100).
check_val_every_n_epoch: 50
num_sanity_val_steps: 0