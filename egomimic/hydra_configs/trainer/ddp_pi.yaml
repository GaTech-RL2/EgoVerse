defaults:
  - default

strategy: ddp_find_unused_parameters_true

# Validate under torch.no_grad instead of torch.inference_mode: the compiled
# pi sampler (max-autotune -> cudagraphs) does in-place setup on its static
# buffers during graph capture, which is illegal on inference tensors
# ("Inplace update to inference tensor outside InferenceMode"). no_grad is
# functionally equivalent for eval and creates no inference tensors.
inference_mode: false

accelerator: gpu
# Per node: Lightning's world size is devices * num_nodes.
devices: ${launch_params.gpus_per_node}
num_nodes: ${launch_params.nodes}
sync_batchnorm: True
check_val_every_n_epoch: 20
num_sanity_val_steps: 0
