# @package _global_
defaults:
  - override /model: bf/bf_pipeline_sampler_usocket_chain_points_dense_medium
  - override /data: pusht/flow_transfer_usocket_chain_obstacle_dense_h100
  - override /evaluator: eval_pipeline_action_mse
  - override /logger: wandb

name: flow_transfer_cotrain_obstacle_latent_dense_medium
description: decoder_only_latent96_dense100_usocket_clean_chain_clean_obstacle3840
launch_params:
  gpus_per_node: 2
  nodes: 1
trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 1
logger:
  wandb: {project: pushshapes-flow-transfer}
norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true
callbacks:
  model_checkpoint:
    every_n_epochs: null
    every_n_train_steps: null
    train_time_interval: {_target_: datetime.timedelta, hours: 1}
    save_top_k: 1
    save_last: true
    save_on_train_epoch_end: true
