# @package _global_
defaults:
  - override /model: bf/bf_pipeline_sampler_chain_gripper_points_arc_length
  - override /data: pusht/chain_gripper_pipeline_arc_length_D200_M25_smoke
  - override /evaluator: eval_pipeline_action_mse
  - override /logger: wandb

name: chain_gripper_pipeline_points_arc_D200_M25_smoke
description: chain_points_anchored_phi_arc_25_waypoints_plus_mean_velocity_smoke7

# This experiment intentionally targets the verified seven-episode additive
# corpus. Promote a separately verified full-data config before a long run.
trainer:
  max_steps: 2
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 2
  val_check_interval: 1
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 1

logger:
  wandb:
    project: pushshapes-indomain-c4

# Slot 25 is a velocity payload, not another point waypoint.
norm_stats:
  norm_mode: minmax
  reduce_all_but_last: false

callbacks:
  model_checkpoint:
    every_n_epochs: null
    every_n_train_steps: 1
    train_time_interval: null
    save_top_k: 1
    save_last: true
    save_on_train_epoch_end: false
