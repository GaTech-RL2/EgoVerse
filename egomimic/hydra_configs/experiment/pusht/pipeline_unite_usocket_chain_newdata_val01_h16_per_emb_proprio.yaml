# @package _global_
defaults:
  - override /model: bf/bf_pipeline_unite_usocket_chain_points_w128_transformer_cg32_per_emb_proprio_h16
  - override /data: pusht/flow_transfer_usocket_chain_newdata_val01_h16_per_emb_proprio
  - override /evaluator: eval_pipeline_action_mse
  - override /logger: wandb

# Configuration only. A gated launcher must still bind immutable 1% split
# manifests, train-only normalization, source identity, and unique W&B/output
# paths before a smoke or full run is allowed.
name: flow_transfer_unite_w128_transformer_cg32_h16
description: unite_xstart_shared_ge_u_rotvec4_chain_points6_w128_h16
model:
  enable_grad_norm: false
  optimizer:
    lr: 3.0e-5
  scheduler:
    eta_min: 3.0e-6
  train_metrics_on_step: true
  train_metrics_on_epoch: true
launch_params:
  gpus_per_node: 2
  nodes: 1
trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 1
logger:
  wandb: {project: pushshapes-flow-transfer}
norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true
callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
