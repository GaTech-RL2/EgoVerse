# @package _global_
# sim_v2 data (2026-07-31).
# ABLATION C -- sdp_noattn cotrained on circle_3000 + small_circle_3000, i.e.
# the baseline structure with ZERO obstacle data. Control separating cotraining
# from obstacle exposure. Swept on obstacle levels 0-29 (e15 AND e17).
defaults:
  - override /model: hnet/hnet_dualstream_2trunk_d16_200m
  - override /data: pusht/indomain_c4_cotrain_noobst_v2
  - override /evaluator: pusht/gmm_eval_firstend
  - override /logger: csv_wandb

name: indomain_c4
description: sdpnoattn_abl_C_noobst_cotrain

trainer:
  max_epochs: 3000
  min_epochs: 3000

logger:
  wandb:
    project: pushshapes-indomain-c4

norm_stats:
  norm_mode: minmax
