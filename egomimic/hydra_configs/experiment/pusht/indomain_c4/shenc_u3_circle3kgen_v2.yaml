# @package _global_
# Shared-obs-encoder arm on the LARGE embodiment gap: circle(v2 gen, 3720)
# + u_socket_3000. Data = circle_3000_plus_gen_v2 (NEW symlink view: all 720
# gen episodes + 3000 obs0 evenly sampled from circle_4500_plus_gen_v2) so the
# circle side is volume-matched to u_socket_3000.
# H-Net cross-embodiment obstacle transfer: circle(v2, obstacles) + u_socket(base).
# Counterpart of DP job 3636876. Model = bf_nopre_sdp_noattn_mlps_u3 (S widened
# 128 -> 256 for the larger embodiment gap).
# sim_v2 data (2026-07-31).
# 4500-scale twin of dualstream_cotrain_2trunk_d16_200m.
# ONLY delta: data -> indomain_c4_cotrain_4500gen (circle_4500 + new_circle_cotrain, SEPARATE folders, +
# small_circle_4500). Model/trainer/eval identical to the 3000-scale cell.
#
# Why the data lives in a config instead of sbatch EXTRA: the previous c4500
# lineage set folder_path via EXTRA, the resume relaunch omitted it, and the
# run silently switched datasets at ep2000 (circle_4500 -> circle_3000_plus_gen)
# mid-training. Config-driven means every resume re-reads the same paths.
defaults:
  - override /model: hnet/hnet_dualstream_2trunk_d16_200m
  - override /data: pusht/circle_3kgen_v2_usocket3000
  - override /evaluator: pusht/gmm_eval_firstend
  - override /logger: csv_wandb

name: indomain_c4
description: dualstream_cotrain_2trunk_d16_200m_4500gen

trainer:
  max_epochs: 3000
  min_epochs: 3000

logger:
  wandb:
    project: pushshapes-indomain-c4

norm_stats:
  norm_mode: minmax
