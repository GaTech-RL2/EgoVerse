# @package _global_
defaults:
  - override /model: bf/bf_pipeline_sampler_chain_gripper_points_arc_length_medium
  - override /data: pusht/chain_gripper_pipeline_arc_length_D200_M25_full
  - override /evaluator: eval_pipeline_action_mse
  - override /logger: wandb

name: flow_transfer_chain_latent_medium
description: chain_3k_native4_fk_phi_arc_D200_M25_latent96_hidden384_b16

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 1

logger:
  wandb:
    project: pushshapes-flow-transfer

# Slot 25 is a velocity payload rather than another waypoint.
norm_stats:
  norm_mode: minmax
  reduce_all_but_last: false

callbacks:
  model_checkpoint:
    every_n_epochs: null
    every_n_train_steps: null
    train_time_interval:
      _target_: datetime.timedelta
      hours: 6
    save_top_k: 1
    save_last: true
    save_on_train_epoch_end: true
