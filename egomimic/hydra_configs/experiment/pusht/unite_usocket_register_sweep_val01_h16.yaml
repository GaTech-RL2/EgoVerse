# @package _global_
defaults:
  - override /data: pusht/unite_usocket_val01_h16_per_emb_proprio
  - override /evaluator: eval_pipeline_action_mse
  - override /logger: wandb

# Canonical support experiment for the materialized UNITE register rows.
# The launcher selects exactly one row directly with model=bf/<task-id>.
name: unite_usocket_register_sweep_h16
description: clean_action_content16_pooled_obs_adaln_incontext32_joint_recon_flow14

model:
  enable_grad_norm: false
  train_metrics_on_step: true
  train_metrics_on_epoch: true
  unite_flow_updates_per_reconstruction: 0
  unite_gradient_telemetry_every_n_steps: 100

launch_params:
  gpus_per_node: 2
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  strategy: ddp_find_unused_parameters_true
  log_every_n_steps: 1

logger:
  wandb:
    project: pushshapes-flow-transfer

norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true

callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9978
    validate_with_ema: true

run_provenance:
  split_manifest_sha256: 672f0f519bb7bff5b6b956d1b709abf1a1d387dd6b88b20a7c37536799bce0cd
  train_only_normalization_sha256: 3559aca1ac1279cbdd37de8e5b2da9bb350fbc0f1177d4c669aa590011fd0203
  action_contract:
    representations:
      pushshapes_sim_u_socket: x_y_cos_theta_sin_theta
  unite_update_schedule:
    mode: joint_reconstruction_plus_flow
    flow_updates_per_reconstruction: 0
    total_optimizer_steps: 240000
  energy_score_contract:
    sample_count: 32
    seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    validation_view: first_deterministic_validation_batch_per_ddp_rank
    aggregation: condition_mean_then_equal_domain_macro_mean

evaluator:
  deterministic_seed: 420042
  energy_score:
    enabled: true
    sample_count: 32
    seed_bank_path: egomimic/hydra_configs/evaluator/energy_score_seed_bank_k32_v1.json
    seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    action_dims:
      pushshapes_sim_u_socket: 4
    max_batches_per_rank: 1
    artifact_root: ${paths.output_dir}/validation_predictions/energy_score
    validation_view:
      definition: first_deterministic_validation_batch_per_ddp_rank
      split_manifest_sha256: ${run_provenance.split_manifest_sha256}
      per_rank_batch_size: 16
      world_size: 2
    provenance:
      action_representations: ${run_provenance.action_contract.representations}
      prediction_horizon: 16
      sampler: dopri5
      sampler_evaluation_points: 50
      sampler_atol: 1.0e-6
      sampler_rtol: 1.0e-3
      model_autocast_precision: bf16
      dopri5_state_precision: fp32
      dopri5_derivative_precision: fp32
      dopri5_error_control_precision: fp32
    distance_blocks:
      pushshapes_sim_u_socket:
        translation: {indices: [0, 1], weight: 1.0}
        rotation_unit_vector: {indices: [2, 3], weight: 1.0}
