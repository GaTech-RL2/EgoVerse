# @package _global_
defaults:
  - override /model: bf/bf_pipeline_diffusion_usocket_chain_20m
  - override /data: pusht/flow_transfer_usocket_chain_newdata_val01_h16
  - override /evaluator: eval_pipeline_action_mse
  - override /logger: wandb

name: flow_transfer_cotrain_newdata_dp20m
description: standard_epsilon_dp_h16_total19m636_val01_seed42

launch_params:
  gpus_per_node: 2
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  gradient_clip_val: null

logger:
  wandb:
    project: pushshapes-flow-transfer

norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true
  sample_frac: 1.0

evaluator:
  exact_epoch_metrics: true
  deterministic_seed: 42
  frame_stride: 1
  max_frames: 0

callbacks:
  model_checkpoint:
    filename: "step-{step:09d}"
    monitor: null
    save_top_k: -1
    save_last: true
    every_n_epochs: null
    every_n_train_steps: 20000
    train_time_interval: null
    save_on_train_epoch_end: false
    auto_insert_metric_name: false
