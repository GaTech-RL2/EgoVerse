# @package _global_
# ABC-130k single-domain BC: fold and stack the t-shirts, yam_bimanual only.
#
# The ABC arm of the cotrain ablation. Robot data volume is pinned at the same
# 20 episodes the cotrain config uses, so a delta against that run is
# attributable to the human data rather than to seeing more robot data.
defaults:
  - override /model: abc/yam_bimanual_dp
  - override /data: abc_arc/abc_fstshirt_bc
  - override /evaluator: null
  - override hydra/launcher: submitit_pace
  - _self_

name: abc_yam_fstshirt_dp
description: yam_bimanual_eef_euler_DP_DDIM100_obs1

launch_params: {gpus_per_node: 2, nodes: 1}
trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

logger:
  wandb:
    project: abc-yam

abc:
  # eef_frame + euler => [L xyz ypr g, R xyz ypr g].
  action_dim: 14
  action_horizon: 16
  # FusedObsEncoder output: 64 image features + the 14D proprio pose.
  condition_dim: 78
  encoder:
    _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
    obs_specs:
      ee_pose: {input_dim: 14, input_slice: [0, 14]}
    img_encoders:
      front_img_1:
        _target_: egomimic.models.stems.visual_core.VisualCore
        in_channels: 3
        # ABC frames are 480x640 (the data config pins image_hw to [480, 640]),
        # so height and width are given separately -- a square image_size sizes
        # the SpatialSoftmax grid wrong for a non-square frame.
        image_size: 480
        image_width: 640
        num_kp: 32
        feature_dimension: 64
        pretrained: false
        crop_aug: true
        crop_height: 432
        crop_width: 576
        crop_eval_mode: center
        crop_sample_mode: v02
        crop_scope: frame
        norm_layer: group
        pool_type: spatial_softmax
