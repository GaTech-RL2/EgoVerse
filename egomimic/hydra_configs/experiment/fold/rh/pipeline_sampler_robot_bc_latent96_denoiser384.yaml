# @package _global_
# Three-quarter capacity variant: 96-D action latent and 384-wide denoiser.
# Depth, decoder, data, evaluator, and training settings inherit from baseline.
defaults:
  - /experiment/fold/rh/pipeline_sampler_robot_bc
  - _self_

# Keep this concise: the canonical launcher derives the resumed W&B ID from
# `${name}_$(basename hydra_dir)`, and W&B limits IDs/names to 128 characters.
