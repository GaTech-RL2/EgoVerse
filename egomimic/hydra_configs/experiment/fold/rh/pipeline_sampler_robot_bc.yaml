# @package _global_
# Robot-only BC control for the Fold Dense Pipeline parent.
defaults:
  - override /model: bf/bf_pipeline_sampler_robot_bc
  - override /data: fold_robot_normal_bc
  - override /logger: wandb
  - override /evaluator: eval_rh_fold_viz_kp

name: fold_robot_dense_bc
description: pipeline_sampler_robot_bc_robot_only_cartesian_h100

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  log_every_n_steps: 1

logger:
  wandb:
    project: human-robot-hnet
    group: fold_robot_only_bc_20260824
    tags: [fold, robot_only, bc, dense_pipeline, "${oc.env:SOURCE_COMMIT_TAG,source_unset}"]

norm_stats:
  norm_mode: quantile
  reduce_all_but_last: true
  sample_frac: 0.05
  precomputed_norm_path: /coc/flash7/paphiwetsa3/datasets/norm_stats/fold_rh_jpeg_kp_h28to100_e20_h126_collapsed_ids/norm_stats/norm_stats.json

callbacks:
  model_checkpoint:
    every_n_epochs: null
    every_n_train_steps: null
    train_time_interval:
      _target_: datetime.timedelta
      hours: 6
    save_top_k: 1
    save_last: true
    save_on_train_epoch_end: true
