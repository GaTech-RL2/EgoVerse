# @package _global_
defaults:
  - override /model: bf/bf_pipeline_sampler_kp
  - override /data: fold_rh_normal_cotrain_kp
  - override /logger: wandb
  - override /evaluator: eval_rh_fold_viz_kp

name: rh_fold_pipeline_sampler_h28to100
description: pipeline_end_to_end_latent_sampler_human28_to_100

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  log_every_n_steps: 1

logger:
  wandb:
    project: human-robot-hnet

norm_stats:
  norm_mode: quantile
  reduce_all_but_last: true
  sample_frac: 0.05

callbacks:
  model_checkpoint:
    every_n_epochs: null
    every_n_train_steps: null
    train_time_interval:
      _target_: datetime.timedelta
      hours: 6
    save_top_k: 1
    save_last: true
    save_on_train_epoch_end: true
