# @package _global_
# ABC-ONLY (no cotraining) ARC-TOKENIZED BC at D = 0.40 m / M = 100:
# fold_and_stack_the_t_shirts, yam_bimanual. The single-domain arm of the
# cotrain ablation.
#
# Robot data is held FIXED at the cotrain run's yam split -- 20 ABC episodes,
# 48,286 frames -- so the only thing removed relative to
# abc_fstshirt_mecka_freefold_cotrain_arcD40M100 is the 250 mecka human
# episodes. Any delta between the two is attributable to cotraining, not to
# data volume.
#
# Its time-indexed twin is abc_fstshirt_bc. Together with the two cotrain
# experiments this makes a 2x2: {arc, time-indexed} x {cotrain, ABC-only}.
#
# Launch:
#   python egomimic/trainHydra.py -m \
#       +experiment=abc_arc/abc_fstshirt_arc_bc
#
# `-m` is required: the submitit launcher only engages in multirun mode.
defaults:
  - override /model: abc_arc/hpt_abc_bc_flow_arc_D40_M100
  - override /data: abc_arc/abc_fstshirt_arc_bc_D40_M100

  # The SAME evaluator all four runs in this study use -- both cotrain runs and
  # both BC runs -- so every one of them emits identically named numbers that
  # overlay on one chart:
  #
  #   Valid/{emb}_actions_cartesian_arcmatch_paired_mse_avg
  #   Valid/{emb}_actions_cartesian_arcmatch_xyz_mse_avg
  #   Valid/{emb}_actions_cartesian_arcmatch_final_xyz_l2_m_avg
  #   Valid/{emb}_actions_cartesian_arcmatch_rot_geodesic_deg_avg
  #
  # Only the yam_bimanual series appears here; there is no human split to score.
  # The evaluator's human transform_list/viz entries are simply never reached.
  - override /evaluator: eval_eef_arcmatch_D40_M100
  - override /trainer: ddp/base
  - override /logger: wandb/base
  - override /hydra/launcher: submitit_skynet_a40
  - _self_

name: abc_fstshirt_arc_bc
description: arcD40M100

# The default paths.dataset_dir (/coc/flash7/scratch/egoverseS3ZarrDataset) is
# owned by another user and mode drwxr-xr-x, so s5cmd's mkdir fails with
# "permission denied" for any episode not already cached there. This directory
# is writable and already holds the ABC episodes this run needs.
paths:
  dataset_dir: /coc/flash7/scratch/arc-training

# Single domain and hpt_bc_flow_base inherits no foreign stems, so the stem/head
# side is clean. find_unused_parameters stays on for the image encoders:
# hpt_bc_flow_base declares front/left/right wrist encoders but only front_img_1
# feeds a stem, so the wrist ResNets never receive a gradient and plain `ddp`
# would abort with "Expected to have finished reduction in the prior iteration".
trainer:
  strategy: ddp_find_unused_parameters_true
  # Run 2 validation batches BEFORE epoch 0. Validation otherwise first executes
  # at epoch 200, so a fault in the evaluator or viz path (as happened with the
  # baseline hitting the arc detokenizer) costs hours before it surfaces. This
  # exercises the whole val path -- forward, arc-matched metrics, video overlay
  # -- in seconds at startup.
  num_sanity_val_steps: 2

launch_params:
  gpus_per_node: 1
  nodes: 1

logger:
  wandb:
    project: "arc"
    tags:
      - abc
      - bc
      - arc
