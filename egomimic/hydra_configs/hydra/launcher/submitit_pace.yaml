defaults:
  - submitit_slurm

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# PACE gpu-h200 launcher. H200 nodes have 141 GB VRAM, so mem_per_gpu 250G is
# safe. cpus_per_task 8 with 2 GPUs = 16 CPUs (under the 8:1 CPU:GPU cap).
# Gres count is hardcoded because this repo does not register an ``eval``
# OmegaConf resolver, so ``${eval:...}`` arithmetic doesn't compose. Override
# ``hydra.launcher.gres`` on the CLI if launching on a different GPU count.
name: ${hydra.job.name}
partition: "gpu-h200"
account: "gts-dxu345-rl2"
cpus_per_task: 8
nodes: ${launch_params.nodes}
tasks_per_node: ${launch_params.gpus_per_node}
gres: "gpu:h200:2"
qos: "inferno"
mem_per_gpu: 250G
timeout_min: 2880
additional_parameters:
  requeue: true
