defaults:
  - submitit_slurm

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

name: ${hydra.job.name}
partition: "rl2-lab"
account: "rl2-lab"

cpus_per_task: 12

nodes: ${launch_params.nodes}                      
tasks_per_node: ${launch_params.gpus_per_node}    
gres: "gpu:l40s:${eval:'${launch_params.gpus_per_node} * ${launch_params.nodes}'}"

qos: "short"
timeout_min: 2880 # 80 hours

# Seconds before the *time limit* that Slurm sends the USR2 warning, in which
# PreemptionCheckpoint writes a full checkpoint (the launcher default of 120 s
# is too short for a multi-GB pi0.5 checkpoint on NFS). On *preemption* the
# window is the partition's GraceTime instead (300 s on overcap; rl2-lab does
# not preempt) and this setting has no effect.
signal_delay_s: 600

additional_parameters:
  requeue: true