# Checkpoints (every_n_epochs=20) + chunker residual scheduler + random
# attention-dropout. model_checkpoint (+ wandb_profiler) come from checkpoints;
# only every_n_epochs is overridden here.
defaults:
  - checkpoints
  - _self_

model_checkpoint:
  every_n_epochs: 20

chunker_residual_scheduler:
  _target_: egomimic.pl_utils.callbacks.chunker_residual_scheduler.ChunkerResidualScheduler
  schedule:
    - [0, 0.0]
    - [319, 0.0]
    - [320, 1.0]

random_attn_dropout:
  _target_: egomimic.pl_utils.callbacks.random_attn_dropout.RandomAttnDropoutScheduler
  dropout_values: [0.0, 0.5, 0.9, 0.95]
  weights: [1, 1, 1, 1]
  seed: 0
