defaults:
  - defaults
  - _self_

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch}"
  save_last: true
  save_top_k: -1
  every_n_epochs: 100
gradnorm:
  _target_: egomimic.pl_utils.gradnorm_callback.GradNormLogger
  every_n_steps: 50
