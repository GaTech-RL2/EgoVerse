defaults:
  - defaults
  - _self_

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step-{step}"
  monitor: null
  save_last: true
  save_top_k: -1
  every_n_epochs: null
  every_n_train_steps: 20000
  train_time_interval: null
  save_on_train_epoch_end: false
  auto_insert_metric_name: false
