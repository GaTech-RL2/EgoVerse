defaults:
  - defaults
  - _self_

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch}"
  # A symlink to the epoch checkpoint, not a second full copy of it (9 GB and
  # ~1.3 min on ABC-DiT-L). Requires save_top_k: -1 below, which is what keeps
  # the target alive; relinks every epoch, not only checkpoint epochs.
  save_last: link
  save_top_k: -1
  every_n_epochs: 50
  # Save at the end of the train epoch, not after validation: with
  # check_val_every_n_epoch > 1 the validation-end hook only fires on val
  # epochs and every_n_epochs would silently miss the others.
  save_on_train_epoch_end: true
