defaults:
  - /callbacks/base/defaults
  - _self_

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch}"
  save_last: true
  save_top_k: -1
  every_n_epochs: 20

chunker_residual_scheduler:
  _target_: egomimic.pl_utils.callbacks.chunker_residual_scheduler.ChunkerResidualScheduler
  schedule:
    - [0, 0.0]
    - [319, 0.0]
    - [320, 1.0]

random_attn_dropout:
  _target_: egomimic.pl_utils.callbacks.random_attn_dropout.RandomAttnDropoutScheduler
  dropout_values: [0.0, 0.5, 0.9, 0.95]
  weights: [1, 1, 1, 1]
  seed: 0
