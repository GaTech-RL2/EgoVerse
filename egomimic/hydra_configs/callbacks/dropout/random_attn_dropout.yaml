# Per-batch random attention dropout, sampled from a list of rates.
# Trains the model under a mix of dropout regimes so it can't rely on
# the AR-trunk shortcut while still seeing some clean passes that match
# inference behavior.
#
# Compose via: callbacks=[checkpoint/checkpoints, chunker_residual_scheduler, random_attn_dropout]
random_attn_dropout:
  _target_: egomimic.pl_utils.callbacks.random_attn_dropout.RandomAttnDropoutScheduler
  dropout_values: [0.0, 0.5, 0.9, 0.95]
  weights: [1, 1, 1, 1]
  seed: 0
