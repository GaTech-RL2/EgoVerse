# @package _global_
# HUMAN RECT, IMAGE-ONLY arm (control) of the human RGB+D experiment.
# Dataset: datasets/human_fullpp_rgbd -- the same 135 demos / 53,664 rows as
# datasets/aria_fullpp, row-for-row, but obs.aria_image is the COLOUR rectified
# image (the frame the Fast-FS depth is native to) instead of the raw fisheye.
# This arm ignores obs.aria_depth; wb_adapt3r_human consumes it. Everything else
# -- rows, actions, proprio, augs, dropout, schedule -- is identical between the two,
# so val(this) - val(adapt3r) is exactly the contribution of depth given colour.
# Old-method gate: 20% episode holdout from the same corpus (no teleop val set --
# it was retired for decisions).
defaults:
  - /train
  - override /model: experiments/wholebody_image/rby1_human_rect_resnet
  - override /data: experiments/wholebody_image/rby1_wb_img_act32
  - _self_

name: RBY1_human_rect
description: "human_rect_resnet_2k"

hydra:
  run:
    dir: ./logs/${name}/${description}
  sweep:
    dir: ./logs/${name}/${description}

trainer:
  max_epochs: 2000
  check_val_every_n_epoch: 50

callbacks:
  aug_image_logger:
    _target_: egomimic.pl_utils.aug_image_logger.AugImageLogger
    every_n_epochs: 100
    n_images: 8

logger:
  wandb:
    entity: null
    project: sew_policy
    id: "${name}_${description}"
    resume: "allow"

data:
  train_datasets:
    dataset1:
      datasets:
        rl2_lab:
          mode: train   # OLD-method: 20% episode holdout becomes the val split
  valid_datasets:
    dataset1:
      datasets:
        eth_lab:
          # Held-out split of the SAME corpus (sbatch points VAL_DIR at FINAL_DIR).
          mode: valid

data_schematic:
  _target_: egomimic.rldb.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    rby1:
      front_img_1:
        key_type: camera_keys
        lerobot_key: obs.aria_image
      hand_left_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_left_qpos
      hand_right_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_right_qpos
      robot0_joint_pos:
        key_type: proprio_keys
        lerobot_key: obs.robot0_joint_pos_no_wheel
      actions_joint_base_torso_head_arm_hand:
        key_type: action_keys
        lerobot_key: actions.joint_base_torso_head_arm_hand
      embodiment:
        key_type: metadata_keys
        lerobot_key: metadata.embodiment
  viz_img_key:
    rby1: front_img_1
