# @package _global_
# V1 RETRAIN (crop): whole-body 49-D action from REAL image + proprio, vanilla head —
# same as wb_img_proprio_vanilla but with:
#   * RandomResizedCrop aug (square crop removing ~0-50 px, resized back to 224)
#   * robot0_joint_pos proprio dropout 0.4 -> 0.8
#   * 2000 epochs (was 1000; not fully converged)
# Run: sbatch ... DATASET_NAME=aria_egoposer_firm TRAIN_CONFIG=experiments/wholebody_image/wb_img_proprio_v1_crop DESCRIPTION=v1_crop_2k
defaults:
  - /train
  - override /model: experiments/wholebody_image/rby1_wb_img_proprio_act32_wam_res
  - override /data: experiments/wholebody_image/rby1_wb_img_act32_wam
  - _self_

name: RBY1_wb_img_proprio_act32_wam_res
description: "wb_img+proprio_49d_wam_res_2k"

hydra:
  run:
    dir: ./logs/${name}/${description}
  sweep:
    dir: ./logs/${name}/${description}

trainer:
  max_epochs: 2000

logger:
  wandb:
    entity: null
    project: sew_policy
    id: "${name}_${description}"
    resume: "allow"

data_schematic:
  _target_: egomimic.rldb.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    rby1:
      front_img_1:
        key_type: camera_keys
        lerobot_key: obs.aria_image
      hand_left_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_left_qpos
      hand_right_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_right_qpos
      robot0_joint_pos:
        key_type: proprio_keys
        lerobot_key: obs.robot0_joint_pos_no_wheel
      actions_joint_base_torso_head_arm_hand:
        key_type: action_keys
        lerobot_key: actions.joint_base_torso_head_arm_hand
      dino_wm_future:
        key_type: action_keys
        lerobot_key: obs.dino_wm
      embodiment:
        key_type: metadata_keys
        lerobot_key: metadata.embodiment
  viz_img_key:
    rby1: front_img_1
