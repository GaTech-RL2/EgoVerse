# @package _global_
# V2 experiment: whole-body 49-D action from REAL image + 10-step JOINT HISTORY + 100-step BASE
# TRAJECTORY (first-frame world frame). Vanilla (flat) head. Consumes the dataset produced by
# add_wb_traj_hist.py (adds obs.robot0_joint_pos_hist [220] + obs.base_traj [300]).
# Run with:  sbatch ... DATASET_NAME=<DS>_v2 TRAIN_CONFIG=experiments/wholebody_image/wb_img_proprio_v2_traj
defaults:
  - /train
  - override /model: experiments/wholebody_image/rby1_wb_img_proprio_act32_v2_traj
  - override /data: experiments/wholebody_image/rby1_wb_img_act32
  - _self_

name: RBY1_wb_img_proprio_act32_v2_traj
description: "wb_img+jointhist10+basetraj100_49d_vanilla"

hydra:
  run:
    dir: ./logs/${name}/${description}
  sweep:
    dir: ./logs/${name}/${description}

trainer:
  max_epochs: 1000

logger:
  wandb:
    entity: null
    project: sew_policy
    id: "${name}_${description}"
    resume: "allow"

data_schematic:
  _target_: egomimic.rldb.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    rby1:
      front_img_1:
        key_type: camera_keys
        lerobot_key: obs.aria_image
      robot0_joint_pos_hist:
        key_type: proprio_keys
        lerobot_key: obs.robot0_joint_pos_hist
      base_traj:
        key_type: proprio_keys
        lerobot_key: obs.base_traj
      hand_left_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_left_qpos
      hand_right_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_right_qpos
      actions_joint_base_torso_head_arm_hand:
        key_type: action_keys
        lerobot_key: actions.joint_base_torso_head_arm_hand
      embodiment:
        key_type: metadata_keys
        lerobot_key: metadata.embodiment
  viz_img_key:
    rby1: front_img_1
