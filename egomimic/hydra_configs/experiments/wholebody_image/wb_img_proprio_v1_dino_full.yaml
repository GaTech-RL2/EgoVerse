# @package _global_
# V1 RETRAIN (DINO): same recipe as wb_img_proprio_v1_crop (RandomResizedCrop aug,
# joint-proprio dropout 0.8, 2000 epochs) but the image encoder is a FROZEN DINOv2
# ViT-S/14 (trainable projection only) instead of a fine-tuned ResNet-18 —
# testing whether DINO's perspective-invariant features close the live-RGB gap.
# Run: sbatch ... DATASET_NAME=aria_egoposer_firm TRAIN_CONFIG=experiments/wholebody_image/wb_img_proprio_v1_dino DESCRIPTION=v1_dino_2k
defaults:
  - /train
  - override /model: experiments/wholebody_image/rby1_wb_img_proprio_act32_v1_dino_full
  - override /data: experiments/wholebody_image/rby1_wb_img_act32
  - _self_

name: RBY1_wb_img_proprio_act32_v1_dino_full
description: "wb_img+proprio_49d_v1_dino_full_2k"

hydra:
  run:
    dir: ./logs/${name}/${description}
  sweep:
    dir: ./logs/${name}/${description}

trainer:
  max_epochs: 2000

logger:
  wandb:
    entity: null
    project: sew_policy
    id: "${name}_${description}"
    resume: "allow"

data_schematic:
  _target_: egomimic.rldb.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    rby1:
      front_img_1:
        key_type: camera_keys
        lerobot_key: obs.aria_image
      hand_left_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_left_qpos
      hand_right_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_right_qpos
      robot0_joint_pos:
        key_type: proprio_keys
        lerobot_key: obs.robot0_joint_pos_no_wheel
      actions_joint_base_torso_head_arm_hand:
        key_type: action_keys
        lerobot_key: actions.joint_base_torso_head_arm_hand
      embodiment:
        key_type: metadata_keys
        lerobot_key: metadata.embodiment
  viz_img_key:
    rby1: front_img_1
