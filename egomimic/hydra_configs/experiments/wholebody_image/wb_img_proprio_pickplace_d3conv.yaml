# @package _global_
# PICKPLACE #3: frozen DINOv3-S/16 + 9-block ConvNeck (Claude's pick — see model
# yaml header for rationale). Identical to wb_img_proprio_pickplace_v1 except the
# vision encoder. Needs HF_HUB_OFFLINE=1 + warm timm cache (set in the sbatch).
defaults:
  - /train
  - override /model: experiments/wholebody_image/rby1_wb_img_proprio_act32_pp_d3conv
  - override /data: experiments/wholebody_image/rby1_wb_img_act32
  - _self_

name: RBY1_wb_img_pickplace_d3conv
description: "wb_img_pickplace_d3conv_2k"

hydra:
  run:
    dir: ./logs/${name}/${description}
  sweep:
    dir: ./logs/${name}/${description}

trainer:
  max_epochs: 2000
  check_val_every_n_epoch: 50

callbacks:
  aug_image_logger:
    _target_: egomimic.pl_utils.aug_image_logger.AugImageLogger
    every_n_epochs: 100
    n_images: 8

logger:
  wandb:
    entity: null
    project: sew_policy
    id: "${name}_${description}"
    resume: "allow"

data:
  valid_datasets:
    dataset1:
      datasets:
        eth_lab:
          folder_path: /coc/flash7/czhang883/Documents/EgoVerse/datasets/rby1_teleop_pickplace_val
          mode: train
          valid_ratio: 0.0

data_schematic:
  _target_: egomimic.rldb.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    rby1:
      front_img_1:
        key_type: camera_keys
        lerobot_key: obs.aria_image
      hand_left_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_left_qpos
      hand_right_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_right_qpos
      robot0_joint_pos:
        key_type: proprio_keys
        lerobot_key: obs.robot0_joint_pos_no_wheel
      actions_joint_base_torso_head_arm_hand:
        key_type: action_keys
        lerobot_key: actions.joint_base_torso_head_arm_hand
      embodiment:
        key_type: metadata_keys
        lerobot_key: metadata.embodiment
  viz_img_key:
    rby1: front_img_1
