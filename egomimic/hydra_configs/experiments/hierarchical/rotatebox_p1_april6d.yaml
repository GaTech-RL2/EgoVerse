# @package _global_
# Hierarchical P1 for the 0418 rotatebox task using 6D april_tag (xyz + rotation).
# Same data pipeline as push_cart_p1_masked_attn; only april_tag dimensionality differs.
# Dataset folder is overridden per-job via CLI.
defaults:
  - /train
  - override /model: experiments/hierarchical/rby1_hierarchical_p1_masked_attn_april6d
  - override /data: experiments/rby1_0416/rby1_0423_push_cart_human_act32_base_torso_head_arm_hand
  - _self_

name: RBY1_rotatebox_hierarchical_p1_april6d
description: "hier_p1_masked_attn_april6d_hand0.7_joint0.4+noise"

hydra:
  run:
    dir: ./logs/${name}/${description}
  sweep:
    dir: ./logs/${name}/${description}

logger:
  wandb:
    project: sew_policy
    id: "${name}_${description}"
    resume: "allow"

data_schematic:
  _target_: egomimic.rldb.utils.DataSchematic
  norm_mode: quantile
  schematic_dict:
    rby1:
      front_img_1:
        key_type: camera_keys
        lerobot_key: obs.aria_image
      april_tag:
        key_type: proprio_keys
        lerobot_key: obs.april_tag
      hand_left_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_left_qpos
      hand_right_qpos:
        key_type: proprio_keys
        lerobot_key: obs.hand_right_qpos
      robot0_joint_pos:
        key_type: proprio_keys
        lerobot_key: obs.robot0_joint_pos_no_wheel
      actions_joint_base_torso_head_arm_hand:
        key_type: action_keys
        lerobot_key: actions.joint_base_torso_head_arm_hand
      embodiment:
        key_type: metadata_keys
        lerobot_key: metadata.embodiment
  viz_img_key:
    rby1: front_img_1
