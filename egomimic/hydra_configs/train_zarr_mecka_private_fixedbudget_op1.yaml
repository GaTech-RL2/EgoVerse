# RDT-1B keypoint recipe of the opscale ladders (train_zarr_mecka_freeform_fold_kp_rdt_op2:
# 4 GPUs x 32, WSD LR decaying over the last 20%, EMA on) on fixed-budget rung 1.
# 1000 x 100 steps on every rung (~12 passes over the budget). Generated by
# make_configs_fixed_budget.py; see data/mecka_private_fixedbudget_op1.
defaults:
  - train_zarr_mecka_freeform_fold_kp_rdt_op2
  - override data: mecka_private_fixedbudget_op1
  - _self_

model:
  ema:
    enabled: true
  scheduler:
    stable: 79000
    decay: 20000

trainer:
  max_epochs: 1000
  min_epochs: 1000
  check_val_every_n_epoch: 10

# Every 20% (~23 GB each with EMA); the 80% one is the decay start.
callbacks:
  model_checkpoint:
    every_n_epochs: 200
