# train_zarr_mecka_private_tshirt_opscale_6 at 2x steps, resumed from its 50% (pre-decay)
# checkpoint by logs/mecka_private_opscale2x/launch_pair.sbatch.
defaults:
  - train_zarr_mecka_private_tshirt_opscale_6
  - _self_

trainer:
  max_epochs: 2000
  min_epochs: 2000

# Every 20%; the 80% one is the decay start.
callbacks:
  model_checkpoint:
    every_n_epochs: 400
