# train_zarr_mecka_private_tshirt_opscale_10 on the 120-min-per-operator data:
# 700 x 100 steps, val every 1000 steps. WSD LR from the launcher.
# Generated; see data/mecka_private_tshirt2h_opscale_10.
defaults:
  - train_zarr_mecka_private_tshirt_opscale_10
  - override data: mecka_private_tshirt2h_opscale_10
  - _self_

trainer:
  max_epochs: 700
  min_epochs: 700
  check_val_every_n_epoch: 10

callbacks:
  model_checkpoint:
    every_n_epochs: 350
