defaults:
  - model: hpt_bc_so100_singlearm
  - visualization: so100_singlearm
  - paths: default
  - trainer: default
  - logger: debug
  - data: so100_singlearm
  - data_schematic: so100_singlearm
  - override hydra/launcher: basic
  - _self_

name: so100_hpt
description: tiny_subset_smoke
ckpt_path: null
mode: train

hydra:
  run:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

seed: 42
reject_outliers: false
callbacks: null
evaluator: null

trainer:
  default_root_dir: ${hydra:runtime.output_dir}
  max_epochs: 1
  min_epochs: 1
  accelerator: cpu
  devices: 1
  precision: 32
  limit_train_batches: 2
  limit_val_batches: 0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  deterministic: false

norm_stats:
  sample_frac: 1.0
  num_workers: 0
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
