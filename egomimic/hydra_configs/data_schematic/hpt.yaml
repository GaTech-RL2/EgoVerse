# Embodiment blocks follow the collapsed EMBODIMENT enum: all human
# demonstration data is human_* regardless of capture rig. The former
# aria_/mecka_/scale_bimanual blocks are merged here -- they declared the
# same keys (aria additionally carried keypoints), and the capture source
# now lives only in the SQL `lab` field, not in the embodiment.
_target_: egomimic.rldb.zarr.utils.DataSchematic
norm_mode: quantile
schematic_dict:
  eva_bimanual:
    front_img_1:
      key_type: camera_keys
      zarr_key: observations.images.front_img_1
    right_wrist_img:
      key_type: camera_keys
      zarr_key: observations.images.right_wrist_img
    left_wrist_img:
      key_type: camera_keys
      zarr_key: observations.images.left_wrist_img
    ee_pose:
      key_type: proprio_keys
      zarr_key: observations.state.ee_pose
    joint_positions:
      key_type: proprio_keys
      zarr_key: observations.state.joint_positions
    actions_joints:
      key_type: action_keys
      zarr_key: actions_joints
    actions_cartesian:
      key_type: action_keys
      zarr_key: actions_cartesian
    embodiment:
      key_type: metadata_keys
      zarr_key: metadata.embodiment
  human_bimanual:
    front_img_1:
      key_type: camera_keys
      zarr_key: observations.images.front_img_1
    ee_pose:
      key_type: proprio_keys
      zarr_key: observations.state.ee_pose
    actions_cartesian:
      key_type: action_keys
      zarr_key: actions_cartesian
    embodiment:
      key_type: metadata_keys
      zarr_key: metadata.embodiment
  pushshapes_sim:
    front_img_1:
      key_type: camera_keys
      zarr_key: front_img_1
    state_agent_obj:
      key_type: proprio_keys
      zarr_key: state_agent_obj
    actions:
      key_type: action_keys
      zarr_key: actions
