# train_zarr_mecka_private_tshirt_opscale_3 on the 30-min-per-operator data:
# 300 x 100 steps, val every 1000 steps, WSD with 500-step warmup.
# Generated; see data/mecka_private_tshirt30m_opscale_3.
defaults:
  - train_zarr_mecka_private_tshirt_opscale_3
  - override data: mecka_private_tshirt30m_opscale_3
  - _self_

trainer:
  max_epochs: 300
  min_epochs: 300
  check_val_every_n_epoch: 10

callbacks:
  model_checkpoint:
    every_n_epochs: 150

model:
  scheduler:
    warmup: 500
    stable: 23500
    decay: 6000
