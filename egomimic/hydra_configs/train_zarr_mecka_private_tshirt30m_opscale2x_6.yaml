# train_zarr_mecka_private_tshirt30m_opscale_6 at 2x steps, resumed from its 50% (pre-decay)
# checkpoint by logs/mecka_private_opscale30m2x/launch_pair.sbatch.
defaults:
  - train_zarr_mecka_private_tshirt30m_opscale_6
  - _self_

trainer:
  max_epochs: 700
  min_epochs: 700

# Every 10%; the 80% one is the decay start.
callbacks:
  model_checkpoint:
    every_n_epochs: 70

model:
  scheduler:
    stable: 55500
    decay: 14000
