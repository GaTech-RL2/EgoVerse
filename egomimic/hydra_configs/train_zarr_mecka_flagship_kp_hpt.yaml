# Composed recipe: HPT 300M flow-matching BC on the 144-D wrist-frame MANO
# keypoint action, mecka FLAGSHIP fold-clothes, seen/unseen operator split.
# The keypoint counterpart of train_zarr_mecka_flagship_6d_hpt, and the
# reference arm any other architecture on this split is compared against
# (the same recipe with `override model:` swapped).
#
#   python egomimic/trainHydra.py --config-name=train_zarr_mecka_flagship_kp_hpt \
#     data=mecka_fold_flagship_top3_hpt_6d \
#     norm_stats.precomputed_norm_path=<out>/norm_stats
#
# The flagship annotations are empty, so every prompt is the default one
# ("fold clothes"), so a comparison arm has to set the same string.
defaults:
  - train_zarr_cartesian
  - override model: hpt_bc_keypoints_wrist_300M
  - override data: mecka_fold_flagship_opsplit_hpt_6d
  - override evaluator: eval_hpt_keypoints_wrist
  - _self_

model:
  robomimic_model:
    default_prompt: "fold clothes"

# The keypoint pipeline over the chosen 6D data config (see
# train_zarr_mecka_kp_wrist_hpt). The keypoint proprio is in the WRIST frame,
# where a history step would carry the wrist's own displacement into the
# articulation channels, so it stays at K = 1 until per-step framing lands.
data:
  train_datasets:
    human_bimanual:
      resolver:
        key_map:
          keymap_mode: keypoints
          proprio_history: 1
          history_stride: 1
        transform_list:
          mode: keypoints_wristframe_6d
