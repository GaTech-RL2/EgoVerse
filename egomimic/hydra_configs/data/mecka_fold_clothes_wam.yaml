# WAM data — MECKA fold_clothes only (lab=mecka, task=fold_clothes). Same
# universal WAM pipeline as mecka_eva_cotrain_wam.yaml but with the alternate
# task-string filter (mecka SQL has both ``fold_clothes`` and
# ``folding_clothes`` labels depending on when the episode was ingested).
# Used for offline eval on the cotrain checkpoint over episodes the model
# didn't see under the ``folding_clothes`` filter.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_wam.WamMultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_wam.S3WamEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/shared/mecka_fold
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_keymap
        cam_horizon: 33
        action_horizon: 192
        state_horizon: 4
        state_stride: 48     # action_horizon / state_horizon: state[k] aligns with block k's action-start
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_transform_list
        state_stride: 48
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: total

valid_datasets:
  human_bimanual: ${data.train_datasets.human_bimanual}

train_dataloader_params:
  human_bimanual:
    batch_size: 4
    num_workers: 10
valid_dataloader_params:
  human_bimanual:
    batch_size: 4
    num_workers: 10
