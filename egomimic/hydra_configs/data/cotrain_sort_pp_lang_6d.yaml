defaults:
  - cotrain_pi_lang_6d
  - _self_

# Legacy cotrain (NO subtask prediction), WRIST-FRAME 6D: sort + pick_place.
# Reads annotations WITHOUT the high/low split (level=None) so the PI algo samples
# one annotation uniformly across all variants per item. Pair with
# model=pi0.5_cotrain_eva_aria_6d (subtask_prediction false) and
# evaluator=eval_pi_wristframe_6d.
#
# folder_path pinned to the obj_gen export for BOTH groups (eva there carries the
# keymap-expected `*.obs_gripper`; the pick_place_cotrain eva export uses the old
# `*.gripper` and KeyErrors). The 41 sort (aria) episodes are materialized into
# this same dir with their converted high/low annotations + aria_bimanual label.
#
# Filters mirror obj_gen_pi_lang (the proven wristframe selection) and ADD sort:
#   - eva: task==pick_place, dense-language, no 'alignment', minus the known-bad
#     eva hash.
#   - aria: task==sort  OR  (task==pick_place AND base/object description), minus
#     the 3 known-corrupt aria hashes (unrecoverable JPEGs).
#   - both: processing-error / zarr-processing-error episodes excluded.
train_datasets:
  eva_bimanual:
    resolver:
      folder_path: /storage/project/r-dxu345-0/agao81/EgoVerse/datasets/sortpp_eva_new
      transform_list:
        mode: cartesian_wristframe_6d
    filters:
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') in ('eva', 'eva_bimanual') and (row.get('zarr_processed_path') or '') != '' and 'alignment' not in ((row.get('task_description') or '').lower()) and (row.get('episode_hash') or '') != '2026-04-22-02-30-32-296000' and not (row.get('episode_hash') or '').startswith('2026-05-11') and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"
  human_bimanual:
    resolver:
      folder_path: /storage/project/r-dxu345-0/agao81/EgoVerse/datasets/sortpp_aria_new
      transform_list:
        mode: cartesian_wristframe_6d
    filters:
      filter_lambdas:
        - "lambda row: row.get('embodiment') in ('aria', 'aria_bimanual') and (row.get('zarr_processed_path') or '') != '' and (row.get('episode_hash') or '') not in ('2026-04-26-00-17-53-000000', '2026-04-26-00-27-26-000000', '2026-05-01-02-52-58-000000') and (row.get('task') == 'sort' or (row.get('task') == 'pick_place' and any(s in ((row.get('task_description') or '').lower()) for s in ('base', 'object')))) and 'eval' not in ((row.get('task_description') or '').lower()) and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"

valid_datasets:
  eva_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') in ('eva', 'eva_bimanual') and (row.get('zarr_processed_path') or '') != '' and 'alignment' not in ((row.get('task_description') or '').lower()) and (row.get('episode_hash') or '') != '2026-04-22-02-30-32-296000' and not (row.get('episode_hash') or '').startswith('2026-05-11') and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: row.get('embodiment') in ('aria', 'aria_bimanual') and (row.get('zarr_processed_path') or '') != '' and (row.get('episode_hash') or '') not in ('2026-04-26-00-17-53-000000', '2026-04-26-00-27-26-000000', '2026-05-01-02-52-58-000000') and (row.get('task') == 'sort' or (row.get('task') == 'pick_place' and any(s in ((row.get('task_description') or '').lower()) for s in ('base', 'object')))) and 'eval' not in ((row.get('task_description') or '').lower()) and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"
