# WAM data: loads a frame CLIP + frame-aligned action/state chunks via the
# ZarrWamDataset (S3WamEpisodeResolver) and Mecka WAM keymap/transform.
# Alignment (production values — Wan 2.2 5B, K=2 latents/block, 4 predicted blocks):
#   cam_horizon=33 strided pixel frames  -> 9 latents (1 anchor + 4 blocks x K=2)
#     video_stride=6 (native 30Hz -> strided 5Hz): raw 33*6=198 native frames read
#   action_horizon=192 native frames    -> num_action_per_block=48 x 4 blocks
#   state_horizon=4  proprio anchors    -> num_state_per_block=1 x 4 blocks
#     state_stride=48 (= action_horizon/state_horizon): state[k] = proprio at
#     block k's action-start (paper-aligned per-block state alignment)
# Bounds checking disabled (raw frame-aligned ee-poses, no quantile calibration).
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_wam.WamMultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_wam.S3WamEpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_keymap
        cam_horizon: 33
        action_horizon: 192
        state_horizon: 4
        state_stride: 48     # action_horizon / state_horizon: state[k] aligns with block k's action-start
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_transform_list
        state_stride: 48
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] == '69bb1284d385c444f34222a7'"
    mode: total

valid_datasets:
  human_bimanual: ${data.train_datasets.human_bimanual}

train_dataloader_params:
  human_bimanual:
    batch_size: 4
    num_workers: 10
valid_dataloader_params:
  human_bimanual:
    batch_size: 4
    num_workers: 10
