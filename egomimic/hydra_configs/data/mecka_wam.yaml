# WAM data: loads a frame CLIP + frame-aligned action/state chunks via the
# ZarrWamDataset (S3WamEpisodeResolver) and Mecka WAM keymap/transform.
# Alignment (k=4 predicted latent frames, Wan VAE 4x temporal):
#   cam_horizon=17 pixel frames -> 5 latent frames (1 cond + 4 predicted)
#   action_horizon=16  (num_action_per_block=4 x 4 blocks)
#   state_horizon=4    (1 state obs per predicted frame)
# Bounds checking disabled (raw frame-aligned ee-poses, no quantile calibration).
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_wam.WamMultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_wam.S3WamEpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_keymap
        cam_horizon: 17
        action_horizon: 16
        state_horizon: 4
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_transform_list
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] == '69bb1284d385c444f34222a7'"
    mode: total

valid_datasets:
  human_bimanual: ${data.train_datasets.human_bimanual}

train_dataloader_params:
  human_bimanual:
    batch_size: 4
    num_workers: 10
valid_dataloader_params:
  human_bimanual:
    batch_size: 4
    num_workers: 10
