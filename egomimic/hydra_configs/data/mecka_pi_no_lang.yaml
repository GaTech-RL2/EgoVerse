_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: (row['lab'] == 'mecka') & (row['zarr_processed_path'] != '') & (row['episode_hash'] != '692ea23dc621d7f4aac3aaa1')"
    mode: train
valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: (row['lab'] == 'mecka') & (row['zarr_processed_path'] != '') & (row['episode_hash'] != '692ea23dc621d7f4aac3aaa1')"
    mode: valid

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: "random"
annotation_key: null
default_prompt: ""
proprio: true
embodiment_label: false

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 10
valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 10
