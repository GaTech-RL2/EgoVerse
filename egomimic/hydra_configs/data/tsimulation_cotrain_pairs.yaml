      folder_path: /storage/home/hcoda1/4/paphiwetsa3/r-dxu345-0/datasets/pushT/pairs/circle
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
