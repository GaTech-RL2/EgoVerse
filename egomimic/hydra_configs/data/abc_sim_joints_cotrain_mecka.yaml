# ABC_SIM_JOINTS_COTRAIN_MECKA: single-task cotrain -- the abc_sim task (robot,
# joint space, abc_sim_joints) + one mecka task (human, mecka_all_6d's
# wrist-frame 6D pipeline), one batch of each per step (CombinedLoader
# max_size_cycle). Default human task cup_on_saucer (the largest mecka task);
# another one restates the human filter_lambdas. See egomimic/scripts/abc_sim/README.md.
defaults:
  - abc_sim_joints
  - mecka_all_6d
  - _self_

train_datasets:
  human_bimanual:
    resolver:
      key_map:
        # RDT's 2-frame image history, as on the robot side
        image_history_gap_s: 0.1
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')) == 'cup_on_saucer'"

train_dataloader_params:
  human_bimanual:
    batch_size: 32

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
