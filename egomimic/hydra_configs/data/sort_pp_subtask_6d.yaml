defaults:
  - sort_pi_subtask
  - _self_

# Subtask-prediction run on sort + pick_place, WRIST-FRAME 6D.
#
# Inherits sort_pi_subtask. Role-named annotation arrays (injected into the
# *_rolekeys dataset copies by migrate_zarr_annotation_keys.py):
#   annotations_task    -> conditioning prompt (sort goal / pp instruction)
#   annotations_subtask -> subtask prediction target (sort; eva = task copy)
# (sort episodes carry real high+low; pick_place have only low -> high->low
# fallback uses the pick-place text as both.)
#
# Same folder_path + filters as cotrain_sort_pp_lang_6d (obj_gen dir for both
# groups; obj_gen-mirrored selection + sort + known-bad/error exclusions); only
# the inherited high/low split differs. Pair with model=pi0.5_subtask,
# evaluator=eval_pi_wristframe_6d.
train_datasets:
  eva_bimanual:
    resolver:
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/sortpp_eva_rolekeys
      transform_list:
        mode: cartesian_wristframe_6d
    filters:
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') in ('eva', 'eva_bimanual') and (row.get('zarr_processed_path') or '') != '' and 'alignment' not in ((row.get('task_description') or '').lower()) and (row.get('episode_hash') or '') != '2026-04-22-02-30-32-296000' and not (row.get('episode_hash') or '').startswith('2026-05-11') and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"
  human_bimanual:
    resolver:
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/sortpp_aria_rolekeys
      transform_list:
        mode: cartesian_wristframe_6d
    filters:
      filter_lambdas:
        - "lambda row: row.get('embodiment') == 'human_bimanual' and row.get('lab') == 'rl2' and (row.get('zarr_processed_path') or '') != '' and (row.get('episode_hash') or '') not in ('2026-04-26-00-17-53-000000', '2026-04-26-00-27-26-000000', '2026-05-01-02-52-58-000000') and (row.get('task') == 'sort' or (row.get('task') == 'pick_place' and any(s in ((row.get('task_description') or '').lower()) for s in ('base', 'object')))) and 'eval' not in ((row.get('task_description') or '').lower()) and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"

valid_datasets:
  eva_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') in ('eva', 'eva_bimanual') and (row.get('zarr_processed_path') or '') != '' and 'alignment' not in ((row.get('task_description') or '').lower()) and (row.get('episode_hash') or '') != '2026-04-22-02-30-32-296000' and not (row.get('episode_hash') or '').startswith('2026-05-11') and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: row.get('embodiment') == 'human_bimanual' and row.get('lab') == 'rl2' and (row.get('zarr_processed_path') or '') != '' and (row.get('episode_hash') or '') not in ('2026-04-26-00-17-53-000000', '2026-04-26-00-27-26-000000', '2026-05-01-02-52-58-000000') and (row.get('task') == 'sort' or (row.get('task') == 'pick_place' and any(s in ((row.get('task_description') or '').lower()) for s in ('base', 'object')))) and 'eval' not in ((row.get('task_description') or '').lower()) and not (isinstance(row.get('processing_error'), str) and row.get('processing_error').strip()) and not (isinstance(row.get('zarr_processing_error'), str) and row.get('zarr_processing_error').strip())"
