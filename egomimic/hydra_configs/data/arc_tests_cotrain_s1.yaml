_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# stride=1 variant of arc_tests_cotrain.yaml (cartesian baseline).
#
# InterpolatePose does actions[::stride] then interpolates to a FIXED
# new_chunk_length=100 (action_chunk_transforms.py:78-82), so stride does not
# change the output shape or the time window -- ACTION_HORIZON=30 raw frames
# (~1s) is read either way and act_seq stays 100. It only changes how many
# real samples back that interpolation:
#
#   stride=3 -> 100 steps interpolated from 10 real samples
#   stride=1 -> 100 steps interpolated from 30 real samples
#
# Exists so the baseline can be compared against the stride=1 arc variants
# without stride being confounded with the tokenizer.

# Cotrain mixture resolved from SQL and auto-synced from R2 into
# ${paths.dataset_dir} by S3EpisodeResolver — no pre-staged folder needed.
# S3EpisodeResolver.resolve() calls sync_from_filters(), which skips episodes
# already present locally, so this is a no-op on a machine that already has
# them and a full download on a fresh node.
#
# Population: lab=rl2, task=fold_clothes, split by embodiment via the per-leaf
# filters below — 290 eva_bimanual + 572 human_bimanual.
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

