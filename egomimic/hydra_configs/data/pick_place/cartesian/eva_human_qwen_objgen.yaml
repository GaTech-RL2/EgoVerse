defaults:
  - /data/pick_place/cartesian/eva_human_qwen@_here_
  - _self_

train_datasets:
  human_bimanual:
    resolver:
      transform_list:
        action_mode: cartesian_gripper_padded
        coord_frame: camframe
        rotation_mode: euler

valid_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pickplace_qwen
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: cartesian_gripper_padded
        coord_frame: camframe
        rotation_mode: euler
        stride: 3
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') == 'human_bimanual' and (row.get('zarr_processed_path') or '') != '' and 'object' in ((row.get('task_description') or '').lower())"
    mode: total

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6
