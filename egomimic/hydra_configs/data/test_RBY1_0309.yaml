# RBY1 0309 format: action columns use dots (actions.joint_arm_hand).
# Use this config when training on datasets/0309 (RBY1_HDF5_config_0309.json format).
# test_RBY1.yaml uses the old format (actions, actions_biarm, etc.) for test_2.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

zero_obs: true
zero_obs_use_numpy: false

train_datasets:
