_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  scale_aloha_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:SCALE_ALOHA_DATA_DIR,/home/ubuntu/EgoVerse/robot_zarr_dataset/donuts_flat}
      key_map:
        _target_: egomimic.rldb.embodiment.scale_aloha.ScaleAloha.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.scale_aloha.ScaleAloha.get_transform_list
        mode: cartesian
    filters: null
    mode: train
    valid_ratio: 0.1

valid_datasets:
  scale_aloha_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:SCALE_ALOHA_DATA_DIR,/home/ubuntu/EgoVerse/robot_zarr_dataset/donuts_flat}
      key_map:
        _target_: egomimic.rldb.embodiment.scale_aloha.ScaleAloha.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.scale_aloha.ScaleAloha.get_transform_list
        mode: cartesian
    filters: null
    mode: valid
    valid_ratio: 0.1

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: "random"
annotation_key: annotations
default_prompt: null

train_dataloader_params:
  scale_aloha_bimanual:
    batch_size: 32
    num_workers: 128
valid_dataloader_params:
  scale_aloha_bimanual:
    batch_size: 32
    num_workers: 128
