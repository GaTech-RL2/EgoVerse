train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  human_bimanual:
    batch_size: 32
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
