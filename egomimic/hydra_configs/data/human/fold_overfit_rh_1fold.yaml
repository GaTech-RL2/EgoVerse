# OVERFIT ON ONE SEGMENTED HUMAN DEMONSTRATION (fold 0).
#
# The overfit episode 2025-09-20-18-05-52-000000 contains 13 folds. The old
# config read them via `annotations` then sliced every fold into 128-frame
# windows (chunking=sequential, max_seq_len=128) -> 28 uniform chunks, so the
# model never saw a complete demonstration and had no signal for which fold or
# which phase it was in.
#
# Here: fold_segments (the structural key written by the annotation pipeline),
# max_seq_len null + chunking none so the fold loads WHOLE, and span_indices
# picks exactly one human demonstration. eva keeps its single full-span episode.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    chunking: none
    min_seq_len: 16
    max_seq_len: null
    annotation_key: fold_segments
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/human
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    chunking: none
    min_seq_len: 16
    max_seq_len: null
    annotation_key: fold_segments
    span_indices:
    - 0
valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    chunking: none
    min_seq_len: 16
    max_seq_len: null
    annotation_key: fold_segments
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/human
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    chunking: none
    min_seq_len: 16
    max_seq_len: null
    annotation_key: fold_segments
    span_indices:
    - 0
train_dataloader_params:
  eva_bimanual:
    batch_size: 2
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  human_bimanual:
    batch_size: 2
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
valid_dataloader_params:
  eva_bimanual:
    batch_size: 2
    num_workers: 1
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  human_bimanual:
    batch_size: 2
    num_workers: 1
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
