    # FREE decode-waste elimination: decode only every 4th frame per span (the
    # frames the model consumes) — MUST match model TargetBuilder.stride=4.
    # Byte-identical model input; ~4x less JPEG decode. 1 == OFF (decode all).
    img_decode_stride: 4

# HOST-RAM NOTE: two emb loaders run concurrently -> total workers =
# 2 * num_workers. 480x480 image seqs (up to 128 frames * batch 4) make each
# prefetch buffer large. Measured in the dry-run: 12 workers/emb * prefetch 4
# (=24 workers, 96 buffers) OOM-SIGKILLs host RAM at --mem=64G; 4 workers/emb *
# prefetch 2 (=8 workers, 16 buffers) ran the full dry-run to completion (finite
# loss on both embs) at --mem=112G with wide headroom. These 4/2 values are the
# PROVEN default paired with rh_real.sbatch's --cpus-per-task=12 --mem=112G.
# To raise throughput, bump both together AND raise sbatch --mem proportionally
# (8/emb*pf2 needs ~128G; 12/emb*pf4 needs ~256G+).
train_dataloader_params:
  eva_bimanual:
    batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  human_bimanual:
    batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
valid_dataloader_params:
  eva_bimanual:
    batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  human_bimanual:
    batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
