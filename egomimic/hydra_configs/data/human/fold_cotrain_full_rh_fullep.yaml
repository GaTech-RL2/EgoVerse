_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# ROBOT-HUMAN hetero-action-dim FULL COTRAIN (span-as-episode, all episodes).
# Pairs with model configs bf_rh_sdp_dual.yaml / bf_rh_sdp_nodual.yaml.
# Derived from fold_overfit_rh.yaml but pointed at the FULL fold datasets:
#   eva  : ALL /coc/flash7/scratch/paphiwetsa3/eva_fold/*.zarr       (~590, single full-span "annotations")
#   human: ALL /coc/flash7/scratch/paphiwetsa3/fold_data_new/*.zarr  (~572, per-fold "annotations" spans)
#
# Loader = ZarrAnnotationSpanPackedDataset (one packed sample per annotation
# span; reads the hardcoded `annotations` zarr key via _load_annotations).
# Span-safe per-frame keymaps/transforms from
# egomimic.rldb.embodiment.fold_span_transforms:
#   eva  : actions_cartesian(14)  = [left.cmd_ee_pose(7), right.cmd_ee_pose(7)];
#          state_ee_pose(14)
#   human: actions_keypoints(138) = head-frame [Lwrist_ypr(6), Lkp_hf(63),
#          Rwrist_ypr(6), Rkp_hf(63)]; state_keypoints(138); obs_head_pose(7)
#
# In-domain cotrain: valid == train (no holdout).

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/eva_fold
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: null
    # FREE decode-waste elimination: decode only every 4th frame per span (the
    # frames the model consumes) — MUST match model TargetBuilder.stride=4.
    # Byte-identical model input; ~4x less JPEG decode. 1 == OFF (decode all).
    img_decode_stride: 4
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/fold_data_new
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: null
    # FREE decode-waste elimination: decode only every 4th frame per span (the
    # frames the model consumes) — MUST match model TargetBuilder.stride=4.
    # Byte-identical model input; ~4x less JPEG decode. 1 == OFF (decode all).
    img_decode_stride: 4

