# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
# needing to walk up to `train_datasets` after it's been mutated in place.
#
# GROUPED shape: {group: {embodiment: dataset}}. Each group is a separate val
# loop, run in the order written here. The group named `valid` is the default
# one -- its metrics stay `Valid/...` and its videos stay in
# videos/epoch_N/{embodiment}/, so this run overlays on charts from runs that
# predate val groups. Every other group is namespaced.
#
# valid_ratio: 1.0 takes the WHOLE allowlist as validation (split_dataset_names
# puts int(len * 1.0) == len names in the valid set). These episodes are
# excluded from the train allowlists above, so there is nothing to hold back.
valid_datasets:

  # IN-DOMAIN: held-out trajectories of the tasks the model trains on. This is
  # the control -- if these do not come down, the transfer number below means
  # nothing.
  valid:
    human_bimanual:
      # 2 held-out episodes each from mecka/folding_clothes,
      # scale/freeform_folding_clothes and microagi fold*shorts.
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
