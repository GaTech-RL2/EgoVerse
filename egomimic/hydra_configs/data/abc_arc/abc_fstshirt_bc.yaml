# `image_hw` pins every episode to one size per embodiment, with each episode's
# intrinsics rescaled by the same per-axis factors (ZarrDataset._scale_intrinsics).
# These splits happen to be uniform today, but a batch cannot mix image sizes and
# ABC/mecka ship 640x480, 640x360, 1280x720 and 848x480 -- so adding an episode
# without this would crash collate rather than resize.
# ABC-ONLY (no cotraining) time-indexed BC data: fold_and_stack_the_t_shirts,
# yam_bimanual.
#
# This is the single-domain arm of the cotrain ablation. The yam block below is
# byte-for-byte the yam block of abc_fstshirt_mecka_freefold_baseline_cotrain --
# same 20 episodes, same coord_frame, same action space, same dataloader params.
# The ONLY difference is that the human_bimanual split is absent. That is what
# isolates the effect of cotraining: robot data volume is held fixed at 20
# episodes / 48,286 frames, so any delta against the cotrain run is attributable
# to the human data, not to seeing more or less robot data.
#
# Its arc twin is abc_fstshirt_arc_bc_D40_M100.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/arc-training
      image_hw: [480, 640]
      # 20 YAM episodes = 48,286 frames. Matched to the cotrain run's yam split
      # so the two see identical robot data; do not change one without the other.
      debug: 20
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'yam_bimanual' and row['lab'] == 'abc' and row['task'] == 'fold and stack the t-shirts' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
# needing to walk up to `train_datasets` after it's been mutated in place.
valid_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/arc-training
      image_hw: [480, 640]
      debug: 20
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'yam_bimanual' and row['lab'] == 'abc' and row['task'] == 'fold and stack the t-shirts' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 6

valid_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 6
