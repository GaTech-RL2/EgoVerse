# fold-shorts EXTREME-tempo split (autoresearch shorts-260910-0030).
# Training set = slowest 100 + fastest 100 episodes by the Step 0 speed heuristic:
# 200 eps / 2.89 h, tau 0.222-0.634 m/s, CV 0.2254. The tempo band 0.366-0.436 is
# occupied by NO training episode and is held out as test_mid, an interpolation probe.
# The natural pool fails the protocol heterogeneity gate (H=0.161 < 0.20), which is
# why only the tails are sampled. Modes are frame-imbalanced 2.4x (slow 2.05h vs
# fast 0.84h) because slow episodes are longer -- report test_fast/test_slow apart.
# Stationery clone of abc_fslongshirt_arc_bc_D40_M100 (2026-09-07, Aidan): task = 'sort the stationery into containers',
# selector K = 400 -> 793 episodes / 15.9 h of the 2,066 / 41.6 h pool (verified against the
# 2026-09-04 episode snapshot); folder_path = the Phoenix mirror (all 2,066 present).
# `image_hw` pins every episode to one size per embodiment, with each episode's
# intrinsics rescaled by the same per-axis factors (ZarrDataset._scale_intrinsics).
# These splits happen to be uniform today, but a batch cannot mix image sizes and
# ABC/mecka ship 640x480, 640x360, 1280x720 and 848x480 -- so adding an episode
# without this would crash collate rather than resize.
# ABC-ONLY (no cotraining) ARC-TOKENIZED BC data at D = 0.40 m / M = 100:
# fold_and_stack_the_t_shirts, yam_bimanual.
#
# This is the single-domain arm of the cotrain ablation. The yam block below is
# byte-for-byte the yam block of
# abc_fslongshirt_micro_foldclothes_arc_cotrain_D40_M100 -- the same episode selection, same
# coord_frame, same action space, same arc knobs, same dataloader params. The
# ONLY difference is that the human_bimanual split is absent. That is what
# isolates the effect of cotraining: robot data volume is held fixed at 20
# episodes / 48,286 frames, so any delta against the cotrain run is attributable
# to the human data, not to seeing more or less robot data.
#
# Its time-indexed twin is abc_fslongshirt_bc.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

