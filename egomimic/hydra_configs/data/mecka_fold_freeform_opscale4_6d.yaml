# MECKA_FOLD_FREEFORM_OPSCALE4_6D: the k=4 rung of the freeform fold-clothes
# OPERATOR-SCALING ladder (chosen 2026-09-17 from SQL app.episodes); the k=1/2
# rungs inherit this file and change only `train_operators`. A rung trains on
# ALL annotated episodes of the top-k operators by ANNOTATED hours (nested, so
# each rung only adds an operator; live filters, so the split grows with SQL),
# minus the 3 seen-op val episodes. Data volume grows with the operator count
# (0.24 / 0.56 / 1.10 h at k = 1 / 2 / 4): the ladder asks whether another
# operator's data helps, not diversity at a fixed budget.
#
#   train            annotated episodes of `train_operators`, minus the pins below
#   seen_op_valid    3 pinned episodes of operator #1, in every rung
#   unseen_op_valid  annotated episodes of opsplit_6d's 31 `held_out_operators`
#   train_viz        the train split (trainHydra's default)
# Every split keeps annotated episodes only: 112 of the 462 freeform episodes
# have segments = NULL and would train the text stem on the empty default prompt.
# Norm stats differ per rung: precompute on each rung's own config.
defaults:
  - mecka_fold_freeform_opsplit_6d
  - _self_

valid_prefix: seen_op_valid

# Config-only: the Python tuple the train operator lambda interpolates.
train_operators: "('6964d38183a9fdf2d8663792', '68e0b875c33a1abcb8fc55b9', '695d09fc83a9fdf2d84d9c11', '69439ad5a2a8b5aee76602f5')"

train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ('folding_clothes', 'fold_clothes')"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        # `segments` is a list or None; isinstance, since bool() of a numpy
        # round-tripped value raises.
        - &annotated "lambda row: isinstance(row.get('segments'), list) and len(row.get('segments')) > 0"
        - "lambda row: str(row.get('operator', '')) in ${data.train_operators}"
        # minus the seen-op val pins
        - "lambda row: str(row.get('episode_hash', '')) not in ('696bcbe0e13d37dd4293f58b', '696bcbe86377d0871b6a9253', '696bcc71ed8ed158122ec794')"

valid_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ('folding_clothes', 'fold_clothes')"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        - *annotated
      # op #1 6964d38183a9fdf2d8663792: 3 eps, 9745 f = 5.41 min
      episode_hashes:
        - 696bcbe0e13d37dd4293f58b
        - 696bcbe86377d0871b6a9253
        - 696bcc71ed8ed158122ec794

unseen_op_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ('folding_clothes', 'fold_clothes')"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        - *annotated
        - "lambda row: str(row.get('operator', '')) in ${data.held_out_operators}"
    mode: total

unseen_op_valid_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8
    shuffle: false

# K = floor(limit_val_batches * batch_size / episodes) of the resolved split.
metric_frames_per_episode:
  valid: auto
  unseen_op_valid: auto
  train_viz: auto

# The longest episode of each split, so one contiguous episode fills the video
# budget; the train_viz pin is an operator #1 episode, so it is in every rung.
video_episodes:
  valid:
    - 696bcbe86377d0871b6a9253
  unseen_op_valid:
    - 696bc7e021d8e8ab8ddc8380
  train_viz:
    - 696dd090a56f03a27e59f69c
