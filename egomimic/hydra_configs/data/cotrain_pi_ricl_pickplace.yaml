# RICL training data: pi0.5 + retrieval finetuned on four pick/place segment
# groups (eva_bimanual). Query = train-group frames; bank = train-group frames
# (set retrieval_cache_dir to the pickplace train cache; query=train/bank=train/
# LOSO-episode). Frame-level SegmentFilteredDataset keeps only the train-group
# spans inside pick_place episodes. valid = held-out train-group episodes (same
# groups, NEW episodes). Held-out eval groups live in cotrain_pi_ricl_pickplace_eval.
# 15-step action chunks. Groups defined in egomimic/ricl/pickplace_splits.py.
defaults:
  - cotrain_pi_ricl
  - _self_

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.SegmentFilteredDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian_pi
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
        chunk_length: 15  # predict a 15-step action chunk (matches model.action_horizon=15)
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row, _eps=__import__('egomimic.ricl.pickplace_splits', fromlist=['train_episode_hashes']).train_episode_hashes(): row.get('embodiment') == 'eva_bimanual' and row.get('episode_hash') in _eps"
    mode: total
    segments_csv: &segments_csv ${paths.work_dir}/egomimic/ricl/episode_lists/action_segments.csv
    by: &segment_by ["verb", "object", "hand"]
    groups: &train_groups
      - ["pick", "blue stuffed toy", "left"]
      - ["pick", "white cup", "right"]
      - ["place", "eggplant", "left"]
      - ["place", "green bowl", "right"]
  aria_bimanual: null

valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.SegmentFilteredDataset._from_resolver
    resolver: ${...train_datasets.eva_bimanual.resolver}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row, _eps=__import__('egomimic.ricl.pickplace_splits', fromlist=['valid_episode_hashes']).valid_episode_hashes(): row.get('embodiment') == 'eva_bimanual' and row.get('episode_hash') in _eps"
    mode: total
    segments_csv: *segments_csv
    by: *segment_by
    groups: *train_groups
  aria_bimanual: null

# Bank = eva (robot) train-group segments, same keymap/transform as the query
# path, 15-step chunks.
bank_embodiment: eva_bimanual
bank_zarr_root: ${paths.dataset_dir}/{hash}
bank_converter:
  _target_: egomimic.utils.action_utils.RobotBimanualCartesianEuler
bank_keymap:
  _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
  keymap_mode: cartesian_pi
  annotation_key: annotations
bank_transform_list:
  _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
  mode: cartesian
  chunk_length: 15  # retrieved demos carry a 15-step action chunk (sliced by action_horizon=15)

# eva's real layout is 14-D (2 arms x [xyz, ypr, gripper]) for both the ee_pose
# state and the per-step action; discretize the retrieved blocks at their true
# width instead of padding to 32.
state_dim: 14
action_dim: 14
