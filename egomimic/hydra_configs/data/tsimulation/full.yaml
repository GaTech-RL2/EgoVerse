# @package data
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pushT/circle_750/circle
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 1024

valid_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pushT/circle_750/circle
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 1024

# 2026-05-23 perf bump: pin_memory + persistent_workers + prefetch_factor=4
# + num_workers=12 (matching cpus-per-task=12 on A40 alloc). Pin memory
# enables async H2D DMA. Persistent workers avoids the fork-each-epoch
# tax. prefetch_factor=4 keeps 48 batches queued across workers. Target
# was 57% GPU util on the previous data-bound config.
train_dataloader_params:
  pushshapes_sim:
    batch_size: 16
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
valid_dataloader_params:
  pushshapes_sim:
    batch_size: 16
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
