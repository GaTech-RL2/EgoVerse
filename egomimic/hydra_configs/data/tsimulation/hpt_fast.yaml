# @package data
# Fast in-memory variant of tsimulation_hpt.yaml. Identical batch contract
# (per-frame obs + length-action_horizon action chunk for pushshapes_sim), but
# each episode is decoded into RAM once at construction by InMemoryZarrDataset,
# so __getitem__ is a slice + uint8->float cast with no per-sample JPEG decode.
# The decode happens in the parent process before the DataLoader forks, so the
# image buffers are shared to workers copy-on-write.
#
# Only differences from _tsim_perframe_base: the resolver _target_
# (InMemoryLocalEpisodeResolver), folder_path (new_circle_3), and tuned
# dataloader params (workers 10 + pin/persistent/prefetch). Everything
# downstream (normalize / bounds / collate / norm_stats / model) is unchanged.
defaults:
  - tsimulation/_perframe_base
  - _self_

train_datasets:
  pushshapes_sim:
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_inmem.InMemoryLocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/new_circle_3

valid_datasets:
  pushshapes_sim:
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_inmem.InMemoryLocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/new_circle_3

train_dataloader_params:
  pushshapes_sim:
    num_workers: 10
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
valid_dataloader_params:
  pushshapes_sim:
    num_workers: 10
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
