# @package data
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Cotrain big-circle + small-circle, FULL-EPISODE teacher forcing
# (chunking="none" -> one full episode per packed sample). Action chunking
# (1 obs -> 8 actions) is handled in GMMLoss, NOT here.
#
# DATA: both pushers live in ONE dir, /coc/flash7/paphiwetsa3/datasets/
# circle_co_big_small (953 "circle" + 955 "circle_small"), BOTH tagged
# embodiment="pushshapes_sim". They are split by EPISODE NAME via a
# DatasetFilter ('circle_small' in the folder name). The small split is
# re-tagged to pushshapes_sim_small_circle via the override resolver so the
# per-emb outer chunker + cotrain dispatch route correctly.

train_datasets:
  pushshapes_sim:                       # big circle
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle_co_big_small
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: 'circle_small' not in row['episode_hash']"
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560
  pushshapes_sim_small_circle:          # small circle
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle_co_big_small
      embodiment_override: "pushshapes_sim_small_circle"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: 'circle_small' in row['episode_hash']"
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560

valid_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle_co_big_small
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: 'circle_small' not in row['episode_hash']"
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560
  pushshapes_sim_small_circle:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle_co_big_small
      embodiment_override: "pushshapes_sim_small_circle"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: 'circle_small' in row['episode_hash']"
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560

train_dataloader_params:
  pushshapes_sim:
    batch_size: 1
    num_workers: 4
  pushshapes_sim_small_circle:
    batch_size: 1
    num_workers: 4
valid_dataloader_params:
  pushshapes_sim:
    batch_size: 1
    num_workers: 4
  pushshapes_sim_small_circle:
    batch_size: 1
    num_workers: 4
