_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# ROBOT+HUMAN COTRAIN feed. Both streams fed; CombinedLoader max_size_cycle
# means the longer (human) loader sets epoch length and eva cycles.
#
# FULL fold set staged on skynet 2026-08-10: human 709 eps / 13,048 spans,
# eva 594 eps. Root /coc/flash7/paphiwetsa3/datasets/fold_rh
#
# annotation_key=fold_segments is the TIMESTAMP-GAP segmentation (2026-08-09):
# split at any >=1.0s discontinuity in obs_rgb_timestamps_ns -- untracked frames
# are never written, so the timeline jump IS the hand-tracking dropout. Spans
# floored at 30 frames (1s; a cloth cannot be folded faster) and clipped to
# [0.33x, 3.0x] the episode median. Verified on the staged copy: 13,048 spans,
# min 31 frames. It REPLACED the SE(3) head-motion segmenter, which never
# looked at hand tracking at all.
#
# NOTE: img_decode_stride / annotation_key are NOT accepted on this branch.
# from_resolver forwards **resolve_kwargs into LocalEpisodeResolver.resolve(),
# which rejects img_decode_stride; and ZarrAnnotationSpanPackedDataset reads a
# HARDCODED `annotations` key (no annotation_key param exists). The staged data
# therefore mirrors fold_segments -> annotations, matching rh_overfit, which
# carries identical spans under both keys.
#
# span-safe keymaps/transforms (egomimic.rldb.embodiment.fold_span_transforms):
#   eva   : actions_cartesian(14) = [left.cmd_ee_pose(7), right.cmd_ee_pose(7)],
#           state_ee_pose(14)
#   human : actions_keypoints(126) = head-frame keypoints ONLY (wrist pose
#           dropped as redundant), state_keypoints(126), obs_head_pose(7)
#   -> pairs with model bf_rh/r5h8 (d126). NOT with sdp_dual, which is d138.
#
# batch eva 2 / human 6: eva spans are whole ~1296-frame episodes while human
# folds are ~157 frames, so 3x the human batch keeps frames-per-step comparable.
# multiprocessing_context: spawn -- fork deadlocks this loader (an arm hung 15h
# with zero steps on the fork variant).

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/fold_rh/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: null
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/fold_rh/human
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: null

