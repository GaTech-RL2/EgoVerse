_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# ROBOT-HUMAN hetero-action-dim OVERFIT (span-as-episode, 1 episode per emb).
# Pairs with model configs bf_rh_sdp_dual.yaml / bf_rh_sdp_nodual.yaml.
#
# Loader = ZarrAnnotationSpanPackedDataset (one packed sample per annotation
# span). Span-safe per-frame keymaps/transforms from
# egomimic.rldb.embodiment.fold_span_transforms:
#   eva  : actions_cartesian(14)  = [left.cmd_ee_pose(7), right.cmd_ee_pose(7)];
#          state_ee_pose(14)
#   human: actions_keypoints(138) = head-frame [Lwrist_ypr(6), Lkp_hf(63),
#          Rwrist_ypr(6), Rkp_hf(63)]; state_keypoints(138); obs_head_pose(7)
#
# Each folder_path holds ONLY the target episode (symlink dir) -> no filter
# needed (zarr metadata keys embodiment, not robot_name). Swap the two
# folder_path dirs to change episodes.
#   eva   : eva_fold/2025-12-30-01-47-21-674000.zarr  (1296 frames, 1 full span)
#   human : fold_data_new/2025-09-20-18-05-52-000000.zarr (3383 frames, per-fold spans)

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: 128
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/human
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: 128

# valid == train (val is disabled at launch for the overfit; kept for schema).
valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: 128
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrAnnotationSpanPackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/scratch/paphiwetsa3/rh_overfit/human
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_span_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: True"
    chunking: sequential
    min_seq_len: 16
    max_seq_len: 128

train_dataloader_params:
  eva_bimanual:
    batch_size: 2
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  human_bimanual:
    batch_size: 2
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
valid_dataloader_params:
  eva_bimanual:
    batch_size: 2
    num_workers: 1
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  human_bimanual:
    batch_size: 2
    num_workers: 1
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
