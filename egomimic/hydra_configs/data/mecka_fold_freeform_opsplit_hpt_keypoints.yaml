defaults:
  - mecka_fold_freeform_opsplit_pi_6d
  - _self_

# MECKA_FOLD_FREEFORM_OPSPLIT_HPT_KEYPOINTS — HPT keypoint-action twin of
# mecka_fold_freeform_opsplit_pi_6d: the SAME mecka FREEFORM fold-clothes
# episodes and the SAME held-out-OPERATOR split (`held_out_operators`, the
# filters, the train_viz slice and the loader params are all inherited — edit
# the operator list only in the parent). Only the keymap and transform differ:
#
#   keymap_mode: keypoints           front image -> `front_img_1` (the HPT
#                                    encoder key; a `_pi` suffix would give
#                                    base_0_rgb)
#   mode: keypoints_wristframe_ypr
#
# Batch keys:
#   actions_keypoints          (100, 138)  wrist-first wrist-frame keypoint
#                                          action: per hand [wrist xyz+ypr in
#                                          its own current wrist frame (6) |
#                                          21 MANO keypoints in that wrist
#                                          frame (63)] x {left, right}
#   observations.state.keypoints   (138,)  per hand [wrist pose in HEAD frame
#                                          (6) | keypoints in wrist frame (63)];
#                                          the HPT `state_keypoints` stem input
#                                          and what the eval revert (wrist ->
#                                          head frame) reads
#   annotations                            task-description track -> the
#                                          `sampled_prompt` for a Qwen text stem
#
# There is no `observations.state.ee_pose`: the plain keypoint keymap never
# reads the ee_pose zarr keys. fix_mecka_left_wrist is off because it only
# corrects those ee_pose keys (Human.get_transform_list rejects it for keypoint
# modes); pad_proprio_gripper is off because keypoint modes ignore it.
#
# NORMALIZATION: proprio + action keys are quantile-normalized from
# precomputed stats computed on THIS config:
#   precompute_norm_stats.py --config-name train_zarr_mecka_kp_wrist_hpt \
#     --data mecka_fold_freeform_opsplit_hpt_keypoints \
#     --model hpt_bc_keypoints_wrist_300M --out <out>
# Stats from the removed pi-keypoint config (fold_freeform_opsplit_kp) carry
# the ee_pose keys and fail the key-set provenance check.
#
# Pairs with model=hpt_bc_keypoints_wrist_300M and
# evaluator=eval_hpt_keypoints_wrist
# (+ `+evaluator@train_viz_evaluator=train_viz_hpt_keypoints_wrist`); see
# train_zarr_mecka_kp_wrist_hpt.yaml for the composed recipe.

train_datasets:
  human_bimanual:
    resolver:
      key_map:
        keymap_mode: keypoints
      transform_list:
        mode: keypoints_wristframe_ypr
        fix_mecka_left_wrist: false
        pad_proprio_gripper: false
