# Per-frame loader for HPT-style training on pushshapes_sim. Each sample is one
# frame with obs (image + state) and a length-action_horizon (32) action chunk.
# Unlike tsimulation.yaml (which packs full episodes into a varlen stream), this
# returns (B, T_chunk, ...) tensors that fit HPT's chunked-action head directly.
#
# This leaf is _tsim_perframe_base verbatim (Local resolver on
# Tsim_datasets2/circle, get_keymap, batch 128 / workers 8). The fast/causal
# siblings extend the same base with the in-memory resolver + perf knobs.
#
# skip_bounds_check (set in the base): accept slightly-out-of-quantile frames
# as-is (per-frame loader + reused norm stats causes ~1-2% of frames to fail
# bounds; resampling each one stalls data loading).
defaults:
  - _tsim_perframe_base
  - _self_
