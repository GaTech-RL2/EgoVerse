_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Cotrain dataloader: circle + u_socket, arc-tok (D=130 px, M=100).
#
# EQUAL AMOUNTS: MultiDataModuleWrapper wraps the per-domain loaders in
# CombinedLoader(..., "max_size_cycle"), which yields one batch from EVERY
# domain per step and cycles whichever is shorter. With the SAME batch_size on
# both domains, each optimizer step therefore sees exactly 64 circle and 64
# u_socket samples — a 1:1 mix by construction, independent of the two sets'
# differing episode lengths. Keep the two batch_size values equal or the ratio
# silently shifts.
#
# 64 + 64 = 128 samples/step, matching the single-pusher runs' batch of 128, so
# the optimizer sees the same number of samples per step as the baselines.
#
# u_socket episodes carry the same ``pushshapes_sim`` embodiment tag on disk as
# circle, so the resolver re-stamps them as pushshapes_sim_u_socket (id 18);
# without the override both domains would collapse to one and the per-domain
# proprio stems could not be dispatched.
#
# The circle domain is padded 2-D -> 3-D BEFORE tokenizing, so its velocity
# token comes out 3-D with theta_vel = 0 alongside the zero theta waypoints.
# u_socket is already 3-D, so its pad step is a no-op and is omitted.
#
# D and M here must match model=pusht_cotrain/circle_usocket_arc_d130m100
# and evaluator/hpt/pusht_cotrain_arc_d130m100.
#
# Raw window widened 100 -> 150 frames: at 100 only 88.8% of u_socket windows
# contain 130 px of travel (circle 98.4%); at 150 it is 98.6%/100%, so the
# tokenizer rarely clips short of D. Measured on the training sets 2026-08-17.

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/rco3/datasets/circle_3000
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_arc
        action_horizon: 150
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_transform_list
        mode: arc_tokenizer
        min_distance_unit: 130.0
        resampled_vector_length: 100
        pad_action_dim: 3
    mode: total
    # bounds_check=false: skip the per-sample quantile bounds scan entirely.
    # skip_bounds_check only suppressed the RESAMPLE on a violation -- the scan
    # still ran on every __getitem__ and logged, which is pure overhead once we
    # have decided to keep out-of-quantile samples.
    skip_bounds_check: true
    bounds_check: false
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v1/u_socket_3000
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_arc
        action_horizon: 150
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_transform_list
        mode: arc_tokenizer
        min_distance_unit: 130.0
        resampled_vector_length: 100
    mode: total
    # bounds_check=false: skip the per-sample quantile bounds scan entirely.
    # skip_bounds_check only suppressed the RESAMPLE on a violation -- the scan
    # still ran on every __getitem__ and logged, which is pure overhead once we
    # have decided to keep out-of-quantile samples.
    skip_bounds_check: true
    bounds_check: false

