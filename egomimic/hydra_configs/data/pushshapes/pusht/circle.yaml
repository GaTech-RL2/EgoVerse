_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# HPT chunked dataloader for pushshapes_sim on the circle_3000 clean set
# (3040 T-shape + circle-pusher episodes at obstacle level 0).
#
# Each sample is one frame: single-obs image + state, plus a length-32
# action chunk. Matches model=pusht/circle (trunk.action_horizon = 32,
# head act_seq = 32, per-frame action dim = 2).

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/circle_3000
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 32
      transform_list: null
    mode: total
    skip_bounds_check: true

valid_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/circle_3000
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 32
      transform_list: null
    mode: total
    skip_bounds_check: true

train_dataloader_params:
  pushshapes_sim:
    batch_size: 128
    num_workers: 4
valid_dataloader_params:
  pushshapes_sim:
    batch_size: 128
    num_workers: 4
