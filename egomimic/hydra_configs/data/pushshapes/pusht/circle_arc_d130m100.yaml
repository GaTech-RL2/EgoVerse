_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# D=130 px / M=100 variant. Raw window widened 100 -> 150 frames: at 100
# frames only 88.8%% of u_socket windows contain 130 px of travel (circle 98.4%%,
# circle_small 97.8%%); at 150 it is 98.6%%/100%%/100%%, so the tokenizer rarely has to
# clip short of D. Measured on the training sets, 2026-08-17.

# HPT + arc-tok dataloader for pushshapes_sim on the circle_3000 clean set
# (3040 T-shape + circle-pusher episodes at obstacle level 0).
#
# Raw window: 100 pusher-target frames from the zarr per sample. The
# transform_list rewrites this to (M+1, 2) = (41, 2) arc-length tokens
# (40 waypoints + 1 velocity token) via TokenizePushShapesArcLength.
#
# D = 100 px chunk arc length, M = 40 waypoints. Must match
# model=pusht_arc/circle and the model's ``arc_tok.min_distance_unit``.

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/rco3/datasets/circle_3000
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_arc
        action_horizon: 150
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_transform_list
        mode: arc_tokenizer
        min_distance_unit: 130.0
        resampled_vector_length: 100
    mode: total
    # bounds_check=false: skip the per-sample quantile bounds scan entirely.
    # skip_bounds_check only suppressed the RESAMPLE on a violation -- the scan
    # still ran on every __getitem__ and logged, which is pure overhead once we
    # have decided to keep out-of-quantile samples.
    skip_bounds_check: true
    bounds_check: false

valid_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/rco3/datasets/circle_3000
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_arc
        action_horizon: 150
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_transform_list
        mode: arc_tokenizer
        min_distance_unit: 130.0
        resampled_vector_length: 100
    mode: total
    # bounds_check=false: skip the per-sample quantile bounds scan entirely.
    # skip_bounds_check only suppressed the RESAMPLE on a violation -- the scan
    # still ran on every __getitem__ and logged, which is pure overhead once we
    # have decided to keep out-of-quantile samples.
    skip_bounds_check: true
    bounds_check: false

train_dataloader_params:
  pushshapes_sim:
    batch_size: 128
    num_workers: 4
valid_dataloader_params:
  pushshapes_sim:
    batch_size: 128
    num_workers: 4
