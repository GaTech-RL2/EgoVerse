_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Arc-tokenized cotrain: MECKA human fold_clothes  x  RL2 eva fold_clothes.
#
# Differs from arc_tests_cotrain_arctok.yaml (which is aria/rl2 human, 572 eps,
# vs 290 eva -- a ~2:1 human-weighted mix) in two ways:
#   * human side is lab=mecka, task=fold_clothes  (1607 available in SQL;
#     NOTE this is distinct from mecka's 'folding_clothes', 462 eps, used by
#     mecka_folding_eva_fold_cotrain_arctok.yaml)
#   * BOTH embodiments capped at debug=290 so the mix is 1:1 -- 290 is the
#     eva ceiling (lab=rl2, task=fold_clothes).
#
# Tokenizer knobs interpolate from the top-level ``arc_tokenizer`` group, so
# ``arc_tokenizer.min_distance_unit=0.4 arc_tokenizer.resampled_vector_length=100``
# actually applies here. (The older arc-tok data configs hardcode 0.20/15 and
# silently ignore those overrides -- that mismatch crashes training with
# `shape '[B, 101, -1]' is invalid` once the model expects M+1=101 rows.)
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: arc_tokenizer_cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: arc_tokenizer_cartesian
        stride: 3
        min_distance_unit: ${arc_tokenizer.min_distance_unit}
        resampled_vector_length: ${arc_tokenizer.resampled_vector_length}
      debug: 290
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: arc_tokenizer_cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: arc_tokenizer_cartesian
        min_distance_unit: ${arc_tokenizer.min_distance_unit}
        resampled_vector_length: ${arc_tokenizer.resampled_vector_length}
      debug: 290
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
