_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Eva-only ROBOT-BASELINE classic (no arc-tok) run: mirrors
# arc_tests_cotrain.yaml on the eva side but drops human_bimanual entirely.
# Same SQL filter (eva_bimanual + lab=rl2 + task=fold_clothes) so the eva
# data pool is identical to the cotrain version — apples-to-apples "classic,
# robot-only" vs "classic, cotrain".
#
# mode=cartesian: eva stays at 14-dim (native gripper); no padding needed
# on the eva side. The removed human side is the one that would have needed
# ``cartesian_padded`` — with human dropped, no padding concern remains.
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  eva_bimanual:
    batch_size: 128
    num_workers: 6

valid_dataloader_params:
  eva_bimanual:
    batch_size: 128
    num_workers: 6
