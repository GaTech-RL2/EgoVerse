# PRIVATE Mecka mono fold (t-shirt + no-t-shirt), fixed-budget operator ladder,
# 4 operator(s): 9.704 h, 309 episodes, t-shirt share 0.501.
# Every rung has the same hours, split equally over its operators, with nested
# picks. Generated by egomimic/scripts/mecka_process/mono/make_configs_fixed_budget.py;
# do not edit by hand. IDs: $EGOVERSE_MECKA_PRIVATE_DIR/splits (private to the lab).
#   train            = this rung's packed episodes
#   valid            = operator 1's held-out episodes (seen_op1_valid, every rung)
#   extra_valid      = the held-out episodes of this rung's operators (k > 1)
#   unseen_op_valid  = the t-shirt + no-t-shirt opscale SQL unseen-operator sets
# The private zarrs are post-fix left wrist; the SQL mecka zarrs are not.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

valid_prefix: seen_op1_valid

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:EGOVERSE_MECKA_PRIVATE_DIR}/zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        stride: 1
        fix_left_wrist_convention: false
        pad_proprio_gripper: false
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      episode_hashes: ${mecka_private:mecka_private_fixedbudget_op4,train_datasets.human_bimanual.filters.episode_hashes}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

# Eval heads on other episodes widen the bounds to 10x each cell's quantile range.
valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    bounds_rel_slack: 10.0
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      episode_hashes: ${mecka_private:mecka_private_fixedbudget_op4,valid_datasets.human_bimanual.filters.episode_hashes}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

train_viz_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters: ${data.train_datasets.human_bimanual.filters}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

unseen_op_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    bounds_rel_slack: 10.0
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        annotation_key: annotations
        proprio_history: ${data.train_datasets.human_bimanual.resolver.key_map.proprio_history}
        history_stride: ${data.train_datasets.human_bimanual.resolver.key_map.history_stride}
        image_history_gap_s: ${data.train_datasets.human_bimanual.resolver.key_map.image_history_gap_s}
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        stride: 1
        fix_left_wrist_convention: true
        pad_proprio_gripper: false
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
      episode_hashes: ${mecka_private:mecka_private_fixedbudget_op4,unseen_op_valid_datasets.human_bimanual.filters.episode_hashes}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

extra_valid_prefix: seen_ops_valid

extra_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    bounds_rel_slack: 10.0
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      episode_hashes: ${mecka_private:mecka_private_fixedbudget_op4,extra_valid_datasets.human_bimanual.filters.episode_hashes}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

extra_valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 8
    shuffle: false

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 12

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 8
    shuffle: false

train_viz_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 4
    shuffle: false

unseen_op_valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 8
    shuffle: false

metric_frames_per_episode:
  valid: auto
  train_viz: auto
  unseen_op_valid: auto
  extra_valid: auto

video_episodes:
  valid: ${mecka_private:mecka_private_fixedbudget_op4,video_episodes.valid}
  train_viz: ${mecka_private:mecka_private_fixedbudget_op4,video_episodes.train_viz}
  unseen_op_valid: ${mecka_private:mecka_private_fixedbudget_op4,video_episodes.unseen_op_valid}
  extra_valid: ${mecka_private:mecka_private_fixedbudget_op4,video_episodes.extra_valid}
