_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# NOTE: action_horizon is hard-coded as 1024 in this file (both keymap calls
# below) AND in egomimic/hydra_configs/model/hnet_pushshapes.yaml. The two
# must match; ``hydra.utils.instantiate(cfg.data, ...)`` forwards every
# top-level key to ``MultiDataModuleWrapper.__init__``, so we can't keep a
# top-level ``action_horizon`` here. The longest episode in
# Tsim_datasets2/circle is 958 frames; 1024 leaves room.

# Packed dataloading. Each sample is one full episode (chunking="none"),
# and `pack_collate` (selected automatically by `_collate_fn_for` in
# pl_data_utils) concatenates `batch_size` episodes into a single flat
# stream with `cu_seqlens` boundaries. The algo's `forward_training`
# detects the packed batch (presence of `cu_seqlens`) and dispatches to
# `HNetPolicy.forward_packed`.
train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/circle/basic
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 1024
    # Parity knobs (defaults reproduce prior behavior exactly):
    # D07 — >1 keeps every Nth frame (keyframe subsampling at read time).
    temporal_stride: 1
    # D17 — "hold_pad" repeat-pads episodes < min_seq_len (held final
    # frame + action) instead of dropping them.
    tail_mode: "drop"
    # D14 — set the SAME n on train and valid to hold out the first n
    # sorted episodes for validation (holdout_split picks the side).
    val_holdout_first_n: 0
    holdout_split: "train"
    # D07 — K action-chunk stacking: >1 emits keyframes every K post-stride
    # frames, each carrying its K actions flattened to K*action_dim
    # (time-major). Must match the model's action_chunk_k. Composes
    # multiplicatively with temporal_stride; parity recipe uses this alone.
    action_chunk_k: 1
    # D26 — per-sample random phase in [0, K) when true (upstream
    # drop_front). No-op (and no RNG) at action_chunk_k=1.
    chunk_phase_aug: false
    # D08 — "current" = keyframe t carries actions [t, t+K) (K=1-compatible
    # generalization of frame-t <-> actions[t]); "incoming_meanpad" =
    # upstream-exact incoming chunk + mean-padded first keyframe.
    action_pairing: "current"

valid_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/circle/basic
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 1024
    # Parity knobs — see train_datasets entry. holdout_split is pre-set to
    # "val" so flipping val_holdout_first_n>0 on BOTH entries is the whole
    # split change; at val_holdout_first_n=0 it is a no-op (all episodes).
    temporal_stride: 1
    tail_mode: "drop"
    val_holdout_first_n: 0
    holdout_split: "val"
    # D07/D26/D08 — keep train and valid K-stacking knobs in lockstep (see
    # train_datasets entry); defaults reproduce prior behavior exactly.
    action_chunk_k: 1
    chunk_phase_aug: false
    action_pairing: "current"

# A40 baseline (44.4 GiB): one full episode at T~958 peaks at ~1.8 GiB,
# so 8 episodes packed should land in 12–16 GiB worst case. Headroom for
# the chunker firing more boundaries as training progresses.
train_dataloader_params:
  pushshapes_sim:
    batch_size: 8
    num_workers: 4
valid_dataloader_params:
  pushshapes_sim:
    batch_size: 8
    num_workers: 4
