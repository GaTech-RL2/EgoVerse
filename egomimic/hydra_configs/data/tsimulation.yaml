# Packed full-episode (varlen / cu_seqlens) pushshapes_sim loader for the H-Net
# policy. Whole scaffold lives in _tsim_packed_base.yaml; this leaf is the base
# verbatim (the canonical packed config), kept as its own name because 93+
# scripts reference data=tsimulation.
#
# `hydra.utils.instantiate(cfg.data, ...)` forwards every top-level key to
# MultiDataModuleWrapper.__init__, so action_horizon (1024) lives inside the
# keymap, not as a top-level data key.
defaults:
  - _tsim_packed_base
  - _self_
