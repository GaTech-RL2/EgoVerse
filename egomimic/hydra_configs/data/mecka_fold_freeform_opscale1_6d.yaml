# MECKA_FOLD_FREEFORM_OPSCALE1_6D: the k=1-operator rung of the freeform
# fold-clothes OPERATOR-SCALING ladder. Everything -- pipeline, the annotation
# guard, the shared seen-op val, the 31-operator unseen val, the video pins,
# loader params -- is inherited from mecka_fold_freeform_opscale4_6d; only the
# train OPERATOR SET changes, so each rung only ADDS an operator. Edit the ladder
# only in the parent.
#
# TRAIN: ALL annotated episodes of the top 1 operator by annotated hours,
#        minus the 3 shared seen-op val episodes ->
#        9 eps / 25633 f / 14.24 min = 0.237 h
#        (1.00x the k=1 arm):
#        #1 6964d38183a9fdf2d8663792   9 eps   25633 f = 14.24 min
# Counts measured 2026-09-17; the filter is live, so they grow if SQL gains more
# episodes for these operators.
#
# NORM STATS: this arm's train distribution differs from every other rung --
# precompute on THIS config, do not reuse the parent's:
#   python egomimic/scripts/precompute_norm_stats.py --data mecka_fold_freeform_opscale1_6d \
#     --model pi0.5_bc_mecka_6d --out <out>

defaults:
  - mecka_fold_freeform_opscale4_6d
  - _self_

# Hydra replaces lists wholesale, so the train lambdas are restated IN FULL; only
# the operator tuple differs from the parent. The resolver and `mode: total` are
# inherited untouched.
train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ('folding_clothes', 'fold_clothes')"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        # LANGUAGE ANNOTATIONS REQUIRED. 112 of the 462 freeform episodes have a
        # NULL `segments` column, which becomes an EMPTY `annotations` track in the
        # zarr; _annotation_text_for_frame then returns [] for every frame of them
        # and _build_prompts silently substitutes `default_prompt` (an EMPTY string
        # unless overridden), so they would train the text stem on nothing. This
        # guard keeps the 350 annotated episodes, whose segments tile 99.7-100 % of
        # their frames. `segments` is a list (or None) on the SQL row, so isinstance
        # is the safe test -- do NOT use truthiness (a numpy round-trip makes
        # `bool(...)` raise "truth value of an array is ambiguous").
        - "lambda row: isinstance(row.get('segments'), list) and len(row.get('segments')) > 0"
        # OPERATOR SET: the top 1 operator by ANNOTATED hours. Inlined rather
        # than put in a config key -- MultiDataModuleWrapper rejects root keys it
        # does not declare.
        - "lambda row: str(row.get('operator', '')) in ('6964d38183a9fdf2d8663792',)"
        # ...minus the 3 SEEN-OP VAL episodes (all from operator #1), which are
        # the only episodes held back from training. Kept in sync with
        # valid_datasets' `episode_hashes` pin by tests/unit/test_opscale_ladder.py.
        - "lambda row: str(row.get('episode_hash', '')) not in ('696bcbe0e13d37dd4293f58b', '696bcbe86377d0871b6a9253', '696bcc71ed8ed158122ec794')"

# train_viz is this arm's own (smaller) train split: K = floor(5120/9) = 568.
# `valid` and `unseen_op_valid` are unchanged, and hydra merges dicts, so only
# the one changed key is restated. The parent's train_viz video pin is an
# operator #1 episode, so it is in this split too and needs no override.
metric_frames_per_episode:
  train_viz: 568
