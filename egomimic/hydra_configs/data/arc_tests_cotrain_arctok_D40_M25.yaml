_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# D=40cm / M=25 arc variant, stride=1 (see arc_tests_cotrain_arctok_s1.yaml for
# why stride matters for an arc-length model). Sequence is M+1 = 26 rows of
# 8-dim [Lx, Ly, Lz, L_grip, Rx, Ry, Rz, R_grip]; pair with
# model=hpt_cotrain_mecka_flow_shared_head_arc_D40_M25 (act_seq 26).
#
# Measured on a real human episode against the other variants:
#   D=0.20 M=15 stride=3   ~8 unique reconstruction points, 2.56cm spacing
#   D=0.20 M=15 stride=1  ~18 points, 1.00cm
#   D=0.40 M=25 stride=1  ~34 points, 0.93cm, 0.314m arc span   <- this config
# Zero-velocity degeneration is 0.0% in all of them.

# stride=1 variant of arc_tests_cotrain_arctok.yaml.
#
# The plain-cartesian human pipeline uses stride=3, which is harmless for a
# time-indexed model but caps an ARC-LENGTH model's reconstruction resolution:
# detokenize can only emit points on the sample grid, so a fixed D=0.20m arc
# yields ~D/(v*dt) points. Measured on a real human episode at D=0.20m:
#
#   stride=3 -> dt=0.100s -> ~6 unique reconstruction points (3.3cm spacing)
#   stride=1 -> dt=0.033s -> ~17 unique points (1.0cm spacing), lower recon RMSE
#
# eva has no stride, which is why only the human overlays looked sparse.
# Zero-velocity degeneration measured 0.0% at both strides, and
# ARC_TOK_ACTION_HORIZON=600 is in RAW frames so the physical read window stays
# 20s either way -- stride only changes sampling density within it.

# Arc-tokenized variant of arc_tests_cotrain.yaml. Same population — 290
# eva_bimanual + 572 human_bimanual, resolved from SQL (lab=rl2,
# task=fold_clothes) and auto-synced from R2 into ${paths.dataset_dir} by
# S3EpisodeResolver — but every leaf uses ``arc_tokenizer_cartesian`` so
# ``get_item`` returns ``actions_cartesian`` already shaped
# ``(M+1, 14) = (16, 14)`` — 15 waypoints + 1 velocity token per bimanual chunk,
# each 14-dim (xyz + ypr + grip per arm) ``[L xyz(3), L ypr(3), L grip(1), R xyz(3), R ypr(3), R grip(1)]``.
#
# Arc knobs (shared by both embodiments):
#   D = 20 cm = 0.20 m per-arm arc length span of one token (min_distance_unit)
#   M = 15 waypoints  (sequence has M+1 = 16 rows once velocity is appended)
#
# The arc_tokenizer_cartesian keymap widens the raw read horizon so joint
# arc length has room to reach D within the raw window: eva 45 -> 200
# frames, human 30 -> 600 raw frames at stride=3 (200 subsampled). Padding
# beyond the true episode end zeros Δxyz and the tokenizer degrades
# gracefully into zero-vel tokens for the affected samples.
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: arc_tokenizer_cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: arc_tokenizer_cartesian_gripper_padded
        coord_frame: camframe
        rotation_mode: euler
        stride: 1
        min_distance_unit: 0.40
        resampled_vector_length: 25
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: arc_tokenizer_cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: arc_tokenizer_cartesian
        coord_frame: camframe
        rotation_mode: euler
        min_distance_unit: 0.40
        resampled_vector_length: 25
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
# needing to walk up to `train_datasets` after it's been mutated in place.
