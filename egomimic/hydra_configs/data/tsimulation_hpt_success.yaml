# Same per-frame HPT loader as tsimulation_hpt.yaml, pointed at the
# basic_success dataset dir, with 8 dataloader workers.
#
# NOTE: this variant overrides the keymap back to get_keymap (WINDOWED obs),
# unlike the get_keymap_hpt used by tsimulation_hpt. Windowed obs lets HPT cheat
# at train time (see pushshapes.get_keymap_hpt docstring) -- preserved here as
# the pre-existing behavior; this likely wants get_keymap_hpt instead.
defaults:
  - tsimulation_hpt
  - _self_

train_datasets:
  pushshapes_sim:
    resolver:
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle/basic_success
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
valid_datasets:
  pushshapes_sim:
    resolver:
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle/basic_success
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
train_dataloader_params:
  pushshapes_sim:
    num_workers: 8
valid_dataloader_params:
  pushshapes_sim:
    num_workers: 8
