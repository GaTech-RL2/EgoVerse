# RH fold cotrain, KEYPOINTS (human hetero), on the STANDARD (per-sample) dataloader.
#
# Human emits actions_keypoints (100,126) + state_keypoints (2,126); EVA is
# UNCHANGED cartesian 18. Twin of fold_rh_normal_cotrain_cart.yaml.
#
# This is the feed the Diffusion Policy baseline trains on (user 2026-08-15:
# "If we r running DP then u better use the normal dataloader" / "Its very
# important that we use standard dataloader"). Deltas vs the packed
# fold_rh_seq_cotrain_cart.yaml:
#
#   reader      MultiDataset (one sample per FRAME, annotation_collate)
#               instead of ZarrAnnotationSpanPackedDataset (whole spans +
#               cu_seqlens + pack_collate).
#   images      per-frame JPEG from processed_v3 (the STANDARD S3 copy). The
#               local fold_rh set is the h264 variant we built for H-Net, whose
#               images are CHUNK-indexed (frames_per_chunk 300) -- fine for a
#               span reader, wrong for a per-frame one. Same episode hashes,
#               same total_frames.
#   chunk       comes from the DATASET (keymap horizon), not TargetBuilder.
#   human time  28 consecutive source wrist/keypoint actions are interpolated
#               to 100 actions (99/27 = 11/3x slowdown). Wrist rotations
#               use quaternion SLERP; keypoint xyz uses linear interpolation.
#               EVA remains 100 consecutive commanded actions.
#   obs history keymap horizon=N_OBS_STEPS, so DP's 2-frame conditioning is real
#               data. See fold_span_transforms for the exact frame alignment.
#   spans       NOT used -- fold_segments does not exist in the JPEG copies and
#               the per-frame reader has no span concept. Sampling is uniform
#               over frames, which is what stock DP does.
#
# mode: total -- MultiDataset defaults to mode="train", an 80/20 episode split
# (476/594 eva, 568/709 human). The packed H-Net cells use ALL 594/709 for both
# train and valid, so leaving the default would train DP on 20% LESS data than
# the arms it is being compared against. Matching them keeps the comparison
# clean; note the consequence, shared by every cell in this matrix: validation
# episodes are NOT held out from training, so the val chunk-MSE is a fit metric,
# not a generalization metric.
#
# skip_bounds_check: the MultiDataset bounds check RESAMPLES away any frame
# outside [quantile_1, quantile_99] (zarr_dataset_multi.__getitem__), silently
# dropping exactly the extreme-reach frames a fold policy needs. Keep the tails.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:FOLD_RH_ROOT,/coc/flash7/paphiwetsa3/datasets/fold_rh_jpeg}/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_normal_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_normal_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    skip_bounds_check: true
    mode: total
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:FOLD_RH_ROOT,/coc/flash7/paphiwetsa3/datasets/fold_rh_jpeg}/aria
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_normal_keymap_kp
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_normal_transforms_kp
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    skip_bounds_check: true
    mode: total

valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:FOLD_RH_ROOT,/coc/flash7/paphiwetsa3/datasets/fold_rh_jpeg}/eva
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_normal_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_normal_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    skip_bounds_check: true
    mode: total
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:FOLD_RH_ROOT,/coc/flash7/paphiwetsa3/datasets/fold_rh_jpeg}/aria
      key_map:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_normal_keymap_kp
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.human_normal_transforms_kp
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: True'
    skip_bounds_check: true
    mode: total

# Per-FRAME samples, so batches are ordinary DP batches (not packed spans) and
# the batch_size is the real DP batch size. Human has ~2x eva's frames; the
# ratio here keeps the cotrain mix roughly balanced per step.
train_dataloader_params:
  eva_bimanual:
    batch_size: 16
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    # A combined batch carries ~900 MiB of full-resolution image tensors.
    # Six workers already provide six queued batches; deeper per-worker
    # prefetch causes memory/page churn and measured 24% slower batch delivery.
    prefetch_factor: 1
  human_bimanual:
    batch_size: 16
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
valid_dataloader_params:
  eva_bimanual:
    batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
  human_bimanual:
    batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
