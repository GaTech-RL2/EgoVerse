defaults:
  - obj_gen_pi_lang
  - _self_

# AnnotationCutoff variant of the motion-generalization cotrain
# (obj_gen_pi_lang): the dataset is switched from the plain Scale-annotation
# resolver to the AnnotationCutoff resolver, which clamps each action chunk at
# the end of the enclosing language-annotation span
# (ZarrAnnotationCutoffDataset). The action layout is the same `cartesian_6d`
# (xyz+6D per arm, +gripper for eva) every pi config uses; the explicit mode
# below only pins it. Pairs with model=pi0.5_cotrain_eva_aria_6d and
# evaluator=eval_pi_camframe_6d.
# Valid datasets inherit the train resolver via `${...}` interpolation in
# cotrain_pi_base, so overriding the train resolver is sufficient.
train_datasets:
  eva_bimanual:
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      transform_list:
        mode: cartesian_6d
  aria_bimanual:
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      transform_list:
        mode: cartesian_6d
