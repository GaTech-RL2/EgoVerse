defaults:
  - mecka_fold_freeform_opsplit_pi_6d
  - _self_

# MECKA_FOLD_FREEFORM_OPSPLIT_PI_CAM6D — CAM (head)-frame twin of
# mecka_fold_freeform_opsplit_pi_6d: same mecka FREEFORM fold-clothes episodes,
# same held-out-OPERATOR split (the `held_out_operators` list is inherited, not
# copied — edit it only in the wrist-frame file), same pipeline knobs. The only
# difference is the transform mode: chunks and proprio ee_pose are expressed
# relative to obs_head_pose with the continuous 6D rotation (18D = xyz+6D per
# arm, no gripper). Pairs with model=pi0.5_bc_mecka_6d and
# evaluator=eval_pi_camframe_6d
# (+ `+evaluator@train_viz_evaluator=train_viz_pi_camframe_6d`).
#
# Norm stats: precompute on a CPU node (scripts/norm_fold_freeform_opsplit_cam6d.sbatch) and point
# training at norm_stats.precomputed_norm_path=<out>/norm_stats.

train_datasets:
  human_bimanual:
    resolver:
      transform_list:
        mode: cartesian_6d
