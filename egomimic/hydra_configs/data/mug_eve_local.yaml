# real_mug (Franka + ORCA right hand, 30 Hz, front + right wrist cam).
# Zarr episodes produced by eth_clariden/mug/convert_mug_raw_to_zarr.sh.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  eve_right_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:EVE_LOCAL_ZARR_DIR}
      key_map:
        _target_: egomimic.rldb.embodiment.eve.Eve.get_keymap
        keymap_mode: cartesian_right_wrist
      transform_list:
        _target_: egomimic.rldb.embodiment.eve.Eve.get_transform_list
        mode: cartesian_right_wrist
    mode: train
    valid_ratio: 0.1

valid_datasets:
  eve_right_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:EVE_LOCAL_ZARR_DIR}
      key_map:
        _target_: egomimic.rldb.embodiment.eve.Eve.get_keymap
        keymap_mode: cartesian_right_wrist
      transform_list:
        _target_: egomimic.rldb.embodiment.eve.Eve.get_transform_list
        mode: cartesian_right_wrist
    mode: valid
    valid_ratio: 0.1

train_dataloader_params:
  eve_right_arm:
    batch_size: 4
    num_workers: 2

valid_dataloader_params:
  eve_right_arm:
    batch_size: 4
    num_workers: 2
