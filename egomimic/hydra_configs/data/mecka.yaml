# One pinned mecka episode (stored as human_bimanual): the smoke / overfit
# config for HPT and Pi on the 144-D wrist-frame hand-keypoint action.
#   fix_left_wrist_convention: this episode predates the mecka_to_zarr rot_left
#     fix (LEFT wrist frame double-mirrored); Rz(180) corrects the raw left
#     pose before any frame math. With include_ee_pose it corrects both the
#     wrist_pose that the 144-D keypoint action is built from and the cartesian
#     ee_pose proprio.
#   pad_proprio_gripper: 18 -> 20-D ee_pose proprio (zero grip slots at 9/19)
#     so the pi0.5 State: prompt bins align with the robot 20-D layout.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        include_ee_pose: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        include_ee_pose: true
        fix_left_wrist_convention: true
        pad_proprio_gripper: true
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      episode_hashes: ["6972164b391867c01c9d3265"]
    mode: total

valid_datasets:
  human_bimanual: ${data.train_datasets.human_bimanual}

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 10
valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 10
