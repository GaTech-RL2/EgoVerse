# PRIVATE Mecka mono fold_tshirt, operator scaling (1/3/6/10 operators), the
# 1-operator run. Generated by egomimic/scripts/mecka_process/mono/make_configs.py;
# do not edit by hand. IDs: $EGOVERSE_MECKA_PRIVATE_DIR/splits (private to the lab).
#   train            = the first N operators of the fixed order, minus every
#                      operator's 5 held-out episodes (fold_tshirt only)
#   valid            = operator 1's 5 held-out episodes (seen_op1_valid)
#   unseen_op_valid  = 5 SQL mecka folding_clothes operators x 5 episodes
# Operator 1 and the other held-out picks: scaling/opscale_picks.json in the private dir.
# The private zarrs are post-fix left wrist; the SQL mecka zarrs are not.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_operators: ${mecka_private:mecka_private_tshirt_opscale_1,train_operators}

# 5 per operator for all 10, so every scale trains on the same episodes of the
# operators it shares.
held_out_hashes: ${mecka_private:mecka_private_tshirt_opscale_1,held_out_hashes}

valid_prefix: seen_op1_valid

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:EGOVERSE_MECKA_PRIVATE_DIR}/zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        stride: 1
        fix_left_wrist_convention: false
        pad_proprio_gripper: false
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('task', '')) == 'fold_tshirt'"
        - "lambda row: str(row.get('user_id', '')) in ${data.train_operators}"
        - "lambda row: str(row.get('episode_hash', '')) not in ${data.held_out_hashes}"
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

# Eval heads on other episodes widen the bounds to 10x each cell's quantile range
# (few operators' stats; see mecka_freeform_fold_kp_op2_holdout). train_viz is
# the stats' own split and keeps the default.
valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    bounds_rel_slack: 10.0
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      episode_hashes: ${mecka_private:mecka_private_tshirt_opscale_1,valid_datasets.human_bimanual.filters.episode_hashes}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

train_viz_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters: ${data.train_datasets.human_bimanual.filters}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

unseen_op_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    bounds_rel_slack: 10.0
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        annotation_key: annotations
        proprio_history: ${data.train_datasets.human_bimanual.resolver.key_map.proprio_history}
        history_stride: ${data.train_datasets.human_bimanual.resolver.key_map.history_stride}
        image_history_gap_s: ${data.train_datasets.human_bimanual.resolver.key_map.image_history_gap_s}
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        stride: 1
        fix_left_wrist_convention: true
        pad_proprio_gripper: false
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
      episode_hashes: ${mecka_private:mecka_private_tshirt_opscale_1,unseen_op_valid_datasets.human_bimanual.filters.episode_hashes}
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 12

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 8
    shuffle: false

train_viz_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 4
    shuffle: false

unseen_op_valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 8
    shuffle: false

metric_frames_per_episode:
  valid: auto
  train_viz: auto
  unseen_op_valid: auto

video_episodes:
  valid: ${mecka_private:mecka_private_tshirt_opscale_1,video_episodes.valid}
  train_viz: ${mecka_private:mecka_private_tshirt_opscale_1,video_episodes.train_viz}
  unseen_op_valid: ${mecka_private:mecka_private_tshirt_opscale_1,video_episodes.unseen_op_valid}
