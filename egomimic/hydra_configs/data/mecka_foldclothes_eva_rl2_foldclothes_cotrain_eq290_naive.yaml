_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# NAIVE action-chunking twin of
# mecka_foldclothes_eva_rl2_foldclothes_cotrain_eq290_arctok.yaml.
#
# Identical population and knobs -- MECKA human fold_clothes x RL2 eva
# fold_clothes, both capped at debug=290 for a 1:1 mix, stride=3, batch 32,
# num_workers 6 -- the ONLY difference is that actions are plain
# time-indexed chunks (`mode: cartesian`) instead of arc-length tokens:
#   * no TokenizeBimanualArcLengthCartesian step, so no D / M knobs
#   * default action horizons (human ACTION_HORIZON=30, eva 45) rather than
#     the widened arc read window (human 600, eva 200)
#   * pairs with the non-arc model `hpt_cotrain_mecka_flow_shared_head`
#     (act_seq=100) and evaluator `hpt/base`
#
# This is the apples-to-apples baseline for the arc-tok run: same data, same
# optimization, different action parameterization.
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian
        stride: 3
      debug: 290
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
      debug: 290
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
# needing to walk up to `train_datasets` after it's been mutated in place.
valid_datasets:
  human_bimanual:
