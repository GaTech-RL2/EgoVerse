_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Cotrain mixture staged in a single folder at /storage/project/r-dxu345-0/shared/arc_tests.
# LocalFolderEpisodeResolver enumerates every zarr in that folder and splits by the
# zarr's own `embodiment` attribute — no SQL, no lab/task filters. Actual mix at
# time of writing: 290 eva_bimanual + 580 human_bimanual (task_name for the human
# side is 'debug', not 'fold_clothes', but the trajectories are folding).
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalFolderEpisodeResolver
      folder_path: ${paths.dataset_dir}
      embodiment: human_bimanual
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian
        stride: 3
    mode: train
    valid_ratio: 0.2
    bounds_check: false

  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalFolderEpisodeResolver
      folder_path: ${paths.dataset_dir}
      embodiment: eva_bimanual
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
    mode: train
    valid_ratio: 0.2
    bounds_check: false

# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
# needing to walk up to `train_datasets` after it's been mutated in place.
valid_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalFolderEpisodeResolver
      folder_path: ${paths.dataset_dir}
      embodiment: human_bimanual
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian
        stride: 3
    mode: valid
    valid_ratio: 0.2
    bounds_check: false
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalFolderEpisodeResolver
      folder_path: ${paths.dataset_dir}
      embodiment: eva_bimanual
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6
  eva_bimanual:
    batch_size: 32
    num_workers: 6

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6
  eva_bimanual:
    batch_size: 32
    num_workers: 6
