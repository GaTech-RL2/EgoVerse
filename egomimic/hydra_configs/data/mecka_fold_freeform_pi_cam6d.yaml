defaults:
  - mecka_fold_freeform_pi_6d
  - _self_

# MECKA_FOLD_FREEFORM_PI_CAM6D — CAM (head)-frame twin of
# mecka_fold_freeform_pi_6d: same mecka FREEFORM fold-clothes episodes, same
# random-episode split, same pipeline knobs (all inherited — edit them only in
# the wrist-frame file). The only difference is the transform mode: chunks and
# proprio ee_pose are expressed relative to obs_head_pose with the continuous
# 6D rotation (18D = xyz+6D per arm, no gripper). Pairs with
# model=pi0.5_bc_mecka_6d and evaluator=eval_pi_camframe_6d
# (+ `+evaluator@train_viz_evaluator=train_viz_pi_camframe_6d`). The
# held-out-operator twin is mecka_fold_freeform_opsplit_pi_cam6d.
#
# Norm stats: precompute on a CPU node with
#   precompute_norm_stats.py --data mecka_fold_freeform_pi_cam6d --model pi0.5_bc_mecka_6d
# and point training at norm_stats.precomputed_norm_path=<out>/norm_stats.

train_datasets:
  human_bimanual:
    resolver:
      transform_list:
        mode: cartesian_6d
