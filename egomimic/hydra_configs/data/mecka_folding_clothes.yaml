_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Mecka folding_clothes single-embodiment CLASSIC baseline (no arc tokenizer).
#   * SQL filter: human_bimanual + lab=mecka + task=folding_clothes
#   * TRAIN/VALID: disjoint 80/20 split via valid_ratio; ``debug: 625`` caps
#     total to 625 → 500 train / 125 valid.
# stride=1, mode=cartesian_padded (14-dim actions_cartesian with zero gripper
# cols) so eval-side slice at ``hpt.py:1157`` is a no-op — right-arm slot
# alignment matches model output. Pair with ``+evaluator.first_D_meters=0.20``
# on eval_hpt to log a distance-clamped detok_paired_mse_avg comparable to
# the arc-tok run.
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian_padded
        stride: 1
      debug: 625
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'folding_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

valid_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian_padded
        stride: 1
      debug: 625
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'folding_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  human_bimanual:
    batch_size: 128
    num_workers: 6

valid_dataloader_params:
  human_bimanual:
    batch_size: 128
    num_workers: 6
