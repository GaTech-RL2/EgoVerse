# mecka_private_notshirt_full with one operator never trained on and scored as its
# own head (unseen_private_valid: all its episodes). The SQL unseen_op_valid head
# stays. Generated by make_full_configs.py.
defaults:
  - mecka_private_notshirt_full
  - _self_

train_operators: ${mecka_private:mecka_private_notshirt_full_unseen,train_operators}

valid_datasets:
  human_bimanual:
    filters:
      episode_hashes: ${mecka_private:mecka_private_notshirt_full_unseen,valid_datasets.human_bimanual.filters.episode_hashes}

extra_valid_prefix: unseen_private_valid

extra_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    bounds_rel_slack: 10.0
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('task', '')) == 'fold_no_tshirt'"
        - "lambda row: str(row.get('user_id', '')) == '${mecka_private:mecka_private_notshirt_full_unseen,extra_valid_datasets.human_bimanual.filters.filter_lambdas.0}'"
    pose_glitch_mask: {step_m: 0.05, rot_deg: 10.0}
    mode: total

video_episodes:
  extra_valid: ${mecka_private:mecka_private_notshirt_full_unseen,video_episodes.extra_valid}
