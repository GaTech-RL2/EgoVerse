defaults:
  - mecka_fold_flagship_opsplit_hpt_6d
  - _self_

# MECKA_FOLD_FLAGSHIP_TOPOP_HPT_6D: single-operator twin of
# mecka_fold_flagship_opsplit_hpt_6d. TRAIN on the ONE largest flagship
# fold-clothes operator only; everything else (pipeline, unseen-operator val,
# loader params) is inherited from the parent.
#
# SPLIT (from SQL app.episodes, 2026-09-15):
#   train       = operator 6903686e0e94ce070afd1f24, the largest of the 20
#                 (405 eps / 76,013 frames / ~0.70 h at 30 fps, 24 % of
#                 flagship), 95 % of its episodes (~385 eps / ~72k frames).
#   seen val    = the other 5 % of that operator's episodes (20 eps / 3,731
#                 frames) -> seen_op_valid/. The parent's valid_datasets interpolates
#                 the train filters and valid_ratio, so it follows this
#                 override automatically.
#   train_viz   = the train split above (trainHydra's default) -> train_viz/.
#   unseen val  = UNCHANGED from the parent: all episodes of the 2
#                 `held_out_operators` -> unseen_op_valid/, directly comparable
#                 with the 18-operator run.
# The other 17 operators are unused.
#
# Hydra replaces lists wholesale, so the train filter_lambdas are restated in
# full; only the last (operator) lambda differs from the parent. The operator id
# is inlined rather than put in a config key: MultiDataModuleWrapper rejects
# root keys it does not declare.
#
# NORMALIZATION: the train distribution differs from the parent's, so
# precompute stats on THIS config:
#   python egomimic/scripts/precompute_norm_stats.py --config-name train_zarr_mecka_flagship_6d_hpt \
#     --data mecka_fold_flagship_topop_hpt_6d --model hpt_bc_mecka_6d_300M --out <out>
# then train with
#   python egomimic/trainHydra.py --config-name=train_zarr_mecka_flagship_6d_hpt \
#     data=mecka_fold_flagship_topop_hpt_6d norm_stats.precomputed_norm_path=<out>/norm_stats

train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() == 'fold_clothes'"
        - "lambda row: '/mecka/flagship/' in str(row.get('zarr_processed_path', ''))"
        # SINGLE-OPERATOR TRAIN: the largest flagship operator only.
        - "lambda row: str(row.get('operator', '')) == '6903686e0e94ce070afd1f24'"

# ---------------------------------------------------------------------------
# METRIC / VIDEO LOADERS: only the SEEN-op and train_viz entries differ from the
# parent (this config trains on one operator, so those two splits are smaller).
# ---------------------------------------------------------------------------
# K is the SINGLE-RANK value, floor(5120 / episodes-in-that-split); trainHydra
# scales it by the world size. Episode counts measured 2026-09-15:
#   valid      20 eps / 3,731 frames  -> K = floor(5120/20)  = 256. Every
#              episode here is shorter than 256 (longest 239f), so this keeps
#              the WHOLE seen-val split: 3,731 frames = 58.3 of the 80 batches.
#   train_viz 385 eps / 72,282 frames -> K = floor(5120/385) =  13
#              -> 385 x 13 = 5,005 frames = 78.2 batches.
# `unseen_op_valid: 26` is inherited unchanged (same split as the parent), and
# hydra merges dicts, so only the two changed keys are restated.
metric_frames_per_episode:
  valid: 256
  train_viz: 13

# The parent's seen-val pin belongs to operator 690364170e94ce070afd1da5, which
# is not in this config's single-operator split, so it is replaced (hydra
# replaces lists wholesale). The train_viz pin 692e9bda21fc595fbe6f941e IS an
# episode of operator 6903686e..., hence in this train split too, and the
# unseen pins are the same split as the parent's -- both inherited.
#   valid  692e83ad567c97525f4011a5 (6903686e0e94ce070afd1f24, 239f)
#          the longest episode in this 20-episode seen-val split: 3.7 of the 10
#          video batches. No longer contiguous episode exists here.
video_episodes:
  valid:
    - 692e83ad567c97525f4011a5
