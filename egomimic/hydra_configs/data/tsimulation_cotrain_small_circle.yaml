_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Cotrain circle + small-circle, FULL-EPISODE teacher forcing (chunking="none"
# -> one full episode per packed sample). Per the GMM/ResNet H-Net config, each
# obs-step predicts the next 8 actions (action chunking is handled in GMMLoss,
# NOT here). PLACEHOLDER DATA: small-circle points at the SAME circle path for
# now (your "same path") with an embodiment_override so the per-emb outer
# chunker + cotrain plumbing exercise correctly; swap folder_path to the real
# small-circle zarrs when they exist.

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/pushT/circle_750/circle
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 1024
  pushshapes_sim_small_circle:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/pushT/circle_750/circle
      embodiment_override: "pushshapes_sim_small_circle"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 1024
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 1024

