# tsimulation, but with a DeltaAction transform applied to `actions` so the
# model learns per-step deltas (a[t] - a[t-1], a[0] = 0) instead of absolute
# target positions. Same dataset and shapes as _tsim_packed_base; the ONLY
# difference is the transform_list (overridden from null to DeltaAction in both
# the train and valid resolver).
#
# Norm stats are recomputed against the delta-transformed actions, so the
# precomputed_norm_path from absolute-action runs **MUST NOT** be reused with
# this config (the action range collapses from [0, 511] to ~[-30, 30]).
defaults:
  - _tsim_packed_base
  - _self_

train_datasets:
  pushshapes_sim:
    resolver:
      transform_list:
        - _target_: egomimic.rldb.zarr.action_chunk_transforms.DeltaAction
          input_key: actions

valid_datasets:
  pushshapes_sim:
    resolver:
      transform_list:
        - _target_: egomimic.rldb.zarr.action_chunk_transforms.DeltaAction
          input_key: actions
