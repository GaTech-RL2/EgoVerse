# MECKA_ALL_PI_6D: pi0.5 on ALL mecka episodes in the SQL table (filters
# lab=mecka with no task filter), stored under the human_bimanual embodiment.
#
# WRIST-frame CARTESIAN actions with the continuous 6D rotation representation
# (18D = xyz+6D per arm, no gripper): each arm's action chunk is expressed
# relative to that wrist's current pose, so both the arbitrary world frame AND
# the moving head frame cancel out of the action targets. The proprio ee_pose
# stays in the head/cam frame (it defines where the wrists are for the model
# and for the eval revert) and is 6D-encoded. stride=1: mecka actions are
# recorded at the target rate (Aria uses 3). Language prompts are sampled
# from the `annotations` track; prompt assembly (proprio-in-prompt on,
# embodiment label off) lives in model=pi0.5_bc_mecka_6d, which this config
# pairs with, alongside evaluator=eval_pi_wristframe_6d (reverts wrist ->
# head frame via the proprio, then 6D -> ypr, for the viz).
#
# This is the explicit cartesian recipe; the repo default for human data is
# the hand-keypoint action (data/mecka.yaml, data/cotrain_pi_base.yaml).

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      # Per-cluster zarr mirror (paths/default.yaml; $EGOVERSE_DATASET_DIR
      # overrides). The resolver s5cmd-syncs only the SQL-matched episodes
      # missing here.
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian_wristframe_6d
        stride: 1
        # processed_v3 mecka zarrs predate the mecka_to_zarr rot_left fix:
        # the LEFT wrist frame was double-mirrored onto the right hand's
        # spatial convention. Rz(180)-corrects the raw left pose keys before
        # any frame math (exactly equivalent to reconverting).
        fix_left_wrist_convention: true
        # 18 -> 20-dim proprio (zero grip slots at 9/19): State: prompt bins
        # align positionally with the robot 20-dim layout.
        pad_proprio_gripper: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
    mode: train
    valid_ratio: 0.05

valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters: ${data.train_datasets.human_bimanual.filters}
    mode: valid
    valid_ratio: ${data.train_datasets.human_bimanual.valid_ratio}

# Train-set spot check: a second val-style loader over the TRAIN split,
# consumed by the TrainVizEvalVideo wrapper on every validation epoch
# (metrics prefixed `train_viz/`, videos under `videos_train_viz/`). No
# shuffle -> the same leading slice every val, so the curves are comparable
# across time. Declared here only to set its loader params; without it the
# default train_viz head reuses the train split with the valid loader params
# (the head is on by default, train_viz=true; `train_viz=false` skips it).
train_viz_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters: ${data.train_datasets.human_bimanual.filters}
    mode: train
    valid_ratio: ${data.train_datasets.human_bimanual.valid_ratio}

train_viz_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 2
    shuffle: false

train_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8

valid_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8
    shuffle: false
