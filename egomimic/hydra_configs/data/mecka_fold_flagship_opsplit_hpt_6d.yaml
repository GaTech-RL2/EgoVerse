# MECKA_FOLD_FLAGSHIP_OPSPLIT_HPT_6D: HPT BC on the mecka FLAGSHIP fold-clothes
# episodes (SQL lab='mecka', task='fold_clothes', all 1607 eps / 316k frames
# under processed_v3/mecka/flagship/, 20 operators; a DIFFERENT set from the
# 462-ep FREEFORM 'folding_clothes' episodes of mecka_fold_freeform_opsplit_6d,
# zero operator overlap), with a SEEN- and an UNSEEN-operator validation set.
# Standalone (no defaults inheritance).
#
# THREE-WAY SPLIT (chosen 2026-09-11 from SQL app.episodes):
#   unseen val  = the 2 operators in `held_out_operators`, ALL their episodes
#                 (191 eps / 30,956 frames, 9.8 %). The two mid-sized operators
#                 with >= 70 episodes each; the three largest (65 % of frames)
#                 stay in train.
#   seen val    = the other 18 operators, seeded 5 % episode split
#                 (`mode: valid`, ~70 eps / 13.8k frames): known operators,
#                 unseen episodes.
#   train       = the other 18 operators, the remaining 95 % (~1346 eps /
#                 271k frames).
#
# VAL LOADERS (three heads, one validation pass):
#   valid_datasets            -> seen_op_valid/Valid/human_bimanual_*,
#                                videos_seen_op_valid/: SEEN operators, unseen
#                                episodes (the canonical loader; `valid_prefix`
#                                renames its metrics and video dir)
#   train_viz (default)       -> train_viz/Valid/human_bimanual_*,
#                                videos_train_viz/: the TRAIN split itself (no
#                                train_viz_datasets here, so trainHydra reuses
#                                train_datasets, unshuffled); `train_viz=false`
#                                drops it
#   unseen_op_valid_datasets  -> unseen_op_valid/Valid/human_bimanual_*,
#                                videos_unseen_op_valid/: UNSEEN operators
# The train and seen-val entries share `filters` and `valid_ratio`, so the
# seeded split (split_dataset_names, SEED 42) makes them exact complements.
#
# METRIC vs VIDEO LOADERS (2026-09-15, lane A). Each head above is served by
# TWO loaders: a per-episode subsampled METRIC loader (no rendering) and a
# contiguous VIDEO-only loader over pinned episodes (no metrics). See
# `metric_frames_per_episode` / `video_episodes` at the bottom of this file.
#
# PIPELINE: WRIST-frame CARTESIAN actions with the continuous 6D rotation
# (18D = xyz+6D per arm, no gripper): each arm's 100-step chunk is expressed
# relative to that wrist's current pose; the head-frame proprio ee_pose is
# 6D-encoded too and padded 18 -> 20 (zero grip slots at 9/19).
# fix_left_wrist_convention: processed_v3 mecka zarrs have the LEFT wrist frame
# double-mirrored; Rz(180)-corrected before any frame math. stride 1 (mecka
# is recorded at the target rate). Prompts from the `annotations` track.
#
# NORMALIZATION: quantile-normalize proprio + action keys from stats
# precomputed on THIS config (train side = the 18 operators):
#   python egomimic/scripts/precompute_norm_stats.py --config-name train_zarr_mecka_flagship_6d_hpt \
#     --data mecka_fold_flagship_opsplit_hpt_6d --model hpt_bc_mecka_6d_300M --out <out>
# The freeform stats share the key set but not the distribution; do not reuse.
#
# Pairs with model=hpt_bc_mecka_6d_300M and evaluator=eval_hpt_wristframe_6d
# (the train_viz head wraps it automatically); see
# train_zarr_mecka_flagship_6d_hpt.yaml for the composed recipe.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# The 2 held-out (UNSEEN) operator ids (SQL app.episodes.operator). Referenced
# by the filter lambdas below via the mounted path `data.held_out_operators`.
# MultiDataModuleWrapper accepts this key (config-only).
held_out_operators:
  - 6871d82a1aaf88556f0c6041
  - 6903a36c466be157ec64562d

# Metric prefix / video dir for the canonical valid loader (config-only; read by
# trainHydra), so the seen-operator val is not logged under a bare Valid/.
valid_prefix: seen_op_valid

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
        # Proprio observation history: the ee_pose keys read K steps spaced
        # `history_stride` frames apart, (K, 20) with the current frame last.
        # At 30 fps the median wrist translation is 6.8 mm over 1 frame but
        # 42.9 mm over 5, so an unstrided window is mostly sensor noise while
        # the action chunk it conditions spans a full second; K = 3, s = 5 is
        # 0.33 s of past. Must match the stem's `history_len` (the run fails
        # loudly if not), and the K = 1 baseline needs
        #   ...key_map.proprio_history=1 ...key_map.history_stride=1
        #   model.robomimic_model.stem_specs.human_bimanual.state_ee_pose.history_len=1
        # The two val loaders interpolate this resolver, so they follow.
        proprio_history: 3
        history_stride: 5
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian_wristframe_6d
        stride: 1
        fix_left_wrist_convention: true
        pad_proprio_gripper: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() == 'fold_clothes'"
        - "lambda row: '/mecka/flagship/' in str(row.get('zarr_processed_path', ''))"
        # OPERATOR SPLIT: train = every operator NOT in the held-out list.
        - "lambda row: str(row.get('operator', '')) not in ${data.held_out_operators}"
    # Seeded 95/5 episode split within the train operators; the 5 % is the
    # seen-operator val (valid_datasets below).
    mode: train
    valid_ratio: 0.05

# SEEN operators, held-out episodes (the complement of train's 95 %) ->
# seen_op_valid/ metrics via the canonical evaluator.
valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters: ${data.train_datasets.human_bimanual.filters}
    mode: valid
    valid_ratio: ${data.train_datasets.human_bimanual.valid_ratio}

# UNSEEN operators: all episodes of the held-out operators -> unseen_op_valid/
# metrics via a second copy of the canonical evaluator.
unseen_op_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() == 'fold_clothes'"
        - "lambda row: '/mecka/flagship/' in str(row.get('zarr_processed_path', ''))"
        # OPERATOR SPLIT: unseen val = the held-out operators only.
        - "lambda row: str(row.get('operator', '')) in ${data.held_out_operators}"
    mode: total

train_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8

# Unshuffled (both val loaders): the same leading slice every val, comparable
# across epochs with a coherent overlay video. Capped per pass by the
# trainer's limit_val_batches. The train_viz loader reuses these params.
valid_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8
    shuffle: false

unseen_op_valid_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8
    shuffle: false

# ---------------------------------------------------------------------------
# METRIC LOADERS: K evenly spaced frames per EPISODE (lane A, 2026-09-15).
# ---------------------------------------------------------------------------
# Config-only (trainHydra reads them; MultiDataModuleWrapper declares them
# because hydra.instantiate(cfg.data) forwards every root key).
#
# WHY: the val loaders are unshuffled so the overlay video is coherent, so the
# metric window was just the first limit_val_batches x batch_size x world_size
# = 80 x 64 x W frames in episode-hash order (DistributedSampler strides, so
# the ranks between them walk one contiguous head of the split). Measured
# 2026-09-15 at W = 1 (lane-0 diagnostic, docs .../reports/lane0-coverage.md):
# the seen-op head scored 25/70 episodes and 6/11 operators, and the unseen
# head 33/191 episodes with an 81/19 operator mix on a split that is 52/48.
# trainHydra now wraps each val head in EvenStrideDataset(base,
# frames_per_episode=K), which takes K evenly spaced frames from EVERY episode
# (all of them when the episode is shorter than K), so every episode and
# operator is scored at the SAME 80-batch cost.
#
# K below is the SINGLE-RANK value, floor(5120 / episodes-in-that-split);
# trainHydra multiplies it by trainer.devices x num_nodes, so a 4-GPU run
# scores 4x these frames in the same 80 batches per rank rather than a quarter
# of what it scored before subsampling existed. Episode counts measured from
# the real splits, 2026-09-15:
#   valid            70 eps / 13,744 frames  -> K = floor(5120/70)   =  73
#                     -> 70 x 73  = 5,110 frames = 79.8 batches
#   train_viz     1,346 eps / 271,247 frames -> K = floor(5120/1346) =   3
#                     -> 1346 x 3 = 4,038 frames = 63.1 batches
#   unseen_op_valid 191 eps / 30,937 frames  -> K = floor(5120/191)  =  26
#                     -> 191 x 26 = 4,966 frames = 77.6 batches
# NOTE: per-batch Frechet _min/_max now span many episodes instead of ~2 s of
# one, so those curves are NOT comparable with pre-2026-09-15 runs.
metric_frames_per_episode:
  valid: 73
  train_viz: 3
  unseen_op_valid: 26

# ---------------------------------------------------------------------------
# VIDEO LOADERS: pinned, contiguous episodes (`<head>_video` loaders).
# ---------------------------------------------------------------------------
# One episode_hash per operator per head. Pinning them here (rather than
# letting the loader order decide) means every run renders the SAME episodes,
# so videos are comparable across runs. The pinned episodes are taken out of
# that head's already-resolved split -- no second SQL pull -- and played in
# frame order; `evaluator.viz_max_batches` (10 batches = 640 frames) caps it.
# These loaders log NO metrics, and the metric loaders above render nothing.
#
# Chosen 2026-09-15 from the real splits; format is <hash> (operator, frames):
#   valid            692e771c39719ab57395b408 (690364170e94ce070afd1da5, 498f)
#                    the longest seen-val episode: 498f = 7.8 of the 10 video
#                    batches from a single contiguous episode (the split mean
#                    is ~196f, which would only fill ~3).
#   train_viz        692e9bda21fc595fbe6f941e (6903686e0e94ce070afd1f24, 496f)
#                    longest train episode of the largest operator; it is also
#                    in the topop train split, so that child inherits this pin.
#   unseen_op_valid  692eadbaaec602a46af10686 (6871d82a1aaf88556f0c6041, 204f)
#                    692ea49a727c13b350cb7c48 (6903a36c466be157ec64562d, 212f)
#                    one per held-out operator, both of typical length
#                    (416f = 6.5 of the 10 batches). Operator 6903a36c... does
#                    have a 661f episode (692fe8d889e6f7f45d175b78) that would
#                    fill the budget alone, but one-per-operator keeps both
#                    unseen operators on screen. Shared by every flagship
#                    config, since the unseen head is identical in all of them.
video_episodes:
  valid:
    - 692e771c39719ab57395b408
  train_viz:
    - 692e9bda21fc595fbe6f941e
  unseen_op_valid:
    - 692eadbaaec602a46af10686
    - 692ea49a727c13b350cb7c48
