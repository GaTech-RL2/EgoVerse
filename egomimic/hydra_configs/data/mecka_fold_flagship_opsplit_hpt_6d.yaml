# MECKA_FOLD_FLAGSHIP_OPSPLIT_HPT_6D — HPT BC on the mecka FLAGSHIP fold-clothes
# episodes (SQL lab='mecka', task='fold_clothes', all 1607 eps / 316k frames
# under processed_v3/mecka/flagship/, 20 operators; a DIFFERENT set from the
# 462-ep FREEFORM 'folding_clothes' episodes of mecka_fold_freeform_opsplit_pi_6d
# — zero operator overlap), with a SEEN- and an UNSEEN-operator validation set.
# Standalone (no defaults inheritance).
#
# THREE-WAY SPLIT (chosen 2026-09-11 from SQL app.episodes):
#   unseen val  = the 2 operators in `held_out_operators`, ALL their episodes
#                 (191 eps / 30,956 frames, 9.8 %). The two mid-sized operators
#                 with >= 70 episodes each; the three largest (65 % of frames)
#                 stay in train.
#   seen val    = the other 18 operators, seeded 5 % episode split
#                 (`mode: valid`, ~70 eps / 13.8k frames): known operators,
#                 unseen episodes.
#   train       = the other 18 operators, the remaining 95 % (~1346 eps /
#                 271k frames).
#
# PLUMBING: the batch-dict key must be an embodiment id, and the trainer
# supports exactly two val loaders (dataloader_idx 0 -> evaluator, 1 ->
# train_viz_evaluator), so the seen-operator val rides in the `train_viz`
# slot. Read the metrics as
#   Valid/human_bimanual_*            -> UNSEEN operators
#   train_viz/Valid/human_bimanual_*  -> SEEN operators, unseen episodes
# (there is no on-train spot-check in this recipe). The train and seen-val
# entries share `filters` and `valid_ratio`, so the seeded split
# (split_dataset_names, SEED 42) makes them exact complements.
#
# PIPELINE: WRIST-frame cartesian actions with the continuous 6D rotation
# (18D = xyz+6D per arm, no gripper): each arm's 100-step chunk is expressed
# relative to that wrist's current pose; the head-frame proprio ee_pose is
# 6D-encoded too and padded 18 -> 20 (zero grip slots at 9/19).
# fix_mecka_left_wrist: processed_v3 mecka zarrs have the LEFT wrist frame
# double-mirrored; Rz(180°)-corrected before any frame math. stride 1 (mecka
# is recorded at the target rate). Prompts from the `annotations` track.
# keymap_mode `cartesian` (no "_pi" suffix) puts the front image on
# `front_img_1`, the HPT encoder key.
#
# NORMALIZATION: quantile-normalize proprio + action keys from stats
# precomputed on THIS config (train side = the 18 operators):
#   precompute_norm_stats.py --config-name train_zarr_mecka_flagship_6d_hpt \
#     --data mecka_fold_flagship_opsplit_hpt_6d --model hpt_bc_mecka_6d_300M --out <out>
# (scripts/norm_fold_flagship_opsplit_hpt_6d[_skynet].sbatch). The freeform
# stats share the key set but not the distribution; do not reuse.
#
# Pairs with model=hpt_bc_mecka_6d_300M and evaluator=eval_hpt_wristframe_6d
# (+ `+evaluator@train_viz_evaluator=train_viz_hpt_wristframe_6d`); see
# train_zarr_mecka_flagship_6d_hpt.yaml for the composed recipe.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# The 2 held-out (UNSEEN) operator ids (SQL app.episodes.operator). Referenced
# by the filter lambdas below via a relative interpolation (five dots: lambda
# -> filter_lambdas -> filters -> human_bimanual -> *_datasets -> root).
# MultiDataModuleWrapper accepts this key (config-only).
held_out_operators:
  - 6871d82a1aaf88556f0c6041
  - 6903a36c466be157ec64562d

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      # Per-cluster zarr mirror (paths/default.yaml; the PACE launchers
      # override paths.dataset_dir to the shared PACE mirror).
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: cartesian_wristframe_6d
        stride: 1
        fix_mecka_left_wrist: true
        pad_proprio_gripper: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() == 'fold_clothes'"
        - "lambda row: '/mecka/flagship/' in str(row.get('zarr_processed_path', ''))"
        # OPERATOR SPLIT — train = every operator NOT in the held-out list.
        - "lambda row: str(row.get('operator', '')) not in ${.....held_out_operators}"
    # Seeded 95/5 episode split within the train operators; the 5 % is the
    # seen-operator val (train_viz_datasets below).
    mode: train
    valid_ratio: 0.05

# UNSEEN operators: all episodes of the held-out operators -> Valid/ metrics.
valid_datasets:
  human_bimanual:
    _target_: ${...train_datasets.human_bimanual._target_}
    resolver: ${...train_datasets.human_bimanual.resolver}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() == 'fold_clothes'"
        - "lambda row: '/mecka/flagship/' in str(row.get('zarr_processed_path', ''))"
        # OPERATOR SPLIT — valid = the held-out operators only.
        - "lambda row: str(row.get('operator', '')) in ${.....held_out_operators}"
    mode: total

# SEEN operators, held-out episodes (the complement of train's 95 %) ->
# train_viz/ metrics via the train_viz_evaluator head.
train_viz_datasets:
  human_bimanual:
    _target_: ${...train_datasets.human_bimanual._target_}
    resolver: ${...train_datasets.human_bimanual.resolver}
    filters: ${...train_datasets.human_bimanual.filters}
    mode: valid
    valid_ratio: ${...train_datasets.human_bimanual.valid_ratio}

train_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8

# Unshuffled: the same leading slice every val (comparable across epochs,
# coherent overlay video). Capped per pass by the trainer's limit_val_batches.
valid_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8
    shuffle: false

# Shuffled: a real validation set, not a leading-slice spot check
# (train_viz_hpt_wristframe_6d caps eval-only mode at 50 batches).
train_viz_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 4
    shuffle: true
