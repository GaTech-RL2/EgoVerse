_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/egoverseDebugDatasets/mecka
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        transform_mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['lab'] == 'mecka' and row['task'] in ['dishwashing', 'cleaning']"
    mode: train
    use_weighted_loss: true
    loss_groups:
      dishwashing:
        filter_lambdas:
          - "lambda row: row['task'] == 'dishwashing'"
        weight: 0.1
      cleaning:
        filter_lambdas:
          - "lambda row: row['task'] == 'cleaning'"
        weight: 0.9
valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/egoverseDebugDatasets/mecka
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        transform_mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['lab'] == 'mecka' and row['task'] in ['dishwashing', 'cleaning']"
    mode: valid
    loss_groups:
      dishwashing:
        filter_lambdas:
          - "lambda row: row['task'] == 'dishwashing'"
        weight: 0.1
      cleaning:
        filter_lambdas:
          - "lambda row: row['task'] == 'cleaning'"
        weight: 0.9
train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 30
valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 30
