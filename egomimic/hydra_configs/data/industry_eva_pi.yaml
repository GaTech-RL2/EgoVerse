_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Embodiment collapse: mecka + scale are both `human_bimanual` now, merged into ONE
# human_bimanual domain alongside eva_bimanual. JUDGMENT CALL to sanity-check: mecka
# has a head pose and scale does not, so the merged human keymap uses
# has_head_pose=false (scale-compatible) for a consistent representation. eva is
# unchanged.
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['task'] == 'fold_clothes'"
    mode: train
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        has_head_pose: false
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: (row['lab'] == 'mecka' and row['task'] == 'fold_clothes') or (row['lab'] == 'scale' and row['task'] == 'flagship_fold_clothes')"
    mode: train

valid_datasets:
  eva_bimanual:
    _target_: ${train_datasets.eva_bimanual._target_}
    resolver: ${train_datasets.eva_bimanual.resolver}
    filters: ${train_datasets.eva_bimanual.filters}
    mode: valid
  human_bimanual:
    _target_: ${train_datasets.human_bimanual._target_}
    resolver: ${train_datasets.human_bimanual.resolver}
    filters: ${train_datasets.human_bimanual.filters}
    mode: valid

train_dataloader_params:
  eva_bimanual:
    batch_size: 21
    num_workers: 10
  human_bimanual:
    batch_size: 21
    num_workers: 10
valid_dataloader_params:
  eva_bimanual:
    batch_size: 21
    num_workers: 10
  human_bimanual:
    batch_size: 21
    num_workers: 10
