_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Embodiment collapse: mecka + scale are both `human_bimanual` now, merged into ONE
# human_bimanual domain alongside eva_bimanual. Scale exports carry obs_head_pose
# (sfs_to_egoverse_zarr.py writes it from the per-frame camera pose), so the merged
# human keymap keeps the default has_head_pose=true. eva is on the wrist-frame
# cartesian 6D action, human on the 144-D wrist-frame hand-keypoint action (see
# data/cotrain_pi_base.yaml). fix_mecka_left_wrist is OFF (mixed labs).
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian_wristframe_6d
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['task'] == 'fold_clothes'"
    mode: train
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        include_ee_pose: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        include_ee_pose: true
        # 18 -> 20-D ee_pose proprio (zero grip slots at 9/19) so the pi0.5
        # State: prompt bins align with the robot 20-D layout on every config.
        pad_proprio_gripper: true
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: (row['lab'] == 'mecka' and row['task'] == 'fold_clothes') or (row['lab'] == 'scale' and row['task'] == 'flagship_fold_clothes')"
    mode: train

valid_datasets:
  eva_bimanual:
    _target_: ${data.train_datasets.eva_bimanual._target_}
    resolver: ${data.train_datasets.eva_bimanual.resolver}
    filters: ${data.train_datasets.eva_bimanual.filters}
    mode: valid
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters: ${data.train_datasets.human_bimanual.filters}
    mode: valid

train_dataloader_params:
  eva_bimanual:
    batch_size: 21
    num_workers: 10
  human_bimanual:
    batch_size: 21
    num_workers: 10
valid_dataloader_params:
  eva_bimanual:
    batch_size: 21
    num_workers: 10
  human_bimanual:
    batch_size: 21
    num_workers: 10
