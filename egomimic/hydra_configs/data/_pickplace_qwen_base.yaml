# Shared eva_bimanual skeleton for the HPT + Qwen-annotation pick_place
# cotrain/bc data configs (cotrain_pickplace_qwen{,_wrist,_objgen},
# cotrain_pi_pickplace_qwen, bc_pickplace_eva_qwen).
#
# Consumed via `defaults: [_pickplace_qwen_base, _self_]`. Holds the eva_bimanual
# train + valid dataset blocks and the eva dataloader params that are
# verbatim-shared across the cluster: S3AnnotationCutoffEpisodeResolver on the
# pickplace_qwen folder, cartesian keymap/transform, the eva pick_place train
# filter ('alignment' NOT IN) and valid filter ('alignment' IN), batch_size 32 /
# num_workers 6.
#
# Each leaf overrides only what differs and adds its aria_bimanual blocks:
#   - _wrist: eva transform_list.mode -> cartesian_wristframe_ypr (train+valid)
#   - _pi:    eva key_map.keymap_mode -> cartesian_pi (train+valid)
#   - _objgen: adds an aria_bimanual valid block + aria valid dataloader
#   - bc: eva-only (no aria blocks at all)
#
# All blocks are CONCRETE (no ${...} interpolation) so launchers can override
# resolver sub-keys directly.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pickplace_qwen
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') == 'eva_bimanual' and (row.get('zarr_processed_path') or '') != '' and 'alignment' not in ((row.get('task_description') or '').lower())"
    mode: total

valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pickplace_qwen
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
        - "lambda row: row.get('task') == 'pick_place' and row.get('embodiment') == 'eva_bimanual' and (row.get('zarr_processed_path') or '') != '' and 'alignment' in ((row.get('task_description') or '').lower())"
    mode: total

train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 6
valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 6
