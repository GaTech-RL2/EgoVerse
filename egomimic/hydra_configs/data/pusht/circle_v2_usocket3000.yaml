# CROSS-EMBODIMENT OBSTACLE TRANSFER, H-Net side (2026-07-31).
# Direct counterpart of the DP run dp_cV2_u3 (job 3636876) -- same two folders.
#
#   circle   = circle_4500_plus_gen_v2  5006 eps, sim_v2-verified, and the ONLY
#              obstacle source (720 eps, levels 1..30, solid_pusher=True)
#   u_socket = u_socket_3000            3000 eps, ALL obs0, no obstacles
#
# u_socket stays on the PRE-sim_v2 collection deliberately (user, 2026-07-31):
# it is in-domain only, and the sim_v2 physics fix engages solely on contact with
# static geometry -- free-space motion is unchanged by construction. So there is
# nothing for a u_socket v2 re-collection to fix.
#
# => any obstacle competence u_socket shows must have TRANSFERRED from circle;
#    it has zero obstacle exposure of its own.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# PUSHSHAPES CIRCLE + U-SOCKET HETEROGENEOUS COTRAIN.
#
# Feeds both domains from separate on-disk dirs:
#   pushshapes_sim          -> circle_4500 (2D xy action, ~4735 episodes)
#   pushshapes_sim_u_socket -> u_socket_1000 (3D xy-theta action, 1000 episodes)
# Packed full-episode teacher forcing (chunking="none"); action chunking
# (chunk-4) is handled by TargetBuilder / SDPHead, not here.
#
# U-socket files are tagged "pushshapes_sim" on disk, so the resolver override
# is mandatory to keep separate normalization, state encoder, router, and
# action head dispatch. CombinedLoader max_size_cycle gives one batch from
# each embodiment per optimizer step and cycles the smaller U-socket loader.

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle_4500_plus_gen_v2
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_with_pusher_cmd
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/u_socket_3000
      embodiment_override: "pushshapes_sim_u_socket"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_with_pusher_cmd
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560

