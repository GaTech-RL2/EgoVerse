# D1-obstacle data config: SYMMETRIC in-domain-vs-in-domain, using the
# user-collected in_domain_v2_alignment set (2026-08-03, 5 episodes/side,
# obstacle level 0 only) instead of the large pre-existing in-domain
# datasets (circle_4500 / small_circle_4500_v2) -- matched scale/protocol to
# obj_gen_v2_alignment so the two comparisons are apples-to-apples (same
# episode count, same collection batch) rather than confounded by dataset
# size. Both folders are already flat (no per-level nesting since only
# level 0 exists), so no symlink flatten step was needed here.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  pushshapes_sim:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/circle_4500_plus_gen_v2
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560
  pushshapes_sim_small_circle:
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/small_circle_4500_v2
      embodiment_override: "pushshapes_sim_small_circle"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560

valid_datasets:
  pushshapes_sim:                       # <-- newly-collected in-domain, e15 side
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /coc/flash7/paphiwetsa3/datasets/chunkviz_stage_indom/e15
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560
  pushshapes_sim_small_circle:          # <-- newly-collected in-domain, e17 side
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/chunkviz_stage_indom/e17
      embodiment_override: "pushshapes_sim_small_circle"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560

train_dataloader_params:
  pushshapes_sim:
    batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: false
  pushshapes_sim_small_circle:
    batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: false
valid_dataloader_params:
  pushshapes_sim:
    batch_size: 1   # only 5 episodes total -- keep small so we get a real
                     # per-batch distribution (up to 5 batches) instead of
                     # one combined mega-batch (batch_size 16 would give N=1)
    num_workers: 4
    pin_memory: true
    persistent_workers: false
  pushshapes_sim_small_circle:
    batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: false
