_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Canonical 3,000-episode pre-step ChainGripper corpus. For Hobs=2 Paper DP,
# action_target_offset=1 aligns [S_t, S_(t+1)] with action a_(t+1).
train_datasets:
  pushshapes_sim_chain_gripper: &dataset
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2
      embodiment_override: pushshapes_sim_chain_gripper
      expected_episode_count: 3000
      expected_episode_names_sha256: 61e23164126fd2b2a9bd1cc7c7b015ddff05e18d5fe704b34d870b17742cddcd
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_planar_keymap
        action_horizon: ${planar.raw_action_horizon}
        observation_horizon: ${planar.observation_horizon}
        action_target_offset: ${planar.action_target_offset}
      transform_list:
        _target_: ${planar.transform_target}
        action_horizon: ${planar.action_horizon}
        action_target_offset: ${planar.action_target_offset}
        min_distance_unit: ${planar.arc_distance}
        resampled_vector_length: ${planar.arc_waypoints}
        rotation_radius: ${planar.arc_rotation_radius}
        hybrid_rotation_unit: ${planar.hybrid_rotation_unit}
    mode: train
    valid_ratio: 0.01
    split_seed: ${seed}
    expected_train_episode_count: 2970
    expected_train_episode_names_sha256: 318c6ec46ef1c0899bbc6254a0799044e534322e7b76bcc11f1744fe3f163264
    expected_valid_episode_count: 30
    expected_valid_episode_names_sha256: 01ceda50bdceaf7505ec3e3dc71c9430048f5b6ea5c894fc565d345fe925e6db
    bounds_check: false

valid_datasets:
  pushshapes_sim_chain_gripper:
    <<: *dataset
    mode: valid

train_dataloader_params: &loader
  pushshapes_sim_chain_gripper:
    batch_size: ${planar.batch_size}
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3
valid_dataloader_params:
  <<: *loader
  pushshapes_sim_chain_gripper:
    batch_size: ${planar.batch_size}
    num_workers: 4
    pin_memory: true
