    min_seq_len: 64
    max_seq_len: 2560

train_dataloader_params:
  pushshapes_sim:
    batch_size: 16
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
  pushshapes_sim_u_socket:
    batch_size: 16
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
valid_dataloader_params:
