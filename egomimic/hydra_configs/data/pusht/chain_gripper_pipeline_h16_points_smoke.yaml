_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Verified seven-episode additive smoke corpus. The logical model key remains
# `actions`; only the physical Zarr source changes to the ordered point array.
# Do not replace this with the raw 3000-episode folder: that folder is native4.
train_datasets:
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2_dual_control_smoke_20260826
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 16
        action_zarr_key: actions.points
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_validation_transform_list
    mode: train
    valid_ratio: 0.15
    bounds_check: false

valid_datasets:
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2_dual_control_smoke_20260826
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 16
        action_zarr_key: actions.points
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_validation_transform_list
    mode: valid
    valid_ratio: 0.15
    bounds_check: false

train_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: 16
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3

valid_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: 16
    num_workers: 4
    pin_memory: true
