_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# zarr_dataset_multi.SEED is fixed at 42. Train and validation resolve the
# same namespaced episode inventories before selecting complementary 99/1
# membership. Chain generated data is the immutable audited 719-episode view.
valid_combined_mode: max_size
# Lightning's default DistributedSampler pads odd validation lengths. This
# recipe owns train sharding and uses no-padding validation shards instead.
manage_distributed_samplers: true

train_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_per_emb_proprio
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_usocket_rotvec_action_state_transform_list
    mode: train
    valid_ratio: 0.01
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverManyWithEmbodimentOverride
      folder_paths: &chain_roots
        - /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2
        - /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_gen_flow_transfer_frozen719_20260829
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_per_emb_proprio
        action_horizon: 16
        action_zarr_key: actions
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_transform_list
        world_size: 512.0
    mode: train
    valid_ratio: 0.01
    bounds_check: false

valid_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_per_emb_proprio
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_usocket_rotvec_action_state_transform_list
    mode: valid
    valid_ratio: 0.01
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverManyWithEmbodimentOverride
      folder_paths: *chain_roots
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt_per_emb_proprio
        action_horizon: 16
        action_zarr_key: actions
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_transform_list
        world_size: 512.0
    mode: valid
    valid_ratio: 0.01
    bounds_check: false

# Keep the prior experiment's 32 independent conditions per rank. K=4 adds
# four stochastic trajectories for each condition; it does not count as a
# larger condition batch.
train_dataloader_params:
  pushshapes_sim_u_socket: &train_loader
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  pushshapes_sim_chain_gripper: *train_loader

valid_dataloader_params:
  pushshapes_sim_u_socket: &valid_loader
    batch_size: 8
    num_workers: 4
    pin_memory: true
  pushshapes_sim_chain_gripper: *valid_loader
