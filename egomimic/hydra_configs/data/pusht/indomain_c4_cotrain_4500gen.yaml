# 4500-scale twin of indomain_c4_cotrain.
#
# GEN AND IN-DOMAIN ARE REFERENCED AS SEPARATE FOLDERS (no merged view folder):
#   circle_4500/           4735 real eps (obs0 4548 + obs1-12 187)  <- in-domain
#   new_circle_cotrain/     720 real eps (obs0 24 + obs1-29 696)    <- gen, 24/level
#   small_circle_4500/     4467 real eps (no gen collection exists for small)
# Resolver merges the circle folders into ONE dataset entry, so the training
# mixture / loss weighting is identical to a merged folder (gen = 720/5455 of
# the circle stream). Keys are namespaced per folder because the two folders
# reuse 32 episode filenames for DIFFERENT data.
#
# Folder paths live HERE (not in sbatch EXTRA) so a resume cannot silently
# revert the dataset -- that is exactly what corrupted the old c4500 lineage.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# PUSHSHAPES TABLE FEED -- BOTH / COTRAIN  (in-domain, chunk-4 families).
#
# Feeds BOTH domains from SEPARATE on-disk dirs (no name filter):
#   pushshapes_sim              -> circle_4500 + new_circle_cotrain (SEPARATE folders, 5455 ep)
#   pushshapes_sim_small_circle -> small_circle_4500     (small, 4467 ep, no gen exists)
# Packed full-episode teacher forcing (chunking="none"); action chunking
# (chunk-4) is handled in the model head / GMMLoss, NOT here.
#
# For the H-Net firstend pyramid + Tx WindowedBC families. The algo's
# forward_training iterates per-embodiment and sets ctx.embodiment_id so the
# per-emb cond encoder + PerEmbodimentStage outer levels (H-Net) / per-emb
# norm-stats (Tx shared policy) route correctly.
#
# the circle folders are tagged embodiment="pushshapes_sim" (includes ncc_*
# generated episodes) -> plain LocalEpisodeResolver. small_circle_4500 is ALSO
# tagged "pushshapes_sim" on disk, so it uses
# LocalEpisodeResolverWithEmbodimentOverride to re-tag to
# "pushshapes_sim_small_circle" at resolve time.
#
# action_horizon=2560 matches the firstend model's outer_stage.action_horizon.
# Longest episode ~500 frames; 2560 leaves headroom.

train_datasets:
  pushshapes_sim:                       # big circle + generated
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path:
      - /coc/flash7/paphiwetsa3/datasets/circle_4500        # in-domain source
      - /coc/flash7/paphiwetsa3/datasets/new_circle_cotrain # gen source (obs 0-29)
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560
  pushshapes_sim_small_circle:          # small circle
    _target_: egomimic.rldb.zarr.zarr_dataset_packed.ZarrEpisodePackedDataset.from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/small_circle_4500
      embodiment_override: "pushshapes_sim_small_circle"
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap
        action_horizon: 2560
      transform_list: null
    chunking: "none"
    min_seq_len: 64
    max_seq_len: 2560

