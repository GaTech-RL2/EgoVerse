_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Current Flow Transfer cotrain feed: 2,999 in-domain U-Socket + 3,000 in-domain
# ChainGripper. The U-Socket folder is named 3000 but index 270 is absent. The
# planned 960 obstacle episodes are intentionally absent:
# no verified obstacle dataset exists under the Skynet dataset roots yet.
# U-Socket consumes native [x,y,theta] through the SE(2) tokenizer. Chain uses
# native4 -> ordered points6 FK -> anchored-Phi tokenizer. Both produce M=25
# waypoints plus one velocity row and therefore share token horizon 26 while
# retaining separate widths/decoders (4 versus 6).
train_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_arc_length_transform_list
        min_distance_unit: 200.0
        resampled_vector_length: 25
        dt: 0.03333333333333333
        rotation_radius: 40.0
    mode: train
    valid_ratio: 0.02
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_native_point_arc_length_transform_list
        min_distance_unit: 200.0
        resampled_vector_length: 25
        dt: 0.03333333333333333
        world_size: 512.0
    mode: train
    valid_ratio: 0.02
    bounds_check: false

valid_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_arc_length_transform_list
        min_distance_unit: 200.0
        resampled_vector_length: 25
        dt: 0.03333333333333333
        rotation_radius: 40.0
    mode: valid
    valid_ratio: 0.02
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_native_point_arc_length_transform_list
        min_distance_unit: 200.0
        resampled_vector_length: 25
        dt: 0.03333333333333333
        world_size: 512.0
    mode: valid
    valid_ratio: 0.02
    bounds_check: false

train_dataloader_params:
  pushshapes_sim_u_socket: &train_loader
    batch_size: 16
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3
  pushshapes_sim_chain_gripper: *train_loader

valid_dataloader_params:
  pushshapes_sim_u_socket: &valid_loader
    batch_size: 16
    num_workers: 4
    pin_memory: true
  pushshapes_sim_chain_gripper: *valid_loader
