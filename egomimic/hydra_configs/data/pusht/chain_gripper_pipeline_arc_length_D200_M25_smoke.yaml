_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Primary ChainGripper point-token experiment. Ordered points P=[L,C,R] use the
# anchored Euclidean embedding Phi(P)=[C,(L-C)/sqrt(2),(R-C)/sqrt(2)]. Thus
# rigid translation retains pixel units, while translation and relative-shape
# motion occupy separate coordinates. Raw H=100 point commands become M=25 Phi
# waypoints plus one 6D mean-Phi-velocity row.
train_datasets:
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2_dual_control_smoke_20260826
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 100
        action_zarr_key: actions.points
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_arc_length_transform_list
        min_distance_unit: 200.0
        resampled_vector_length: 25
        dt: 0.03333333333333333
    mode: train
    valid_ratio: 0.15
    bounds_check: false

valid_datasets:
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2_dual_control_smoke_20260826
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 100
        action_zarr_key: actions.points
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_arc_length_transform_list
        min_distance_unit: 200.0
        resampled_vector_length: 25
        dt: 0.03333333333333333
    mode: valid
    valid_ratio: 0.15
    bounds_check: false

train_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: 16
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3

valid_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: 16
    num_workers: 4
    pin_memory: true
