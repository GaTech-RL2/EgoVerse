_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Canonical 2,999-episode pre-step U-Socket corpus. For Hobs=2 Paper DP,
# action_target_offset=1 aligns [S_t, S_(t+1)] with action a_(t+1).
train_datasets:
  pushshapes_sim_u_socket: &dataset
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      expected_episode_count: 2999
      expected_episode_names_sha256: 38a22a25ae2c45d18861bcf0c32d139fcf56787d891ba463e9318c27a105dc8e
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_planar_keymap
        action_horizon: ${planar.raw_action_horizon}
        observation_horizon: ${planar.observation_horizon}
        action_target_offset: ${planar.action_target_offset}
      transform_list:
        _target_: ${planar.transform_target}
        action_horizon: ${planar.action_horizon}
        action_target_offset: ${planar.action_target_offset}
        min_distance_unit: ${planar.arc_distance}
        resampled_vector_length: ${planar.arc_waypoints}
        rotation_radius: ${planar.arc_rotation_radius}
        hybrid_rotation_unit: ${planar.hybrid_rotation_unit}
    mode: train
    valid_ratio: 0.01
    split_seed: ${seed}
    expected_train_episode_count: 2970
    expected_train_episode_names_sha256: ceb588f2132f9ff9cdb2c2ebe754a4797228acb884eb18351589242866ee84a1
    expected_valid_episode_count: 29
    expected_valid_episode_names_sha256: b34193949ac8d76ea27c6f5c307229798064d16367d7ce2efac00a48f63bfb93
    bounds_check: false

valid_datasets:
  pushshapes_sim_u_socket:
    <<: *dataset
    mode: valid

train_dataloader_params: &loader
  pushshapes_sim_u_socket:
    batch_size: ${planar.batch_size}
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3
valid_dataloader_params:
  <<: *loader
  pushshapes_sim_u_socket:
    batch_size: ${planar.batch_size}
    num_workers: 4
    pin_memory: true
