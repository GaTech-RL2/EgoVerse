_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Immutable episode-level split contract:
# - seed 42 (the repository split_dataset_names default)
# - valid_ratio 0.01 on both the train and validation views
# - U-Socket: 2,970 train / 29 validation from 2,999 episodes
# - ChainGripper: 3,682 train / 37 validation from 3,719 episodes
# The generated Chain root is the frozen audited 719-episode view, so no
# runtime filter can diverge from the materialized split manifest.
train_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_rotvec_transform_list
    mode: train
    valid_ratio: 0.01
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverManyWithEmbodimentOverride
      folder_paths: &chain_roots
        - /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_3000_v2
        - /coc/flash7/paphiwetsa3/datasets/Tsim_v2/chain_gripper_gen_flow_transfer_frozen719_20260829
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 16
        action_zarr_key: actions
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_transform_list
        world_size: 512.0
    mode: train
    valid_ratio: 0.01
    bounds_check: false

valid_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_rotvec_transform_list
    mode: valid
    valid_ratio: 0.01
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverManyWithEmbodimentOverride
      folder_paths: *chain_roots
      embodiment_override: pushshapes_sim_chain_gripper
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_keymap_hpt
        action_horizon: 16
        action_zarr_key: actions
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_point_transform_list
        world_size: 512.0
    mode: valid
    valid_ratio: 0.01
    bounds_check: false

# Do not cycle the shorter validation domain; visit each held-out window once.
valid_combined_mode: max_size

train_dataloader_params:
  pushshapes_sim_u_socket: &train_loader
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  pushshapes_sim_chain_gripper: *train_loader

valid_dataloader_params:
  pushshapes_sim_u_socket: &valid_loader
    batch_size: 16
    num_workers: 4
    pin_memory: true
  pushshapes_sim_chain_gripper: *valid_loader
