# RICL training data: pi0.5 + retrieval finetuned on fold_clothes (eva_bimanual).
# Query = fold frames; bank = fold frames (set retrieval_cache_dir to the fold cache,
# query=fold/bank=fold/LOSO-episode). Model learns the in-context mechanism on fold;
# it is later eval'd zero-shot on cup_on_saucer with a cup cache. 15-step chunks.
defaults:
  - cotrain_pi_ricl
  - _self_

train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian_pi
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        mode: cartesian
        chunk_length: 15
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row, _eps=__import__('egomimic.ricl.fold_cup_splits', fromlist=['fold_train_episode_hashes']).fold_train_episode_hashes(): row.get('embodiment') == 'eva_bimanual' and row.get('task') == 'fold_clothes' and row.get('episode_hash') in _eps"
    mode: train
    valid_ratio: 0.05
  aria_bimanual: null

valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver: ${...train_datasets.eva_bimanual.resolver}
    filters: ${...train_datasets.eva_bimanual.filters}
    mode: valid
    valid_ratio: 0.05
  aria_bimanual: null

# Bank = eva (robot), same keymap/transform as the query path, 15-step chunks.
bank_embodiment: eva_bimanual
bank_zarr_root: ${paths.dataset_dir}/{hash}
bank_converter:
  _target_: egomimic.utils.action_utils.RobotBimanualCartesianEuler
bank_keymap:
  _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
  keymap_mode: cartesian_pi
  annotation_key: annotations
bank_transform_list:
  _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
  mode: cartesian
  chunk_length: 15
