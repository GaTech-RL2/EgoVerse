# MECKA_FOLD_FREEFORM_OPSPLIT_6D: pi0.5 BC on the mecka FREEFORM fold-clothes
# episodes (SQL task='folding_clothes', 462 eps / 1.13M frames under
# processed_v3/mecka/freeform/; "freeform" is only visible in
# zarr_processed_path, so the filter keys on '/mecka/freeform/' and accepts
# either fold-clothes task spelling), stored under the human_bimanual
# embodiment, with the held-out-OPERATOR train/val split.
#
# OPERATOR SPLIT: validation = 31 operators held out ENTIRELY, so no val
# episode shares an operator with training. The list lives ONCE, in
# `held_out_operators` below; the train and valid filter lambdas both
# interpolate it, so the two sides cannot drift apart.
#
# Chosen deterministically on 2026-09-01 from SQL app.episodes (462 freeform
# fold eps / 178 operators): skip the 10 largest operators (their data stays in
# train), seeded shuffle (random.Random(42)) of the remaining operator ids,
# accumulate until >= 10 % of frames -> 31 operators, 50 episodes,
# 115,681 frames (10.2 %) held out; train = 147 operators, 412 episodes,
# 1,013,220 frames. Both sides use mode: total (no random episode split); the
# list IS the split. Do not edit it: checkpoints were trained against it.
#
# NO ANNOTATION GUARD: 112 of the 462 freeform episodes have segments = NULL, so
# their `annotations` track is empty and the prompt falls back to
# `default_prompt` ('' by default) on every frame: Pi sees "Task: , State: ...",
# HPT feeds '' to its text stem. Left as is because checkpoints were trained on
# this split; the opscale ladder (mecka_fold_freeform_opscale4_6d) reuses only
# its held-out OPERATOR list and filters to annotated episodes.
#
# Pipeline and loader params: mecka_all_6d (wrist-frame 6D cartesian; pairs
# with model=pi0.5_bc_mecka_6d, evaluator=eval_pi_wristframe_6d). For CAM
# (head)-frame actions add
#   data.train_datasets.human_bimanual.resolver.transform_list.mode=cartesian_6d
# with evaluator=eval_pi_camframe_6d. Norm stats: precompute on a CPU node
# (egomimic/scripts/precompute_norm_stats.py) and point training at
# norm_stats.precomputed_norm_path=<out>/norm_stats.
defaults:
  - mecka_all_6d
  - _self_

# The 31 held-out operator ids (SQL app.episodes.operator), sorted. See the
# OPERATOR SPLIT note above; the filter lambdas read `data.held_out_operators`.
held_out_operators:
