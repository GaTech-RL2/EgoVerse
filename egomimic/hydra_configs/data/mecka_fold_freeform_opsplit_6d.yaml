train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ('folding_clothes', 'fold_clothes')"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        # OPERATOR SPLIT: train = every operator NOT in the held-out list.
        - "lambda row: str(row.get('operator', '')) not in ${data.held_out_operators}"
      exclude_hashes: null
    mode: total

valid_datasets:
  human_bimanual:
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ('folding_clothes', 'fold_clothes')"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        # OPERATOR SPLIT: valid = the held-out operators only.
        - "lambda row: str(row.get('operator', '')) in ${data.held_out_operators}"
    mode: total
