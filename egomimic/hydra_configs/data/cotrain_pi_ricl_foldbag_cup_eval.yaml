# RICL OOD eval: (fold+bag)-trained RICL evaluated on cup_on_saucer WITH retrieved
# cup demos (set retrieval_cache_dir to the cup cache: query=cup/bank=cup/LOSO-episode).
# valid = the 100 held-out cup_on_saucer eval episodes (held out of training).
# train_datasets inherited (fold+bag), not iterated in eval mode. Splits:
# egomimic/ricl/foldbag_cup_splits.py.
defaults:
  - cotrain_pi_ricl_foldbag
  - _self_

valid_datasets:
  eva_bimanual:
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row, _eps=__import__('egomimic.ricl.foldbag_cup_splits', fromlist=['cup_eval_episode_hashes']).cup_eval_episode_hashes(): row.get('embodiment') == 'eva_bimanual' and row.get('task') == 'cup_on_saucer' and row.get('episode_hash') in _eps"
    mode: total
