# data=mecka_all_6d pinned to fixed episode lists: train = a 20% subset of the
# lab=mecka episodes (4078 hashes in resources/blocklists/mecka_20pct_6d_train.txt,
# mode total), valid = 3 seen-operator episodes, unseen_op_valid = 3
# held-out-operator episodes. Every hash is a pin: one that is missing, deleted
# or filtered out fails the resolve.
defaults:
  - mecka_all_6d
  - _self_

valid_datasets:
  human_bimanual:
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas: ${data.train_datasets.human_bimanual.filters.filter_lambdas}
      exclude_hashes: ${data.train_datasets.human_bimanual.filters.exclude_hashes}
      episode_hashes:
        - "69b5691e4e73acdd60a51040"
        - "69b0c52becd6553472c0cb2d"
        - "69b9abc3aa6e21f31eb6ba25"
    mode: total

unseen_op_valid_datasets:
  human_bimanual:
    _target_: ${data.train_datasets.human_bimanual._target_}
    resolver: ${data.train_datasets.human_bimanual.resolver}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas: ${data.train_datasets.human_bimanual.filters.filter_lambdas}
      exclude_hashes: ${data.train_datasets.human_bimanual.filters.exclude_hashes}
      episode_hashes:
        - "69b525ff91d6491aa901a64b"
        - "69b9b260c004b8e369a3d517"
        - "69b9e5e27301ad7dc90077dc"
    mode: total

unseen_op_valid_dataloader_params:
  human_bimanual: ${data.valid_dataloader_params.human_bimanual}

# 80 val batches x 64 = 5120 frames per head; train_viz: floor(5120/4078) = 1.
# valid / unseen_op_valid have 3 episodes each and run in full.
metric_frames_per_episode:
  train_viz: 1

video_episodes:
  valid:
    - "69b5691e4e73acdd60a51040"
  train_viz:
    - "696a1464715ed751e5e0f674"
  unseen_op_valid:
    - "69b525ff91d6491aa901a64b"

train_datasets:
  human_bimanual:
    mode: total
    filters:
      episode_hashes: mecka_20pct_6d_train
