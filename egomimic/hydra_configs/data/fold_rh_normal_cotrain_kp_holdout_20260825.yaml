# Canonical 28->100 Fold cotrain feed with an explicit held-out EVA validation
# split collected on 2026-08-25. The train roots/transforms stay unchanged.
defaults:
  - fold_rh_normal_cotrain_kp
  - _self_

# Guard against future synchronization of held-out stores into the fixed local
# training cache. This is a no-op for the current cache but makes non-overlap an
# explicit data contract.
train_datasets:
  eva_bimanual:
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - >-
        lambda row: row.get('episode_hash') not in ('2026-08-25-03-32-24-233000', '2026-08-25-03-33-03-690000', '2026-08-25-03-33-49-175000', '2026-08-25-03-34-46-970000')

valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:FOLD_HELDOUT_EVA_ROOT,/coc/flash7/paphiwetsa3/datasets/fold_rh_holdout_20260825/eva}
      # The 2026-08-25 processed stores intentionally carry no camera
      # calibration metadata.  Scheduled validation computes action MSE only,
      # so retain the canonical Fold image/action/proprio windows while
      # omitting the three overlay-only metadata keys.
      key_map:
        _target_: builtins.dict
        front_img_1: {key_type: camera_keys, zarr_key: images.front_1, horizon: 2}
        left.cmd_ee_pose: {key_type: action_keys, zarr_key: left.cmd_ee_pose, horizon: 101}
        right.cmd_ee_pose: {key_type: action_keys, zarr_key: right.cmd_ee_pose, horizon: 101}
        left.cmd_gripper: {key_type: action_keys, zarr_key: left.cmd_gripper, horizon: 101}
        right.cmd_gripper: {key_type: action_keys, zarr_key: right.cmd_gripper, horizon: 101}
        left.obs_ee_pose: {key_type: proprio_keys, zarr_key: left.obs_ee_pose, horizon: 2}
        right.obs_ee_pose: {key_type: proprio_keys, zarr_key: right.obs_ee_pose, horizon: 2}
        left.obs_gripper: {key_type: proprio_keys, zarr_key: left.obs_gripper, horizon: 2}
        right.obs_gripper: {key_type: proprio_keys, zarr_key: right.obs_gripper, horizon: 2}
        left_wrist_img: {key_type: camera_keys, zarr_key: images.left_wrist, horizon: 2}
        right_wrist_img: {key_type: camera_keys, zarr_key: images.right_wrist, horizon: 2}
      transform_list:
        _target_: egomimic.rldb.embodiment.fold_span_transforms.eva_normal_transforms
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - >-
        lambda row: row.get('episode_hash') in ('2026-08-25-03-32-24-233000', '2026-08-25-03-33-03-690000', '2026-08-25-03-33-49-175000', '2026-08-25-03-34-46-970000')
    # Validation must normalize with training stats but never replace a frame
    # because it lies outside those stats' quantile bounds.
    bounds_check: false
    mode: total
