_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Two-stream hybrid keypoint tokenizer, human-only, stride=1.
#
# eef (wrist xyz+ypr, head frame) and keypoints (21 joints, WRIST frame ->
# pure hand shape) are parameterised INDEPENDENTLY: each has its own D and its
# own distance function, both resampled to the same M=30. Row M carries four
# velocities (2 hands x 2 streams); at rollout only the window where every
# stream is still inside its token is emitted.
#
# D_eef=0.45 / D_kp=0.41 from measured path lengths on a real 94s episode
# (48.71m eef vs 44.51m keypoint L-inf), so the two streams emit comparable
# token counts -- otherwise whichever exhausts D first chronically truncates
# the other.

# Human-only 21-keypoint hand pose, ARC-uniform: (31, 138) = 30 waypoints + 1 velocity token.
#
# Same population as the cartesian runs (lab=rl2, task=fold_clothes) so the
# two action spaces are trained on identical episodes, and stride=1 because
# an arc-length model can only reconstruct on the sample grid.
#
# Action space is 138 = 2 x (21*3 + 6): per hand, wrist xyz+ypr then 21 MANO
# keypoints. Confirmed against the live pipeline; aria has no gripper.
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_ypr_hybrid
        stride: 1
        min_distance_unit_eef: 0.45
        min_distance_unit_kp: 0.41
        resampled_vector_length: 30
        distance_mode: linf
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

valid_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_ypr_hybrid
        stride: 1
        min_distance_unit_eef: 0.45
        min_distance_unit_kp: 0.41
        resampled_vector_length: 30
        distance_mode: linf
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6
