_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Variant of human_mecka_eva_rl2_fold_clothes.yaml but with mecka filtered on
# task='folding_clothes' (462 episodes SQL-side) instead of 'fold_clothes'
# (1607 SQL-side). Both mecka and eva capped to 290 episodes so the two sets
# are size-matched (eva rl2 fold_clothes is 290 episodes native, no cap).
train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
        stride: 3
      debug: 290
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'folding_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.05

  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'eva_bimanual' and row['lab'] == 'rl2' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.05

valid_datasets:
  human_bimanual:
    _target_: ${train_datasets.human_bimanual._target_}
    resolver: ${train_datasets.human_bimanual.resolver}
    filters: ${train_datasets.human_bimanual.filters}
    mode: valid
    valid_ratio: ${train_datasets.human_bimanual.valid_ratio}
  eva_bimanual:
    _target_: ${train_datasets.eva_bimanual._target_}
    resolver: ${train_datasets.eva_bimanual.resolver}
    filters: ${train_datasets.eva_bimanual.filters}
    mode: valid
    valid_ratio: ${train_datasets.eva_bimanual.valid_ratio}

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6
  eva_bimanual:
    batch_size: 32
    num_workers: 6

valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 6
  eva_bimanual:
    batch_size: 32
    num_workers: 6
