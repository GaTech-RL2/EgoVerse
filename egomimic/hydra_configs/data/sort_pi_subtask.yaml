defaults:
  - cotrain_pi_lang_6d
  - _self_

# Sort-regime data for hierarchical subtask prediction.
#
# Inherits `cotrain_pi_lang_6d` (NOT `cotrain_pi_lang`): the model config
# `pi0.5_subtask` uses action_encoding=cartesian_normalized_rot6d, which expects
# the xyz+6D(+gripper) action layout produced by transform mode `cartesian_6d`.
# Inheriting the plain `cotrain_pi_lang` (ypr) parent would crash in
# to32_norm_6d on the first batch.
#
# One change vs. the parent: filters select both SORT episodes (task ==
# 'sort', which carry real sort goals -> task != subtask training signal) and
# pick_place episodes (task-only conditioning; no subtask target unless the
# episode carries an injected copy). Annotation ROLES come from the role-named
# zarr keys (annotations_task / annotations_subtask, fetched automatically by
# ZarrDataset) and are sampled by the model config's SubtaskAnnotationProcessor
# — no keymap registration or level filtering.
#
# Pair with model config `pi0.5_subtask`.
train_datasets:
  eva_bimanual:
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: "dense-language"
      filter_lambdas:
        - "lambda row: (row.get('embodiment') == 'eva_bimanual') & (row['task'] in ('sort', 'pick_place')) & (row['zarr_processed_path'] != '')"
  human_bimanual:
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: "dense-language"
      filter_lambdas:
        - "lambda row: (row.get('embodiment') == 'human_bimanual' and row.get('lab') == 'rl2') & (row['task'] in ('sort', 'pick_place')) & (row['zarr_processed_path'] != '')"

valid_datasets:
  eva_bimanual:
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: "dense-language"
      filter_lambdas:
        - "lambda row: row.get('embodiment') == 'eva_bimanual' and row['task'] in ('sort', 'pick_place') and row['zarr_processed_path'] != '' and 'alignment' not in (row.get('task_description') or '')"
  human_bimanual:
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: "dense-language"
      filter_lambdas:
        - "lambda row: row.get('embodiment') == 'human_bimanual' and row.get('lab') == 'rl2' and row['task'] in ('sort', 'pick_place') and row['zarr_processed_path'] != '' and 'alignment' not in (row.get('task_description') or '')"
