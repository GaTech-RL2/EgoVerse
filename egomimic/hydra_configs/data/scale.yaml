# One pinned scale episode (stored as human_bimanual) on the 144-D wrist-frame
# hand-keypoint action; see data/human.yaml for the layout and the cartesian
# override. fix_left_wrist_convention is on: scale runs its own converter,
# but it writes the same pre-fix left-wrist convention as mecka (measured on
# all 20 production episodes).
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${paths.dataset_dir}
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: keypoints
        include_ee_pose: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        mode: keypoints_wristframe_6d
        include_ee_pose: true
        # Scale exports were written by the pre-fix hand-pose converter too:
        # measured on all 20 production episodes, the left wrist matches
        # rot_left to <= 2.06 deg with the right-hand control clean.
        fix_left_wrist_convention: true
        # 18 -> 20-D ee_pose proprio (zero grip slots at 9/19) so the pi0.5
        # State: prompt bins align with the robot 20-D layout on every config.
        pad_proprio_gripper: true
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      episode_hashes: ["2026-04-30-09-41-51-255837"]
    mode: total

valid_datasets:
  human_bimanual: ${data.train_datasets.human_bimanual}

train_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 10
valid_dataloader_params:
  human_bimanual:
    batch_size: 32
    num_workers: 10
