defaults:
  - cotrain_pi_base
  - _self_

train_datasets:
  eva_bimanual:
    resolver:
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: (row['robot_name'] == 'eva_bimanual') & (row['task'] == 'fold_clothes') & (row['zarr_processed_path'] != '')"
    mode: train

valid_datasets:
  eva_bimanual:
    resolver:
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: (row['robot_name'] == 'eva_bimanual') & (row['task'] == 'fold_clothes') & (row['zarr_processed_path'] != '')"
    mode: valid
  
use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: "random"
annotation_key: null
default_prompt: "this is clothes folding"


sampling_mode: "random"
annotation_key: "annotations"
default_prompt: "this is a bad action"
