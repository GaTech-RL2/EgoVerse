# mecka_freeform_fold_kp_op2_holdout on freeform folding_clothes operators #2-#4
# by total hours (#1, 695d09fc83a9fdf2d84d9c11, has 15 of 21 episodes on the
# bad-egomotion blocklist), 2 median-length episodes of each held out; the same
# unseen_op_valid. After the blocklist (2026-09-29):
#   68e0b875c33a1abcb8fc55b9  21 of 21 -> 19 train, 2 val
#   695d0a7783a9fdf2d84d9db5  15 of 16 -> 13 train, 2 val
#   69624c9583a9fdf2d8601cf9  13 of 13 -> 11 train, 2 val
defaults:
  - mecka_freeform_fold_kp_op2_holdout
  - _self_

held_out_hashes:
  - 696d119e1fe17643f95f9fb9 # 69624c9583a9fdf2d8601cf9
  - 696d0fe4a199224e8d66242c
  - 69b49d838cd7957ebe478c88 # 68e0b875c33a1abcb8fc55b9
  - 69b4b52e6d78ad6736570e97
  - 69b4b33c5dac6770e6021e42 # 695d0a7783a9fdf2d84d9db5
  - 69b4b9abe8279eda42670225

train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ${data.tasks}"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        - "lambda row: str(row.get('operator', '')) in ('68e0b875c33a1abcb8fc55b9', '695d0a7783a9fdf2d84d9db5', '69624c9583a9fdf2d8601cf9')"
        - "lambda row: str(row.get('episode_hash', '')) not in ${data.held_out_hashes}"
