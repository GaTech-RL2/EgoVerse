defaults:
  - sort_pp_subtask_6d
  - _self_

# Eval/viz restricted to SORT episodes (human_bimanual) so the eval video
# actually exercises the sort-goal conditioning + the model's decoded [pred]
# subtask — instead of being swamped by pick_place (where high==low and the
# overlay degenerates to pick-place). The high/low split (high_annotation_key)
# is inherited from sort_pp_subtask_6d and left intact, so the model still
# receives the sort goal as the high prompt. eva is left as-is (its separate
# video is pick_place); look at the human_bimanual video for the sort result.
train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: row.get('task') == 'sort' and row.get('embodiment') in ('aria', 'aria_bimanual') and (row.get('zarr_processed_path') or '') != '' and (row.get('episode_hash') or '') not in ('2026-04-26-00-17-53-000000', '2026-04-26-00-27-26-000000', '2026-05-01-02-52-58-000000')"
valid_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: row.get('task') == 'sort' and row.get('embodiment') in ('aria', 'aria_bimanual') and (row.get('zarr_processed_path') or '') != '' and (row.get('episode_hash') or '') not in ('2026-04-26-00-17-53-000000', '2026-04-26-00-27-26-000000', '2026-05-01-02-52-58-000000')"
