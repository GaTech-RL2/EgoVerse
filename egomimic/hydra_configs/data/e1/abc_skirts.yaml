# E1 speed-spread data on the ABC / YAM "fold and stack the skirts" episodes
# (983 in the episode table, all yam_bimanual; the zarr attrs still say
# eva_bimanual, hence the embodiment override). Front camera + EE pose only,
# mirroring the mecka rows. Split folders from build_splits.py, no SQL.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.e1_resolvers.LocalFolderEpisodeResolverWithEmbodimentOverride
      folder_path: ${e1.train_root}
      embodiment_override: yam_bimanual
      key_map:
        _target_: egomimic.rldb.embodiment.e1_fold.get_keymap
        horizon: ${e1.chunk_length}
        embodiment: yam
      transform_list:
        _target_: egomimic.rldb.embodiment.e1_fold.get_transform_list
        variant: ${e1.variant}
        chunk_length: ${e1.chunk_length}
        time_rows: ${e1.time_rows}
        min_distance_unit: ${e1.D}
        resampled_vector_length: ${e1.M}
        stride: 1
        rotation_mode: euler
        progress_smooth_hz: ${e1.progress_smooth_hz}
        velocity_norm: ${e1.velocity_norm}
        embodiment: yam
    mode: ${e1.train_mode}
    valid_ratio: 0.0
    bounds_check: false

valid_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.e1_resolvers.LocalFolderEpisodeResolverWithEmbodimentOverride
      folder_path: ${e1.valid_root}
      embodiment_override: yam_bimanual
      key_map:
        _target_: egomimic.rldb.embodiment.e1_fold.get_keymap
        horizon: ${e1.chunk_length}
        embodiment: yam
      transform_list:
        _target_: egomimic.rldb.embodiment.e1_fold.get_transform_list
        variant: ${e1.variant}
        chunk_length: ${e1.chunk_length}
        time_rows: ${e1.time_rows}
        min_distance_unit: ${e1.D}
        resampled_vector_length: ${e1.M}
        stride: 1
        rotation_mode: euler
        progress_smooth_hz: ${e1.progress_smooth_hz}
        velocity_norm: ${e1.velocity_norm}
        embodiment: yam
    mode: ${e1.valid_mode}
    valid_ratio: 0.0
    bounds_check: false

train_dataloader_params:
  yam_bimanual:
    batch_size: 128
    num_workers: 12
    anchor_sampler: ${e1.anchor_sampler}

valid_dataloader_params:
  yam_bimanual:
    batch_size: 128
    num_workers: 8
    shuffle: false
