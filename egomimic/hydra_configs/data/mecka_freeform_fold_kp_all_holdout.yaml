# mecka_freeform_fold_kp_top3_holdout on every freeform folding_clothes operator:
# the same seen_op_valid (top3's 6 held-out episodes) and unseen_op_valid, whose 5
# operators (`held_out_operators`) are dropped from train. After the blocklist
# (2026-09-29): 423 of 462 episodes, 9.6 h; train is 171 operators, 407
# episodes, 9.2 h.
defaults:
  - mecka_freeform_fold_kp_top3_holdout
  - _self_

train_datasets:
  human_bimanual:
    filters:
      filter_lambdas:
        - "lambda row: str(row.get('lab', '')).lower() == 'mecka'"
        - "lambda row: str(row.get('task', '')).lower() in ${data.tasks}"
        - "lambda row: '/mecka/freeform/' in str(row.get('zarr_processed_path', ''))"
        - "lambda row: str(row.get('operator', '')) not in ${data.held_out_operators}"
        - "lambda row: str(row.get('episode_hash', '')) not in ${data.held_out_hashes}"
