_target_: egomimic.pl_utils.pl_model.ModelWrapper

# TAPERED-DIM variant of hnet_cotrain_gmm_obs_big (2026-06-15). Hourglass dims
# widen toward the trunk: fine 256 = mid 256 -> trunk 512. The H-Net OuterStage
# forces fine==mid (hnet.output_hidden_dim must equal d_model), so only the
# trunk widens; Stage 1 projects 256->512 via proj_in/proj_out. Rationale: most
# tokens live at the fine level (cheap to keep narrow), the few coarse tokens
# get more capacity for abstract trunk reasoning. chunk_len=4;
# target_compression_ratio=4.0 (per request, vs 2.0 base) -> ~4 tokens/chunk
# per level. NOTE: action head reads the dechunked FINE level (d_model=256), so
# the output path is intentionally the narrow level (watch for under-capacity).
robomimic_model:
  _target_: egomimic.algo.hnet.PackedAlgoBase
  d_cond: 256

  domains: ["pushshapes_sim", "pushshapes_sim_small_circle"]
  ac_keys:
    pushshapes_sim: "actions"
    pushshapes_sim_small_circle: "actions"

  loss:
    _target_: egomimic.algo.hnet.GMMLoss

  outer_stage:
    _target_: egomimic.algo.hnet.HNetOuterStage
    action_dim: 2
    action_horizon: 2560
    d_model: 256
    action_head_type: gmm

    gmm_head:
      _target_: egomimic.models.heads.gmm_head.GMMActionHead
      d_model: 256
      action_dim: 2
      num_modes: 32
      chunk_len: 4
      min_std: 1.0e-4
      std_activation: softplus
      low_noise_eval: true
      head_hidden_dim: 1024
      head_n_layers: 3

    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 256
      output_key: "fused_cond"
      obs_specs: {}
      img_encoders: {}

    input_modules:
      - _target_: egomimic.models.stems.input_modules.ObsToken
        d_model: 256
        obs_encoder:
          _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
          d_cond: 256
          output_key: "fused_cond"
          cond_proj_widths: [256, 256]
          obs_specs:
            state_agent_obj:
              input_dim: 5
              embed_dim: 96
              widths: [192]
          img_encoders:
            front_img_1:
              _target_: egomimic.models.stems.visual_core.VisualCore
              in_channels: 3
              image_size: 96
              num_kp: 48
              feature_dimension: 96
              pretrained: false
              crop_aug: true
              crop_height: 86
              crop_width: 86
              crop_eval_mode: random
              crop_sample_mode: v02

    # Tapered 2-level chunking H-Net (cond_key=null — no AdaLN):
    #   [0] PerEmbodimentStage(ChunkerStage)  fine 256 -> inner 384, PER-EMB
    #     -> [1] ChunkerStage                 mid  384 -> inner 512, SHARED
    #         -> [2] ComputeStage             trunk 512, SHARED (terminal)
    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
        - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
          sub_stages:
            pushshapes_sim:
              _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 256
              output_hidden_dim: 256
              target_compression_ratio: 8.0
              ratio_loss_weight: 0.03
              cond_key: null
            pushshapes_sim_small_circle:
              _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 256
              output_hidden_dim: 256
              target_compression_ratio: 8.0
              ratio_loss_weight: 0.03
              cond_key: null
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 256
          output_hidden_dim: 512
          target_compression_ratio: 8.0
          ratio_loss_weight: 0.03
          cond_key: null
        - _target_: egomimic.models.hnet.stages.ComputeStage
          input_hidden_dim: 512
          output_hidden_dim: 512
          cond_key: null
          d_cond: 0
          causal: true
          main_network:
            arch_layout: "T6"
            d_model: 512
            d_intermediate: 1536
            num_heads: 16
            cond: false
            rotary_emb_dim: 32
            dropout: 0.0
            resid_dropout: 0.0

enable_grad_norm: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 200000
  warmup_steps: 2000
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
