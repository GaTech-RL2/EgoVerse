# train_zarr_mecka_private_tshirt30m_opscale_10 at 2x steps, resumed from its 50% (pre-decay)
# checkpoint by logs/mecka_private_opscale30m2x/launch_pair.sbatch.
defaults:
  - train_zarr_mecka_private_tshirt30m_opscale_10
  - _self_

trainer:
  max_epochs: 900
  min_epochs: 900

# Every 10%; the 80% one is the decay start.
callbacks:
  model_checkpoint:
    every_n_epochs: 90

model:
  scheduler:
    stable: 71500
    decay: 18000
