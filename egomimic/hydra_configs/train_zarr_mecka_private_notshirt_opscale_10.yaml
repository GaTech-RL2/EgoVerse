# RDT-1B keypoint recipe of train_zarr_mecka_freeform_fold_kp_rdt_op2 (4 GPUs x
# 32, WSD LR decaying over the last 20%, EMA on) on 10 private fold_no_tshirt operator(s).
# 1400 x 100 steps: max(60k, ~4 passes over the train split). Generated; see
# data/mecka_private_notshirt_opscale_1.
defaults:
  - train_zarr_mecka_freeform_fold_kp_rdt_op2
  - override data: mecka_private_notshirt_opscale_10
  - _self_

model:
  ema:
    enabled: true
  scheduler:
    stable: 111000
    decay: 28000

trainer:
  max_epochs: 1400
  min_epochs: 1400

# Two checkpoints: each is ~23 GB on NFS with the EMA weights.
callbacks:
  model_checkpoint:
    every_n_epochs: 700
