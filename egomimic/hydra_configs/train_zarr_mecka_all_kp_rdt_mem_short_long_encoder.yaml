# RDT memory ablation (all mecka, keypoints), SHORT_LONG_ENCODER arm: the proprio arm plus 8
# front frames on the proprio's grid (5 frames apart, t-35 .. t), one CLS token
# each from a second fine-tuned DINOv3, fused with that step's proprio token;
# RDT's pair is dropped for 30 % of training samples.
# See train_zarr_mecka_all_kp_rdt_mem_base.yaml.
defaults:
  - train_zarr_mecka_all_kp_rdt_mem_proprio
  - _self_

data:
  train_datasets:
    human_bimanual:
      resolver:
        key_map:
          # Seconds, not frames, so fusion can check it against the memory's grid;
          # 5 frames at mecka's 30 fps (history stats raise on any other fps).
          history_stride: 1
          history_stride_s: 0.16667
          image_memory: 8
          image_memory_stride_s: 0.16667

model:
  robomimic_model:
    trunk:
      short_dropout: 0.3
      memory:
        encoder:
          _target_: egomimic.models.hpt_nets.DINOv3Stem
          model_name: ${model.robomimic_model.encoder_specs.front_img_1.model_name}
          output_dim: ${model.robomimic_model.width}
          freeze_backbone: false
          image_size: ${model.robomimic_model.encoder_specs.front_img_1.image_size}
          pool: cls
          grad_checkpointing: true
        # Must equal key_map.image_memory / image_memory_stride_s above: the
        # model is built from the model config alone, so it cannot interpolate
        # them. A frame-count mismatch raises at the first batch.
        frames: 8
        stride_s: 0.16667
        fuse_proprio: true
    head_specs:
      human_bimanual:
        model:
          n_memory_tokens: 8
