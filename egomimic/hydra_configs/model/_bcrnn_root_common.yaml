# ABSTRACT GRAND-BASE (underscore-prefixed, NEVER launched) — the sliver of
# payload that is VERBATIM-identical between the two BC-RNN lineage bases
# (_bcrnn_common = non-paperexact, _bcrnn_paperexact_common = paper-exact). Both
# bases extend THIS via their defaults list; each then adds ONLY the keys that
# diverge between the lineages (obs_encoder, core_net, actor_mlp_dims, scheduler,
# the paper-exact-only pad_mode/enable_grad_norm/paper_exact/crop, and the
# gmm_head.d_model that follows from each core).
#
# Every block below was byte-equality-verified across the two bases before being
# lifted here; resolving any BC-family leaf is unchanged (comments are stripped
# by the resolver and the merged values are identical). This file is never
# launched and is referenced only by the two lineage bases.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.bc.WindowedBC

  action_dim: 2
  action_horizon: 1024
  rnn_horizon: 10           # robomimic rnn.horizon: 10-step train windows + rollout hidden re-init cadence
  max_windows_per_batch: 256

  gmm_head:
    _target_: egomimic.models.heads.gmm_head.GMMActionHead
    # d_model is supplied per-lineage base (non-PE: actor_mlp_dims[-1]=1024;
    # paper-exact: the core's per-step output width, set per leaf).
    action_dim: 2
    num_modes: 5              # robomimic gmm.num_modes
    min_std: 1.0e-4           # robomimic gmm.min_std: std=softplus(raw)+min_std
    std_activation: softplus  # robomimic gmm.std_activation
    low_noise_eval: true      # robomimic gmm.low_noise_eval: eval std=1e-4, SAMPLE

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

# robomimic optimizer: torch.optim.Adam, lr 1e-4, L2=0 (NO weight decay).
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0
