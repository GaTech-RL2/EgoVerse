# HPT_BC_MECKA_6D_300M — ~300M-parameter HPT flow-matching BC on the 18-D
# WRIST-frame cartesian action with the continuous 6D rotation, plus a frozen
# Qwen3-Embedding text stem for the task prompt. HPT twin of pi0.5_bc_mecka_6d.
#
# Data: a `cartesian_wristframe_6d` data config with `keymap_mode: cartesian`
# (front image -> `front_img_1`, the HPT encoder key), e.g.
# mecka_fold_flagship_opsplit_hpt_6d. Action `actions_cartesian` = per arm
# [xyz | 6D rotation] (18) relative to that wrist's current pose; proprio
# `observations.state.ee_pose` = head-frame wrist poses, 6D-encoded and padded
# 18 -> 20 (pad_proprio_gripper; zero grip slots at 9/19). Both are
# quantile-normalized from precomputed stats. Inputs: front image (ResNet), the
# 20-D ee_pose through the `state_ee_pose` stem, and one annotation sampled per
# batch item through the Qwen per-token stem. Drop the text stem with
#   ~model.robomimic_model.shared_stem_specs.annotation model.robomimic_model.shared_obs_keys=[front_img_1]
#
# Widths follow the lab's 300M reference (hpt_bc_flow_mecka_300M on
# aniketh/hpt-run-configs): embed_dim 840, 10 trunk heads, cross-attn 18
# latents x 10 heads x 140 dim_head, head hidden_dim 320 / 5 heads / mlp 5x5.
# num_blocks is set so the TRAINABLE count (frozen Qwen excluded) lands at
# ~300M. Measured by instantiating this config on 2026-09-11: 23 blocks =
# 298.1M trainable (trunk 195.0M = 8.48M/block, head 74.2M, ResNet 11.6M,
# image stem 6.1M, Qwen stem projection 5.6M, ee_pose stem 5.4M; Qwen 595.8M
# frozen). 24 blocks would be 306.5M.
#
# Constant LR 5e-5, no scheduler (the setting of the mecka_fold_*_300M
# constlr_5e5 ablations; the CosineAnnealingLR of hpt_bc_flow_mecka sawtooths
# over a long run).
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  camera_transforms: {}
  ac_keys:
    human_bimanual: "actions_cartesian"

  diffusion: true
  6dof: true

  # Prompt for the Qwen stem: one annotation sampled per batch item from the
  # `annotations` track (the data config's keymap exposes it).
  annotation_key: "annotations"
  annotation_sampling_mode: "random"
  annotation_modality: "annotation"
  default_prompt: ""

  trunk:
    embed_dim: 840
    num_blocks: 23
    num_heads: 10
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: null
  domains: ["human_bimanual"]
  shared_obs_keys: ["front_img_1", "annotation"]

  head_specs:
    human_bimanual:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        human_bimanual: 18
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 840
        hidden_dim: 320
        act_dim: 18
        act_seq: 100
        n_heads: 5
        dropout: 0.1
        mlp_layers: 5
        mlp_ratio: 5

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 840
      output_dim: 840
      widths: [840]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 18
          crossattn_heads: 10
          crossattn_dim_head: 140
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 840
    annotation:
      _target_: egomimic.models.hpt_nets.QwenPerTokenEncoder
      model_name: "Qwen/Qwen3-Embedding-0.6B"
      max_length: 128
      freeze: true
      dtype: "float16"
      output_dim: 840
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 18
          crossattn_heads: 10
          crossattn_dim_head: 140
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 840

  stem_specs:
    human_bimanual:
      # 20-D: 6D-encoded head-frame wrist poses (18) + zero grip pads (2).
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 20
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 840
      num_of_copy: 1

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-5
  weight_decay: 0.0001

scheduler: null
