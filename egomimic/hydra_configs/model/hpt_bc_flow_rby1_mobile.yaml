# 40-action variant of hpt_bc_flow_rby1_egoengine. Use with data=test_RBY1_0309_40act.
defaults:
  - hpt_bc_flow_rby1
  - _self_

robomimic_model:
  ac_keys:
    rby1: actions_joint_arm_head_torso_base
  trunk:
    action_horizon: 20
  head_specs:
    rby1:
      action_horizon: 20
      infer_ac_dims:
        rby1: 25
      model:
        act_seq: 20
        act_dim: 25  # per-timestep dim for joint_arm_head_torso_base