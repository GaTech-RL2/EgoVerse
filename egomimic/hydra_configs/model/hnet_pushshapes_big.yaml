_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.packed_base.HNet

  # Scaled-up version of hnet_pushshapes.yaml:
  #   - d_model 128 -> 256, num_heads 4 -> 8
  #   - d_intermediate (MLP) 512 -> 1024 (enc/dec) and 768 -> 1536 (inner)
  #   - chunked dim 192 -> 384 (kept proportional, 1.5x of outer)
  # Expected param count: ~5.7M (baseline) -> ~22M (~4x).

  d_cond: 256

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

  outer_stage:
    _target_: egomimic.algo.packed_outer_stage.HNetOuterStage
    action_dim: 2
    action_horizon: 1024
    d_model: 256
    action_head_type: linear

    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 256
      output_key: "fused_cond"
      cond_proj_widths: [256, 256]
      obs_specs:
        state_agent_obj:
          input_dim: 5
          embed_dim: 128
          widths: [256]
      img_encoders:
        front_img_1:
          _target_: egomimic.models.stems.image_encoders.SimpleConv
          in_channels: 3
          channels: [32, 64, 128, 256]
          kernel_size: 3
          stride: 2
          embed_dim: 256
          norm_groups: 8

    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
        - _target_: egomimic.models.hnet.stages.EncoderDecoderStage
          input_hidden_dim: 256
          output_hidden_dim: 256
          cond_key: "fused_cond"
          d_cond: 256
          causal: true
          encoder:
            arch_layout: "T4"
            d_model: 256
            d_intermediate: 1024
            num_heads: 8
            cond: true
          decoder:
            arch_layout: "T4"
            d_model: 256
            d_intermediate: 1024
            num_heads: 8
            cond: true
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 256
          output_hidden_dim: 384
          target_compression_ratio: 8.0
          ratio_loss_weight: 0.03
          cond_key: "fused_cond"
        - _target_: egomimic.models.hnet.stages.ComputeStage
          input_hidden_dim: 384
          output_hidden_dim: 384
          cond_key: "fused_cond"
          d_cond: 256
          causal: true
          main_network:
            arch_layout: "T4"
            d_model: 384
            d_intermediate: 1536
            num_heads: 8
            cond: false

  init_weights_range: null
  lr_multipliers: null
  use_parameter_groups: false
  weight_decay: 0.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
