# BC-RNN-TRANSFORMER — the PAPER-EXACT BC-RNN recipe with ONE thing changed: the
# recurrent core is swapped LSTM -> causal-attention TRANSFORMER. The full
# paper-exact payload (obs encoder, GMM head, minmax norm, repeat_unmasked
# windows, rnn_horizon=10, eval crop, Adam optimizer) plus the TransformerCore
# swap come from _bcrnn_paperexact_tx_common; this leaf only pins the scheduler.
defaults:
  - _bcrnn_paperexact_tx_common
  - _self_

# Constant-LR schedule (robomimic exact-replica): LambdaLR factor 1.0.
scheduler:
  _target_: egomimic.utils.schedulers.constant_scheduler
  _partial_: true
