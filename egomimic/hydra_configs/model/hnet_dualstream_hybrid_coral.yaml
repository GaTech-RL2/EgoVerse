_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.PackedAlgoBase
  # Re-plan cadence == the GMM head chunk_len (=4): each kept obs-token predicts
  # chunk_len actions, so re-observe every chunk_len frames.
  obs_stride: 4
  # HYBRID dual-stream + CORAL (v4): a hybrid of the 2trunk (transformer +
  # cross-attention) and dualhnet (two dynamic-chunking H-Nets) variants.
  #   * SPECIFIC stream S -> a PER-EMBODIMENT dict of dynamic-chunking H-Nets
  #     (EncDec(T2) -> Chunker(cossim/first_token/duplicate, ratio 4) ->
  #     Compute(T4)), UNCHANGED from dualhnet. Output S_top -> GMM specific.
  #   * AGNOSTIC stream A -> ONE shared CHUNKER-FREE transformer H-Net
  #     (EncDec(T2) -> Compute(T4): encoder/decoder/trunk, NO dynamic chunking),
  #     full token resolution. Output A_full.
  # The agnostic trunk attends ONE-WAY to the specific trunk's compressed tokens
  # S_M (detached): A_full is compressed at the SAME chunk boundaries the
  # specific H-Net produced, cross-attends detach(S_M), then the residual is
  # duplicate-dechunked back to full resolution and added onto A_full -> A_top.
  # A_top -> GMM agnostic modes + CORAL only. CORAL aligns A_top across
  # embodiments (cov + mean). Both streams get the SAME observations.
  d_cond: 704
  # CORAL aux loss on the agnostic trunk (cov + mean), across embodiments.
  coral_weight: 0.1
  coral_include_mean: true
  domains:
  - pushshapes_sim
  - pushshapes_sim_small_circle
  ac_keys:
    pushshapes_sim: actions
    pushshapes_sim_small_circle: actions
  loss:
    _target_: egomimic.algo.hnet.GMMLoss
  outer_stage:
    _target_: egomimic.algo.hnet.dual_stream_outer.DualStreamOuterStage
    action_dim: 2
    action_horizon: 2560
    d_model: 704
    action_head_type: gmm
    # Policy AdaLN cond path — unused (inner trunks take no cond). Empty encoder.
    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 704
      output_key: fused_cond
      obs_specs: {}
      img_encoders: {}
    # SPECIFIC stream: per-embodiment obs encoder (one per domain).
    input_modules:
    - _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 704
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.MultiEmbodimentCondEncoder
        encoders:
          pushshapes_sim:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 704
            output_key: fused_cond
            cond_proj_widths:
            - 256
            - 256
            obs_specs:
              state_agent_obj:
                input_dim: 2
                input_slice: [0, 2]
                embed_dim: 64
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 96
                num_kp: 32
                feature_dimension: 64
                pretrained: false
                crop_aug: true
                crop_height: 86
                crop_width: 86
                crop_eval_mode: random
                crop_sample_mode: v02
          pushshapes_sim_small_circle:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 704
            output_key: fused_cond
            cond_proj_widths:
            - 256
            - 256
            obs_specs:
              state_agent_obj:
                input_dim: 2
                input_slice: [0, 2]
                embed_dim: 64
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 96
                num_kp: 32
                feature_dimension: 64
                pretrained: false
                crop_aug: true
                crop_height: 86
                crop_width: 86
                crop_eval_mode: random
                crop_sample_mode: v02
    # AGNOSTIC stream: a SINGLE shared CondEncoderModule (weight-shared across
    # embodiments). Same obs_specs / img_encoders shape as one per-emb encoder.
    agnostic_obs_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 704
      output_key: fused_cond
      cond_proj_widths:
      - 256
      - 256
      obs_specs:
        state_agent_obj:
          input_dim: 2
          input_slice: [0, 2]
          embed_dim: 64
      img_encoders:
        front_img_1:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 96
          num_kp: 32
          feature_dimension: 64
          pretrained: false
          crop_aug: true
          crop_height: 86
          crop_width: 86
          crop_eval_mode: random
          crop_sample_mode: v02
    # The inner stage: a SINGLE HybridDualStreamCoralStage holding the shared
    # chunker-free agnostic trunk + the per-embodiment chunking specific H-Nets.
    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
      - _target_: egomimic.models.hnet.hybrid_dual_stream_stage.HybridDualStreamCoralStage
        input_hidden_dim: 704
        output_hidden_dim: 704
        num_heads: 8
        cross_attn_causal: true
        cond_key: null
        # AGNOSTIC H-Net: CHUNKER-FREE (encoder/decoder + trunk, full resolution).
        hnet_agnostic:
          _target_: egomimic.models.hnet.hnet.HNet
          stages:
          - _target_: egomimic.models.hnet.stages.EncoderDecoderStage
            input_hidden_dim: 704
            output_hidden_dim: 704
            cond_key: null
            d_cond: 0
            causal: true
            encoder:
              arch_layout: "T2"
              d_model: 704
              d_intermediate: 1408
              num_heads: 8
              cond: false
              rotary_emb_dim: 88
            decoder:
              arch_layout: "T2"
              d_model: 704
              d_intermediate: 1408
              num_heads: 8
              cond: false
              rotary_emb_dim: 88
          - _target_: egomimic.models.hnet.stages.ComputeStage
            input_hidden_dim: 704
            output_hidden_dim: 704
            cond_key: null
            d_cond: 0
            causal: true
            main_network:
              arch_layout: "T4"
              d_model: 704
              d_intermediate: 1408
              num_heads: 8
              cond: false
              rotary_emb_dim: 88
        # SPECIFIC H-Nets: one separate dynamic-chunking H-Net per embodiment.
        hnet_specific:
          pushshapes_sim:
            _target_: egomimic.models.hnet.hnet.HNet
            stages:
            - _target_: egomimic.models.hnet.stages.EncoderDecoderStage
              input_hidden_dim: 704
              output_hidden_dim: 704
              cond_key: null
              d_cond: 0
              causal: true
              encoder:
                arch_layout: "T2"
                d_model: 704
                d_intermediate: 1408
                num_heads: 8
                cond: false
                rotary_emb_dim: 88
              decoder:
                arch_layout: "T2"
                d_model: 704
                d_intermediate: 1408
                num_heads: 8
                cond: false
                rotary_emb_dim: 88
            - _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 704
              output_hidden_dim: 704
              target_compression_ratio: 4.0
              ratio_loss_weight: 0.03
              cond_key: null
              down_interface: first_token
              up_interface: duplicate
              router_interface: cossim
            - _target_: egomimic.models.hnet.stages.ComputeStage
              input_hidden_dim: 704
              output_hidden_dim: 704
              cond_key: null
              d_cond: 0
              causal: true
              main_network:
                arch_layout: "T4"
                d_model: 704
                d_intermediate: 1408
                num_heads: 8
                cond: false
                rotary_emb_dim: 88
          pushshapes_sim_small_circle:
            _target_: egomimic.models.hnet.hnet.HNet
            stages:
            - _target_: egomimic.models.hnet.stages.EncoderDecoderStage
              input_hidden_dim: 704
              output_hidden_dim: 704
              cond_key: null
              d_cond: 0
              causal: true
              encoder:
                arch_layout: "T2"
                d_model: 704
                d_intermediate: 1408
                num_heads: 8
                cond: false
                rotary_emb_dim: 88
              decoder:
                arch_layout: "T2"
                d_model: 704
                d_intermediate: 1408
                num_heads: 8
                cond: false
                rotary_emb_dim: 88
            - _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 704
              output_hidden_dim: 704
              target_compression_ratio: 4.0
              ratio_loss_weight: 0.03
              cond_key: null
              down_interface: first_token
              up_interface: duplicate
              router_interface: cossim
            - _target_: egomimic.models.hnet.stages.ComputeStage
              input_hidden_dim: 704
              output_hidden_dim: 704
              cond_key: null
              d_cond: 0
              causal: true
              main_network:
                arch_layout: "T4"
                d_model: 704
                d_intermediate: 1408
                num_heads: 8
                cond: false
                rotary_emb_dim: 88
    # Partitioned-mode GMM heads (per embodiment). Input width = d_model.
    gmm_heads:
      pushshapes_sim:
        _target_: egomimic.models.heads.partitioned_gmm_head.PartitionedGMMActionHead
        d_model: 704
        action_dim: 2
        k_agnostic: 20
        k_specific: 12
        chunk_len: 4
        min_std: 0.0001
        std_activation: softplus
        low_noise_eval: true
        head_hidden_dim: 512
        head_n_layers: 3
      pushshapes_sim_small_circle:
        _target_: egomimic.models.heads.partitioned_gmm_head.PartitionedGMMActionHead
        d_model: 704
        action_dim: 2
        k_agnostic: 20
        k_specific: 12
        chunk_len: 4
        min_std: 0.0001
        std_activation: softplus
        low_noise_eval: true
        head_hidden_dim: 512
        head_n_layers: 3
enable_grad_norm: false   # MAD clamper freezes median->starves grads; no-clip default
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 300000
  warmup_steps: 15000
  warmup_start_factor: 0.1
  eta_min: 1.0e-06
