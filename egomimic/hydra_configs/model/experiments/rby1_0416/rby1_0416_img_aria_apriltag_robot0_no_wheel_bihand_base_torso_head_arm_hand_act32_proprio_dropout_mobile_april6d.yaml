# Vanilla (CrossTransformer) variant using 6D april_tag (xyz + rotation) instead of 3D april_tag_xyz.
# Slim variant: TinyCNN encoder (cheap for 64x64 black aria) + trunk shrunk to 8 blocks, d=192.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand
  trunk:
    embed_dim: 192
    num_blocks: 8
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8
  domains:
    - rby1
  shared_obs_keys:
    - front_img_1
  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 192
      output_dim: 192
      widths: [192]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 48
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 192
  stem_specs:
    rby1:
      state_april_tag:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 6
        output_dim: 192
        widths: [192]
        specs:
          random_horizon_masking: false
          noise_std: 0.1
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 192
      state_robot0_joint_pos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 22
        output_dim: 192
        widths: [192]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.4
          noise_std: 0.01
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 192
      state_hand_left_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 192
        widths: [192]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.7
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 192
      state_hand_right_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 192
        widths: [192]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.7
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 192
  head_specs:
    rby1:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 32
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 49
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 192
        hidden_dim: 128
        act_dim: 49
        act_seq: 32
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.TinyCNN
      output_dim: 192
      channels: [16, 32, 64]
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1.0e-5
