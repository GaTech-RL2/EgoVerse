# Priority 1: Block-token diffusion with masked attention (DAG structure).
#
# Same as vanilla but model._target_ -> HierarchicalCrossTransformer.
# FMPolicy is unchanged; inference cost is identical to vanilla.
#
# Block layout (49D): base(3) | torso(6) | head(2) | arms(14) | hands(24)
# DAG: arms/hands skip head (head is a dead-end in the conditioning graph).
#
# To switch to vanilla:  change model._target_ back to CrossTransformer and remove
#                        hierarchical_block_dims / hierarchical_block_parents.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand
  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8
  domains:
    - rby1
  shared_obs_keys:
    - front_img_1
  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
  stem_specs:
    rby1:
      state_april_tag_xyz:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 3
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          noise_std: 0.1
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_robot0_joint_pos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 22
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.4
          noise_std: 0.01
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_left_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.7
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_right_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.7
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    rby1:
      # ── only this block differs from vanilla ──────────────────────────────
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 32
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 49
      model:
        _target_: egomimic.models.denoising_nets.HierarchicalCrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 49
        act_seq: 32
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
        # Block layout: base(3) | torso(6) | head(2) | l_arm+r_arm(14) | l_hand+r_hand(24)
        hierarchical_block_dims: [3, 6, 2, 14, 24]
        # DAG parents (indices into block_dims list)
        hierarchical_block_parents:
          - []        # base: no parents
          - [0]       # torso <- base
          - [0, 1]    # head <- base, torso
          - [0, 1]    # arms <- base, torso (NOT head)
          - [0, 1, 3] # hands <- base, torso, arms (NOT head)
      # ─────────────────────────────────────────────────────────────────────
  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1.0e-5
