# TELEOP round v4 (RECTIFIED images): same recipe as v3 but trained on undistorted
# (linear pinhole f=373, 81 deg HFOV) frames instead of raw fisheye. 72 demos, 2000 ep.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  manip_base_disp_thresh: 0.05   # m of GT-chunk base |dx|+|dy| below which a val sample is "manip phase"
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand
  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 4
  domains:
    - rby1
  shared_obs_keys:
    - front_img_1
  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
  stem_specs:
    rby1:
      state_robot0_joint_pos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 22
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0    # clamp normalized proprio (train+eval); guards near-static joints
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_left_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_right_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    rby1:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 32
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 49
      loss_block_slices:   # diagnostic per-block train losses (normalized flow-MSE)
        base: [0, 3]
        torso: [3, 9]
        head: [9, 11]
        l_arm: [11, 18]
        r_arm: [18, 25]
        l_hand: [25, 37]
        r_hand: [37, 49]
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 49
        act_seq: 32
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      resnet_model: resnet18   # fast encoder for hardware iteration
      output_dim: 256
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: egomimic.utils.image_augs.BatchedRandomCropRotate
        # 20-40 px crop. `scale` is an AREA fraction: cropped_px = 224*(1-sqrt(scale)).
        # sqrt(0.675)=0.821 -> 40 px ; sqrt(0.83)=0.911 -> 20 px
        scale: [0.675, 0.83]
        degrees: 5.0
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 2000
  eta_min: 1.0e-5
