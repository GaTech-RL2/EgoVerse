# V1 RETRAIN (crop): = rby1_wb_img_proprio_act32_vanilla with two robustness changes
# for the live-input gap (policy was brittle to live RGB/proprio shifts):
#   * RandomResizedCrop: square crop of side 173-224 px (removes ~0-50 px), resized
#     back to 224 — trains translation/scale-tolerant features. scale includes 1.0 so
#     the full frame (what deploy sends) stays in-distribution; eval augs unchanged.
#   * robot0_joint_pos proprio_dropout_p 0.4 -> 0.8 — lean harder on vision.
# Obs: front_img_1 (real obs.aria_image, ResNet) + robot0_joint_pos_no_wheel (22) + hand_left/right_qpos (12 each).
# Action: actions_joint_base_torso_head_arm_hand (49-D, horizon 32).
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand
  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8
  domains:
    - rby1
  shared_obs_keys:
    - front_img_1
  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
  stem_specs:
    rby1:
      state_robot0_joint_pos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 22
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.8
          noise_std: 0.01
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_left_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.7
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_right_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.7
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    rby1:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 32
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 49
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 49
        act_seq: 32
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.RandomResizedCrop
        size: 224
        scale: [0.60, 1.0]   # crop side 173-224 px (removes ~0-50 px), square
        ratio: [1.0, 1.0]
        antialias: true
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1.0e-5
