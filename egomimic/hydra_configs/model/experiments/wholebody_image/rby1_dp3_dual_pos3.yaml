# ABLATION pos3: eef POSITION only (3-D, no orientation) -- attributes rot6d's value.
# DUAL-STREAM DP3 (human corpus): GLOBAL glass cloud (nav) + LOCAL eef-frame ball
# cloud (manip), separate DP3 encoders/stems, + right-eef pose (pos+rot6d) in glass
# frame as proprio (dropout 0.9 like all retarget-derived proprio). UMI-style
# local/global decomposition; targets the missed-grasp / phase-confusion failures.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  manip_base_disp_thresh: 0.05   # m of GT-chunk base |dx|+|dy| below which a val sample is "manip phase"
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand
  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 4
  domains:
    - rby1
  shared_obs_keys:
    - front_pcd_1
    - front_pcd_2
  shared_stem_specs:
    front_pcd_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
    front_pcd_2:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
  stem_specs:
    rby1:
      state_robot0_joint_pos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 22
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0    # clamp normalized proprio (train+eval); guards near-static joints
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_eef_pos_glass:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 3
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_left_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_right_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    rby1:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 32
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 49
      loss_block_slices:   # diagnostic per-block train losses (normalized flow-MSE)
        base: [0, 3]
        torso: [3, 9]
        head: [9, 11]
        l_arm: [11, 18]
        r_arm: [18, 25]
        l_hand: [25, 37]
        r_hand: [37, 49]
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 49
        act_seq: 32
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
  encoder_specs:
    front_pcd_1:
      _target_: egomimic.models.dp3_encoder.DP3PointNetEncoder
      output_dim: 256
      num_points: 1024
      use_layernorm: true       # DP3 default
      final_norm: layernorm     # DP3 default
      # Cloud-space augmentation (train only; eval deterministic). Same magnitudes
      # as the Adapt3R jitter run; 5% scale-analog via pose+noise, dropout adds
      # occlusion robustness (DP3 clouds vary in coverage frame to frame).
      pose_jitter_deg: 5.0
      pose_jitter_m: 0.02
      point_noise_std_m: 0.015
      point_dropout: 0.1
    front_pcd_2:
      _target_: egomimic.models.dp3_encoder.DP3PointNetEncoder
      output_dim: 256
      num_points: 1024
      use_layernorm: true       # DP3 default
      final_norm: layernorm     # DP3 default
      # Cloud-space augmentation (train only; eval deterministic). Same magnitudes
      # as the Adapt3R jitter run; 5% scale-analog via pose+noise, dropout adds
      # occlusion robustness (DP3 clouds vary in coverage frame to frame).
      pose_jitter_deg: 5.0
      pose_jitter_m: 0.02
      point_noise_std_m: 0.015
      point_dropout: 0.1
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []   # identity: "image" key is a flattened point cloud, not an image
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 2000
  eta_min: 1.0e-5
