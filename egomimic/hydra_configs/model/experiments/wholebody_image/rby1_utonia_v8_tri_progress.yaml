# 2026-10-28 (user: frozen point transformer version of the cart policy, gaze crop 1 m, 2048 points, trained on Skynet):
# rby1_dp3c_v8_tri_progress with the three DP3 PointNet encoders replaced by the pretrained Utonia Tiny PTv3, frozen
# (egomimic/models/utonia_encoder.py from egoverse-5f's EgoVerse-utonia; whole-cloud attention). Stems, trunk, head, optimizer unchanged.
# 10-27 PROGRESS variant (user: walk-up and just-closed look alike -> the policy predicts its task progress as a 50th action dimension and
# gets the remembered progress back as an input, state_progress): = rby1_dp3c_v8_tri + that stem + a 50-D head. Nothing else differs.
# r1_rs_tri (user 10-15): rby1_dp3c_v8 + front_pcd_3 (left-eef ball, left-eef frame; stem and encoder = front_pcd_2's). Nothing else differs.
# MY BET (2026-08-20): dp3c_dual -- DUAL COLOURED point clouds + eef pose.
# Global xyzrgb glass cloud (nav, colour landmarks) + local xyzrgb EEF-frame ball
# (manip, object identity at the hand) + eef pose proprio. Embodiment colour-
# excision: rgb neutralized within 0.30 m of either eef (appearance gap removed,
# geometry kept). Colour = per-point albedo (viewpoint-independent), NOT frozen
# image features -- the colour-ceiling result does not apply to from-scratch
# PointNet input.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  manip_base_disp_thresh: 0.05   # m of GT-chunk base |dx|+|dy| below which a val sample is "manip phase"
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand_progress
  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 4
  domains:
    - rby1
  shared_obs_keys:
    - front_pcd_1
    - front_pcd_2
    - front_pcd_3
  shared_stem_specs:
    front_pcd_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
    front_pcd_2:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
    front_pcd_3:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256
  stem_specs:
    rby1:
      state_robot0_joint_pos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 22
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0    # clamp normalized proprio (train+eval); guards near-static joints
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_eef_pose_glass:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 9
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_left_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_hand_right_qpos:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.9
          noise_std_raw: 0.03
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_progress:   # 10-27: the remembered task progress (0 -> 1); train = the true progress + 0.1 noise, deploy = the client's
                        # forward-only estimate from the policy's own predicted progress (50th action dim)
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 1
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.1
          noise_std_raw: 0.1
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    rby1:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 64
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 50
      loss_block_slices:   # diagnostic per-block train losses (normalized flow-MSE)
        base: [0, 3]
        torso: [3, 9]
        head: [9, 11]
        l_arm: [11, 18]
        r_arm: [18, 25]
        l_hand: [25, 37]
        r_hand: [37, 49]
        progress: [49, 50]
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 50
        act_seq: 64
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
  encoder_specs:
    front_pcd_1:
      _target_: egomimic.models.utonia_encoder.UtoniaPointEncoder
      output_dim: 256
      num_points: 2048           # checked per batch
      in_dim: 6                 # xyzrgb coloured points (robot glass frame; 1 m gaze ball, 2048 points)
      ckpt_path: ${oc.env:UTONIA_CKPT_DIR}/utonia_tiny.pth
      num_groups: 16            # tokens per cloud (FPS centres)
      group_size: 64            # nearest points pooled per token
      hidden: 256
      coord_scale: 1.0
      grid_size: 0.01
      input_rotation: none
      concat_levels: 4          # all pooling levels concatenated back to the points
      finetune_stages: []       # [] = frozen backbone
      backbone_lr: null
      backbone_dtype: fp16      # frozen backbone: fp16 autocast (egoverse-5f)
      enc_patch_size: 2048      # one attention window per 2048-point cloud (pretraining windows: 1024)
      # same train-only cloud augmentation as rby1_dp3c_v8_tri (colour jitter 0.4 / 0.1 from the training command)
      pose_jitter_deg: 5.0
      pose_jitter_m: 0.02
      point_noise_std_m: 0.015
    front_pcd_2:
      _target_: egomimic.models.utonia_encoder.UtoniaPointEncoder
      output_dim: 256
      num_points: 1024           # checked per batch
      in_dim: 6                 # xyzrgb coloured points (right-eef frame)
      ckpt_path: ${oc.env:UTONIA_CKPT_DIR}/utonia_tiny.pth
      num_groups: 16            # tokens per cloud (FPS centres)
      group_size: 64            # nearest points pooled per token
      hidden: 256
      coord_scale: 1.0
      grid_size: 0.01
      input_rotation: none
      concat_levels: 4          # all pooling levels concatenated back to the points
      finetune_stages: []       # [] = frozen backbone
      backbone_lr: null
      backbone_dtype: fp16      # frozen backbone: fp16 autocast (egoverse-5f)
      # same train-only cloud augmentation as rby1_dp3c_v8_tri (colour jitter 0.4 / 0.1 from the training command)
      pose_jitter_deg: 5.0
      pose_jitter_m: 0.02
      point_noise_std_m: 0.015
    front_pcd_3:
      _target_: egomimic.models.utonia_encoder.UtoniaPointEncoder
      output_dim: 256
      num_points: 1024           # checked per batch
      in_dim: 6                 # xyzrgb coloured points (left-eef frame)
      ckpt_path: ${oc.env:UTONIA_CKPT_DIR}/utonia_tiny.pth
      num_groups: 16            # tokens per cloud (FPS centres)
      group_size: 64            # nearest points pooled per token
      hidden: 256
      coord_scale: 1.0
      grid_size: 0.01
      input_rotation: none
      concat_levels: 4          # all pooling levels concatenated back to the points
      finetune_stages: []       # [] = frozen backbone
      backbone_lr: null
      backbone_dtype: fp16      # frozen backbone: fp16 autocast (egoverse-5f)
      # same train-only cloud augmentation as rby1_dp3c_v8_tri (colour jitter 0.4 / 0.1 from the training command)
      pose_jitter_deg: 5.0
      pose_jitter_m: 0.02
      point_noise_std_m: 0.015
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []   # identity: "image" key is a flattened point cloud, not an image
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 2000
  eta_min: 1.0e-5
