# 10-21 LOW-DIM SCREEN S2 'objects only': rby1_lowdim_objpose with the four robot-state stems removed (state_object_poses_body
# is the only input; the schematic still lists the proprio keys, which are then normalised and ignored). Decisive shortcut test.
# 10-20 LOW-DIM DEBUG policy (user: "start v8 w/ low dim policies first to debug policy ... input pose output actions"):
# rby1_dp3c_v8_tri with the three point-cloud streams removed (no shared stems, no DP3 encoders) and one privileged input,
# state_object_poses_body (30). Proprio stems = the cloud policy's four with the n010 recipe's dropout 0.1 / noise 0.003
# (set here instead of on the command line); trunk, flow head (h=64), optimizer, scheduler unchanged.
# r1_rs_tri (user 10-15): rby1_dp3c_v8 + front_pcd_3 (left-eef ball, left-eef frame; stem and encoder = front_pcd_2's). Nothing else differs.
# MY BET (2026-08-20): dp3c_dual -- DUAL COLOURED point clouds + eef pose.
# Global xyzrgb glass cloud (nav, colour landmarks) + local xyzrgb EEF-frame ball
# (manip, object identity at the hand) + eef pose proprio. Embodiment colour-
# excision: rgb neutralized within 0.30 m of either eef (appearance gap removed,
# geometry kept). Colour = per-point albedo (viewpoint-independent), NOT frozen
# image features -- the colour-ceiling result does not apply to from-scratch
# PointNet input.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data_schematic}
  diffusion: true
  6dof: true
  manip_base_disp_thresh: 0.05   # m of GT-chunk base |dx|+|dy| below which a val sample is "manip phase"
  ac_keys:
    rby1: actions_joint_base_torso_head_arm_hand
  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch
  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 4
  domains:
    - rby1
  stem_specs:
    rby1:
      state_object_poses_body:   # cup xyz+rot6 | ball xyz | bowl xyz+rot6 | pad xyz+rot6 in the base frame (sim_policy/objpose.py)
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 30
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          proprio_dropout_p: 0.1
          noise_std_raw: 0.003
          proprio_clamp: 3.0
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    rby1:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 64
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        rby1: 49
      loss_block_slices:   # diagnostic per-block train losses (normalized flow-MSE)
        base: [0, 3]
        torso: [3, 9]
        head: [9, 11]
        l_arm: [11, 18]
        r_arm: [18, 25]
        l_hand: [25, 37]
        r_hand: [37, 49]
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 49
        act_seq: 64
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
  encoder_specs: {}   # no camera / point-cloud inputs
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []   # identity: "image" key is a flattened point cloud, not an image
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 2000
  eta_min: 1.0e-5
