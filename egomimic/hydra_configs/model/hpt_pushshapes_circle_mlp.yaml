_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  # Regression variant of hpt_pushshapes_circle.
  # - diffusion: false so hpt.py:666 does NOT wrap features into a (features, domain)
  #   tuple (which FMPolicy expects). MLPPolicyHead just takes raw features.
  # - head is MLPPolicyHead: trunk emits (B, 32, embed_dim) action tokens,
  #   the MLP maps embed_dim -> action_dim per token. Direct L1/MSE regression
  #   on actions, no flow-matching sampling.

  camera_transforms: null

  diffusion: false
  6dof: false

  ac_keys:
    pushshapes_sim: "actions"

  trunk:
    embed_dim: 128
    num_blocks: 6
    num_heads: 4
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8

  domains: ["pushshapes_sim"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 128
      output_dim: 128
      widths: [128]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 4
          crossattn_dim_head: 32
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 128

  stem_specs:
    pushshapes_sim:
      state_agent_obj:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 5
        output_dim: 128
        widths: [128]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 128

  head_specs:
    pushshapes_sim:
      _target_: egomimic.models.hpt_nets.MLPPolicyHead
      input_dim: 128       # = trunk.embed_dim (per-token feature size)
      output_dim: 2        # = action_dim for pushshapes_sim (x, y)
      widths: [128, 128]
      dropout: false
      ln: true
      tanh_end: false

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 128

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
