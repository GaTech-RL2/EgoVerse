defaults:
  - hpt_cotrain_enc_dec_base

robomimic_model:
  ac_keys:
    eva_bimanual: "actions_cartesian"
    human_bimanual: "actions_cartesian"
  shared_ac_key: "actions_cartesian"

  6dof: true
  diffusion: true
  
  # Shared head: every embodiment's actions are zero-padded to action_width, so
  # the per-embodiment action widths inherited from the base follow it.
  dims:
    # eva cartesian_6d is 20-D; the human 18-D action zero-pads up to it.
    action_width: 20
    eva_bimanual:
      action: ${model.robomimic_model.dims.action_width}
    human_bimanual:
      action: ${model.robomimic_model.dims.action_width}

  head_specs:
    human_bimanual: null
    eva_bimanual: null
    shared:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      padding: "zero"
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: ${model.robomimic_model.dims.eva_bimanual.action}
        human_bimanual: ${model.robomimic_model.dims.human_bimanual.action}
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: ${model.robomimic_model.dims.action_width}
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4 
        mlp_ratio: 4

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1e-5
