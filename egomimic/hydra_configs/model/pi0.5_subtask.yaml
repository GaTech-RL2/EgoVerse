defaults:
  - pi0.5_cotrain_eva_aria_6d
  - _self_

# PI0.5 with hierarchical subtask prediction (sort regime). The model conditions
# on the HIGH-level sort instruction and predicts the LOW-level pick-and-place
# instruction as language tokens (auxiliary cross-entropy), in addition to the
# action flow-matching loss. At inference the subtask is decoded
# autoregressively and the action expert is conditioned on the realized
# [high + subtask] prefix. See egomimic/models/pi0_subtask.py and
# egomimic/algo/pi.py.
#
# Pair with data config `sort_pi_subtask` / `sort_pp_subtask_6d` (role-named
# annotation arrays annotations_task / annotations_subtask, fetched
# automatically by ZarrDataset).
# LR schedule override (2026-07-12): the inherited pi0.5_base cosine hits LR=0
# at 60k steps (= epoch 600 at 100 steps/epoch) and stays there — everything
# after is dead compute. Replace with a min-LR cosine ending at 100k steps
# (= epoch 1000): decay to 10% of peak (3e-6 at lr=3e-5) and hold. Pair with
# trainer.max_epochs=1000. LambdaLR-based so a mid-run checkpoint resume keeps
# THIS schedule (see warmup_then_cosine_min_lr docstring).
scheduler:
  _target_: egomimic.utils.scheduler_utils.warmup_then_cosine_min_lr
  _partial_: true
  num_warmup_steps: 2000
  num_training_steps: 100000
  min_lr_rate: 0.1

robomimic_model:
  subtask_prediction: true
  # Role-named annotation keys: the task instruction (sort goal / pick_place
  # instruction) conditions the model; the subtask decomposition is the
  # prediction target. Sampled per frame by the processor (no cross-role
  # fallback; eva carries an identical task/subtask copy, kept textually
  # identical by tie_identical).
  annotation_processor:
    _target_: egomimic.rldb.annotation_processing.SubtaskAnnotationProcessor
    task_key: "annotations_task"
    subtask_key: "annotations_subtask"
    strategy: "random"
    tie_identical: true
  subtask_anchor: "Subtask: "
  # Relative weight of the subtask CE loss vs. the action flow-matching loss.
  subtask_loss_weight: 1.0
  # Max autoregressively-decoded subtask length (tokens) at inference.
  max_subtask_len: 48
  # Toggle whether the action expert may attend the "Task: <instruction>"
  # tokens (+ the "Subtask:" anchor). false -> those tokens are masked from the
  # suffix rows only; the action expert STILL sees all obs — images and the
  # Embodiment/Control-mode/State proprio blocks — plus the predicted subtask,
  # and the subtask LM head still conditions on the instruction. true
  # reproduces prior behavior exactly (no gate is even computed). Note this is
  # an attention-level ablation, not an information bottleneck: instruction
  # info can still reach the suffix indirectly through image/subtask hidden
  # states (they attend the instruction in the shared prefix forward).
  action_expert_sees_lang: true
