# BC-RNN-HNET-CHUNK32-QUERIES (the bcrnnHnetC32Q_nc3 run): the H-Net CHUNK32 recipe
# (obs_stride=32/chunk_len=32 on the REAL dynamic-chunking H-Net core) with ONE
# change vs a LINEAR _hnet_chunk32 -- the chunk readout is an ACT/HPT-style
# ACTION-QUERY DECODER (chunk_head: queries) instead of the flat wide-linear
# gmm_head projection. CORE STAYS H-Net (HNetCore, d_model=256); the query
# decoder only changes the readout shape, never the core.
#
# WHAT CHANGES (readout only):
#   linear  (_hnet_chunk32): each obs-step feature h_k -> Linear(256 -> 32*per_step)
#       -> 32 independent GMMs (32 disjoint slices of one projection of the SAME h_k).
#   queries (this):   32 LEARNABLE query embeddings refined by a small decoder
#       (self-attn among queries + causal cross-attn over h_0..h_k), then a SHARED
#       Linear(256 -> per_step) maps each refined query to its GMM params.
# extends bc_rnn_pushshapes_paperexact_hnet_chunk8 (obs_stride/chunk_len delta to
# 32 set directly here so this leaf is self-contained).
defaults:
  - bc_rnn_pushshapes_paperexact_hnet_chunk8
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (override the chunk8 base to 32).
  obs_stride: 32
  chunk_len: 32
  # CHUNK READOUT SWAP (the ONLY deviation from a LINEAR _hnet_chunk32):
  # ACT/HPT-style action-query decoder instead of the flat wide-linear projection.
  chunk_head: queries

  # ACTION-QUERY DECODER (the readout for chunk_head: queries). Refines chunk_len
  # learnable queries via self-attn(queries) + causal cross-attn over the H-Net's
  # per-obs-step features h_0..h_k, then a SHARED projection maps each refined
  # query to per_step GMM params. d_model interpolates the H-NET core d_model (256).
  query_decoder:
    _target_: egomimic.models.bc_rnn_nets.QueryActionDecoder
    d_model: ${..core_net.d_model}   # = HNetCore.d_model 256 (the features it cross-attends)
    chunk_len: ${..chunk_len}        # MUST match robomimic_model.chunk_len (= 32)
    per_step: 25              # = gmm_head num_modes*(2*action_dim+1) = 5*(2*2+1)
    n_layers: 1               # 1 decoder block
    n_heads: 8                # 256 / 8 = 32 dim/head
    ff_mult: 4                # FF hidden = 4*256 = 1024
    dropout: 0.0              # match the core (paper-exact dropout 0)
    max_window: ${..rnn_horizon}  # inherits the ONE window number

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 32)
