# BC-RNN-TRANSFORMER, warmup->cosine LR variant. Identical to
# bc_rnn_pushshapes_paperexact_tx (paper-exact recipe + TransformerCore swap,
# all from _bcrnn_paperexact_tx_common) except the scheduler is warmup->cosine
# instead of constant (the smooth-loss variant; vault default for non-replica runs).
defaults:
  - _bcrnn_paperexact_tx_common
  - _self_

# Horizon in OPTIMIZER STEPS: 1800 epochs x 50 batches = 90,000.
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 90000
  warmup_steps: 4500  # 5% warmup
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
