defaults:
  - hpt_bc_flow_eve_right_arm

robomimic_model:
  camera_transforms:
    eve_right_arm:
      _target_: egomimic.utils.egomimicUtils.CameraTransforms
      intrinsics_key: "base"
      extrinsics_key: "x5Dec13_2"
    aria_right_arm:
      _target_: egomimic.utils.egomimicUtils.CameraTransforms
      intrinsics_key: "base"
      extrinsics_key: "x5Dec13_2"

  ac_keys:
    eve_right_arm: "actions_cartesian"
    aria_right_arm: "actions_cartesian"
  auxiliary_ac_keys:
    eve_right_arm: ["actions_joints"]
    # aria has no joints; auxiliary not set

  domains: ["eve_right_arm", "aria_right_arm"]
  shared_obs_keys: ["front_img_1"]

  # eve_right_arm stem_specs inherited from hpt_bc_flow_eve_right_arm.
  # Add aria_right_arm stem_specs (cartesian only, no joints, no wrist cams).
  stem_specs:
    aria_right_arm:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 6                              # aria right_arm: 6D headframe ee_pose
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    aria_right_arm:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        aria_right_arm: 6
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 6
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
