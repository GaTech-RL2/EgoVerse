# 300M-parameter time-indexed cotrain model.
# ABC fold tasks (yam_bimanual) + mecka (human_bimanual).
#
# Scaled from hpt_abc_mecka_cotrain_flow_shared_head_* using the widths in
# hpt_bc_flow_mecka_300M.yaml (branch aniketh/hpt-run-configs) as the reference
# recipe: embed_dim 840, 24 trunk blocks, 10 heads, cross-attn 18 latents x 10
# heads x 140 dim_head, head hidden_dim 320 / 5 heads / mlp 5x5.
#
# embed_dim is the SHARED BUS WIDTH. Every stem in/out, every cross_attn
# modality_embed_dim, every encoder output and the head cond_dim must move with
# it or the graph will not connect. The only widths that stay fixed are the ones
# set by the DATA: proprio input_dim 14 and act_dim 14
# ([xyz(3) ypr(3) grip(1)] x 2).
defaults:
  - hpt_cotrain_enc_dec_base

robomimic_model:
  domains: ["yam_bimanual", "human_bimanual"]

  ac_keys:
    yam_bimanual: "actions_cartesian"
    human_bimanual: "actions_cartesian"
  shared_ac_key: "actions_cartesian"

  camera_transforms: {}

  6dof: true
  diffusion: true

  trunk:
    embed_dim: 840
    # 19, not the reference's 24. The reference recipe is a SINGLE-domain,
    # single-camera BC model; this cotrain carries three 840-wide ResNet
    # encoders, two domains' stems and a wider shared head, so at 24 blocks it
    # measures 341.9M. Trunk blocks cost ~8.48M each here, so 19 lands at
    # 299.5M -- verified by instantiating the model and counting parameters,
    # not estimated.
    num_blocks: 19
    num_heads: 10
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
      front_img_1:
        _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
        input_dim: 840
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840

  stem_specs:
    yam_bimanual:
      state_ee_pose:
        _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
        input_dim: 14
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
      left_wrist_img:
        _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
        input_dim: 840
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
      right_wrist_img:
        _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
        input_dim: 840
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
    human_bimanual:
      state_ee_pose:
        _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
        input_dim: 14
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
    # Not in `domains`, so never built; nulled so the 256-wide leftovers from
    # hpt_cotrain_enc_dec_base cannot be mistaken for live config.
    eva_bimanual: null

  head_specs:
    human_bimanual: null
    yam_bimanual: null
    eva_bimanual: null
    shared:
      _target_: egomimic.models.heads.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      padding: "zero"
      time_dist: "beta"
      infer_ac_dims:
        yam_bimanual: 14
        human_bimanual: 14
      model:
        _target_: egomimic.models.diffusion.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 840
        hidden_dim: 320
        act_dim: 14
        act_seq: 100
        n_heads: 5
        dropout: 0.1
        mlp_layers: 5
        mlp_ratio: 5

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.stems.hpt_stems.ResNet
      output_dim: 840
      num_of_copy: 1
    right_wrist_img:
      _target_: egomimic.models.stems.hpt_stems.ResNet
      output_dim: 840
      num_of_copy: 1
    left_wrist_img:
      _target_: egomimic.models.stems.hpt_stems.ResNet
      output_dim: 840
      num_of_copy: 1

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  # Constant 1e-4 (no decay), between the 300M reference's 1e-5 and the 3e-4 the
  # small cotrain runs use.
  lr: 1e-4
  weight_decay: 0.0001

# Constant LR at 1e-4 -- no scheduler (pl_model.configure_optimizers skips
# scheduling when `scheduler` is absent/null).
scheduler: null
