# Diffusion Policy over arc-length tokens for YAM bimanual cartesian actions.
#
# Arc tokenization happens loader-side (action_mode: arc_tokenizer_cartesian in
# the data config's transform_list), so `actions_cartesian` arrives as an
# (M+1, 14) arc token rather than a time-indexed chunk. ActionTargetBuilder
# passes it straight through as `target`; the diffusion stages model tokens.
#
# The ArcTokenizeStage / ArcDetokenizeStage in stages_arc.py are Planar-specific
# (native_action_dim in {2,3,4}) and are NOT used here.
#
# The only structural difference from abc/yam_bimanual_dp is action_horizon,
# which is driven by abc.arc_token_rows (M+1 = 101) in the experiment YAML
# rather than abc.action_horizon (16).
_target_: egomimic.pl_utils.pl_model.ModelWrapper

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: observations.images.front_img_1
        ee_pose: observations.state.ee_pose
      encoder: ${abc.encoder}
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
      action_key: actions_cartesian
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
      action_horizon: ${abc.arc_token_rows}
      action_dim: ${abc.action_dim}
      noise_scheduler: &abc_arc_scheduler
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
      action_horizon: ${abc.arc_token_rows}
      action_dim: ${abc.action_dim}
      condition_input_dim: ${abc.condition_dim}
      policy:
        _target_: egomimic.models.diffusion_policy.DiffusionPolicy
        action_horizon: ${abc.arc_token_rows}
        num_inference_steps: 100
        model:
          _target_: egomimic.models.denoising_nets.ConditionalUnet1D
          input_dim: ${abc.action_dim}
          cond_dim: ${abc.condition_dim}
          ac_latent_seq: 1
          diffusion_step_embed_dim: 256
          down_dims: [256, 512, 1024]
          kernel_size: 3
        noise_scheduler: *abc_arc_scheduler
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-6
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 500
  warmup_start_factor: 1.0e-8
  eta_min: 0.0
