# Behavior-Prompting Diffusion Transformer (BPP) with whole-episode prompts
# (prompt.mode: episode_pair). Same policy stack as bpp_prompt_dit.yaml; the
# prompt is built by EpisodePromptMultiDataset (data/bpp_folding_clothes.yaml)
# from another episode of the same (task, operator) group, one chunk per
# second. See docs/2026-09-02_bpp_episode_prompting.md.
#
# Translated nearly verbatim from behavior_prompting's
#   train_network/config/model/diffusion_transformer_base.yaml
#   train_network/config/model/obs_encoder/pair_prompt_encoder.yaml
# with shape_meta generated here from our human cartesian data config
# (data/bpp_overfit_test.yaml, data/mecka.yaml, data/human.yaml). Human
# batches carry one front camera and a 18-dim state/action
# ([left xyz+rot6d, right xyz+rot6d] in the head frame, no gripper;
# Human transform mode `cartesian_rot6d`).
# See docs/2026-09-02_bpp_algo_option.md.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.bpp.BPP
  camera_transforms: {}

  ac_keys:
    human_bimanual: "actions_cartesian"

  # Prompt sampling. episode_pair: the dataset attaches a whole-episode prompt
  # from the same (task, operator) group; the adapter renames keys, resizes
  # frames and applies content dropout.
  prompt:
    mode: episode_pair
    p_drop_prompt: 0.0

  # BPP-convention shape_meta. Keys are our short batch names (the adapter
  # maps "observations.images.front_img_1" -> "front_img_1" and
  # "observations.state.ee_pose" -> "state_ee_pose"). Horizons match what
  # MultiDataset actually emits (single current frame per obs key).
  shape_meta:
    image_resolution: 224
    # 1 Hz prompt chunks on 30 fps data (the original's convention: chunk 20
    # at 20 Hz). The data config interpolates this value.
    prompt_chunk_n_actions: 30
    # Longest demo of the chosen task in raw frames (sizes the prompt
    # positional table; episodes longer than this fail at dataset build).
    # cup_on_saucer: 450 (14.8 s). fold_clothes: 750 (24.2 s).
    max_sequence_length: 450
    # Prompt chunks are already full (the dataset repeats the last frame past
    # the episode end), so this is unused in episode_pair mode.
    pad_end_prompt_actions: repeat
    use_prompting: true
    action:
      shape: [18]
      horizon: 100
    obs:
      front_img_1:
        shape: [3, 224, 224]
        horizon: 1
        type: rgb
        ignore_by_policy: false
        include_in_receding_obs: true
        include_in_prompt_current_obs: true
        prompt_type: observation
      state_ee_pose:
        shape: [18]
        horizon: 1
        type: low_dim
        ignore_by_policy: false
        include_in_receding_obs: true
        include_in_prompt_current_obs: true
        prompt_type: proprioception

  policy:
    _target_: behavior_prompting.train_network.policy.diffusion_transformer_policy.DiffusionTransformerPolicy
    shape_meta: ${model.robomimic_model.shape_meta}
    n_emb: 768

    noise_scheduler:
      _target_: diffusers.DDIMScheduler
      num_train_timesteps: 50
      beta_start: 0.0001
      beta_end: 0.02
      beta_schedule: squaredcos_cap_v2
      clip_sample: True
      set_alpha_to_one: True
      steps_offset: 0
      prediction_type: epsilon

    num_inference_steps: 16
    input_pertub: 0.1
    diffusion_decoder_n_layer: 7
    diffusion_decoder_n_head: 8
    diffusion_encoder_enabled: False
    diffusion_encoder_n_layer: 4
    diffusion_encoder_n_head: 8
    p_drop_attn: 0.1

    obs_encoder:
      _target_: behavior_prompting.train_network.model.prompt.prompt_obs_encoder.PairPromptObsEncoder
      shape_meta: ${model.robomimic_model.shape_meta}
      obs_encoder:
        _target_: behavior_prompting.train_network.model.prompt.prompt_obs_encoder.PairPromptTransformerTokenizer
        shape_meta: ${model.robomimic_model.shape_meta}
        separate_prompt_and_receding_obs_encoders: False
        obs_encoder:
          _target_: behavior_prompting.train_network.model.vision.transformer_obs_encoder.TransformerObsEncoder
          shape_meta: ${model.robomimic_model.shape_meta}
          global_pool: ""
          n_emb: 768
          model_name: "vit_base_patch16_clip_224.openai"
          pretrained: True
          frozen: False
          feature_aggregation: cls
          downsample_ratio: 32
          # Image geometry/augmentation is owned by the algo-level
          # train/eval_image_augs below — keep these null so frames are never
          # doubly augmented. CLIP mean/std still applied via use_vision_norm.
          train_image_transforms: null
          non_prompt_train_image_transforms: null
          eval_image_transforms: null
          use_group_norm: True
          share_rgb_model: False
          use_vision_norm: True
          concat_time_dimension: False
        n_emb: 768
        concat_prompt_and_receding: False
        only_use_last_step_of_prompt: False
        cut_first_n_steps_of_prompt: 0
        ignore_prompt_obs: False
        ignore_prompt_proprio: False
        ignore_prompt_action: False
        merge_prompt_tokens: obs_and_action # none, obs, obs_and_action
        use_pool_modality_pos_embed: true
        prompt_attention_pool:
          _target_: timm.layers.AttentionPoolLatent
          in_features: 768
          num_heads: 8
          mlp_ratio: 4.0
          pool_type: "token"
      prompt_encoder_enabled: False
      prompt_encoder_n_layer: 6
      prompt_encoder_n_head: 8
      prompt_with_obs_decoder_enabled: True
      prompt_with_obs_decoder_n_layer: 6
      prompt_with_obs_decoder_n_head: 8
      ignore_prompt: False
      flatten_output: False
      n_emb: 768
      p_drop_attn: 0.1
      p_drop_prompt_tokens: 0.0
      use_attention_sink: False
      num_attention_sink_tokens: 4

  # Resize to the CLIP ViT's 224x224 + BPP's UMI color jitter. No Normalize:
  # the policy applies CLIP mean/std internally (use_vision_norm: True).
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
        antialias: true
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
        antialias: true

# BPP's UMI diffusion-transformer training hyperparameters.
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-5
  weight_decay: 1e-6
  betas: [0.95, 0.999]

scheduler:
  # Linear warmup then flat LR. LinearLR ramps lr from start_factor*lr to lr
  # over total_iters and holds it there. 1500 steps is 5 % of the 30k-step
  # ablation runs, matching BPP's own `lr_warmup_proportion: 0.05`.
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 0.01
  end_factor: 1.0
  total_iters: 1500
