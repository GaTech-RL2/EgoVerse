# BC-RNN with the recurrent core swapped LSTM -> the real hierarchical dynamic-
# chunking H-Net (core: hnet). The full paper-exact payload comes from
# _bcrnn_paperexact_common; this leaf supplies the H-Net core (d_model 256,
# n_heads 8, outer 4 / inner 6), the matching gmm_head.d_model, and the
# warmup->cosine schedule (single-knob LSTM/TX/HNet comparison). The ratio/
# compression aux is INERT in BC-RNN (chunk length is driven by obs-embedding
# cos-sim dynamics, not the ratio loss).
defaults:
  - _bcrnn_paperexact_common
  - _self_

robomimic_model:
  # CORE SWAP: the real dynamic-chunking H-Net over the rnn_horizon window.
  core: hnet
  core_net:
    _target_: egomimic.models.cores.hnet_core.HNetCore
    input_dim: 66                  # = obs_encoder concat (64 img + 2 raw)
    d_model: 256                   # H-Net working dim = head input (param-matched)
    n_heads: 8                     # 256 / 8 = 32 dim/head
    d_intermediate: 768            # SwiGLU FFN hidden (3 * d_model)
    outer_layers: 4                # T blocks in EACH of outer encoder + decoder
    inner_layers: 6                # T blocks in the inner ComputeStage
    target_compression_ratio: 2.0  # NO-OP in BC-RNN (ratio aux loss never read)
    ratio_loss_weight: 0.03        # INERT in BC-RNN (kept for a clean single-knob cmp)
    max_window: ${..rnn_horizon}   # inherits the ONE window number
    dropout: 0.0                   # paper-exact LSTM uses dropout 0 -> match
    resid_dropout: 0.0
    rotary_emb_dim: 0              # RoPE off (learned-pos-free; window is short)
    causal: true                   # MUST stay true for train==rollout parity

  gmm_head:
    d_model: 256                   # = core.hidden_dim (no actor MLP)

# Warmup->cosine (pairs single-knob with the TX-cos run).
# Horizon in OPTIMIZER STEPS: 1800 epochs x 50 batches = 90,000.
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 90000
  warmup_steps: 4500  # 5% warmup
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
