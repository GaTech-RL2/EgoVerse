# HNetChunkToken modular policy — PRESET "full HPT-like": every slot set to
# HPT's choice (encoder=resnet pretrained, stem=cross_attn 16 latents,
# readout=action_token, T6 trunk, HPT LR 4e-4). Same modular policy as
# hnet_pushshapes_chunktoken; only the SLOT selections + LR/eta_min differ.
# Shared payload lives in the abstract base; see it for the full slot menu.
# extends _hnet_chunktoken_common
defaults:
  - _hnet_chunktoken_common
  - _self_

robomimic_model:
  # SLOT 1: encoder = HPT's ResNet (pretrained)
  encoder: "resnet"

  # SLOT 2: stem = HPT cross-attention (16 latents)
  stem: "cross_attn"

  # SLOT 3: trunk
  arch_layout: "T6"           # 6 blocks, matching HPT trunk depth

  # SLOT 4: readout = HPT action-token query readout
  readout: "action_token"

optimizer:
  lr: 4e-4                     # HPT's LR

scheduler:
  eta_min: 4.0e-6
