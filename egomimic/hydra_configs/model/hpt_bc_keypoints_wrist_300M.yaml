# HPT_BC_KEYPOINTS_WRIST_300M: hpt_bc_mecka_6d_300M (300M widths, frozen Qwen
# text stem, constant LR 5e-5) on the 144-D wrist-frame MANO keypoint action:
# per hand [wrist xyz+rot6d in its own wrist frame (9) | 21 keypoints in that
# wrist frame (63)] x {left, right}. Proprio: the 144-D
# `observations.state.keypoints` (wrist pose in head frame + keypoints in wrist
# frame, per hand) through a `state_keypoints` stem in place of the parent's
# `state_ee_pose`. Recipes: train_zarr_mecka_kp_wrist_hpt,
# train_zarr_mecka_flagship_kp_hpt.
defaults:
  - hpt_bc_mecka_6d_300M
  - _self_

robomimic_model:
  dims:
    human_bimanual: {proprio: 144, action: 144}
  ac_keys:
    human_bimanual: "actions_keypoints"
  6dof: false

  stem_specs:
    human_bimanual:
      state_ee_pose: null
      state_keypoints:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: ${model.robomimic_model.dims.human_bimanual.proprio}
        output_dim: 840
        widths: [840]
        # Must equal the data config's `proprio_history`; inert at 1.
        history_len: 1
        history_dropout: 0.2
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
