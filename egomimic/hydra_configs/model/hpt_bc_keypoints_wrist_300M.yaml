# HPT_BC_KEYPOINTS_WRIST_300M: ~300M-parameter HPT flow-matching BC on the
# 144-D wrist-frame MANO keypoint action, with a frozen Qwen3-Embedding text
# stem for the task prompt ("300M hpt qwen").
#
# Data: mecka_fold_freeform_opsplit_hpt_keypoints; action `actions_keypoints`,
# per hand [wrist xyz+rot6d in its own wrist frame (9) | 21 keypoints in that
# wrist frame (63)] x {left, right}, quantile-normalized from precomputed
# stats. Inputs: front image (ResNet), the 144-D
# `observations.state.keypoints` (wrist pose in head frame + keypoints in
# wrist frame, per hand), and the sampled annotation through the Qwen
# per-token stem. Drop the text stem with
#   ~model.robomimic_model.shared_stem_specs.annotation model.robomimic_model.shared_obs_keys=[front_img_1]
#
# Widths follow the lab's 300M reference recipe (hpt_bc_flow_mecka_300M.yaml on
# aniketh/hpt-run-configs; also the basis of the arc-E1 300M cotrain configs):
# embed_dim 840, 10 trunk heads, cross-attn 18 latents x 10 heads x 140
# dim_head, head hidden_dim 320 / 5 heads / mlp 5x5. embed_dim is the shared
# bus width: every stem in/out, modality_embed_dim, encoder output and the
# head cond_dim move with it. num_blocks is set so the TRAINABLE count
# (frozen Qwen excluded) lands at ~300M (23 blocks ~= 298M measured on the
# 138-D layout; the 144-D stem/head add < 0.1M).
#
# Constant LR 5e-5, no scheduler (the setting of the mecka_fold_*_300M
# constlr_5e5 ablation whose keypoint arm fit best).
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  camera_transforms: {}
  dims:
    human_bimanual: {proprio: 144, action: 144}
  ac_keys:
    human_bimanual: "actions_keypoints"

  diffusion: true

  # Prompt for the Qwen stem: one annotation sampled per batch item from the
  # `annotations` track (the data config's keymap exposes it).
  annotation_key: "annotations"
  annotation_sampling_mode: "random"
  annotation_modality: "annotation"
  default_prompt: ""

  # Mask the repeat-last padding at every episode / annotation tail out of
  # the action loss (the dataset's `action_pad_mask`).
  use_pad_mask: false

  trunk:
    embed_dim: 840
    num_blocks: 23
    num_heads: 10
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: null
  domains: ["human_bimanual"]
  shared_obs_keys: ["front_img_1", "annotation"]

  head_specs:
    human_bimanual:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        human_bimanual: ${model.robomimic_model.dims.human_bimanual.action}
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 840
        hidden_dim: 320
        act_dim: ${model.robomimic_model.dims.human_bimanual.action}
        act_seq: 100
        n_heads: 5
        dropout: 0.1
        mlp_layers: 5
        mlp_ratio: 5

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 840
      output_dim: 840
      widths: [840]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 18
          crossattn_heads: 10
          crossattn_dim_head: 140
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 840
    annotation:
      _target_: egomimic.models.hpt_nets.QwenPerTokenEncoder
      model_name: "Qwen/Qwen3-Embedding-0.6B"
      max_length: 128
      freeze: true
      dtype: "float16"
      # The frozen encoder's per-token features are cached per unique prompt
      # string (LRU, in memory), so the 600M-parameter forward runs once per
      # annotation instead of once per training step. Ignored when
      # `freeze: false` - a trainable encoder must stay online.
      cache_text_features: true
      text_cache_max_entries: 8192
      output_dim: 840
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 18
          crossattn_heads: 10
          crossattn_dim_head: 140
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 840

  stem_specs:
    human_bimanual:
      state_keypoints:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: ${model.robomimic_model.dims.human_bimanual.proprio}
        output_dim: 840
        widths: [840]
        # Proprio observation history (as hpt_bc_mecka_6d_300M's state_ee_pose
        # stem): K tokens, learned zero-init time-step embedding, whole-past
        # dropout. Must equal the data config's `proprio_history`; inert at 1.
        history_len: 1
        history_dropout: 0.2
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 840
      num_of_copy: 1

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

# LR multiplier for the image encoders' pretrained backbones; 1.0 keeps the
# single optimizer param group (ModelWrapper.configure_optimizers).
backbone_lr_scale: 1.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-5
  weight_decay: 0.0001

scheduler: null
