# Base for the hnet_cotrain_cossim capacity-allocation sweep.
#
# Every variant in this family is this exact 5-stage skeleton with a
# different split of transformer depth between the per-embodiment levels
# (l0/l1) and the shared apex. The six knobs below are the whole sweep;
# variants set them and inherit everything else.
#
# NOTE: outer_stage.hnet.stages is a YAML *list*, and OmegaConf replaces
# lists wholesale on merge -- a variant cannot override one element. That
# is why the knobs are top-level scalars referenced by interpolation
# rather than overridden in place.

# ---- sweep knobs (override these in variants) ----
l0_enc_arch: T1
l0_dec_arch: T1
l1_enc_arch: T1
l1_dec_arch: T1
apex_arch: T12
apex_width: 1024
apex_d_intermediate: 3168
apex_num_heads: 16

_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.PackedAlgoBase
  d_cond: 256
  domains:
  - pushshapes_sim
  - pushshapes_sim_small_circle
  ac_keys:
    pushshapes_sim: actions
    pushshapes_sim_small_circle: actions
  loss:
    _target_: egomimic.algo.hnet.GMMLoss
  outer_stage:
    _target_: egomimic.algo.hnet.HNetOuterStage
    action_dim: 2
    action_horizon: 2560
    d_model: 256
    action_head_type: gmm
    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 256
      output_key: fused_cond
      obs_specs: {}
      img_encoders: {}
    input_modules:
    - _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 256
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.MultiEmbodimentCondEncoder
        encoders:
          pushshapes_sim:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 256
            output_key: fused_cond
            cond_proj_widths:
            - 256
            - 256
            obs_specs:
              state_agent_obj:
                input_dim: 5
                embed_dim: 96
                widths:
                - 192
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 96
                num_kp: 48
                feature_dimension: 96
                pretrained: false
                crop_aug: true
                crop_height: 86
                crop_width: 86
                crop_eval_mode: random
                crop_sample_mode: v02
          pushshapes_sim_small_circle:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 256
            output_key: fused_cond
            cond_proj_widths:
            - 256
            - 256
            obs_specs:
              state_agent_obj:
                input_dim: 5
                embed_dim: 96
                widths:
                - 192
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 96
                num_kp: 48
                feature_dimension: 96
                pretrained: false
                crop_aug: true
                crop_height: 86
                crop_width: 86
                crop_eval_mode: random
                crop_sample_mode: v02
    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
      - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
        sub_stages:
          pushshapes_sim:
            _target_: egomimic.models.hnet.stages.EncoderDecoderStage
            input_hidden_dim: 256
            output_hidden_dim: 256
            cond_key: null
            d_cond: 0
            causal: true
            encoder:
              arch_layout: ${model.l0_enc_arch}
              d_model: 256
              d_intermediate: 768
              num_heads: 4
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
            decoder:
              arch_layout: ${model.l0_dec_arch}
              d_model: 256
              d_intermediate: 768
              num_heads: 4
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
          pushshapes_sim_small_circle:
            _target_: egomimic.models.hnet.stages.EncoderDecoderStage
            input_hidden_dim: 256
            output_hidden_dim: 256
            cond_key: null
            d_cond: 0
            causal: true
            encoder:
              arch_layout: ${model.l0_enc_arch}
              d_model: 256
              d_intermediate: 768
              num_heads: 4
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
            decoder:
              arch_layout: ${model.l0_dec_arch}
              d_model: 256
              d_intermediate: 768
              num_heads: 4
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
      - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
        sub_stages:
          pushshapes_sim:
            _target_: egomimic.models.hnet.stages.ChunkerStage
            input_hidden_dim: 256
            output_hidden_dim: 512
            target_compression_ratio: 3.0
            ratio_loss_weight: 1.0
            cond_key: null
            down_interface: first_token
            up_interface: duplicate
            router_interface: cossim
            grab_prev_end: true
            residual_mixer: mlp
            residual_mixer_kwargs:
              n_layers: 2
            prev_end_combine_n_layers: 3
          pushshapes_sim_small_circle:
            _target_: egomimic.models.hnet.stages.ChunkerStage
            input_hidden_dim: 256
            output_hidden_dim: 512
            target_compression_ratio: 3.0
            ratio_loss_weight: 1.0
            cond_key: null
            down_interface: first_token
            up_interface: duplicate
            router_interface: cossim
            grab_prev_end: true
            residual_mixer: mlp
            residual_mixer_kwargs:
              n_layers: 2
            prev_end_combine_n_layers: 3
      - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
        sub_stages:
          pushshapes_sim:
            _target_: egomimic.models.hnet.stages.EncoderDecoderStage
            input_hidden_dim: 512
            output_hidden_dim: 512
            cond_key: null
            d_cond: 0
            causal: true
            encoder:
              arch_layout: ${model.l1_enc_arch}
              d_model: 512
              d_intermediate: 1536
              num_heads: 8
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
            decoder:
              arch_layout: ${model.l1_dec_arch}
              d_model: 512
              d_intermediate: 1536
              num_heads: 8
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
          pushshapes_sim_small_circle:
            _target_: egomimic.models.hnet.stages.EncoderDecoderStage
            input_hidden_dim: 512
            output_hidden_dim: 512
            cond_key: null
            d_cond: 0
            causal: true
            encoder:
              arch_layout: ${model.l1_enc_arch}
              d_model: 512
              d_intermediate: 1536
              num_heads: 8
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
            decoder:
              arch_layout: ${model.l1_dec_arch}
              d_model: 512
              d_intermediate: 1536
              num_heads: 8
              cond: false
              rotary_emb_dim: 64
              dropout: 0.0
              resid_dropout: 0.0
      - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
        sub_stages:
          pushshapes_sim:
            _target_: egomimic.models.hnet.stages.ChunkerStage
            input_hidden_dim: 512
            output_hidden_dim: ${model.apex_width}
            target_compression_ratio: 3.0
            ratio_loss_weight: 1.0
            cond_key: null
            down_interface: first_token
            up_interface: duplicate
            router_interface: cossim
            grab_prev_end: true
            residual_mixer: mlp
            residual_mixer_kwargs:
              n_layers: 2
            prev_end_combine_n_layers: 3
          pushshapes_sim_small_circle:
            _target_: egomimic.models.hnet.stages.ChunkerStage
            input_hidden_dim: 512
            output_hidden_dim: ${model.apex_width}
            target_compression_ratio: 3.0
            ratio_loss_weight: 1.0
            cond_key: null
            down_interface: first_token
            up_interface: duplicate
            router_interface: cossim
            grab_prev_end: true
            residual_mixer: mlp
            residual_mixer_kwargs:
              n_layers: 2
            prev_end_combine_n_layers: 3
      - _target_: egomimic.models.hnet.stages.ComputeStage
        input_hidden_dim: ${model.apex_width}
        output_hidden_dim: ${model.apex_width}
        cond_key: null
        d_cond: 0
        causal: true
        main_network:
          arch_layout: ${model.apex_arch}
          d_model: ${model.apex_width}
          d_intermediate: ${model.apex_d_intermediate}
          num_heads: ${model.apex_num_heads}
          cond: false
          rotary_emb_dim: 64
          dropout: 0.0
          resid_dropout: 0.0
    gmm_heads:
      pushshapes_sim:
        _target_: egomimic.models.heads.gmm_head.GMMActionHead
        d_model: 256
        action_dim: 2
        num_modes: 32
        chunk_len: 4
        min_std: 0.0001
        std_activation: softplus
        low_noise_eval: true
        head_hidden_dim: 512
        head_n_layers: 3
      pushshapes_sim_small_circle:
        _target_: egomimic.models.heads.gmm_head.GMMActionHead
        d_model: 256
        action_dim: 2
        num_modes: 32
        chunk_len: 4
        min_std: 0.0001
        std_activation: softplus
        low_noise_eval: true
        head_hidden_dim: 512
        head_n_layers: 3
enable_grad_norm: true
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 300000
  warmup_steps: 2000
  warmup_start_factor: 0.1
  eta_min: 1.0e-06
