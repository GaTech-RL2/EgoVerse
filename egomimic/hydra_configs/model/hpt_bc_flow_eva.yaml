# HPT bimanual flow, eva domain (14-dim ee pose + L/R wrist image stems, x5Dec13_2
# extrinsics, lr 1e-4). extends _hpt_bc_flow_bimanual_256.
defaults:
  - _hpt_bc_flow_bimanual_256
  - _self_

robomimic_model:
  camera_transforms:
    eva_bimanual:
      _target_: egomimic.utils.egomimicUtils.CameraTransforms
      intrinsics_key: "base" # change to base_half if using half res
      extrinsics_key: "x5Dec13_2"

  ac_keys:
    eva_bimanual: "actions_cartesian"

  domains: ["eva_bimanual"]

  stem_specs:
    eva_bimanual:
      left_wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      right_wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 14
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    eva_bimanual:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: 14
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 14
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4

  encoder_specs:
    right_wrist_img:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256
    left_wrist_img:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256

optimizer:
  lr: 1e-4
