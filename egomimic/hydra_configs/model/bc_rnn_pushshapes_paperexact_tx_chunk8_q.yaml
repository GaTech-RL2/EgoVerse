_target_: egomimic.pl_utils.pl_model.ModelWrapper

# BC-RNN-TRANSFORMER-CHUNK8-QUERIES — the BC-RNN-TRANSFORMER-CHUNK8 recipe with
# ONE change: the chunk readout is an ACT/HPT-style ACTION-QUERY DECODER instead
# of the flat wide-linear head.
#
# SINGLE-KNOB vs bcrnnTxC8 (bc_rnn_pushshapes_paperexact_tx_chunk8 / job
# 3325097): this file is a byte-for-byte clone of *_tx_chunk8.yaml (same
# TransformerCore d_model=448, same obs encoder, same minmax norm, same
# repeat_unmasked windows, same rnn_horizon=10/max_window=10, same eval crop,
# SAME warmup->cosine LR peak 1e-4, same obs_stride=8/chunk_len=8) with ONLY the
# chunk readout swapped: ``chunk_head: queries`` (+ the ``query_decoder:`` slot).
# So bcrnnTxC8 vs this run isolates the READOUT SHAPE (linear vs action-queries)
# alone — NOT capacity (the query decoder adds ~1-3M params; the comparison is
# readout shape, see the report for the honest param delta).
#
# WHAT CHANGES (readout only):
#   linear  (chunk8): each obs-step feature h_k -> Linear(448 -> 8*per_step) ->
#       8 independent GMMs (8 disjoint slices of one projection of the SAME h_k).
#   queries (this):   8 LEARNABLE query embeddings refined by a small decoder
#       (1-2 blocks) where the queries (a) self-attend among themselves (plan
#       coherence) and (b) cross-attend over the CAUSAL context h_0..h_k (the
#       transformer's per-obs-step features; query at obs-step k sees only h_<=k
#       — at rollout the buffer provides exactly h_0..h_k, so train==rollout by
#       construction). A SHARED Linear(448 -> per_step) maps each refined query
#       to its GMM params (ACT-style; per-query identity = the query embeddings).
#   The 8 GMMs (5 modes each, one 2-d action) are IDENTICAL semantics in both;
#   only how the per-position features are produced differs.
#
# The core lives under the ``lstm:`` slot (kept named ``lstm:`` so the shared
# policy/state_dict plumbing is unchanged); _target_ is TransformerCore and
# ``core: transformer`` guards that the config + algo agree. The decoder lives
# under the ``query_decoder:`` slot; ``chunk_head: queries`` guards it.
#
# Inherited paper settings (unchanged from bc_rnn_pushshapes_paperexact_tx_chunk8):
#  1. actor_layer_dims = ()  -> actor_mlp_dims: [] (decoder reads core.hidden_dim)
#  3. paper-exact obs encoder (raw 2-dim low-dim + ReLU image + no fusion MLP,
#       concat 64+2=66 feeds the core directly)
#  4. eval-time RANDOM crop + v0.2 off-by-one
#  5. window pad = repeat last frame, unmasked NLL (repeat_unmasked); with the
#       chunk axis the per-obs-step target is repeat-padded at episode tails too
#       (last real obs + remaining target actions repeated, counted in the loss).
#  6. fp32 (set in launcher: trainer.precision=32)
#  7. no grad-spike clip (enable_grad_norm: false below)
robomimic_model:
  _target_: egomimic.algo.bc.WindowedBC

  action_dim: 2
  action_horizon: 1024
  rnn_horizon: 10
  max_windows_per_batch: 256
  # actor_layer_dims = () -> empty actor MLP (identity). gmm_head.d_model then
  # equals the core's per-step output width (d_model=448).
  actor_mlp_dims: []
  # repeat-pad window tails (obs AND action) + include pad steps in the NLL with
  # NO mask (robomimic pad_same=True, plain-mean loss).
  pad_mode: repeat_unmasked
  # CORE SWAP: causal-attention transformer over the rnn_horizon window.
  core: transformer
  # OBS STRIDING + ACTION CHUNKING (same as *_tx_chunk8.yaml).
  obs_stride: 8
  chunk_len: 8
  # CHUNK READOUT SWAP (the ONLY deviation from *_tx_chunk8.yaml): ACT/HPT-style
  # action-query decoder instead of the flat wide-linear gmm_head projection.
  chunk_head: queries

  obs_encoder:
    _target_: egomimic.models.stems.obs_encoder.ObsEncoder
    # paper-exact mode -> embed_dim is IGNORED (becomes the concat sum 64+2=66);
    # low-dim raw (no MLP), ReLU on image, no fusion MLP.
    embed_dim: 66
    paper_exact: true
    obs_specs:
      state_agent_obj:
        input_dim: 2
        input_slice: [0, 2]   # agent xy out of the 5-dim state_agent_obj
        embed_dim: 64         # ignored in paper_exact (raw 2-dim fed through)
    img_encoders:
      front_img_1:
        _target_: egomimic.models.stems.visual_core.VisualCore
        in_channels: 3
        image_size: 96
        num_kp: 32
        feature_dimension: 64
        pretrained: false
        # crop 86x86 (round(96*76/84)), random at TRAIN, RANDOM at EVAL too
        # (crop_eval_mode=random), corner sampled via v0.2 off-by-one.
        crop_aug: true
        crop_height: 86
        crop_width: 86
        crop_eval_mode: random
        crop_sample_mode: v02

  # CORE: TransformerCore under the ``lstm:`` slot (the policy treats it
  # polymorphically via the shared .input_dim/.hidden_dim/forward/init_hidden/
  # step interface). input_dim = obs_encoder concat (64 img + 2 raw) = 66.
  core_net:
    _target_: egomimic.models.cores.transformer_core.TransformerCore
    input_dim: 66             # = obs_encoder concat (64 img + 2 raw)
    d_model: 448              # transformer width = head input (param-matched)
    n_layers: 5               # 12.11M core params ~= LSTM(1000)x2 12.28M
    n_heads: 8                # 448 / 8 = 56 dim/head
    ff_mult: 4                # FF hidden = 4*448 = 1792
    dropout: 0.0              # paper-exact LSTM uses dropout 0 -> match
    max_window: ${..rnn_horizon}  # inherits the ONE window number (override only for capacity pre-allocation, e.g. window curriculum)

  # ACTION-QUERY DECODER (the readout for chunk_head: queries). Refines chunk_len
  # learnable queries via self-attn(queries) + causal cross-attn over the
  # transformer's per-obs-step features h_0..h_k, then a SHARED projection maps
  # each refined query to per_step GMM params. d_model MUST equal the core's
  # per-step output width (448, no actor MLP). max_window MUST be >= rnn_horizon.
  query_decoder:
    _target_: egomimic.models.heads.query_decoder.QueryActionDecoder
    d_model: 448              # = core.hidden_dim (the features it cross-attends)
    chunk_len: 8              # MUST match robomimic_model.chunk_len
    per_step: 25              # = gmm_head: num_modes*(2*action_dim+1) = 5*(2*2+1)
    n_layers: 1               # 1 block = 3.24M added params (in the ~1-3M band;
                              # n_layers=2 -> 6.46M -- a one-line config bump).
    n_heads: 8                # 448 / 8 = 56 dim/head
    ff_mult: 4                # FF hidden = 4*448 = 1792
    dropout: 0.0              # match the core (paper-exact dropout 0)
    max_window: ${..rnn_horizon}  # inherits the ONE window number (override only for capacity pre-allocation, e.g. window curriculum)

  gmm_head:
    _target_: egomimic.models.heads.gmm_head.GMMActionHead
    d_model: 448              # = core.hidden_dim (no actor MLP)
    action_dim: 2
    num_modes: 5
    min_std: 1.0e-4
    std_activation: softplus
    low_noise_eval: true
    chunk_len: 8              # MUST match robomimic_model.chunk_len above

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

# disable the MAD-based grad-spike clip (robomimic never clips).
enable_grad_norm: false

# robomimic optimizer: Adam, lr 1e-4, L2=0 (no weight decay), CONSTANT lr.
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0

# Warmup->cosine (the smooth-loss variant; vault default for new transformer
# runs). IDENTICAL to *_tx_chunk8.yaml (peak 1e-4). Horizon in OPTIMIZER STEPS:
# 1800 epochs x 50 batches = 90,000.
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 90000
  warmup_steps: 4500  # 5% warmup
  warmup_start_factor: 0.1
  eta_min: 1.0e-6

# ----- DELIBERATE TASK ADAPTATIONS (kept, identical to paperexact) -----
# * MIN-MAX action normalization (norm_stats.norm_mode=minmax, set in launcher).
#   Fresh full-data stats (sample_frac=1.0, no precomputed path).
# * obs keys = agent xy (slice 0:2) + front_img_1; ar rollout eval path; packed
#   pipeline cut into 10-step (obs-step) windows; obs_stride=8 subsamples obs and
#   chunk_len=8 makes each obs-step predict the next 8 actions (queued at rollout).
#   The ONLY change vs *_tx_chunk8: chunk_head=queries (ACT/HPT action-query
#   decoder readout instead of the flat wide-linear gmm_head projection).
