# HPT_BC_MECKA_6D_300M_QWEN35: hpt_bc_mecka_6d_300M with ONE Qwen 3.5-0.8B VLM
# in place of both the ResNet image encoder and the Qwen3-Embedding text stem.
#
#   1. `Qwen35VLMEncoder` (encoder_specs.front_img_1) runs one joint
#      image+text forward per batch: the frame is resized 640x360 -> 640x352
#      and the prompt follows it in the Qwen chat layout.
#   2. Its VISUAL tokens (220 = 40 x 22 after patch 16 / merge 2) go to the
#      existing image Perceiver stem, now `input_dim: 1024` -> 18 latents.
#   3. Its TEXT tokens (image-conditioned, the LM is causal) are read by
#      `Qwen35TextStem` (shared_stem_specs.annotation) -> proj 1024 -> 840 ->
#      the same masked Perceiver -> 18 latents. The stem holds a plain
#      reference to the encoder, so the VLM weights exist once.
#   4. The VLM is FROZEN and runs in bfloat16 under no_grad (trainable_layers:
#      0; N > 0 unfreezes the last N text layers for the follow-up run).
#   5. Trunk layout is unchanged: 64 action + 18 proprio + 18 image + 18 text
#      = 118 tokens. The ResNet + Qwen-Embedding configs are untouched.
#
# The processor normalizes (and the frames must reach it in [0, 1]), so the
# ImageNet `Normalize` is dropped from BOTH aug lists; training keeps the same
# ColorJitter, eval augments nothing.
#
# Run:
#   python egomimic/trainHydra.py --config-name=train_zarr_mecka_flagship_6d_hpt \
#     data=mecka_fold_flagship_top3_hpt_6d \
#     model=hpt_bc_mecka_6d_300M_qwen35 \
#     norm_stats.precomputed_norm_path=<out>/norm_stats \
#     trainer.gradient_clip_val=100.0
#
# PARAMETER / SEQUENCE CHANGES vs hpt_bc_mecka_6d_300M (measured, see
# docs/hpt-experiments/supervisors/S1/reports/qwen35-vlm.md):
#   - ResNet18 (11.6M trainable) leaves; Qwen3-Embedding-0.6B (595.8M frozen)
#     leaves; Qwen3.5-0.8B (853.0M frozen) arrives.
#   - image stem input 840 -> 1024: 6.1M -> 6.3M (+0.15M).
#   - text projection 1024 -> 840 unchanged (the same 0.86M + Perceiver).
#   - trunk sequence length unchanged at 118; visual tokens 240 -> 220.
defaults:
  - hpt_bc_mecka_6d_300M
  - _self_

robomimic_model:
  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.Qwen35VLMEncoder
      model_name: "Qwen/Qwen3.5-0.8B"
      dtype: "bfloat16"
      freeze: true
      trainable_layers: 0
      feature_layer: -1
      image_size: [352, 640]   # (H, W) -> 220 visual tokens
      max_text_tokens: 128
      # inherited from the ResNet entry and inert here (the VLM's feature width
      # is its own hidden size, and it encodes one view):
      output_dim: null
      num_of_copy: null

  shared_stem_specs:
    front_img_1:
      input_dim: 1024          # Qwen 3.5 hidden size (was the ResNet's 840)
    annotation:
      _target_: egomimic.models.hpt_nets.Qwen35TextStem
      input_dim: 1024
      output_dim: 840
      vlm_modality: front_img_1
      # inherited from the QwenPerTokenEncoder entry and inert here (the VLM
      # owns the tokenizer, the weights and the freezing):
      model_name: null
      max_length: null
      freeze: null
      dtype: null

  # The Qwen processor resizes and normalizes; only the ColorJitter is ours.
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
  eval_image_augs: null
