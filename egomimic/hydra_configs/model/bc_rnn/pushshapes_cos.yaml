# @package model
# BC-RNN exact-replica MODEL + warmup->cosine LR (run 3308727): the "exact code +
# cosine LR" ablation. ONLY the scheduler differs from bc_rnn_pushshapes (constant
# -> warmup_cosine 4800/240). extends _bcrnn_common
defaults:
  - bc_rnn/_common
  - _self_

# Warmup->cosine (the non-exact LR ablation; everything else identical).
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 4800   # = 600 epochs x 8 batches/epoch
  warmup_steps: 240 # 5% warmup
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
