# @package model
# BC-RNN-HNET-CHUNK16 (the bcrnnHnetC16_nc3 run): single-knob clone of
# bc_rnn_pushshapes_paperexact_hnet_chunk8 with ONLY obs_stride/chunk_len 8 -> 16.
# Core stays the REAL dynamic-chunking H-Net (HNetCore, d_model=256, LINEAR
# chunk head, rnn_horizon=10). obs_stride=16 -> policy observes every 16 env
# frames; chunk_len=16 -> each obs-step predicts the NEXT 16 actions.
# extends bc_rnn_pushshapes_paperexact_hnet_chunk8
defaults:
  - bc_rnn/_pushshapes_paperexact_hnet_chunk8_base
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (the only deviation from _hnet_chunk8.yaml).
  obs_stride: 16
  chunk_len: 16

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 16)
