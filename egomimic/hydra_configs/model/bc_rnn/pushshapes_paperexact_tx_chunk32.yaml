# @package model
# BC-RNN-TRANSFORMER-CHUNK32: bc_rnn_pushshapes_paperexact_tx_cos + OBSERVATION
# STRIDING + ACTION CHUNKING at stride/chunk 32 (the chunk8 recipe with 8 -> 32).
#   * obs_stride: 32 -> the policy observes/encodes only every 32 env frames; the
#       transformer history is over the SUBSAMPLED obs (rnn_horizon=10 obs-steps
#       = 320 env frames of context).
#   * chunk_len: 32  -> each obs-step predicts the NEXT 32 actions (target = the
#       32 GT actions at frames [s+32k, s+32k+32) for obs-step k). At rollout the
#       32 predicted actions are QUEUED and popped one per env frame (env fps
#       UNCHANGED; model invoked once every 32 env frames).
# extends bc_rnn_pushshapes_paperexact_tx_cos
defaults:
  - bc_rnn/_pushshapes_paperexact_tx_cos_base
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (the only deviation from _tx_cos): 32/32.
  obs_stride: 32
  chunk_len: 32

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 32)
