# @package model
# BC-RNN-HNET-CHUNK8 (the bcrnnHnetC8 run): the exact H-Net TWIN of
# bc_rnn_pushshapes_paperexact_tx_chunk8 -- bc_rnn_pushshapes_paperexact_hnet +
# OBSERVATION STRIDING + ACTION CHUNKING (the two knobs tx_chunk8 adds over
# tx_cos). SINGLE-KNOB vs bcrnnTxC8: ONLY the core differs (Transformer -> H-Net);
# SINGLE-KNOB vs bcrnnHnet: ONLY obs_stride/chunk_len 1/1 -> 8/8.
#   * obs_stride: 8   -> the policy observes/encodes only every 8 env frames; the
#       H-Net history is over the SUBSAMPLED obs (rnn_horizon=10 obs-steps = 80
#       env frames of context).
#   * chunk_len: 8    -> each obs-step predicts the NEXT 8 actions (queued at
#       rollout, popped one per env frame).
#   * chunk_head: linear (default) -> the wide-Linear GMM head reads out all 8
#       chunk GMMs from each obs-step feature.
# extends bc_rnn_pushshapes_paperexact_hnet
defaults:
  - _pushshapes_paperexact_hnet_base
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (the only deviation from _hnet.yaml).
  obs_stride: 8
  chunk_len: 8
  # window_anchor: uniform (default, the bcrnnTxC8 semantics -- all valid (b,s)
  # start frames, subsampled to max_windows_per_batch). The fullhist variant flips
  # this to 'start'; here it stays uniform.
  window_anchor: uniform

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 8)
