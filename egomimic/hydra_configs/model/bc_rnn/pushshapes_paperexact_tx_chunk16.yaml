# @package model
# BC-RNN-TRANSFORMER-CHUNK16: bc_rnn_pushshapes_paperexact_tx_cos + OBSERVATION
# STRIDING + ACTION CHUNKING at stride/chunk 16 (the chunk8 recipe with 8 -> 16).
#   * obs_stride: 16 -> the policy observes/encodes only every 16 env frames; the
#       transformer history is over the SUBSAMPLED obs (rnn_horizon=10 obs-steps
#       = 160 env frames of context).
#   * chunk_len: 16  -> each obs-step predicts the NEXT 16 actions (target = the
#       16 GT actions at frames [s+16k, s+16k+16) for obs-step k). At rollout the
#       16 predicted actions are QUEUED and popped one per env frame (env fps
#       UNCHANGED; model invoked once every 16 env frames).
# extends bc_rnn_pushshapes_paperexact_tx_cos
defaults:
  - bc_rnn/_pushshapes_paperexact_tx_cos_base
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (the only deviation from _tx_cos): 16/16.
  obs_stride: 16
  chunk_len: 16

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 16)
