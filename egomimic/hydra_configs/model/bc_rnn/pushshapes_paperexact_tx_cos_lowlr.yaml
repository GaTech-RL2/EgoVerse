# @package model
# BC-RNN-TRANSFORMER, warmup->cosine LR variant at a LOW peak LR. Identical to
# bc_rnn_pushshapes_paperexact_tx_cos except the optimizer peak LR is 2.5e-5
# (4x below the tx_cos run's 1e-4) for the transformer's fluctuating loss.
defaults:
  - bc_rnn/_paperexact_tx_common
  - _self_

optimizer:
  lr: 2.5e-5

# Horizon in OPTIMIZER STEPS: 1800 epochs x 50 batches = 90,000.
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 90000
  warmup_steps: 4500  # 5% warmup
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
