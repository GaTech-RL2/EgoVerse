# @package model
# BC-RNN-HNET-CHUNK4 (the bcrnnHnetC4_nc3 run): single-knob clone of
# bc_rnn_pushshapes_paperexact_hnet_chunk8 with ONLY obs_stride/chunk_len 8 -> 4.
# Core stays the REAL dynamic-chunking H-Net (HNetCore, d_model=256, LINEAR
# chunk head, rnn_horizon=10). obs_stride=4 -> policy observes every 4 env
# frames; chunk_len=4 -> each obs-step predicts the NEXT 4 actions.
# extends bc_rnn_pushshapes_paperexact_hnet_chunk8
defaults:
  - bc_rnn/_pushshapes_paperexact_hnet_chunk8_base
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (the only deviation from _hnet_chunk8.yaml).
  obs_stride: 4
  chunk_len: 4

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 4)
