_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data.dataset.data_schematic}
  camera_transforms: {}

  diffusion: false
  6dof: true

  ac_keys:
    so100_singlearm: "actions_cartesian"

  trunk:
    embed_dim: 64
    num_blocks: 2
    num_heads: 4
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.0
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 0

  domains: ["so100_singlearm"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 64
      output_dim: 64
      widths: [64]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 4
          crossattn_heads: 2
          crossattn_dim_head: 32
          crossattn_modality_dropout: 0.0
          modality_embed_dim: 64

  stem_specs:
    so100_singlearm:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 7
        output_dim: 64
        widths: [64]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 4
            crossattn_heads: 2
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.0
            modality_embed_dim: 64

  head_specs:
    so100_singlearm:
      _target_: egomimic.models.hpt_nets.MLPPolicyHead
      input_dim: 64
      output_dim: 7
      widths: [128]

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.TinyConvImageEncoder
      output_dim: 64

  train_image_augs:
    _target_: torch.nn.Identity
  eval_image_augs:
    _target_: torch.nn.Identity

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-3
  weight_decay: 0.0001

scheduler: null
