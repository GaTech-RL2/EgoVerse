# Flow Transfer Large cotrain model. The latent/denoiser widths are copied
# from the verified decoder-only Fold reference; the two action decoders remain
# domain-specific because their learned action spaces have widths 4 and 6.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

robomimic_model:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  action_horizon: 26
  domains: [pushshapes_sim_u_socket, pushshapes_sim_chain_gripper]
  ac_keys:
    pushshapes_sim_u_socket: actions
    pushshapes_sim_chain_gripper: actions
  rollout_adapters:
    pushshapes_sim_u_socket:
      _target_: egomimic.pipeline.pushshapes.USocketArcLengthRolloutAdapter
      min_distance_unit: 200.0
      resampled_vector_length: 25
      action_horizon: 100
      dt: 0.03333333333333333
      rotation_radius: 40.0
    pushshapes_sim_chain_gripper:
      _target_: egomimic.pipeline.pushshapes.ChainGripperPointArcLengthRolloutAdapter
      min_distance_unit: 200.0
      resampled_vector_length: 25
      action_horizon: 100
      dt: 0.03333333333333333
      world_size: 512.0
      grid_size: 33
      refinements: 6
  stages:
  - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
    n_obs_steps: 1
    encoder:
      _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
      obs_specs:
        state_agent_obj: {input_dim: 3, input_slice: [0, 3]}
      img_encoders:
        front_img_1:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 96
          num_kp: 32
          feature_dimension: 64
          pretrained: false
          crop_aug: true
          crop_height: 84
          crop_width: 84
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: group
          pool_type: spatial_softmax
  - _target_: egomimic.pipeline.stages_sampler.GaussianLatentNoise
    action_horizon: 26
    latent_dim: 128
  - _target_: egomimic.pipeline.stages_sampler.MultiJActionSampler
    condition_input_dim: 67
    condition_dim: 384
    gradient_accumulation_steps: 1
    schedule_anchor_domain: pushshapes_sim_u_socket
    action_horizon: 26
    action_dims:
      pushshapes_sim_u_socket: 4
      pushshapes_sim_chain_gripper: 6
    latent_dim: 128
    decoder_hidden_dim: 512
    denoiser_hidden_dim: 512
    num_inference_steps: 16
    sampling_schedule:
      1: {1: 0.50, 2: 0.50}
      2001: {2: 0.80, 4: 0.15, 8: 0.05}
    gradient_checkpointing: true
    denoising_module:
      _target_: egomimic.models.denoising_nets.CrossTransformer
      nblocks: 16
      cond_dim: 384
      hidden_dim: 512
      act_dim: 128
      act_seq: 26
      n_heads: 8
      dropout: 0.1
      mlp_layers: 4
      mlp_ratio: 4
      time_conditioning: additive
  - _target_: egomimic.pipeline.stages_sampler.NativeActionMSELoss

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 3000
  warmup_start_factor: 0.1
  eta_min: 1.0e-5
