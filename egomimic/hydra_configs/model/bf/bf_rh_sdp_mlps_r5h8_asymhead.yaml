# RH + INDEPENDENT A-HNET / S-MLP trunk, carrying nc3k's action head.
#
# Trunk copied from bf_nopre_sdp_noattn_mlps: every DualTrunkLevel keeps ONLY the
# A stream (stream_keys=[A], attn_window=1) and the S stream becomes a StreamMLP
# (d_model 128, d_hidden 512, 4 layers + 4 decoder layers, gelu). Chunkers act on
# A; the apex is unchanged (T10 @1024).
#
# Head is nc3k's r5h8-asym verbatim -- latent 768, d_model_a/s 768, enc_hidden
# eva 768 / human 1024, enc_layers 5/8, residual, mask asym -- with the single
# necessary change d_s 64 -> 128 to match the StreamMLP's output width. The
# per-emb obs encoders go 64 -> 128 for the same reason (as the pushshapes mlps
# config does).
#
# NOTE: this does NOT touch the image encoder, which is still the pushshapes
# setup (ResNet18 from scratch, 32 keypoints, 64-dim feature, 128x128 crop =
# 5.3% of a 480x640 frame). That is a separate, likely-larger bottleneck.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  action_horizon: 2560
  domains:
  - eva_bimanual
  - human_bimanual
  ac_keys:
    eva_bimanual: actions_cartesian
    human_bimanual: actions_keypoints
  stages:
  - _target_: egomimic.pipeline.stages_io.TargetBuilder
    chunk_len: 4
    stride: 4
  - _target_: egomimic.pipeline.stages_io.ObsEncoders
    agnostic:
      _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 256
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
        d_cond: 256
        output_key: fused_cond
        cond_proj_widths:
        - 256
        - 256
        obs_specs: {}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 480
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: true
            crop_height: 128
            crop_width: 128
            crop_eval_mode: center
            crop_sample_mode: v02
    specific:
    - _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 128
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.MultiEmbodimentCondEncoder
        encoders:
          eva_bimanual:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 128
            output_key: fused_cond
            cond_proj_widths:
            - 128
            - 128
            obs_specs:
              state_ee_pose:
                input_dim: 14
                input_slice:
                - 0
                - 14
                embed_dim: 128
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 480
                num_kp: 32
                feature_dimension: 64
                pretrained: false
                crop_aug: true
                crop_height: 128
                crop_width: 128
                crop_eval_mode: center
                crop_sample_mode: v02
          human_bimanual:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 128
            output_key: fused_cond
            cond_proj_widths:
            - 128
            - 128
            obs_specs:
              state_keypoints:
                input_dim: 132
                input_slice:
                - 0
                - 132
                embed_dim: 128
              obs_head_pose:
                input_dim: 7
                input_slice:
                - 0
                - 7
                embed_dim: 128
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 480
                num_kp: 32
                feature_dimension: 64
                pretrained: false
                crop_aug: true
                crop_height: 128
                crop_width: 128
                crop_eval_mode: center
                crop_sample_mode: v02
  - _target_: egomimic.pipeline.stages_hnet.DualstreamTrunk
    init_range: 0.02
    levels:
    - _target_: egomimic.pipeline.stages_hnet.DualTrunkLevel
      adjacency:
      - []
      attn_window: 1
      causal: true
      decoder_layout: T4
      embodiments:
      - eva_bimanual
      - human_bimanual
      mask_mode: sym
      n_layers: 4
      rotary_emb_dim: 64
      stream_keys:
      - A
      streams_cfg:
      - d_intermediate: 1024
        d_model: 256
        num_heads: 4
    - _target_: egomimic.pipeline.stages_hnet.StreamMLP
      activation: gelu
      d_hidden: 512
      d_model: 128
      decoder_layers: 4
      embodiments:
      - eva_bimanual
      - human_bimanual
      n_layers: 4
      stream: S
    - _target_: egomimic.pipeline.stages_hnet.DualChunkerLevel
      apex_a: 512
      d_a: 256
      d_s: 128
      dual_inner: true
      embodiments:
      - eva_bimanual
      - human_bimanual
      flat_s: true
      grab_prev_end: true
      ratio_loss_weight: 0.0005
      residual_mixer: mlp
      residual_mixer_kwargs:
        n_layers: 4
      router_fusion: mlp
      router_per_emb: true
      target_compression_ratio: 3.0
    - _target_: egomimic.pipeline.stages_hnet.DualTrunkLevel
      adjacency:
      - []
      attn_window: 1
      causal: true
      decoder_layout: T4
      embodiments:
      - eva_bimanual
      - human_bimanual
      mask_mode: sym
      n_layers: 4
      rotary_emb_dim: 64
      stream_keys:
      - A
      streams_cfg:
      - d_intermediate: 2048
        d_model: 512
        num_heads: 8
    - _target_: egomimic.pipeline.stages_hnet.StreamMLP
      activation: gelu
      d_hidden: 512
      d_model: 128
      decoder_layers: 4
      embodiments:
      - eva_bimanual
      - human_bimanual
      n_layers: 4
      stream: S
    - _target_: egomimic.pipeline.stages_hnet.DualChunkerLevel
      apex_a: 1024
      d_a: 512
      d_s: 128
      dual_inner: false
      embodiments:
      - eva_bimanual
      - human_bimanual
      flat_s: true
      grab_prev_end: true
      ratio_loss_weight: 0.0005
      residual_mixer: mlp
      residual_mixer_kwargs:
        n_layers: 4
      route_on: a
      router_fusion: mlp
      router_per_emb: true
      target_compression_ratio: 3.0
    - _target_: egomimic.pipeline.stages_hnet.ApexLevel
      causal: true
      main_network:
        arch_layout: T10
        cond: false
        d_intermediate: 1536
        d_model: 1024
        dropout: 0.0
        num_heads: 16
        resid_dropout: 0.0
        rotary_emb_dim: 64
  - _target_: egomimic.pipeline.stages_flow.SDPHead
    d_a: 256
    d_s: 128
    action_dim: 14
    action_dims:
      eva_bimanual: 14
      human_bimanual: 132
    latent_dim: 768
    dual_stream: true
    enc_hidden:
      eva_bimanual: 768
      human_bimanual: 1024
    enc_layers:
      eva_bimanual: 5
      human_bimanual: 8
    enc_residual:
      eva_bimanual: true
      human_bimanual: true
    chunk_len: 4
    embodiments:
    - eva_bimanual
    - human_bimanual
    buffer_chunks: 4
    num_train_timesteps: 100
    num_inference_steps: 16
    regime_weights:
    - 0.7
    - 0.15
    - 0.15
    end_mode: masked
    denoiser_arch: adaln
    d_model_a: 768
    d_model_s: 768
    n_layers: 4
    n_heads: 4
    ffn_mult: 4
    mask_mode: asym
  - _target_: egomimic.pipeline.stages_io.RatioLoss
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 2000
  warmup_steps: 100
  warmup_start_factor: 0.1
  eta_min: 1.0e-06
