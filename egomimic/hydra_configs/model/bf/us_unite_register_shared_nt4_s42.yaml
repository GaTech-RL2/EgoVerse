# Canonical shared-encoder, four-register UNITE row.
_target_: egomimic.pl_utils.pl_model_unite_released.ReleasedUniteModelWrapper

share_encoder_denoiser: true
num_latent_tokens: 4
latent_dim: 16
condition_dim: 128
hidden_dim: 768
action_horizon: 16
flow_steps_per_reconstruction: 14

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
    - _target_: egomimic.pipeline.stages_sampler.KeyedFeatureProjection
      selector_key: embodiment
      selector_aliases: {19: pushshapes_sim_u_socket}
      input_key: state_agent_model
      output_key: proprio_condition
      output_dim: 64
      projections:
        pushshapes_sim_u_socket:
          input_dim: 4
          hidden_dim: 64
          semantic: x_y_cos_theta_sin_theta
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: front_img_1
        proprio_condition: proprio_condition
      encoder:
        _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
        obs_specs:
          proprio_condition: {input_dim: 64, input_slice: [0, 64]}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 96
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: true
            crop_height: 84
            crop_width: 84
            crop_eval_mode: center
            crop_sample_mode: v02
            crop_scope: frame
            norm_layer: group
            pool_type: spatial_softmax
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    - _target_: egomimic.pipeline.stages_sampler.GaussianLatentNoise
      num_tokens: ${model.num_latent_tokens}
      latent_dim: ${model.latent_dim}
    - _target_: egomimic.pipeline.stages_unite_released.ReleasedRecipeUniteLatentPolicy
      condition_dropout_probability: 0.1
      cfg_scale: 4.0
      cfg_interval: [0.0, 1.0]
      dopri5_output_points: 50
      dopri5_atol: 1.0e-6
      dopri5_rtol: 1.0e-3
      timestep_shift_alpha: 0.5
      flow_steps_per_reconstruction: ${model.flow_steps_per_reconstruction}
      flow_mini_batch: 4
      train_eps: 0.05
      sample_eps: 0.05
      lognorm_mu: 0.0
      lognorm_sigma: 1.0
      reconstruction_noising_start: 0.7
      reconstruction_noising_probability: 0.5
      generative_encoder:
        _target_: egomimic.pipeline.stages_unite_separate.build_configurable_unite_generative_encoder
        _recursive_: false
        share_encoder_denoiser: ${model.share_encoder_denoiser}
        action_dims: {pushshapes_sim_u_socket: 4}
        condition_input_dim: ${model.condition_dim}
        condition_dim: ${model.condition_dim}
        latent_dim: ${model.latent_dim}
        num_latent_tokens: ${model.num_latent_tokens}
        denoiser_hidden_dim: ${model.hidden_dim}
        gradient_checkpointing: true
        tokenization_time_max: 0.01
        in_context_start: 4
        in_context_len: 32
        backbone_config:
          _target_: egomimic.models.unite_dit.UniteDiTBackbone
          input_dim: ${model.latent_dim}
          output_dim: ${model.latent_dim}
          horizon: ${model.num_latent_tokens}
          condition_dim: ${model.condition_dim}
          max_condition_tokens: 1
          max_content_tokens: ${model.action_horizon}
          hidden_dim: ${model.hidden_dim}
          depth: 12
          num_heads: 12
          mlp_ratio: 4.0
          qk_norm: true
          use_rope: true
          use_rmsnorm: true
          use_swiglu: true
          block_norm: true
          time_fourier_dim: 256
          context_adaln_summary: false
          in_context_start: 4
          in_context_len: 32
          trainable_position_embeddings: false
          trainable_register_position_embeddings: true
          trainable_content_position_embeddings: false
          trainable_condition_position_embeddings: false
          trainable_in_context_position_embeddings: true
          gradient_checkpointing: true
      decoders:
        pushshapes_sim_u_socket:
          _target_: egomimic.models.unite_action_decoder.UniteActionDecoder
          latent_dim: ${model.latent_dim}
          action_dim: 4
          num_latent_tokens: ${model.num_latent_tokens}
          action_horizon: ${model.action_horizon}
          hidden_dim: ${model.hidden_dim}
          depth: 12
          num_heads: 12
          mlp_ratio: 4.0
          dropout: 0.0
          gradient_checkpointing: true
    - _target_: egomimic.pipeline.stages_unite_released.ReleasedRecipeUniteObjective
      reconstruction_weight: 1.0
      flow_weight: 1.0

enable_grad_norm: false
optimizer:
  _target_: egomimic.utils.unite_optim.ReleasedUniteCompositeOptimizer
  _partial_: true
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-6
  adamw_weight_decay: 0.0
  muon_weight_decay: 0.0
  muon_momentum: 0.95
  muon_adjust_lr_fn: match_rms_adamw
scheduler:
  _target_: egomimic.utils.unite_optim.released_unite_two_stage_scheduler
  _partial_: true
  warmup_steps: 8000
  decay_start_1_steps: 12000
  decay_end_1_steps: 20000
  # The released 600-epoch recipe starts phase two at epoch 3000. Its 240k-step
  # translation is therefore intentionally beyond this run; terminal LR is 5e-5.
  decay_start_2_steps: 1200000
  decay_end_2_steps: 1200000
  base_lr_1: 1.0e-4
  base_lr_2: 5.0e-5
  final_lr: 1.0e-5
