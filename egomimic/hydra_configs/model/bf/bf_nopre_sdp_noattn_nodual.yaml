_target_: egomimic.pl_utils.pl_model.ModelWrapper
# Parameter-matched single-stream ablation of bf_nopre_sdp_noattn.
# One shared obs encoder -> one-stream H-Net -> one shared SDP denoiser/head.
# There are no A/S encoder copies, dual-stream trunk blocks, fused A/S routers,
# embodiment-specific router branches, or additive A/S action predictions.
# Stage-matched single-stream control. The shared apex is unchanged and the
# second observation encoder is intentionally not replaced. Each lower H-Net
# level matches its dual trunk+router/chunker budget independently, and the
# single SDP denoiser matches the dual SDP head budget.
# L0 22,622,304 vs 22,624,768; L1 90,254,656 vs 90,255,872;
# SDP 6,610,882 vs 6,609,158; apex 89,191,424 exactly.
robomimic_model:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  action_horizon: 2560
  domains: [pushshapes_sim, pushshapes_sim_small_circle]
  ac_keys:
    pushshapes_sim: actions
    pushshapes_sim_small_circle: actions
  stages:
  - _target_: egomimic.pipeline.stages_io.TargetBuilder
    chunk_len: 4
    stride: 4

  # One encoder shared byte-for-byte across both embodiments.
  - _target_: egomimic.pipeline.stages_single.SingleObsEncoder
    encoder:
      _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 352
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
        d_cond: 352
        output_key: fused_cond
        cond_proj_widths: [352, 352]
        obs_specs:
          state_agent_obj: {input_dim: 2, input_slice: [0, 2], embed_dim: 64}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 96
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: true
            crop_height: 86
            crop_width: 86
            crop_eval_mode: random
            crop_sample_mode: v02

  - _target_: egomimic.pipeline.stages_single.SingleStreamTrunk
    init_range: 0.02
    levels:
    - _target_: egomimic.pipeline.stages_single.SingleTrunkLevel
      causal: true
      attn_window: 1
      decoder_layout: T4
      main_network:
        arch_layout: T4
        d_model: 352
        d_intermediate: 1080
        num_heads: 4
        cond: false
        rotary_emb_dim: 64
        dropout: 0.0
        resid_dropout: 0.0
    - _target_: egomimic.pipeline.stages_single.SingleChunkerLevel
      d_model: 352
      apex_dim: 672
      target_compression_ratio: 3.0
      ratio_loss_weight: 0.0005
      grab_prev_end: true
      residual_mixer: mlp
      residual_mixer_kwargs: {n_layers: 4}
    - _target_: egomimic.pipeline.stages_single.SingleTrunkLevel
      causal: true
      attn_window: 1
      decoder_layout: T4
      main_network:
        arch_layout: T4
        d_model: 672
        d_intermediate: 2581
        num_heads: 8
        cond: false
        rotary_emb_dim: 64
        dropout: 0.0
        resid_dropout: 0.0
    - _target_: egomimic.pipeline.stages_single.SingleChunkerLevel
      d_model: 672
      apex_dim: 1024
      target_compression_ratio: 3.0
      ratio_loss_weight: 0.0005
      grab_prev_end: true
      residual_mixer: mlp
      residual_mixer_kwargs: {n_layers: 4}
    - _target_: egomimic.pipeline.stages_hnet.ApexLevel
      causal: true
      main_network:
        arch_layout: T10
        d_model: 1024
        d_intermediate: 1536
        num_heads: 16
        cond: false
        rotary_emb_dim: 64
        dropout: 0.0
        resid_dropout: 0.0

  # Same SDP schedule as bf_nopre_sdp_noattn, but one condition/output stream.
  - _target_: egomimic.pipeline.stages_single.SingleSDPHead
    d_h: 352
    action_dim: 2
    chunk_len: 4
    embodiments: [pushshapes_sim, pushshapes_sim_small_circle]
    buffer_chunks: 2
    num_train_timesteps: 100
    num_inference_steps: 16
    detach_offregime: true
    regime_weights: [0.7, 0.15, 0.15]
    end_mode: pusher_hold
    d_model: 292
    n_layers: 4
    n_heads: 4
    ffn_mult: 4

  - _target_: egomimic.pipeline.stages_single.SingleRatioLoss

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 2000
  warmup_steps: 100
  warmup_start_factor: 0.1
  eta_min: 1.0e-06
