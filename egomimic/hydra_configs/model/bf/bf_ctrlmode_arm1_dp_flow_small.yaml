# ARM 1 — established baseline: bidirectional, flow matching.
# The external reference point. Arms 2-4 use regression+MSE, so arm 1
# differs from them in BOTH objective and attention; arm 2 is what
# isolates attention on its own.
#
# Capacity: small — CrossTransformer nblocks=4 hidden=384 -> ~49M total params
# (including the shared 11.20M observation encoder). All four arms are matched
# to within 5% at each capacity; see _gen_control_modes.py.
#
# Control-mode study: gripper only, trained on ideal, tight, loose, laggy, sticky,
# held out jittery. Arc token D=10.0 M=16 r=0.0 layout=append.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  action_horizon: 17
  domains:
  - pushshapes_sim_gripper
  ac_keys:
    pushshapes_sim_gripper: actions
  stages:
  - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
    n_obs_steps: 1
    encoder:
      _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
      obs_specs:
        state_agent_obj:
          input_dim: 3
          input_slice:
          - 0
          - 3
      img_encoders:
        front_img_1:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 96
          num_kp: 32
          feature_dimension: 64
          pretrained: false
          crop_aug: true
          crop_height: 84
          crop_width: 84
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: group
          pool_type: spatial_softmax
  - _target_: egomimic.pipeline.stages_sampler.GaussianLatentNoise
    action_horizon: 17
    latent_dim: 96
  - _target_: egomimic.pipeline.stages_sampler.MultiJActionSampler
    condition_input_dim: 67
    condition_dim: 384
    gradient_accumulation_steps: 1
    schedule_anchor_domain: pushshapes_sim_gripper
    action_horizon: 17
    action_dims:
      pushshapes_sim_gripper: 5
    latent_dim: 96
    decoder_hidden_dim: 512
    denoiser_hidden_dim: 384
    num_inference_steps: 16
    sampling_schedule:
      1:
        1: 0.5
        2: 0.5
      2001:
        2: 0.8
        4: 0.15
        8: 0.05
    gradient_checkpointing: true
    denoising_module:
      _target_: egomimic.models.denoising_nets.CrossTransformer
      nblocks: 4
      cond_dim: 384
      hidden_dim: 384
      act_dim: 96
      act_seq: 17
      n_heads: 8
      dropout: 0.1
      mlp_layers: 4
      mlp_ratio: 4
      time_conditioning: additive
  - _target_: egomimic.pipeline.stages_sampler.NativeActionMSELoss
  rollout_adapters:
    pushshapes_sim_gripper:
      _target_: egomimic.pipeline.pushshapes.PlanarArcRolloutAdapter
      embodiment: pushshapes_sim_gripper
      velocity_layout: append
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0001
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 3000
  warmup_start_factor: 0.1
  eta_min: 1.0e-05
