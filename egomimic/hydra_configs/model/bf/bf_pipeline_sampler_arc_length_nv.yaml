# Fold cotrain Pipeline with arc-length-nv action tokens.
#
# D=0.40 m and M=25 match the latest arc-length-nv experiment.  Each target is
# (26, 8): 25 [L xyz, L grip, R xyz, R grip] waypoints followed by one
# per-dimension velocity token.  The rollout adapter reconstructs 100 control
# setpoints at 30 Hz and holds the observed wrist orientations. Data transforms
# encode physical velocity using the true span of their interpolated windows.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

robomimic_model:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  action_horizon: 26
  domains: [eva_bimanual, human_bimanual]
  ac_keys:
    eva_bimanual: actions_cartesian
    human_bimanual: actions_cartesian
  rollout_transform_mode: cartesian
  rollout_adapter:
    _target_: egomimic.pipeline.arc_length.ArcLengthRolloutAdapter
    min_distance_unit: 0.40
    resampled_vector_length: 25
    action_horizon: 100
    dt: 0.03333333333333333
    state_key: observations.state.ee_pose
  stages:
  - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
    n_obs_steps: 1
    encoder:
      _target_: egomimic.pipeline.stages_sampler.SharedAdapterObsEncoder
      shared_encoder:
        _target_: egomimic.models.stems.input_modules.ObsToken
        d_model: 256
        obs_encoder:
          _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
          d_cond: 256
          output_key: fused_cond
          cond_proj_widths: [256, 256]
          obs_specs: {}
          img_encoders:
            observations.images.front_img_1: &img
              _target_: egomimic.models.stems.visual_core.VisualCore
              in_channels: 3
              image_size: 480
              num_kp: 32
              feature_dimension: 64
              pretrained: false
              crop_aug: true
              crop_height: 128
              crop_width: 128
              crop_eval_mode: center
              crop_sample_mode: v02
      embodiment_adapter:
        _target_: egomimic.models.stems.input_modules.ObsToken
        d_model: 64
        obs_encoder:
          _target_: egomimic.models.stems.cond_encoders.MultiEmbodimentCondEncoder
          encoders:
            eva_bimanual:
              _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
              d_cond: 64
              output_key: fused_cond
              cond_proj_widths: [64, 64]
              obs_specs:
                observations.state.ee_pose:
                  {input_dim: 14, input_slice: [0, 14], embed_dim: 64}
              img_encoders:
                observations.images.left_wrist_img: *img
                observations.images.right_wrist_img: *img
            human_bimanual:
              _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
              d_cond: 64
              output_key: fused_cond
              cond_proj_widths: [64, 64]
              obs_specs:
                observations.state.ee_pose:
                  {input_dim: 12, input_slice: [0, 12], embed_dim: 64}
              img_encoders: {}
  - _target_: egomimic.pipeline.stages_sampler.GaussianLatentNoise
    action_horizon: 26
    latent_dim: 128
  - _target_: egomimic.pipeline.stages_sampler.MultiJActionSampler
    condition_input_dim: 320
    condition_dim: 384
    gradient_accumulation_steps: 1
    schedule_anchor_domain: eva_bimanual
    action_horizon: 26
    action_dims: {eva_bimanual: 8, human_bimanual: 8}
    latent_dim: 128
    decoder_hidden_dim: 512
    denoiser_hidden_dim: 512
    num_inference_steps: 16
    sampling_schedule:
      1: {1: 0.50, 2: 0.50}
      2001: {2: 0.80, 4: 0.15, 8: 0.05}
    gradient_checkpointing: true
    denoising_module:
      _target_: egomimic.models.denoising_nets.CrossTransformer
      nblocks: 16
      cond_dim: 384
      hidden_dim: 512
      act_dim: 128
      act_seq: 26
      n_heads: 8
      dropout: 0.1
      mlp_layers: 4
      mlp_ratio: 4
      time_conditioning: additive
  - _target_: egomimic.pipeline.stages_sampler.NativeActionMSELoss

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 3000
  warmup_start_factor: 0.1
  eta_min: 1.0e-5
