_target_: egomimic.pl_utils.pl_model.ModelWrapper
# Heterogeneous PushShapes no-attention SDP cotrain:
#   circle_4500: state xy, action xy (2D)
#   u_socket_1000: state xy-theta, action xy-theta (3D)
# L0/L1 are self-only exactly like bf_nopre_sdp_noattn; apex remains full
# causal. The diffusion core is shared, with per-embodiment 2D/3D action
# encoder/decoder adapters around a common 3D latent action representation.
robomimic_model:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  action_horizon: 2560
  domains: [pushshapes_sim, pushshapes_sim_u_socket]
  ac_keys:
    pushshapes_sim: actions
    pushshapes_sim_u_socket: actions
  stages:
  # --- stride + targets as data (was obs_stride: 4) ---
  - _target_: egomimic.pipeline.stages_io.TargetBuilder
    chunk_len: 4
    stride: 4
  # --- A (shared) + S (per-emb) obs encoders ---
  - _target_: egomimic.pipeline.stages_io.ObsEncoders
    agnostic:
      _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 160
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
        d_cond: 160
        output_key: fused_cond
        cond_proj_widths: [160, 160]
        obs_specs:
          state_agent_obj: {input_dim: 2, input_slice: [0, 2], embed_dim: 64}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 96
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: false
    specific:
    - _target_: egomimic.models.stems.input_modules.ObsToken
      d_model: 160
      obs_encoder:
        _target_: egomimic.models.stems.cond_encoders.MultiEmbodimentCondEncoder
        encoders:
          pushshapes_sim:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 160
            output_key: fused_cond
            cond_proj_widths: [160, 160]
            obs_specs:
              state_agent_obj: {input_dim: 2, input_slice: [0, 2], embed_dim: 64}
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 96
                num_kp: 32
                feature_dimension: 64
                pretrained: false
                crop_aug: false
          pushshapes_sim_u_socket:
            _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
            d_cond: 160
            output_key: fused_cond
            cond_proj_widths: [160, 160]
            obs_specs:
              state_agent_obj: {input_dim: 3, input_slice: [0, 3], embed_dim: 64}
            img_encoders:
              front_img_1:
                _target_: egomimic.models.stems.visual_core.VisualCore
                in_channels: 3
                image_size: 96
                num_kp: 32
                feature_dimension: 64
                pretrained: false
                crop_aug: false
  # --- the pyramid (one pipeline stage; levels nest internally) ---
  - _target_: egomimic.pipeline.stages_hnet.DualstreamTrunk
    init_range: 0.02
    levels:
    - _target_: egomimic.pipeline.stages_hnet.DualTrunkLevel   # L0 A256/S64 x8
      mask_mode: sym
      attn_window: 1   # bf_nopre_sdp_noattn L0 local attn
      allow_agnostic_cross: true
      causal: true
      n_layers: 4
      decoder_layout: T4
      rotary_emb_dim: 64
      embodiments: [pushshapes_sim, pushshapes_sim_u_socket]
      streams_cfg:
      - {d_model: 160, num_heads: 4, d_intermediate: 640}   # A
      - {d_model: 160, num_heads: 4, d_intermediate: 640}   # S == A
    - _target_: egomimic.pipeline.stages_hnet.DualChunkerLevel  # 256->512 / 64->128, dual
      d_a: 160
      d_s: 160
      apex_a: 320
      apex_s: 320
      dual_inner: true
      target_compression_ratio: 3.0
      ratio_loss_weight: 0.0005
      grab_prev_end: true
      residual_mixer: mlp
      residual_mixer_kwargs: {n_layers: 4}
      embodiments: [pushshapes_sim, pushshapes_sim_u_socket]
      router_per_emb: true
      router_fusion: mlp
    - _target_: egomimic.pipeline.stages_hnet.DualTrunkLevel   # L1 A512/S128 x8
      mask_mode: sym
      attn_window: 1   # bf_nopre_sdp_noattn L1 local attn
      allow_agnostic_cross: true
      causal: true
      n_layers: 4
      decoder_layout: T4
      rotary_emb_dim: 64
      embodiments: [pushshapes_sim, pushshapes_sim_u_socket]
      streams_cfg:
      - {d_model: 320, num_heads: 8, d_intermediate: 1280}   # A
      - {d_model: 320, num_heads: 8, d_intermediate: 1280}   # S == A
    - _target_: egomimic.pipeline.stages_hnet.DualChunkerLevel  # 512->1024 SEAM (A only)
      d_a: 320
      d_s: 320
      apex_a: 1024
      dual_inner: false
      target_compression_ratio: 3.0
      ratio_loss_weight: 0.0005
      grab_prev_end: true
      residual_mixer: mlp
      residual_mixer_kwargs: {n_layers: 4}
      embodiments: [pushshapes_sim, pushshapes_sim_u_socket]
      router_per_emb: true
      router_fusion: mlp
    - _target_: egomimic.pipeline.stages_hnet.ApexLevel        # 1024 T10 agnostic-only
      causal: true
      main_network:
        arch_layout: T10
        d_model: 1024
        d_intermediate: 1536
        num_heads: 16
        cond: false
        rotary_emb_dim: 64
        dropout: 0.0
        resid_dropout: 0.0
  # --- heterogeneous-D SDP head: shared core + per-emb action adapters ---
  - _target_: egomimic.pipeline.stages_flow.SDPHead
    d_a: 160
    d_s: 160
    action_dim: 2  # nominal; action_dims controls each embodiment
    action_dims: {pushshapes_sim: 2, pushshapes_sim_u_socket: 3}
    # DIRECT adapters (2026-07-28): per-emb 4-layer MLPs map act_dim_e straight
    # to the trunk width (256/128) and back, instead of squeezing through a
    # common 3-wide action latent. latent_dim/enc_hidden/enc_layers do not apply.
    head_adapter: direct
    adapter_layers: 4
    dual_stream: true
    enc_residual: false
    chunk_len: 4
    embodiments: [pushshapes_sim, pushshapes_sim_u_socket]
    buffer_chunks: 2
    num_train_timesteps: 100
    num_inference_steps: 16
    detach_offregime: true
    regime_weights: [0.7, 0.15, 0.15]
    end_mode: pusher_hold
    denoiser_arch: adaln
    d_model_a: 256
    d_model_s: 128
    n_layers: 4
    n_heads: 4
    ffn_mult: 4
    mask_mode: asym
  # --- losses are stages ---
  - _target_: egomimic.pipeline.stages_io.RatioLoss
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 2000
  warmup_steps: 100
  warmup_start_factor: 0.1
  eta_min: 1.0e-06
