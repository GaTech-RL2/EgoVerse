# VAE v6: same as v5 but with KL regularization enabled (beta=0.001). The latent
# space needs Gaussian structure for latent diffusion to work -- without KL the
# encoder can produce an arbitrary non-smooth manifold the diffusion model can't
# learn to sample from. beta=0.001 is a light touch (Stable Diffusion uses ~1e-6
# with a much larger latent space).
defaults:
  - vae_pushshapes_v5
  - _self_

robomimic_model:
  beta: 0.001   # <- only change vs v5 (KL on)
