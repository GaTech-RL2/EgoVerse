# @package model
# HNetChunkToken modular policy — CONV preset (from-scratch GroupNorm convnet,
# no stem, mean-pool readout, T4 trunk). This is the base config of the modular
# family: every architectural slot is a YAML knob — see the abstract base
# (_hnet_chunktoken_common) for the shared payload and the slot menu.
# Pipeline:  image+proprio -> [encoder] -> obs tokens -> [stem] -> trunk
#            -> [readout] -> 32-action chunk  (+ temporal-ensemble rollout)
# extends _hnet_chunktoken_common
defaults:
  - hnet/_chunktoken_common
  - _self_

robomimic_model:
  # ---- SLOT 1: image encoder ----  options: conv | resnet
  encoder: "conv"
  #   conv:   from-scratch GroupNorm convnet (these knobs apply)
  channels: [32, 64, 128, 256]
  kernel_size: 3
  stride: 2
  norm_groups: 8

  # ---- SLOT 2: obs-token pooling / stem ----  options: none | cross_attn
  stem: "none"

  # ---- SLOT 3: trunk transformer ----
  arch_layout: "T4"           # e.g. T4 = 4 transformer blocks

  # ---- SLOT 4: action readout ----  options: mean_pool | action_token
  readout: "mean_pool"

optimizer:
  lr: 1e-4

scheduler:
  eta_min: 1.0e-5
