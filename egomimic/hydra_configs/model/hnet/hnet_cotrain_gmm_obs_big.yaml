_target_: egomimic.pl_utils.pl_model.ModelWrapper

# BIG variant of hnet_cotrain_gmm_obs (2026-06-13). Scaled to match
# hnet_gmm_obs_circle_big dims so the larger-capacity cotrain matches the
# single-domain big model: d_model/d_cond 256->384 everywhere, num_heads
# 8->12, d_intermediate 768->1152, trunk T4->T6, GMM num_modes 5->32 +
# head_hidden_dim 1024 + head_n_layers 3, obs encoder widths scaled
# (embed_dim 64->96, widths [128]->[192], cond_proj_widths [256,256]->
# [384,384], img feature_dimension 64->96, num_kp 32->48). Structure
# (PerEmbodimentStage outer -> shared inner ChunkerStage -> shared
# ComputeStage trunk; obs-as-input via ObsToken; all cond_key=null) is
# UNCHANGED from the base cotrain config.
robomimic_model:
  _target_: egomimic.algo.hnet.PackedAlgoBase
  d_cond: 384

  domains: ["pushshapes_sim", "pushshapes_sim_small_circle"]
  ac_keys:
    pushshapes_sim: "actions"
    pushshapes_sim_small_circle: "actions"

  # GMM-NLL loss over 8-action chunks (reads ctx.extras['gmm_head']).
  loss:
    _target_: egomimic.algo.hnet.GMMLoss

  outer_stage:
    _target_: egomimic.algo.hnet.HNetOuterStage
    action_dim: 2
    action_horizon: 2560
    d_model: 384
    action_head_type: gmm

    # GMM head: 32-mode mixture, chunk_len=8 (1 obs -> 8 actions), big MLP.
    gmm_head:
      _target_: egomimic.models.heads.gmm_head.GMMActionHead
      d_model: 384
      action_dim: 2
      num_modes: 32
      chunk_len: 8
      min_std: 1.0e-4
      std_activation: softplus
      low_noise_eval: true
      head_hidden_dim: 1024
      head_n_layers: 3

    # OuterStage requires a cond_encoder; here it's a no-op (empty specs ->
    # produces no fused_cond) because conditioning enters as INPUT via ObsToken
    # and every stage runs unconditioned (cond_key=null).
    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 384
      output_key: "fused_cond"
      obs_specs: {}
      img_encoders: {}

    # OBS-AS-INPUT: ObsToken owns its own CondEncoderModule (ResNet image +
    # proprio) at d_model and feeds the per-frame embedding as the input token.
    input_modules:
      - _target_: egomimic.models.stems.input_modules.ObsToken
        d_model: 384
        obs_encoder:
          _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
          d_cond: 384
          output_key: "fused_cond"
          cond_proj_widths: [384, 384]
          obs_specs:
            state_agent_obj:
              input_dim: 5
              embed_dim: 96
              widths: [192]
          img_encoders:
            front_img_1:
              _target_: egomimic.models.stems.visual_core.VisualCore
              in_channels: 3
              image_size: 96
              num_kp: 48
              feature_dimension: 96
              pretrained: false
              crop_aug: true
              crop_height: 86
              crop_width: 86
              crop_eval_mode: random
              crop_sample_mode: v02

    # 2-level chunking H-Net (all cond_key=null — no AdaLN):
    #   [0] PerEmbodimentStage(ChunkerStage)  outer, PER-EMB
    #     -> [1] ChunkerStage                 inner, SHARED
    #         -> [2] ComputeStage             trunk, SHARED (terminal)
    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
        - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
          sub_stages:
            pushshapes_sim:
              _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 384
              output_hidden_dim: 384
              target_compression_ratio: 2.0
              ratio_loss_weight: 0.03
              cond_key: null
            pushshapes_sim_small_circle:
              _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 384
              output_hidden_dim: 384
              target_compression_ratio: 2.0
              ratio_loss_weight: 0.03
              cond_key: null
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 384
          output_hidden_dim: 384
          target_compression_ratio: 2.0
          ratio_loss_weight: 0.03
          cond_key: null
        - _target_: egomimic.models.hnet.stages.ComputeStage
          input_hidden_dim: 384
          output_hidden_dim: 384
          cond_key: null
          d_cond: 0
          causal: true
          main_network:
            arch_layout: "T6"
            d_model: 384
            d_intermediate: 1152
            num_heads: 12
            cond: false
            rotary_emb_dim: 32
            dropout: 0.0
            resid_dropout: 0.0

enable_grad_norm: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0

# Warmup -> cosine (project default for fresh launches). max_steps =
# epochs * limit_train_batches; tune at launch.
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 200000
  warmup_steps: 2000
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
