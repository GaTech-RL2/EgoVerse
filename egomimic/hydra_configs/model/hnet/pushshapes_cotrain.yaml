# @package model
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.PackedAlgoBase
  # ``norm_stats`` is injected at runtime by ModelWrapper._instantiate_model.
  #
  # Cotrain on circle + stick. Two-level H-Net:
  #   - Outer level (per-embodiment): EncoderDecoderStage + ChunkerStage
  #     (target_compression_ratio=8), each wrapped in PerEmbodimentStage so
  #     every embodiment has its own parameters at this depth. AdaLN cond ON
  #     via a per-emb cond encoder (image + state) dispatched by embodiment.
  #   - Inner level (shared): EncoderDecoderStage + ChunkerStage
  #     (target_compression_ratio=4) + ComputeStage trunk. Unconditioned
  #     (cond_key=null) — the shared trunk operates purely on the chunked
  #     representation produced by each embodiment's outer level.
  # Net compression: 8 (outer) * 4 (inner) = 32x over the action stream.
  d_cond: 128

  domains: ["pushshapes_sim", "pushshapes_sim_stick"]
  ac_keys:
    pushshapes_sim: "actions"
    pushshapes_sim_stick: "actions"

  # ---- outer_stage: cond_encoder + input_modules + action head + H-Net ----
  outer_stage:
    _target_: egomimic.algo.hnet.HNetOuterStage
    action_dim: 2
    action_horizon: 1024
    d_model: 128
    action_head_type: linear

    # ---- per-embodiment conditioning encoder ----
    # MultiEmbodimentCondEncoder dispatches on ctx.embodiment_id (the domain
    # name) to the matching CondEncoderModule. Both share output_key.
    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.MultiEmbodimentCondEncoder
      encoders:
        pushshapes_sim:
          _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
          d_cond: 128
          output_key: "fused_cond"
          cond_proj_widths: [128, 128]
          obs_specs:
            state_agent_obj:
              input_dim: 5
              embed_dim: 64
              widths: [128]
          img_encoders:
            front_img_1:
              _target_: egomimic.models.stems.image_encoders.SimpleConv
              in_channels: 3
              channels: [32, 64, 128, 256]
              kernel_size: 3
              stride: 2
              embed_dim: 128
              norm_groups: 8
        pushshapes_sim_stick:
          _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
          d_cond: 128
          output_key: "fused_cond"
          cond_proj_widths: [128, 128]
          obs_specs:
            state_agent_obj:
              input_dim: 5
              embed_dim: 64
              widths: [128]
          img_encoders:
            front_img_1:
              _target_: egomimic.models.stems.image_encoders.SimpleConv
              in_channels: 3
              channels: [32, 64, 128, 256]
              kernel_size: 3
              stride: 2
              embed_dim: 128
              norm_groups: 8

    # ---- stage-based H-Net (inner_stage) ----
    # Chain (wired at construction):
    #   [0] PerEmbodimentStage(EncoderDecoderStage)   outer, per-emb, cond ON
    #     └ [1] PerEmbodimentStage(ChunkerStage r=8)  outer, per-emb, cond ON
    #         └ [2] EncoderDecoderStage  shared inner, cond OFF
    #             └ [3] ChunkerStage r=4 shared inner, cond OFF
    #                 └ [4] ComputeStage shared trunk, cond OFF (terminal)
    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
        # ---------- Outer level: per-embodiment (AdaLN cond ON) ----------
        - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
          sub_stages:
            pushshapes_sim:
              _target_: egomimic.models.hnet.stages.EncoderDecoderStage
              input_hidden_dim: 128
              output_hidden_dim: 128
              cond_key: "fused_cond"
              d_cond: 128
              causal: true
              encoder:
                arch_layout: "T4"
                d_model: 128
                d_intermediate: 512
                num_heads: 4
                cond: true
                rotary_emb_dim: 32
                dropout: 0.15
                resid_dropout: 0.2
              decoder:
                arch_layout: "T4"
                d_model: 128
                d_intermediate: 512
                num_heads: 4
                cond: true
                rotary_emb_dim: 32
                dropout: 0.15
                resid_dropout: 0.2
            pushshapes_sim_stick:
              _target_: egomimic.models.hnet.stages.EncoderDecoderStage
              input_hidden_dim: 128
              output_hidden_dim: 128
              cond_key: "fused_cond"
              d_cond: 128
              causal: true
              encoder:
                arch_layout: "T4"
                d_model: 128
                d_intermediate: 512
                num_heads: 4
                cond: true
                rotary_emb_dim: 32
                dropout: 0.15
                resid_dropout: 0.2
              decoder:
                arch_layout: "T4"
                d_model: 128
                d_intermediate: 512
                num_heads: 4
                cond: true
                rotary_emb_dim: 32
                dropout: 0.15
                resid_dropout: 0.2
        - _target_: egomimic.models.hnet.per_embodiment_stage.PerEmbodimentStage
          sub_stages:
            pushshapes_sim:
              _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 128
              output_hidden_dim: 192
              target_compression_ratio: 8.0
              ratio_loss_weight: 0.03
              cond_key: "fused_cond"
            pushshapes_sim_stick:
              _target_: egomimic.models.hnet.stages.ChunkerStage
              input_hidden_dim: 128
              output_hidden_dim: 192
              target_compression_ratio: 8.0
              ratio_loss_weight: 0.03
              cond_key: "fused_cond"
        # ---------- Inner level: shared (cond OFF) ----------
        - _target_: egomimic.models.hnet.stages.EncoderDecoderStage
          input_hidden_dim: 192
          output_hidden_dim: 192
          cond_key: null
          d_cond: 0
          causal: true
          encoder:
            arch_layout: "T4"
            d_model: 192
            d_intermediate: 768
            num_heads: 4
            cond: false
            rotary_emb_dim: 48
            dropout: 0.15
            resid_dropout: 0.2
          decoder:
            arch_layout: "T4"
            d_model: 192
            d_intermediate: 768
            num_heads: 4
            cond: false
            rotary_emb_dim: 48
            dropout: 0.15
            resid_dropout: 0.2
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 192
          output_hidden_dim: 256
          target_compression_ratio: 4.0
          ratio_loss_weight: 0.03
          cond_key: null
        - _target_: egomimic.models.hnet.stages.ComputeStage
          input_hidden_dim: 256
          output_hidden_dim: 256
          cond_key: null
          d_cond: 0
          causal: true
          main_network:
            arch_layout: "T4"
            d_model: 256
            d_intermediate: 1024
            num_heads: 4
            cond: false
            rotary_emb_dim: 64
            dropout: 0.15
            resid_dropout: 0.2

  # ---- loss: defaults to HNetLoss() (action MSE + per-chunker ratio loss). ----
  # Training-recipe knobs (init_weights_range / lr_multipliers /
  # use_parameter_groups) are intentionally OMITTED to match the source
  # cotrain run (single LR group, default init). lr_multipliers would also
  # need 5 entries here (chain depth) rather than the 3 in the single-emb
  # config — enable deliberately if desired.

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  # Faithful to the source cotrain run: constant LR. NOTE: per the standing
  # project rule, a fresh training launch should switch to
  # ``egomimic.utils.schedulers.warmup_cosine_scheduler`` (warmup -> cosine,
  # max_steps = epochs * limit_train_batches). Kept constant here so this
  # config reproduces the original cotrain behaviour.
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
