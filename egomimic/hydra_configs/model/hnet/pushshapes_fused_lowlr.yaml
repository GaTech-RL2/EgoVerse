# @package model
# Fused-tokens variant (current best) with LOWER LR (5e-5, half of 1e-4) + flat
# LinearLR (no decay), to reduce the slight val-MSE drift seen late in training.
# The 3 H-Net tricks don't apply (no chunker/stages) so only the LR knob changes;
# this leaf carries NO dropout / F22 (its base _hnet_fused_common omits them).
# extends _hnet_fused_common
defaults:
  - hnet/_fused_common
  - _self_

robomimic_model:
  action_horizon: 1024

  cond_encoder:
    _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
    d_cond: 128
    output_key: "fused_cond"
    cond_proj_widths: [128, 128]
    obs_specs:
      # DRIFT WARNING (provenance, NOT a bug): this HNetFused-algo config feeds the
      # FULL 5-dim state_agent_obj (input_dim: 5, no input_slice) -- DIVERGES from
      # the BC-RNN family base (_bcrnn_common / _bcrnn_paperexact_common), which
      # uses input_dim: 2 + input_slice: [0, 2] (agent xy only). Kept as-is to
      # preserve the original run; do NOT "fix" it to match the BC family.
      state_agent_obj:
        input_dim: 5
        embed_dim: 64
        widths: [128]
    img_encoders:
      front_img_1:
        _target_: egomimic.models.stems.image_encoders.SimpleConv
        in_channels: 3
        channels: [32, 64, 128, 256]
        kernel_size: 3
        stride: 2
        embed_dim: 128
        norm_groups: 8

optimizer:
  lr: 5.0e-5         # half of baseline 1e-4

scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
