# @package model
# ABSTRACT BASE (underscore-prefixed, NEVER launched) — shared payload of the
# HNetChunkToken modular-policy pair (hnet_pushshapes_chunktoken +
# _chunktoken_hptfull). Holds ONLY the keys both leaves resolve identically:
# the algo target, action/chunk dims, proprio wiring, shared trunk hyperparams
# (num_heads/d_intermediate/dropout/resid_dropout), backbone=flat + ratio knobs,
# domains/ac_keys, the AdamW optimizer skeleton, and the warmup-cosine schedule
# (minus eta_min, which differs per leaf).
#
# Deliberately ABSENT here (the cannot-delete-keys trap): the conv-encoder knobs
# (channels / kernel_size / norm_groups / stride) live ONLY in the conv leaf —
# the resnet leaf (hptfull) drops them, so they cannot sit in this shared base.
# Likewise arch_layout, encoder, stem, readout, optimizer.lr and scheduler.eta_min
# differ between the two and are set in each leaf.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.HNetChunkToken

  action_dim: 2
  chunk_k: 32                 # actions predicted per one-shot chunk
  d_model: 128

  # ---- proprio slot ----
  proprio_dim: 2
  input_slice: [0, 2]         # which state dims to use (pusher xy)
  proprio_key: "state_agent_obj"
  img_key: "front_img_1"

  # ---- encoder knobs shared by both leaves ----
  in_channels: 3
  image_size: 96
  #   resnet: HPT's ResNet backbone (these knobs apply)
  resnet_model: "resnet18"
  pretrained: true

  # ---- SLOT 2: obs-token pooling / stem ----  options: none | cross_attn
  stem_latents: 16            # (cross_attn) number of learned latent tokens

  # ---- SLOT 3: trunk transformer (shared) ----
  num_heads: 4
  d_intermediate: 512
  dropout: 0.1
  resid_dropout: 0.1

  # ---- SLOT 5: backbone topology ----  options: flat | hnet_chunked
  backbone: "flat"            # flat = HPT-style flat trunk (DEFAULT; old runs byte-identical)
  #   hnet_chunked: insert H-Net dynamic chunker (router -> chunk -> inner -> dechunk) mid-trunk,
  #                 keeping the HPT-like encoder/stem/readout/chunk+TE parts unchanged.
  #                 arch_layout is split enc/inner/dec (e.g. T6 -> T2/T2/T2).
  chunk_compress_ratio: 4.0   # (hnet_chunked) target token compression ratio for the ratio loss
  ratio_loss_weight: 0.03     # (hnet_chunked) weight of the boundary ratio auxiliary loss

  action_horizon: 1024        # rollout-length cap only (Markovian model)

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  weight_decay: 0.0001

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 400
  warmup_steps: 24
  warmup_start_factor: 0.1
