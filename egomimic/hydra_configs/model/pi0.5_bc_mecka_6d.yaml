defaults:
  - pi0.5_base
  - _self_

# pi0.5 BC on mecka data alone (stored as human_bimanual — all human demo data
# is one embodiment locally). Normalized continuous-6D rotation encoding:
# actions arrive already in xyz+6D layout (18D per arm pair, no gripper,
# wrist-relative via the `cartesian_wristframe_6d` transform mode) and the
# head-frame proprio ee_pose arrives 6D-encoded too; the forward pass only
# packs them into the 32D vector.
# Pairs with data=mecka_all_pi_6d and evaluator=eval_pi_wristframe_6d.
robomimic_model:
  camera_transforms: {}
  config:
    # Enable the M-sample val metrics (reverse KL, best/mean/worst-of-M,
    # sample diversity) with a moderate M: 4 extra flow rollouts per valid
    # batch (~+50% val sampling time). Set to 1 to disable, 8 for the full
    # version at ~2x the cost. Train-viz pass always runs with 1.
    reverse_kl_samples: 4
  ac_keys:
    human_bimanual: "actions_cartesian"
  domains: ["human_bimanual"]

  action_encoding: "cartesian_normalized_rot6d"
  # Keep the discretized-proprio "State: <bins>" prompt block (pi0.5_base
  # defaults proprio_in_prompt on) but do not splice "Embodiment: <name>" into
  # the prompt.
  embodiment_label: false

  action_converters:
    rules:
      HUMAN_BIMANUAL:
        _target_: egomimic.utils.action_utils.HumanBimanualCartesianEuler
    # optional fallback if no match is found
    fallback:
      _target_: egomimic.utils.action_utils.BaseActionConverter
