_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.packed_base.HNet
  # ObsToken-as-input variant: per-frame obs embedding goes directly into
  # the trunk as the input token (no ActionInToken, no BOS, no previous-
  # action feedback). cond_encoder still produces fused_cond for AdaLN.

  d_cond: 128

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

  outer_stage:
    _target_: egomimic.algo.packed_outer_stage.HNetOuterStage
    action_dim: 2
    action_horizon: 1024
    d_model: 128
    action_head_type: linear

    # Single ObsToken input module (no ActionInToken).
    input_modules:
      - _target_: egomimic.models.stems.input_modules.ObsToken
        d_model: 128
        obs_encoder:
          _target_: egomimic.models.hnet.cond_encoders.CondEncoderModule
          d_cond: 128
          output_key: "obs_token"
          cond_proj_widths: [128, 128]
          obs_specs:
            state_agent_obj:
              input_dim: 5
              embed_dim: 64
              widths: [128]
          img_encoders:
            front_img_1:
              _target_: egomimic.models.hnet.image_encoders.SimpleConv
              in_channels: 3
              channels: [32, 64, 128, 256]
              kernel_size: 3
              stride: 2
              embed_dim: 128
              norm_groups: 8

    cond_encoder:
      _target_: egomimic.models.hnet.cond_encoders.CondEncoderModule
      d_cond: 128
      output_key: "fused_cond"
      cond_proj_widths: [128, 128]
      obs_specs:
        state_agent_obj:
          input_dim: 5
          embed_dim: 64
          widths: [128]
      img_encoders:
        front_img_1:
          _target_: egomimic.models.hnet.image_encoders.SimpleConv
          in_channels: 3
          channels: [32, 64, 128, 256]
          kernel_size: 3
          stride: 2
          embed_dim: 128
          norm_groups: 8

    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
        - _target_: egomimic.models.hnet.stages.EncoderDecoderStage
          input_hidden_dim: 128
          output_hidden_dim: 128
          cond_key: "fused_cond"
          d_cond: 128
          causal: true
          encoder:
            arch_layout: "T4"
            d_model: 128
            d_intermediate: 512
            num_heads: 4
            cond: false
            rotary_emb_dim: 32
            dropout: 0.15
            resid_dropout: 0.2
          decoder:
            arch_layout: "T4"
            d_model: 128
            d_intermediate: 512
            num_heads: 4
            cond: false
            rotary_emb_dim: 32
            dropout: 0.15
            resid_dropout: 0.2
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 128
          output_hidden_dim: 192
          target_compression_ratio: 8.0
          ratio_loss_weight: 0.03
          cond_key: "fused_cond"
        - _target_: egomimic.models.hnet.stages.ComputeStage
          input_hidden_dim: 192
          output_hidden_dim: 192
          cond_key: "fused_cond"
          d_cond: 128
          causal: true
          main_network:
            arch_layout: "T4"
            d_model: 192
            d_intermediate: 768
            num_heads: 4
            cond: false
            rotary_emb_dim: 48
            dropout: 0.15
            resid_dropout: 0.2

  init_weights_range: 0.02
  lr_multipliers: [3.0, 1.7, 0.9]
  use_parameter_groups: true
  weight_decay: 0.01

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 4e-5
  weight_decay: 0.0001

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 400
  warmup_steps: 24
  warmup_start_factor: 0.1
  eta_min: 4.0e-6
