_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.HNetFused

  # Fused-tokens variant: flat transformer over an interleaved
  # [c_0, BOS, c_1, a_0, c_2, a_1, ...] sequence of length 2T. No chunker,
  # no AdaLN — conditioning is fed in-band as obs tokens. Causal masking +
  # action_out extraction at odd positions gives the per-step action
  # predictions.
  action_dim: 2
  action_horizon: 1024
  d_model: 128
  d_cond: 128

  cond_encoder:
    _target_: egomimic.models.hnet_nets.cond_encoders.CondEncoderModule
    d_cond: 128
    output_key: "fused_cond"
    cond_proj_widths: [128, 128]
    obs_specs:
      state_agent_obj:
        input_dim: 2
        input_slice: [0, 2]
        embed_dim: 64
        widths: [128]
      goal_obs:
        input_dim: 3
        embed_dim: 64
        widths: [128]
    img_encoders:
      front_img_1:
        _target_: egomimic.models.hnet_nets.image_encoders.SimpleConv
        in_channels: 3
        channels: [32, 64, 128, 256]
        kernel_size: 3
        stride: 2
        embed_dim: 128
        norm_groups: 8

  # Flat backbone: 8 transformer layers w/ MLPs (T8). Roughly matches the
  # encoder+decoder of the baseline (4+4 transformer blocks).
  arch_layout: "T8"
  num_heads: 4
  d_intermediate: 512
  # Stronger-than-default dropout: the obs/action conditioning signal in
  # pushshapes is very strong, so we regularise the flat backbone.
  dropout: 0.15           # attention dropout (inside MHA)
  resid_dropout: 0.2      # residual-branch dropout (attn/ffn outputs)

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

  # F22: paper's stability recipe knobs. NOTE — ``HNetFused`` does NOT have a
  # multi-stage chunker hierarchy (single flat backbone), so these are
  # currently *absorbed by **kwargs* and have no effect on the fused variant.
  # Kept in the yaml so the two configs stay structurally parallel and so
  # they take effect immediately if/when HNetFused gains stage-tree support.
  init_weights_range: 0.02
  lr_multipliers: [1.0]
  use_parameter_groups: true
  weight_decay: 0.01

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 4e-5
  weight_decay: 0.0001

scheduler:
  # Linear warmup -> cosine annealing.
  # Defaults assume 50 epochs x 8 steps/epoch (H-Net with limit_train_batches=8)
  # = 400 total steps. Override max_steps / warmup_steps at launch if the
  # batch budget differs.
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 400
  warmup_steps: 24            # ~3 epochs
  warmup_start_factor: 0.1
  eta_min: 4.0e-6             # 1/10 of starting lr -> well below 1/5 floor
