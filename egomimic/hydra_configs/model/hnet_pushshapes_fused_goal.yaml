# Fused + GOAL conditioning: identical to hnet_pushshapes_fused but the cond_encoder
# also ingests a 3-dim goal_obs spec (goal xy + flag). Everything else inherited.
# extends _hnet_fused_simpleconv
defaults:
  - _hnet_fused_simpleconv
  - _self_

robomimic_model:
  cond_encoder:
    obs_specs:
      goal_obs:
        input_dim: 3
        embed_dim: 64
        widths: [128]
