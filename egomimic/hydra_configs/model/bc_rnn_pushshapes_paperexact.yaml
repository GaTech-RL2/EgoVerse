# BC-RNN PAPER-EXACT root: the LSTM(1000)x2 paper-exact recipe. Adds the LSTM
# core (FIX 2: image datasets use RNN dim 1000), the gmm_head.d_model that follows
# from it, and the constant-LR schedule on top of the shared paper-exact payload.
# extends _bcrnn_paperexact_common
defaults:
  - _bcrnn_paperexact_common
  - _self_

robomimic_model:
  core_net:
    _target_: egomimic.models.bc_rnn_nets.LSTMCore
    input_dim: 66             # FIX 3c: = obs_encoder concat (64 img + 2 raw)
    hidden_dim: 1000          # FIX 2: image datasets use RNN dim 1000
    num_layers: 2
    dropout: 0.0

  gmm_head:
    d_model: ${..core_net.hidden_dim}   # FIX 1+2: = LSTM hidden_dim 1000 (no actor MLP)

# Constant-LR schedule (robomimic exact-replica): LambdaLR factor 1.0.
scheduler:
  _target_: egomimic.utils.schedulers.constant_scheduler
  _partial_: true
