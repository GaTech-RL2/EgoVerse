# HPT pushshapes circle (regression): diffusion off, MLPPolicyHead, state stem
# input_dim 2 + input_slice [0,2] (agent xy only). extends _hpt_pushshapes_128_common.
defaults:
  - _hpt_pushshapes_128_common
  - _self_

robomimic_model:
  diffusion: false

  stem_specs:
    pushshapes_sim:
      state_agent_obj:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 2
        input_slice: [0, 2]
        output_dim: 128
        widths: [128]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 128

  head_specs:
    pushshapes_sim:
      _target_: egomimic.models.hpt_nets.MLPPolicyHead
      input_dim: 128
      output_dim: 64
      widths: [256, 256]
      dropout: false
      ln: true
      tanh_end: false
