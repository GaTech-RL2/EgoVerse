# RDT_BC_MECKA_6D_DINOV3_VITB: Robotics Diffusion Transformer
# (thu-ml/RoboticsDiffusionTransformer) on the HPT chassis, ~300M trainable
# DiT (param-matched to hpt_bc_mecka_6d_300M), same data / action space: 18-D
# wrist-frame 6D-rotation cartesian action, 20-D ee_pose proprio, front camera,
# one sampled annotation.
#
#   python egomimic/trainHydra.py --config-name=train_zarr_mecka_flagship_6d_rdt \
#     norm_stats.precomputed_norm_path=<out>/norm_stats
#
# egomimic.algo.rdt.RDT is HPT with the policy network swapped: no Perceiver
# pooling. The stems are RDT's condition adaptors and hand their full token
# sequences to the head. `trunk` is the DiT, shared across embodiments:
# self-attention over [timestep; ctrl freq; state; noisy action chunk],
# cross-attention alternating between the language tokens (even blocks) and the
# image tokens (odd blocks). A head holds one embodiment's action adaptor,
# position table and output layer, so co-training shares the blocks at native
# action widths.
#
# Against the paper (decided with ABC-DiT, abc.bot, as the second reference):
#   - flow matching (the repo's FMPolicy, 10 Euler steps like pi0.5 / ABC) for
#     DDPM sample-prediction + DPM-Solver;
#   - DINOv3 ViT-B/16 for SigLIP-so400m, fine-tuned at 0.1x LR (ABC's setting;
#     encoder_specs.front_img_1.freeze_backbone=true is the frozen control), at
#     the native 16:9 aspect, 224x400 = 350 patch tokens per frame, all of them
#     cross-attended. The stem resizes and normalizes; the augs must NOT;
#   - Qwen3-Embedding-0.6B per-token states for T5-XXL (frozen, cached);
#   - native action width + per-embodiment adaptors for the 128-D unified vector;
#   - 2 frames per camera, the past one 0.1 s back (RDT: the previous step);
#     needs data...key_map.image_history_gap_s (the train config sets it);
#   - DINOv3 is RoPE-only, so patches get a fixed normalized 2D sin-cos code on
#     top of RDT's (learned, zero-init) frame / camera tags;
#   - condition dropout per stream: state and language 0.1, no image dropout
#     with a single camera.
#
# DiT: width 1024 x 28 blocks x 16 heads (head_dim 64, RDT-1B's), RDT's FFN
# ratio 1 -> 10.5M / block.
# Trainable 392.7M = DiT 296.6M + DINOv3 85.6M + adaptors; Qwen 596M frozen.
# H100, batch 32, bf16: 212 ms / step, 30 GiB (ViT-L: 365 ms, 49 GiB; the 1B
# DiT: 359 ms, 57 GiB); sampling 0.3 s per batch.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.rdt.RDT
  camera_transforms: {}
  dims:
    human_bimanual: {proprio: 20, action: 18}
  # DiT width; every stem / encoder output_dim and the head's hidden_dim.
  width: 1024
  ac_keys:
    human_bimanual: "actions_cartesian"

  diffusion: true
  6dof: true

  annotation_key: "annotations"
  annotation_sampling_mode: "random"
  annotation_modality: "annotation"
  default_prompt: ""

  use_pad_mask: false

  trunk:
    embed_dim: ${model.robomimic_model.width}
    depth: 28
    num_heads: 16
    mlp_ratio: 1.0
    # RDT's cond_mask_prob, per stream (train only). A dropped prompt becomes
    # "", the no-prompt deployment condition; `img` is per camera and never
    # blinds a sample, so it is inert with one camera.
    cond_drop: {state: 0.1, lang: 0.1, img: 0.0}
    # frames per camera (current last); 2 <-> key_map.image_history_gap_s set
    image_history: 2
    # past frame := current frame, per sample (what an episode start looks like)
    image_history_dropout: 0.2

  multitask: false
  pretrained: false
  pretrained_checkpoint: null
  domains: ["human_bimanual"]
  shared_obs_keys: ["front_img_1", "annotation"]

  head_specs:
    human_bimanual:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 10
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        human_bimanual: ${model.robomimic_model.dims.human_bimanual.action}
      model:
        _target_: egomimic.models.rdt_nets.RDTDenoiser
        act_dim: ${model.robomimic_model.dims.human_bimanual.action}
        act_seq: 100
        hidden_dim: ${model.robomimic_model.width}
        # proprio stems x history_len
        n_state_tokens: 1
        # FMPolicy's t in [0, 1] -> RDT's [0, 1000) timestep embedding
        time_scale: 1000.0

  shared_stem_specs:
    # image adaptor (DINOv3Stem.proj + this MLP ~ RDT's mlp2x_gelu)
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: ${model.robomimic_model.width}
      output_dim: ${model.robomimic_model.width}
      widths: ["${model.robomimic_model.width}"]
    # RDTModel adds the mlp2x_gelu language adaptor on top of these tokens.
    annotation:
      _target_: egomimic.models.hpt_nets.QwenPerTokenEncoder
      model_name: "Qwen/Qwen3-Embedding-0.6B"
      max_length: 128
      freeze: true
      dtype: "float16"
      cache_text_features: true
      text_cache_max_entries: 8192
      output_dim: ${model.robomimic_model.width}

  stem_specs:
    human_bimanual:
      # state adaptor (RDT's mlp3x_gelu); one token per proprio step
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: ${model.robomimic_model.dims.human_bimanual.proprio}
        output_dim: ${model.robomimic_model.width}
        widths:
          - ${model.robomimic_model.width}
          - ${model.robomimic_model.width}
        history_len: 1
        history_dropout: 0.2

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.DINOv3Stem
      model_name: "vit_base_patch16_dinov3.lvd1689m"
      output_dim: ${model.robomimic_model.width}
      freeze_backbone: false
      # [H, W]; 360x640 frames at their native aspect
      image_size: [224, 400]

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
  eval_image_augs: null

# DINOv3 tower at 1e-5 against 1e-4 everywhere else (ABC-DiT's 0.1).
backbone_lr_scale: 0.1

# RDT and ABC-DiT agree: AdamW 1e-4, wd 1e-2, constant LR. ABC's 1k-step
# warmup and (0.9, 0.95) betas; gradient clipping is in the train config.
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  _convert_: all
  lr: 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]

# LinearLR holds end_factor after total_iters: warmup, then constant.
scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1.0e-3
  end_factor: 1.0
  total_iters: 1000
scheduler_interval: step
