# B-v2: identical to hnet_pushshapes_fused_windowed_resnet but with a HOTTER
# peak LR (1.5e-4 = 1.5x B's flat 1e-4) + warmup->cosine decay (user request:
# "go ~1.5x higher at first, then come down more"). Pair with GCLIP=1.0.
# extends _hnet_fused_windowed_resnet
defaults:
  - _hnet_fused_windowed_resnet
  - _self_

optimizer:
  lr: 1.5e-4

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 4800   # 600 epochs x 8 batches/epoch
  warmup_steps: 240 # 5% warmup up to the 1.5e-4 peak
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
