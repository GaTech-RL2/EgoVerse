defaults:
  - pusht/base@_here_

# HPT (time-chunked, no arc-tok) for PushShapes with the U-socket pusher.
#   Chunk = 32 frames of pusher targets at 30 Hz, shape (32, 3).
#   Pusher (end-effector): "u_socket", U-shaped socket (32 px inner gap,
#   10 px prongs) that grips T-stems for oriented pushing.
#   Action = 3-D target (target_x, target_y, target_theta): the socket
#   needs a commanded orientation (env.py:171-176, _VALID_PUSHERS =
#   "u_socket" branch), so per-frame action dim = 3, NOT 2 like the other
#   pushers.
eef_name: "u_socket"

robomimic_model:
  head_specs:
    shared:
      infer_ac_dims:
        pushshapes_sim: 3
      model:
        act_dim: 3
