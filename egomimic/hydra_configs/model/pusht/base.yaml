_target_: egomimic.pl_utils.pl_model.ModelWrapper

# HPT model for the PushShapes (push-T) sim environment with STANDARD
# time-indexed action chunking (no arc-length tokenizer).
#
# Sequence layout per sample:
#   slots 0..T-1 (0..31) : consecutive commanded pusher targets at the
#                          30 Hz control rate. T = 32 frames = ~1.07 s of
#                          horizon per chunk.
#
# Per-sample action tensor shape: (T, 2) = (32, 2).
# Actions are pusher target (target_x, target_y) in world pixels [0, 512].
# PushShapes has no gripper.
#
# Unit convention: the arena is 512x512 pixels (env.py:88, WORLD_SIZE =
# 512.0). Actions and xy state are all in pixels -- no cm mapping applied.
#
# Pair with a data config that returns time-chunked actions of length 32
# under the ``actions`` key (the default pushshapes packed / chunked
# dataloaders already do this -- no arc-tok transform is needed).
robomimic_model:
  _target_: egomimic.algo.hpt.algo.HPT

  camera_transforms: null

  diffusion: true
  6dof: false

  ac_keys:
    pushshapes_sim: "actions"
  shared_ac_key: "actions"

  trunk:
    embed_dim: 128
    num_blocks: 6
    num_heads: 4
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 32
    no_trunk: false
    use_domain_embedding: false
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8

  domains: ["pushshapes_sim"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
      input_dim: 128
      output_dim: 128
      widths: [128]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 4
          crossattn_dim_head: 32
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 128

  stem_specs:
    pushshapes_sim:
      state_agent_obj:
        _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
        input_dim: 5
        output_dim: 128
        widths: [128]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 128

  head_specs:
    pushshapes_sim: null
    shared:
      _target_: egomimic.models.heads.fm_policy.FMPolicy
      # T = 32 time-indexed action frames per chunk.
      action_horizon: 32
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      # PushShapes action is 2-dim (target_x, target_y).
      infer_ac_dims:
        pushshapes_sim: 2
      model:
        _target_: egomimic.models.diffusion.denoising_nets.CrossTransformer
        nblocks: 4
        cond_dim: 128
        hidden_dim: 64
        act_dim: 2
        act_seq: 32
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.stems.hpt_stems.ResNet
      output_dim: 128

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
