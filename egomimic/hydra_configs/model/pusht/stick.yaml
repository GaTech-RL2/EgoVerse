defaults:
  - pusht/base@_here_

# HPT (time-chunked, no arc-tok) for PushShapes with the stick pusher.
#   Chunk = 32 frames of pusher targets at 30 Hz, shape (32, 2).
#   Pusher (end-effector): "stick", 60 x 10 px capsule that re-orients
#   toward its velocity vector every step (env.py _ORIENTED_PUSHERS).
#   Action = 2-D target (target_x, target_y) in world pixels; orientation
#   is derived from motion, not commanded.
eef_name: "stick"
