# BC-RNN-TRANSFORMER-CHUNK8 (run 3325097): bc_rnn_pushshapes_paperexact_tx_cos +
# OBSERVATION STRIDING + ACTION CHUNKING (the two knobs that isolate obs-striding
# + action-chunking over tx_cos).
#   * obs_stride: 8  -> the policy observes/encodes only every 8 env frames; the
#       transformer history is over the SUBSAMPLED obs (rnn_horizon=10 obs-steps
#       = 80 env frames of context).
#   * chunk_len: 8   -> each obs-step predicts the NEXT 8 actions (target = the 8
#       GT actions at frames [s+8k, s+8k+8) for obs-step k). At rollout the 8
#       predicted actions are QUEUED and popped one per env frame (env fps
#       UNCHANGED; model invoked once every 8 env frames).
# extends bc_rnn_pushshapes_paperexact_tx_cos
defaults:
  - bc_rnn_pushshapes_paperexact_tx_cos
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (the only deviation from _tx_cos).
  obs_stride: 8
  chunk_len: 8

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 8)
