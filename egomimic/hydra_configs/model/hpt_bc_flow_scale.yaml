# HPT bimanual flow, scale domain (12-dim ee pose, scale intrinsics+extrinsics,
# deep 64-block trunk). extends _hpt_bc_flow_bimanual_256.
defaults:
  - _hpt_bc_flow_bimanual_256
  - _self_

robomimic_model:
  trunk:
    num_blocks: 64

  camera_transforms:
    scale_bimanual:
      _target_: egomimic.utils.egomimicUtils.CameraTransforms
      intrinsics_key: "scale" # change to base_half if using half res
      extrinsics_key: "scale"

  ac_keys:
    scale_bimanual: "actions_cartesian"

  domains: ["scale_bimanual"]

  stem_specs:
    scale_bimanual:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    scale_bimanual:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        scale_bimanual: 12
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 12
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
