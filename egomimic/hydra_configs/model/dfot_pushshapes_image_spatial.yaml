_target_: egomimic.pl_utils.pl_model.ModelWrapper

# DFoT video diffusion with DiT3D backbone (History Guided Video Diffusion).
#
# Diffusion target = VAE latent in spatial form (4, 6, 6) per timestep.
# Actions + state enter via external_cond (broadcast across spatial
# patches by AdaLN-Zero). Model predicts FUTURE IMAGE LATENTS.
#
# Key arch choices matching the reference (kwsong0113/diffusion-forcing-transformer):
#   - DiT3D backbone with AdaLN-Zero gating (zero-init residual gates)
#   - RoPE 3D positional encoding (temporal + spatial axes)
#   - Discrete diffusion, cosine schedule, pred_v, min-SNR loss weighting
#   - Non-causal attention (chunk-mode inference)

robomimic_model:
  _target_: egomimic.algo.diffusion.DFoT
  action_dim: 2
  action_horizon: 32

  sampler: "ddim"
  sampler_n_steps: 50
  sampler_eta: 0.0

  inference_mode: "chunk"
  cfg_scale: 1.0

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

  outer_stage:
    _target_: egomimic.algo.diffusion.ImageSpatialDFoTOuterStage
    action_dim: 2
    bundle_obs_keys: ["state_agent_obj"]
    bundle_obs_dims: [5]
    image_key: "front_img_1"
    state_action_proj_dim: 384
    vae_checkpoint_path: /coc/flash7/paphiwetsa3/projects/EgoVerse-pact/external_ckpts/vae_v5_last.ckpt
    cond_output_key: "fused_cond"

    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 384
      output_key: "fused_cond"
      cond_proj_widths: [384, 384]
      obs_specs: {}
      img_encoders: {}

    backbone:
      _target_: egomimic.models.diffusion.DFoTDiT3DBackbone
      latent_channels: 4
      latent_size: 6
      patch_size: 1
      action_horizon: 32
      d_model: 384
      d_cond: 384
      cond_dim: 384
      depth: 12
      num_heads: 6
      mlp_ratio: 4.0
      time_embed_dim: 256
      cond_emb_dim: 256
      use_fourier_time: false
      stochastic_time_p: 0.0
      cond_dropout_prob: 0.1
      causal: false

    diffusion:
      _target_: egomimic.models.diffusion.diffusion.discrete_diffusion.DiscreteDiffusion
      action_dim: 4
      timesteps: 1000
      beta_schedule: "cosine"
      objective: "pred_v"
      loss_weighting_strategy: "min_snr"
      snr_clip: 5.0
      clip_noise: 20.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0001

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 18800
  warmup_steps: 480
  warmup_start_factor: 0.1
  eta_min: 1.0e-5
