_target_: egomimic.pl_utils.pl_model.ModelWrapper

# BIG variant of hnet_gmm_obs_circle (2026-06-11, user: more params, GMM head
# mainly). Scaled vs base: d_model 256->384, num_heads 8->12 (head_dim 32 kept,
# rotary full), trunk T4->T6, d_intermediate 768->1152, GMM num_modes 5->16,
# obs encoder widths + image features scaled. Recipe UNCHANGED (minmax/fp32/
# constLR/full-hist/chunk targets 2.0) — capacity is the only variable vs
# fairmatch (0.323 anchor). Core ~2.6M -> ~9-10M (closer to txar 12M).
robomimic_model:
  _target_: egomimic.algo.hnet.PackedAlgoBase
  d_cond: 384
  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"
  loss:
    _target_: egomimic.algo.hnet.GMMLoss
  outer_stage:
    _target_: egomimic.algo.hnet.HNetOuterStage
    action_dim: 2
    action_horizon: 2560
    d_model: 384
    action_head_type: gmm
    gmm_head:
      _target_: egomimic.models.heads.gmm_head.GMMActionHead
      d_model: 384
      action_dim: 2
      num_modes: 32
      chunk_len: 8
      min_std: 1.0e-4
      std_activation: softplus
      low_noise_eval: true
      head_hidden_dim: 1024
      head_n_layers: 3
    cond_encoder:
      _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
      d_cond: 384
      output_key: "fused_cond"
      obs_specs: {}
      img_encoders: {}
    input_modules:
      - _target_: egomimic.models.stems.input_modules.ObsToken
        d_model: 384
        obs_encoder:
          _target_: egomimic.models.stems.cond_encoders.CondEncoderModule
          d_cond: 384
          output_key: "fused_cond"
          cond_proj_widths: [384, 384]
          obs_specs:
            state_agent_obj:
              input_dim: 5
              embed_dim: 96
              widths: [192]
          img_encoders:
            front_img_1:
              _target_: egomimic.models.stems.visual_core.VisualCore
              in_channels: 3
              image_size: 96
              num_kp: 48
              feature_dimension: 96
              pretrained: false
              crop_aug: true
              crop_height: 86
              crop_width: 86
              crop_eval_mode: random
              crop_sample_mode: v02
    hnet:
      _target_: egomimic.models.hnet.hnet.HNet
      stages:
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 384
          output_hidden_dim: 384
          target_compression_ratio: 2.0
          ratio_loss_weight: 0.03
          cond_key: null
        - _target_: egomimic.models.hnet.stages.ChunkerStage
          input_hidden_dim: 384
          output_hidden_dim: 384
          target_compression_ratio: 2.0
          ratio_loss_weight: 0.03
          cond_key: null
        - _target_: egomimic.models.hnet.stages.ComputeStage
          input_hidden_dim: 384
          output_hidden_dim: 384
          cond_key: null
          d_cond: 0
          causal: true
          main_network:
            arch_layout: "T6"
            d_model: 384
            d_intermediate: 1152
            num_heads: 12
            cond: false
            rotary_emb_dim: 32
            dropout: 0.0
            resid_dropout: 0.0
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 200000
  warmup_steps: 2000
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
