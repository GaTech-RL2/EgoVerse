# hpt_bc_flow_pushshapes_big.yaml
# Scaled-UP HPT-flow trunk to match the firstend H-Net 2-stage single-embodiment
# budget (~39.32M). ONLY the transformer trunk capacity is grown
# (embed_dim 128->512, num_blocks 6->8, num_heads 4->8, head_dim stays 64).
# The flow head and stems keep their STRUCTURE unchanged; the dependent
# interface widths (modality_embed_dim, stem in/out dims, ResNet output_dim,
# head cond_dim) are forced to track embed_dim=512 because they form the shared
# token bus into/out of the trunk. Verified single-emb instantiation = 39.2039M
# (0.30% under target).
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data.dataset.data_schematic}

  camera_transforms: null

  diffusion: true
  6dof: false

  ac_keys:
    pushshapes_sim: "actions"

  trunk:
    embed_dim: 512        # SCALED UP from 128
    num_blocks: 8         # SCALED UP from 6
    num_heads: 8          # SCALED UP from 4 (head_dim=512/8=64)
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: ${data.action_horizon}
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: ""
  reverse_kl_samples: 8

  domains: ["pushshapes_sim"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 512      # forced: matches trunk embed_dim / ResNet output_dim
      output_dim: 512     # forced: stem tokens feed the trunk bus
      widths: [512]       # forced: matches output_dim
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 4
          crossattn_dim_head: 32
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 512   # forced: post-stem token dim == trunk embed_dim

  stem_specs:
    pushshapes_sim:
      state_agent_obj:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 5
        output_dim: 512   # forced: stem tokens feed the trunk bus
        widths: [512]     # forced: matches output_dim
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 4
            crossattn_dim_head: 32
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 512  # forced: post-stem token dim == trunk embed_dim

  head_specs:
    pushshapes_sim:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: ${data.action_horizon}
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        pushshapes_sim: 2
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 4
        cond_dim: 512     # forced: conditioning width == trunk embed_dim (head structure unchanged: hidden_dim stays 64)
        hidden_dim: 64
        act_dim: 2
        act_seq: ${data.action_horizon}
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 512     # forced: ResNet output feeds the image stem input_dim

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 200
  eta_min: 1e-5
