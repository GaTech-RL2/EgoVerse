_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.pi.PI
  config:
    pytorch_training_precision: bfloat16
    pytorch_weight_path: /storage/project/r-dxu345-0/rco3/EgoVerse/egomimic/algo/pi_checkpoints/pi05_base_pytorch
    model:
      pi05: true
      action_dim: 32
      action_horizon: 100
      max_token_len: 180

  # Prompt assembly + tokenization. The PI algo owns the tokenizer because
  # the prompt template is model-specific (paligemma + pi0.5 anchor). All
  # of these were previously in the data config.
  #
  # Three orthogonal inclusion flags govern what gets spliced into the prompt:
  #   proprio_in_prompt — append "State: <bins>" (pi0.5 discretized proprio)
  #   embodiment_label  — append "Embodiment: <name>"
  #   control_mode      — append "Control mode: <descriptor>" (per-embodiment dict
  #                       or null to omit; falls back to "cam frame xyzypr ..."
  #                       defaults if a key isn't matched)
  #
  # If any of these is active, the prompt is rendered as
  #   "Task: {prompt}, <blocks>;\nAction: "
  # Otherwise the raw prompt is tokenized as-is (pre-pi0.5 / language behaviour).
  #
  # Override per-run for lang / wristframe variants, e.g.
  #   model.robomimic_model.annotation_key=annotations
  #   model.robomimic_model.default_prompt="this is a bad action"
  #   model.robomimic_model.control_mode='{aria: "wrist frame xyzypr per arm", eva: "wrist frame xyzypr gripper per arm"}'
  tokenizer_model_name: "google/paligemma-3b-mix-224"
  tokenizer_max_length: 128
  sampling_mode: "random"
  annotation_key: "annotations"
  default_prompt: ""
  proprio_in_prompt: true
  embodiment_label: true
  state_num_bins: 256
  control_mode: null

  # Short-term memory (recent EE-pose history spliced into the prompt as a
  # coarse "Prev:" delta block). OFF by default → behaviour unchanged. To
  # enable, set prev_state_in_prompt=true, history_len=K (K>1), and match the
  # data side so proprio arrives as [B,K,D], e.g.
  #   +data.train_datasets.eva_bimanual.resolver.key_map.proprio_history=K
  # (the get_keymap _target_ forwards proprio_history to every proprio key).
  # Mind the token budget (tokenizer_max_length=128): keep K small and bins
  # coarse, or bump tokenizer_max_length (<= model.max_token_len=180).
  prev_state_in_prompt: false
  history_len: 1
  prev_state_num_bins: 64

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: 224
        interpolation: 3
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: 224
        interpolation: 3

enable_grad_norm: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3e-5
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 1e-10

scheduler:
  _target_: transformers.optimization.get_cosine_with_min_lr_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 1000
  num_training_steps: 200000
  num_cycles: 0.5
  min_lr: 1e-5

scheduler_interval: step
