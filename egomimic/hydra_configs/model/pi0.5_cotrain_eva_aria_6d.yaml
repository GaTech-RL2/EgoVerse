defaults:
  - pi0.5_cotrain_eva_aria
  - _self_

# pi0.5_cotrain_eva_aria without the "Embodiment: <name>" prompt block.
# Actions arrive already in xyz+6D(+gripper) layout (via the `cartesian_6d`
# transform mode) and normalized by the standard pipeline; the forward pass
# only packs them into the 32D vector. The proprio ee_pose arrives 6D-encoded
# as well (eva 20D, human 18D) — the 6D transform modes convert both, since
# normalized YPR proprio saturates yaw/roll at ±π just like the action
# rotations did.
robomimic_model:
  # Do not splice "Embodiment: <name>" into the prompt (pi0.5_base defaults it on).
  embodiment_label: false
