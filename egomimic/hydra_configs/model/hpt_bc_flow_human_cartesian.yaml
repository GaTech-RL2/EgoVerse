# HPT flow-matching BC on human data with the CARTESIAN head-frame action
# (18-D xyz+rot6d per arm pair) and the 20-D gripper-padded ee_pose proprio.
# The repo default for human data is the 144-D hand-keypoint action
# (hpt_bc_flow_human); use this with a cartesian data override, e.g.
#   data=mecka data.train_datasets.human_bimanual.resolver.key_map.keymap_mode=cartesian \
#     data.train_datasets.human_bimanual.resolver.key_map.include_ee_pose=false \
#     data.train_datasets.human_bimanual.resolver.transform_list.mode=cartesian_6d \
#     data.train_datasets.human_bimanual.resolver.transform_list.include_ee_pose=false
defaults:
  - hpt_bc_flow_human
  - _self_

robomimic_model:
  dims:
    # cartesian_6d + pad_proprio_gripper: action [xyz | rot6d] x 2 = 18,
    # proprio ee_pose grip-padded to the robot 20-D layout.
    human_bimanual: {proprio: 20, action: 18}

  ac_keys:
    human_bimanual: "actions_cartesian"

  stem_specs:
    human_bimanual:
      state_keypoints: null
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: ${model.robomimic_model.dims.human_bimanual.proprio}
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
