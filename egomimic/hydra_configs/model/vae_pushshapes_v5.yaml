# VAE v5: same architecture as v4 (spatial latent + residual + NN-Upsample +
# beta=0 + LPIPS@1.0) but with VGG-net LPIPS instead of AlexNet. VGG has
# finer-grained spatial features before pooling (SDXL uses VGG); ~3x more LPIPS
# compute per step but well within H200 budget.
defaults:
  - vae_pushshapes_v4
  - _self_

robomimic_model:
  lpips_net: "vgg"   # <- only change vs v4
