<title>Pipeline Config Graph — Dependency View</title>
<style>
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --line:#D3D9E2; --ink:#161B22; --dim:#5A6472;
  --A:#B77A12; --S:#0E7C99; --route:#B03A76; --shared:#7A8391;
  --grid:#DCE1E9; --shadow:0 1px 2px rgba(16,22,34,.08),0 8px 24px rgba(16,22,34,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F14; --panel:#131A22; --line:#242E3A; --ink:#E4EAF2; --dim:#8592A4;
  --A:#E8B04B; --S:#4BC5E8; --route:#D95A9A; --shared:#6B7789; --grid:#1B232D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0B0F14; --panel:#131A22; --line:#242E3A; --ink:#E4EAF2; --dim:#8592A4;
  --A:#E8B04B; --S:#4BC5E8; --route:#D95A9A; --shared:#6B7789; --grid:#1B232D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:12.5px}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--dim)}
button:focus-visible,select:focus-visible{outline:2px solid var(--A);outline-offset:2px}
select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;margin-left:auto}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:0;height:calc(100vh - 116px);min-height:460px}
@media(max-width:860px){main{grid-template-columns:1fr;height:auto}
  #wrap{height:56vh}#side{border-left:none;border-top:1px solid var(--line)}}
#wrap{position:relative}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
#side{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px 18px}
#side h2{margin:0 0 2px;font-size:14px;font-weight:650}
#side .k{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  margin:14px 0 6px}
table{border-collapse:collapse;width:100%;font-size:12px}
td{padding:5px 0;vertical-align:top;word-break:break-word;border-bottom:1px solid var(--line)}
td:first-child{color:var(--dim);padding-right:14px;width:52%}
.cfg-block{margin:9px 0 12px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.cfg-title{padding:6px 9px;background:var(--bg);color:var(--dim);font-size:11px;
  letter-spacing:.04em;overflow-wrap:anywhere}
.cfg-target{display:block;margin-top:2px;color:var(--ink);font-weight:650;letter-spacing:0}
.cfg-body{padding:0 9px 8px}.cfg-body .cfg-block{margin-left:7px}
.cfg-block pre{margin:0;padding:9px;white-space:pre-wrap;overflow-wrap:anywhere;
  color:var(--ink);font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  border:1px solid currentColor;margin-right:5px}
.keys span{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11.5px;
  background:var(--bg);border:1px solid var(--line);margin:0 4px 4px 0}
footer{display:flex;flex-wrap:wrap;gap:14px;padding:10px 22px;border-top:1px solid var(--line);
  color:var(--dim);font-size:12px;align-items:center}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
kbd{border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;
  background:var(--panel);font-family:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
</style>

<header>
  <div>
    <h1>Pipeline Routing</h1>
    <div class="sub">Dependency-aware layout with separated branch and skip-edge lanes. Drag to rotate; hover a node or edge, click a node to pin it.</div>
  </div>
  <select id="pick"></select>
  <div class="seg" role="group" aria-label="Layer visibility">
    <button id="tgNodes" type="button" aria-pressed="true">nodes</button>
    <button id="tgEdges" type="button" aria-pressed="true">edges</button>
  </div>
  <button id="reset" type="button">Reset view</button>
</header>

<main>
  <div id="wrap"><canvas id="c"></canvas></div>
  <aside id="side"><div class="sub">Hover a node or an edge to inspect it.</div></aside>
</main>

<footer>
  <span class="lg"><i class="sw" style="background:var(--shared)"></i>single fused condition dataflow</span>
  <span style="margin-left:auto"><kbd>click</kbd> pin a node &nbsp; <kbd>drag</kbd> rotate &nbsp; <kbd>shift</kbd>+drag or right-drag pan &nbsp; <kbd>scroll</kbd> zoom</span>
</footer>

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const side = document.getElementById('side'), pick = document.getElementById('pick');
Object.keys(G).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;pick.appendChild(o)});
let cur = Object.keys(G)[0], rotY=-0.62, rotX=0.36, zoom=1, hover=null, drag=null;
let selected=null;             // click-pinned node; survives pointerleave
let hoverEdge=null;            // edges are hoverable too, and hit-tested after nodes
let panX=0, panY=0;            // free translation, in device pixels
let showNodes=true, showEdges=true;   // independent layer visibility
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = () => ({A:css('--A'),S:css('--S'),route:css('--route'),shared:css('--shared'),
                    both:css('--shared'),grid:css('--grid'),ink:css('--ink'),dim:css('--dim')});

function fan(g){
  // Several keys can run between the SAME pair of stages (A_L1d and S_L1d both
  // go trunk->dechunk; route_L1 + two residuals all go chunk->dechunk).  The
  // control point is derived from the endpoints alone, so without this they
  // trace one identical curve and only the last-drawn colour is visible.
  if(g.__fanned) return;
  const cnt=new Map(), seen=new Map(), key=e=>e.a+'>'+e.b;
  g.edges.forEach(e=>cnt.set(key(e),(cnt.get(key(e))||0)+1));
  g.edges.forEach(e=>{const i=seen.get(key(e))||0;
    e.fi=i; e.fn=cnt.get(key(e)); seen.set(key(e),i+1);});
  g.__fanned=true;
}
function layout(){
  const g = G[cur], n = g.nodes.length;
  // Longest-path rank gives every dependency a left-to-right direction while
  // allowing independent branches to share a column instead of forming a line.
  const rank=Array(n).fill(0);
  g.edges.slice().sort((a,b)=>a.b-b.b||a.a-b.a).forEach(e=>{
    rank[e.b]=Math.max(rank[e.b],rank[e.a]+1);
  });
  const maxRank=Math.max(...rank,1), layers=new Map(), slot=Array(n).fill(0);
  rank.forEach((r,i)=>{if(!layers.has(r))layers.set(r,[]);layers.get(r).push(i)});
  // Stable ordering keeps YAML order, while centering and spreading siblings
  // makes the target and Gaussian-noise branches visibly distinct.
  layers.forEach(ids=>ids.forEach((id,j)=>slot[id]=j-(ids.length-1)/2));
  return g.nodes.map(nd=>({...nd, rank:rank[nd.i],
    X:(rank[nd.i]/maxRank-0.5)*3.35,
    Y:slot[nd.i]*1.28,
    Z:0}));
}
function project(p,w,h){
  const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);
  let x=p.X*cy - p.Z*sy, z=p.X*sy + p.Z*cy, y=p.Y*cx - z*sx; z=p.Y*sx + z*cx;
  const d=3.0, s=d/(d+z)*Math.min(w,h)*0.42*zoom;
  return {x:w/2+x*s+panX, y:h/2-y*s+panY, z, s};
}
function draw(){
  fan(G[cur]);
  const w=cv.width=cv.clientWidth*devicePixelRatio, h=cv.height=cv.clientHeight*devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h);
  const C=COL(), P=layout().map(p=>({...p,...project(p,w,h)}));
  // edges — fanned apart so parallel keys stay individually visible
  const EG=[];
  G[cur].edges.forEach((e,ei)=>{
    const a=P[e.a],b=P[e.b]; if(!a||!b){EG.push(null);return;}
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    const off=(e.fi-(e.fn-1)/2)*20*devicePixelRatio;   // spread parallel keys
    const mx=(a.x+b.x)/2 - dy/L*off;
    const span=Math.max(1,Math.abs((b.rank??e.b)-(a.rank??e.a)));
    // Skip edges alternate above/below the direct path. This gives them their
    // own visible lanes instead of stacking every long dependency on one arc.
    const sign=((e.a*7+e.b*3+e.fi)%2) ? 1 : -1;
    const lane=span>1 ? sign*Math.min(Math.abs(dx)*(0.13+0.025*span),120*devicePixelRatio)
                      : -Math.abs(dx)*0.045;
    const my=(a.y+b.y)/2 + lane + dx/L*off;
    EG.push({ax:a.x,ay:a.y,mx,my,bx:b.x,by:b.y});
    if(!showEdges) return;
    const anchor = hover!=null ? hover : selected;
    const lit = hoverEdge===ei ||
      (hoverEdge==null && (anchor==null||anchor===e.a||anchor===e.b));
    ctx.strokeStyle=C[e.s]||C.shared;
    ctx.globalAlpha = lit ? .9 : .10;
    ctx.lineWidth=(hoverEdge===ei?3:(anchor===e.a||anchor===e.b?2.2:1.1))*devicePixelRatio;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(mx,my,b.x,b.y);ctx.stroke();
  });
  window.__E = showEdges ? EG : null;
  ctx.globalAlpha=1;
  // nodes back-to-front
  if(showNodes) P.map((p,i)=>[p,i]).sort((u,v)=>v[0].z-u[0].z).forEach(([p,i])=>{
    const anch = hover!=null ? hover : selected;
    const r=((hover===i||selected===i)?8:5.6)*devicePixelRatio*(p.s/ (Math.min(w,h)*0.42*zoom) *1.6+0.55);
    ctx.globalAlpha=(anch==null||anch===i)?1:.35;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(r,3*devicePixelRatio),0,7);
    ctx.fillStyle=C[p.stream]||C.shared;ctx.fill();
    if(hover===i){ctx.strokeStyle=C.ink;ctx.lineWidth=1.6*devicePixelRatio;ctx.stroke();}
    if(selected===i){                       // pinned: a second, offset ring
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(r,3*devicePixelRatio)+4*devicePixelRatio,0,7);
      ctx.strokeStyle=C.ink; ctx.lineWidth=2*devicePixelRatio; ctx.stroke();
    }
    if(hover===i||selected===i||p.sec!=='MAIN TRUNK'||['Chunk','Apex','Dechunk','Mix'].includes(p.t)){
      ctx.fillStyle=(hover===i||selected===i)?C.ink:C.dim;
      ctx.font=`${(hover===i||selected===i)?12:10.5}px ui-monospace,monospace`.replace('px',`px`);
      ctx.font=`${((hover===i||selected===i)?12:10.5)*devicePixelRatio}px ui-monospace,monospace`;
      ctx.fillText(p.t, p.x+10*devicePixelRatio, p.y+4*devicePixelRatio);
    }
  });
  ctx.globalAlpha=1;
  window.__P = showNodes ? P : null;     // no hit-testing against hidden nodes
}
function edgeHit(mx,my){
  const E=window.__E; if(!E) return null;
  let best=null, bd=(13*devicePixelRatio)**2;
  E.forEach((g,i)=>{
    if(!g) return;
    for(let t=0;t<=1.0001;t+=1/16){          // sample the quadratic, keep the nearest
      const u=1-t;
      const x=u*u*g.ax+2*u*t*g.mx+t*t*g.bx, y=u*u*g.ay+2*u*t*g.my+t*t*g.by;
      const d=(x-mx)**2+(y-my)**2;
      if(d<bd){bd=d;best=i;}
    }
  });
  return best;
}
function showEdge(i){
  const g=G[cur], e=g.edges[i];
  if(!e){show(-1);return;}
  const A=g.nodes[e.a], B=g.nodes[e.b];
  const c={A:'var(--A)',S:'var(--S)',route:'var(--route)'}[e.s]||'var(--shared)';
  side.innerHTML = `<h2 class="mono">${e.k}</h2>
    <div><span class="chip" style="color:${c}">${e.s}</span>
         <span class="chip" style="color:var(--dim)">batch key</span></div>
    <div class="k">written by</div>
    <div class="keys"><span class="mono">${A.t}</span></div>
    <div class="k">read by</div>
    <div class="keys"><span class="mono">${B.t}</span></div>`;
}
function show(i, pinned){
  const nd = G[cur].nodes[i];
  if(!nd){side.innerHTML='<div class="sub">Hover a node or an edge to inspect it.</div>';return;}
  const c = {A:'var(--A)',S:'var(--S)',route:'var(--route)'}[nd.stream]||'var(--shared)';
  const esc = v => String(v).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const parsed = v => {
    if(typeof v!=='string' || !/^[\[{]/.test(v.trim())) return v;
    try{return JSON.parse(v)}catch(_){return v}
  };
  const entries=Object.entries(nd.p).map(([k,v])=>[k,parsed(v)]);
  const rows=entries.filter(([,v])=>v===null||typeof v!=='object').map(([k,v])=>
    `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(v===null?'null':v)}</td></tr>`).join('');
  const objectBlock=(label,obj)=>{
    if(!obj._target_){return `<div class="cfg-block"><div class="cfg-title mono">${esc(label)}</div>`+
      `<pre>${esc(JSON.stringify(obj,null,2))}</pre></div>`;}
    const target=String(obj._target_), short=target.split('.').pop();
    const inner=Object.entries(obj).filter(([k])=>k!=='_target_').map(([k,v])=>[k,parsed(v)]);
    const scalar=inner.filter(([,v])=>v===null||typeof v!=='object').map(([k,v])=>
      `<tr><td class="mono">${esc(k)}</td><td class="mono">${esc(v===null?'null':v)}</td></tr>`).join('');
    const nested=inner.filter(([,v])=>v!==null&&typeof v==='object').map(([k,v])=>
      objectBlock(k,v)).join('');
    return `<div class="cfg-block"><div class="cfg-title mono">${esc(label)}`+
      `<span class="cfg-target">${esc(short)}</span><span>${esc(target)}</span></div>`+
      `<div class="cfg-body"><table>${scalar}</table>${nested}</div></div>`;
  };
  const blocks=entries.filter(([,v])=>v!==null&&typeof v==='object').map(([k,v])=>
    objectBlock(k,v)).join('');
  const keys = a => a.length? a.map(k=>`<span class="mono">${k}</span>`).join('') : '<span class="sub">—</span>';
  side.innerHTML = `<h2 class="mono">${nd.t}</h2>
    <div><span class="chip" style="color:${c}">${nd.stream}</span>
         <span class="chip" style="color:var(--dim)">${nd.sec}</span>
         <span class="chip" style="color:var(--dim)">node ${nd.i}</span>
         ${pinned?'<span class="chip" style="color:var(--A)">pinned \u00b7 click again to release</span>':''}</div>
    <div class="k">reads</div><div class="keys">${keys(nd.in)}</div>
    <div class="k">writes</div><div class="keys">${keys(nd.out)}</div>
    <div class="k">hyperparameters</div><table>${rows||'<tr><td class="sub">none</td></tr>'}</table>${blocks}`;
}
cv.addEventListener('pointermove',ev=>{
  const r=cv.getBoundingClientRect(), mx=(ev.clientX-r.left)*devicePixelRatio, my=(ev.clientY-r.top)*devicePixelRatio;
  if(drag){
    const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y;
    if(drag.pan){ panX+=dx*devicePixelRatio; panY+=dy*devicePixelRatio; }
    else { rotY+=dx*0.01; rotX+=dy*0.008; }   // no clamp: full free rotation
    drag={x:ev.clientX,y:ev.clientY,pan:drag.pan}; draw(); return;}
  let best=null,bd=1e9;
  (window.__P||[]).forEach((p,i)=>{const d=(p.x-mx)**2+(p.y-my)**2; if(d<bd){bd=d;best=i}});
  const h = bd < (22*devicePixelRatio)**2 ? best : null;
  const he = h==null ? edgeHit(mx,my) : null;      // nodes win ties
  if(h!==hover || he!==hoverEdge){
    hover=h; hoverEdge=he; refreshPanel(); draw();
  }
});
cv.addEventListener('pointerdown',ev=>{
  const pan = ev.shiftKey || ev.button===1 || ev.button===2;
  drag={x:ev.clientX,y:ev.clientY,pan,x0:ev.clientX,y0:ev.clientY,moved:0};
  cv.setPointerCapture(ev.pointerId);
  cv.style.cursor = pan ? 'move' : 'grabbing';});
cv.addEventListener('pointerup',ev=>{
  // a click is a pointerup that barely moved -- otherwise it was a rotate/pan
  const moved = drag ? Math.hypot(ev.clientX-drag.x0, ev.clientY-drag.y0) : 99;
  drag=null; cv.style.cursor='grab';
  if(moved<=4 && hover!=null){
    selected = (selected===hover) ? null : hover;   // click again to unpin
    refreshPanel(); draw();
  }});
cv.addEventListener('contextmenu',e=>e.preventDefault());   // right-drag pans
function refreshPanel(){
  // hover previews; the pinned node is what you fall back to.
  if(hover!=null) show(hover);
  else if(hoverEdge!=null) showEdge(hoverEdge);
  else if(selected!=null) show(selected, true);
  else show(-1);
}
cv.addEventListener('pointerleave',()=>{drag=null;cv.style.cursor='grab';
  hover=null;hoverEdge=null;refreshPanel();draw()});
cv.addEventListener('wheel',ev=>{ev.preventDefault();zoom=Math.max(.05,Math.min(40,zoom*(ev.deltaY>0?.9:1.111)));draw()},{passive:false});
document.getElementById('reset').addEventListener('click',()=>{
  rotY=-0.62; rotX=0.36; zoom=1; panX=0; panY=0; draw();});
[['tgNodes',()=>showNodes=!showNodes,()=>showNodes],
 ['tgEdges',()=>showEdges=!showEdges,()=>showEdges]].forEach(([id,flip,get])=>{
  const b=document.getElementById(id);
  b.addEventListener('click',()=>{
    flip(); b.setAttribute('aria-pressed',String(get()));
    if(!showNodes){hover=null;selected=null;}   // hidden nodes cannot stay hovered or pinned
    if(!showEdges) hoverEdge=null;
    refreshPanel();
    draw();});
});
pick.addEventListener('change',e=>{cur=e.target.value;hover=null;hoverEdge=null;selected=null;show(-1);draw()});
addEventListener('resize',draw);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
draw();
