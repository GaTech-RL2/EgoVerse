name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.8.6" # keep in sync with .pre-commit-config.yaml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx ruff@${RUFF_VERSION} check egomimic tests
      - name: ruff format
        run: uvx ruff@${RUFF_VERSION} format --check . --exclude external

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      # openpi cannot be locked (its fork pins lerobot -> av>=14.2, numpy<2; see
      # pyproject), so install it the way the lab venv does: no deps, plus the
      # few packages the Pi wrapper's import chain needs, pinned to the lab venv
      # and constrained so no locked package moves.
      - name: Install openpi without its dependencies (Pi train-step tests)
        run: |
          git submodule update --init --depth 1 external/openpi
          uv pip freeze | grep -v '^-e' > "$RUNNER_TEMP/locked.txt"
          uv pip install --no-deps -e external/openpi
          uv pip install -c "$RUNNER_TEMP/locked.txt" \
            flax==0.10.2 jax==0.5.3 augmax==0.4.1 beartype==0.19.0 \
            jaxtyping==0.2.36 orbax-checkpoint==0.11.13
      # The Pi wrapper loads this tokenizer; the tests run with HF offline.
      - name: Cache PaliGemma tokenizer
        id: tokenizer-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--google--paligemma-3b-mix-224
          key: hf-paligemma-3b-mix-224-tokenizer-v1
      - name: Download PaliGemma tokenizer (gated model; needs the HF_TOKEN secret)
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set; it needs access to google/paligemma-3b-mix-224"
            exit 1
          fi
          uv run --no-sync python -c "from huggingface_hub import snapshot_download; snapshot_download('google/paligemma-3b-mix-224', allow_patterns=['tokenizer*', 'special_tokens_map.json', 'added_tokens.json'])"
      # --no-sync: a sync would not remove openpi, but never let it touch the venv.
      - name: Unit tests (hermetic; includes the Hydra compose test over every config)
        env:
          EGOVERSE_REQUIRE_PI: "1" # fail instead of skipping the Pi train-step tests
        run: uv run --no-sync pytest tests/unit -q -p no:cacheprovider

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Build wheel
        run: uv build --wheel
      # Wheel *contents* are asserted by tests/unit/test_packaging.py; this only
      # proves the built wheel installs and imports outside the checkout.
      - name: Install into a fresh venv and import
        run: |
          uv venv smoke --python 3.11
          uv pip install --python smoke/bin/python --no-deps dist/*.whl
          cd /tmp && "${GITHUB_WORKSPACE}/smoke/bin/python" -c "import egomimic, os; p = os.path.dirname(egomimic.__file__); assert 'site-packages' in p, p; print(p)"
