    reason: >-
      The only current UNITE telemetry call is inside the alternating-update
      branch, which is disabled when unite_flow_updates_per_reconstruction is 0.
    unite_flow_updates_per_reconstruction: 0
    unite_gradient_telemetry_every_n_steps: 0
    joint_update_semantics_must_be_preserved: true
    prohibited_workaround: >-
      Do not set unite_flow_updates_per_reconstruction above 0 merely to emit
      telemetry; that changes the optimizer-step objective to alternating
      reconstruction-only and flow-only updates.
