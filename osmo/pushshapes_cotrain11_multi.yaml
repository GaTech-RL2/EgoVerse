# EgoVerse arc-tokenizer cotrain on OSMO — 1 node x 8 L40S, no submitit.
#
# Differences vs the PACE commands:
#   * no `-m` / `hydra/launcher=submitit_pace_l40s` — Lightning DDP runs the 8
#     ranks directly inside this container (`launch_params.gpus_per_node=8`
#     feeds `trainer/ddp.yaml`'s `devices`).
#   * per-GPU batch_size 32 -> 4 (32/8) on both train and valid dataloaders.
#   * no pre-staged dataset. data/arc_tests_cotrain*.yaml use S3EpisodeResolver,
#     which resolves the episode set from SQL and syncs it from R2 into
#     ${paths.dataset_dir} on its own — /storage/project/r-dxu345-0 (PACE) does
#     not exist on OSMO, so the configs do the download.
#   * norm stats are computed ONCE on 1 GPU, then the 8-GPU run consumes the
#     JSON. trainHydra.py:127 computes stats unguarded by rank, so letting all
#     8 DDP ranks do it would be 8x redundant work over 862 episodes plus a
#     write race on norm_stats.json. This also means the dataset download
#     happens once, in a single process, before the 8-rank run starts.
#
# `bounds_check: false` (no-bounds) and `lr: 3e-4` + `scheduler: null`
# (constant LR) are already baked into the data/model configs on the
# rpunamiya/arc-length-tokenizer branch — no override needed.

workflow:
  # Set per submission so the two variants are distinguishable in
  # `osmo workflow list` without cross-referencing the trailing counter.
  # Convention: arc-<variant>-<hardware>, e.g.
  #   arc-baseline-cart-8xl40s
  #   arc-tok-d20m15-8xl40s
  name: "{{job_name}}"

  tasks:
  - name: train
    image: nvcr.io/nvidia/pytorch:25.06-py3

    # egoverse-aws is what setup_secret.sh needs to pull the R2 keys and
    # SECRETS_ARN (the DB password S3EpisodeResolver reads through
    # create_default_engine) out of Secrets Manager.
    # See osmo/README.md for the `osmo credential set` commands.
    credentials:
      egoverse-github:
        GITHUB_TOKEN: github_token
      egoverse-aws:
        AWS_ACCESS_KEY_ID: aws_access_key_id
        AWS_SECRET_ACCESS_KEY: aws_secret_access_key
        AWS_DEFAULT_REGION: aws_region
      egoverse-wandb:
        WANDB_API_KEY: wandb_api_key

    environment:
      BRANCH: "{{branch}}"
      # Space-separated VARIANT names. data cfg is pusht/cotrain11_<v> and
      # model cfg is bf/bf_cotrain11_<v>, so one token names both.
      VARIANTS: "{{variants}}"
      GPUS_PER_RUN: "{{gpus_per_run}}"
      RUN_DESC: "{{run_desc}}"
      NUM_GPU: "{{num_gpu}}"
      BATCH_SIZE: "{{batch_size}}"
      NUM_WORKERS: "{{num_workers}}"
      # Space-separated embodiments present in the data config. Human-only
      # keypoint configs have no eva_bimanual, and overriding a key that is
      # not in the struct is a hard hydra error.
      EMBODIMENTS: "{{embodiments}}"
      # Sweep runs cap epochs to rank configs without paying the full 2000.
      MAX_EPOCHS: "{{max_epochs}}"
      JOB_NAME: "{{job_name}}"
      # logger/wandb.yaml hardcodes entity rl2-group (the Georgia Tech team).
      # An API key that lacks access to it fails at wandb.init() with
      # "CommError: permission denied" — after the dataset pull and norm-stats
      # phase have already run, so get this right before submitting.
      WANDB_ENTITY: "{{wandb_entity}}"
      WORKDIR: /workspace
      DATASET_DIR: /workspace/pushshapes
      PUSHSHAPES_ROOT: /workspace/pushshapes
      GAP_ROW: "{{gap_row}}"
      N_PER_EMB: "{{n_per_emb}}"
      NCCL_DEBUG: WARN
      TOKENIZERS_PARALLELISM: "false"
      HYDRA_FULL_ERROR: "1"

    command: ["bash"]
    args: ["/tmp/entry.sh"]

    files:
    - path: /tmp/entry.sh
      contents: |
        #!/usr/bin/env bash
        exec > >(tee /tmp/entry_script.log) 2>&1
        set -euxo pipefail

        # ---------------------------------------------------------------- deps
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          git curl unzip ca-certificates build-essential \
          libgl1 libglib2.0-0 libegl1 libosmesa6 ffmpeg

        # uv (EgoVerse ships a uv.lock; torch 2.7.1 comes from the lock, so the
        # base image only needs a working CUDA driver + glibc)
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"

        # s5cmd — what S3EpisodeResolver._sync_s3_to_local shells out to
        curl -sSfL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz \
          | tar xz -C /usr/local/bin s5cmd

        # awscli — setup_secret.sh calls `aws secretsmanager`
        curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update
        rm -rf /tmp/awscliv2.zip /tmp/aws

        # --------------------------------------------------------------- clone
        mkdir -p "$WORKDIR" && cd "$WORKDIR"
        git clone --depth 1 --branch "$BRANCH" --single-branch \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/GaTech-RL2/EgoVerse.git" EgoVerse
        cd "$WORKDIR/EgoVerse"
        git rev-parse HEAD

        uv sync --frozen
        source .venv/bin/activate

        # The SIMULATOR's dependencies are in neither pyproject.toml nor
        # uv.lock, so `uv sync --frozen` yields an env where
        # Tsimulation/sim_v2/pushshapes/env.py cannot import at all -- it pulls
        # gymnasium, pygame, pymunk and shapely at module scope. Without these
        # SimRolloutEval constructs fine and then dies at the first rollout, in
        # phase 2, after training has started.
        #
        # Installed here rather than added to pyproject/uv.lock on purpose: the
        # lock is shared with every other EgoVerse run, and regenerating it to
        # land what is effectively a test-time dependency is a far larger blast
        # radius than an explicit install. Revisit if the sim becomes a
        # first-class dependency.
        #
        # pymunk MUST be 7.x: the sim uses Space.on_collision, which is 7.x API,
        # and 6.9.0 fails in reset().
        uv pip install "pymunk==7.3.0" gymnasium pygame shapely

        # Fail in seconds if the sim still cannot come up, rather than hours
        # into training at the first rollout.
        SDL_VIDEODRIVER=dummy python - <<'SIMCHECK'
        import numpy as np
        from Tsimulation.sim_v2.pushshapes.env import PushShapesEnv
        env = PushShapesEnv(object_shape="T", pusher_shape="gripper",
                            obstacle_level=0, image_size=96)
        env.reset(seed=0)
        env.step(np.zeros(len(env.agent.action_spec), dtype=np.float64))
        import pymunk
        assert pymunk.version.startswith("7."), f"pymunk {pymunk.version}, need 7.x"
        print(f"SIMCHECK OK: pymunk {pymunk.version}, env constructs and steps")
        SIMCHECK

        # --------------------------------------------------------- credentials
        # Writes ~/.egoverse_env with R2_* (for the s5cmd sync) and SECRETS_ARN
        # (for the SQL episode table). Both are what S3EpisodeResolver needs.
        bash ./egomimic/utils/aws/setup_secret.sh
        test -s "$HOME/.egoverse_env"

        # ---------------------------------------------------------- preflight
        # wandb.init() is not reached until phase 2, i.e. after the ~155GB pull
        # and the norm-stats phase (~2.5h). A key without access to
        # $WANDB_ENTITY fails there and throws all of it away, so check the
        # entity is writable up front and fail in seconds instead.
        python - <<'PY'
        import os, sys, wandb
        entity = os.environ["WANDB_ENTITY"]
        api = wandb.Api()
        # api.viewer.teams is a list of plain strings, not objects.
        teams = [t if isinstance(t, str) else getattr(t, "name", str(t))
                 for t in (getattr(api.viewer, "teams", None) or [])]
        ents = sorted({e for e in (api.default_entity, *teams) if e})
        print(f"wandb user={api.viewer.username} default={api.default_entity} entities={ents}")
        if entity not in ents:
            sys.exit(f"FATAL: wandb key has no access to entity '{entity}'. Accessible: {ents}")
        print(f"wandb entity '{entity}' OK")
        PY

        mkdir -p "$DATASET_DIR"

        # ------------------------------------------------ checkpoint persistence
        # ModelCheckpoint writes to ${paths.output_dir}/checkpoints inside
        # /workspace, which is node-local and ephemeral, and this workflow
        # declares no outputs -- so checkpoints die with the container. Two
        # completed 20h runs were lost that way. Push them to R2 continuously.
        cat > /tmp/ckpt_sync.sh <<'CSEOF'
        #!/bin/bash
        set -a; source "$HOME/.egoverse_env"; set +a
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        DEST="s3://rldb/staged/pushshapes_cotrain11/$1"
        while true; do
          # logs/<run_name>/<timestamp>/checkpoints -> keep runs in separate
          # prefixes. Packed runs share this container, so a single DEST would
          # have four runs overwriting one another's last.ckpt.
          for d in $(find /workspace/EgoVerse/logs -type d -name checkpoints 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$d")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 sync "$d/" "$DEST/$RN/checkpoints/" >>/tmp/ckpt_sync.log 2>&1
          done
          for f in $(find /workspace/EgoVerse/logs -name norm_stats.json 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$f")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" cp "$f" "$DEST/$RN/norm_stats.json" >>/tmp/ckpt_sync.log 2>&1
          done
          sleep 420
        done
        CSEOF
        chmod +x /tmp/ckpt_sync.sh
        (setsid nohup /tmp/ckpt_sync.sh "$JOB_NAME" >/dev/null 2>&1 &)

        # DataLoader workers exhaust the default FD limit under load; two sweep
        # cells died with "Too many open files" in the norm-stats phase.
        ulimit -n 65536 || true

        # ------------------------------------------------- pull PushShapes data
        # The cotrain11 data configs use LocalEpisodeResolver, so the episodes
        # must be on disk before hydra builds the datasets. s3://rldb is
        # CLOUDFLARE R2, not AWS S3 -- it needs $R2_ENDPOINT_URL and the R2 key
        # pair. Pointing AWS credentials at an AWS endpoint returns AccessDenied
        # and looks exactly like a permissions problem.
        set -a; source "$HOME/.egoverse_env"; set +a
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        unset AWS_SESSION_TOKEN
        SRC="s3://rldb/processed_v3/pushshapes_sim/control_gap_all6x13_1000_per_cell_simv2_20260826/${GAP_ROW}"
        mkdir -p "$PUSHSHAPES_ROOT/${GAP_ROW}"
        s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 48 \
          cp "$SRC/*" "$PUSHSHAPES_ROOT/${GAP_ROW}/"
        echo "pulled $(find "$PUSHSHAPES_ROOT/${GAP_ROW}" -name '*.zarr' -maxdepth 3 | wc -l) episodes"
        du -sh "$PUSHSHAPES_ROOT"
        # Held-out embodiments must not be present at all: a stray directory
        # would silently rejoin the cotrain through a glob.
        rm -rf "$PUSHSHAPES_ROOT/${GAP_ROW}/circle_small" "$PUSHSHAPES_ROOT/${GAP_ROW}/suction"
        echo "after holdout removal: $(ls "$PUSHSHAPES_ROOT/${GAP_ROW}" | tr '\n' ' ')"

        # Cap every cell at N_PER_EMB episodes ON DISK rather than through a
        # loader kwarg. MultiDataset._from_resolver forwards unknown kwargs
        # straight to __init__, so an unsupported max_episodes would either
        # raise on the node after the pull or be silently ignored -- and a cap
        # that is silently ignored is worse than no cap, because the run still
        # looks correct. Trimming the directory is unambiguous.
        for cell in "$PUSHSHAPES_ROOT/${GAP_ROW}"/*/T; do
          [ -d "$cell" ] || continue
          ls -1 "$cell" | sort | tail -n +$((N_PER_EMB + 1)) | while read -r ep; do
            rm -rf "$cell/$ep"
          done
        done
        echo "per-cell episode counts after cap:"
        for cell in "$PUSHSHAPES_ROOT/${GAP_ROW}"/*/T; do
          echo "  $(basename $(dirname $cell)) $(ls -1 "$cell" | wc -l)"
        done

        # ------------------------- phases 1+2: several variants on ONE node
        # One workflow == one whole node, split into disjoint GPU slices. The
        # ~155GB R2 pull above happens ONCE and is shared by every variant here,
        # which is the point of packing rather than taking a node per variant.
        DL_OVERRIDES=""
        for emb in $EMBODIMENTS; do
          for split in train valid; do
            DL_OVERRIDES="$DL_OVERRIDES data.${split}_dataloader_params.${emb}.batch_size=$BATCH_SIZE"
            DL_OVERRIDES="$DL_OVERRIDES data.${split}_dataloader_params.${emb}.num_workers=$NUM_WORKERS"
          done
        done
        echo "dataloader overrides: $DL_OVERRIDES"
        echo "packing variants: $VARIANTS  ($GPUS_PER_RUN GPU each)"

        # ---- phase 1: norm stats, one GPU per variant, all in parallel.
        # Each tokenisation has its own action statistics, so this cannot be
        # shared across variants the way the episode pull can.
        # Poll on liveness rather than calling bare `wait`.
        #
        # OBSERVED: a run died with the trace stopped dead on "+ wait" -- all 8
        # norm-stats jobs finished (8 norm_stats.json on disk), zero python
        # processes left, shell still alive, GPUs idle, and the 9th variant
        # never launched. An hour of dataset pull lost.
        #
        # Bare `wait` blocks on EVERY child of the shell, not just the jobs we
        # care about, and this script has long-lived children (the detached
        # checkpoint-sync loop, the tee from the line-2 process substitution).
        # Which one held it is NOT confirmed -- it did not reproduce in a local
        # bash -- so do not rely on knowing. Polling the specific PIDs with
        # kill -0 is correct whichever child was responsible.
        drain_pids () {
          for dp in $1; do
            while kill -0 "$dp" 2>/dev/null; do sleep 15; done
          done
        }

        NPIDS=""
        i=0
        for V in $VARIANTS; do
          mkdir -p "$WORKDIR/norm_stats/$V"
          ( CUDA_VISIBLE_DEVICES=$((i % NUM_GPU)) python egomimic/trainHydra.py \
              data="pusht/cotrain11_$V" model="bf/bf_cotrain11_$V" \
              ~evaluator \
              paths.dataset_dir="$DATASET_DIR" \
              launch_params.nodes=1 launch_params.gpus_per_node=1 \
              norm_stats.save_cache_dir="$WORKDIR/norm_stats/$V" \
              trainer.max_epochs=1 trainer.min_epochs=1 \
              trainer.limit_train_batches=1 trainer.limit_val_batches=0 \
              ~logger ~callbacks \
              name="cotrain11_$V" description="${V}_normstats" \
              > "/tmp/norm_$V.log" 2>&1 ) &
          NPIDS="$NPIDS $!"
          i=$((i + 1))
          # Drain every NUM_GPU so more variants than GPUs still works.
          #
          # wait MUST take explicit PIDs. Bare `wait` waits for EVERY child of
          # this shell, and line 2's `exec > >(tee ...)` process substitution
          # leaves a tee running for the life of the script -- so bare `wait`
          # blocks forever after the first drain, with every job finished, no
          # processes left, and the trace stopped dead on "+ wait". That cost
          # an hour of dataset pull once already.
          if [ $((i % NUM_GPU)) -eq 0 ]; then
            drain_pids "$NPIDS"
            NPIDS=""
          fi
        done
        drain_pids "$NPIDS"
        NPIDS=""
        for V in $VARIANTS; do
          NJ="$WORKDIR/norm_stats/$V/norm_stats/norm_stats.json"
          if [ ! -s "$NJ" ]; then
            echo "FATAL: norm stats missing for $V"; tail -40 "/tmp/norm_$V.log"; exit 1
          fi
          echo "norm stats OK: $V"
        done

        # ---- phase 2: training. Each variant gets its own GPU slice AND its
        # own MASTER_PORT -- concurrent DDP groups otherwise all bind the
        # default 29500 and every run after the first dies on "address already
        # in use", which reads as a CUDA error and wastes the whole pull.
        WAVE=$((NUM_GPU / GPUS_PER_RUN))
        echo "wave size: $WAVE concurrent variants on $NUM_GPU GPUs"
        RC=0
        run_wave () {
        PIDS=""
        i=0
        for V in $1; do
          LO=$((i * GPUS_PER_RUN))
          DEVS=$(seq -s, $LO $((LO + GPUS_PER_RUN - 1)))
          PORT=$((29500 + i * 17))
          ( CUDA_VISIBLE_DEVICES="$DEVS" MASTER_PORT=$PORT \
            python egomimic/trainHydra.py \
              data="pusht/cotrain11_$V" model="bf/bf_cotrain11_$V" \
              evaluator=eval_sim_pushshapes \
              trainer.strategy=ddp_find_unused_parameters_true \
              norm_stats.precomputed_norm_path="$WORKDIR/norm_stats/$V/norm_stats/norm_stats.json" \
              paths.dataset_dir="$DATASET_DIR" \
              launch_params.nodes=1 launch_params.gpus_per_node="$GPUS_PER_RUN" \
              $DL_OVERRIDES \
              logger.wandb.entity="$WANDB_ENTITY" \
              trainer.max_epochs="$MAX_EPOCHS" trainer.min_epochs="$MAX_EPOCHS" \
              trainer.check_val_every_n_epoch=5 \
              trainer.limit_val_batches=1 \
              callbacks.model_checkpoint.every_n_epochs=5 \
              name="cotrain11_$V" description="${V}_${RUN_DESC}" \
              > "/tmp/train_$V.log" 2>&1 ) &
          PIDS="$PIDS $!"
          echo "launched $V on GPU(s) $DEVS port $PORT"
          i=$((i + 1))
        done

        # Stream the first variant of the wave so the log is not silent for hours.
        FIRST=$(echo $1 | awk '{print $1}')
        touch "/tmp/train_$FIRST.log"
        tail -f "/tmp/train_$FIRST.log" & TAILPID=$!

        drain_pids "$PIDS"
        for p in $PIDS; do
          if ! wait $p 2>/dev/null; then RC=1; echo "packed run pid $p exited nonzero"; fi
        done
        kill $TAILPID 2>/dev/null || true
        }

        # Chop VARIANTS into waves and run them BACK TO BACK on this one node.
        BATCH=""
        for V in $VARIANTS; do
          BATCH="$BATCH $V"
          if [ "$(echo $BATCH | wc -w)" -eq "$WAVE" ]; then
            echo "===== wave:$BATCH ====="
            run_wave "$BATCH"
            BATCH=""
          fi
        done
        if [ -n "$BATCH" ]; then
          echo "===== final wave:$BATCH ====="
          run_wave "$BATCH"
        fi

        for V in $VARIANTS; do
          echo "================ tail: $V ================"
          tail -30 "/tmp/train_$V.log" || true
        done

        # Final flush: the periodic loop may be mid-sleep when training ends.
        bash -c 'set -a; source "$HOME/.egoverse_env"; set +a
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          for d in $(find /workspace/EgoVerse/logs -type d -name checkpoints 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$d")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 \
              sync "$d/" "s3://rldb/staged/pushshapes_cotrain11/'"$JOB_NAME"'/$RN/checkpoints/"
          done' || true
        echo "final checkpoint flush done"
        exit $RC

  # groot-l40s-03 nodes are 126 CPU / 988Gi mem / 3163Gi storage / 8 GPU, but
  # per-node free capacity varies a lot, so these are sized to fit most nodes
  # rather than only the emptiest. 862 episodes x ~180MB is ~155GB of zarr;
  # 400Gi leaves room for the uv env, checkpoints and logs.
  # num_workers=4 keeps dataloader workers at 8 ranks x 2 embodiments x 4 = 64,
  # which fits the 80 CPU request (the config default of 6 would need ~120).
  # cpu was 100, but most nodes in this pool sit at 84/126 free, so that only
  # matched the emptiest few and cost ~6-8 min of queueing per submission.
  resources:
    default:
      cpu: {{cpu}}
      gpu: {{num_gpu}}
      memory: {{memory}}
      storage: {{storage}}

  timeout:
    queue_timeout: 1d
