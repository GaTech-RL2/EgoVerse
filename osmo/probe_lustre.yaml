# Throwaway probe: what persistent filesystems do the L40S pools mount, and is
# anything from our training runs on them? The training workflow writes
# checkpoints to /workspace (node-local, ephemeral), so this checks whether a
# Lustre mount exists that they could have landed on or be moved to.
workflow:
  name: "{{job_name}}"
  tasks:
  - name: probe
    image: nvcr.io/nvidia/pytorch:25.06-py3
    command: ["bash"]
    args: ["/tmp/p.sh"]
    files:
    - path: /tmp/p.sh
      contents: |
        echo "=== mounts (lustre / nfs / shared) ==="
        df -hT 2>/dev/null | grep -Ei 'lustre|nfs|amlfs|aws-lfs|/mnt' || echo "  none"
        echo "=== /mnt ==="
        ls -la /mnt 2>/dev/null || echo "  no /mnt"
        echo "=== is /workspace local or shared? ==="
        df -hT /workspace 2>/dev/null | tail -1
        echo "=== search any shared mount for EgoVerse run artifacts ==="
        for m in /mnt/*/ ; do
          [ -d "$m" ] || continue
          echo "-- $m"
          ls "$m" 2>/dev/null | head -5
          find "$m" -maxdepth 4 -name '*.ckpt' 2>/dev/null | head -5
          find "$m" -maxdepth 4 -type d \( -name 'arc_sweep*' -o -name 'arc_tests_cotrain*' -o -name 'logs' \) 2>/dev/null | head -5
        done
        echo "=== done ==="
  resources:
    default:
      cpu: 4
      gpu: 1
      memory: 32Gi
      storage: 40Gi
  timeout:
    queue_timeout: 1d
