<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 885" role="img" aria-labelledby="title desc">
<title id="title">All five policy methods</title><desc id="desc">Five rows compare native conditioning, recorded text edits, learned text edits, an always-active flow residual and a gated flow residual.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8091a7"/></marker></defs>
<rect width="1370" height="885" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="42" font-size="27" fill="#172a43" font-weight="700">Five methods · where the intervention enters</text><text x="28" y="73" font-size="15" fill="#536781" font-weight="400">All use the same frozen π0.5 base. Live observations close the loop after each five-action execution.</text><text x="28" y="149" font-size="18" fill="#536781" font-weight="750">01</text><text x="28" y="175" font-size="15" fill="#172a43" font-weight="650">Native</text><rect x="202" y="118" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="218" y="148" font-size="17" fill="#172a43" font-weight="650">Live observations</text><text x="218" y="173" font-size="13" fill="#536781" font-weight="400">Original task instruction</text><path d="M450 162H486" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="118" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="502" y="148" font-size="17" fill="#172a43" font-weight="650">Native conditioning</text><text x="502" y="173" font-size="13" fill="#536781" font-weight="400">No additional learning</text><path d="M734 162H770" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="118" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="786" y="148" font-size="17" fill="#172a43" font-weight="650">Frozen π0.5</text><text x="786" y="173" font-size="13" fill="#536781" font-weight="400">10 Euler flow steps</text><path d="M1018 162H1054" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="118" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="1070" y="148" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="1070" y="173" font-size="13" fill="#536781" font-weight="400">Observe again</text><text x="202" y="233" font-size="12" fill="#536781" font-weight="400">Astra disabled at evaluation · matched reset and noise · one attempt per case</text><text x="28" y="297" font-size="18" fill="#a8701e" font-weight="750">02</text><text x="28" y="323" font-size="15" fill="#172a43" font-weight="650">Teacher schedule</text><rect x="202" y="266" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="218" y="296" font-size="17" fill="#172a43" font-weight="650">Task + action count</text><text x="218" y="321" font-size="13" fill="#536781" font-weight="400">Stored Astra teacher program</text><path d="M450 310H486" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="266" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#a8701e" stroke-width="1.5"/><text x="502" y="296" font-size="17" fill="#172a43" font-weight="650">Recorded TEI / TLI</text><text x="502" y="321" font-size="13" fill="#536781" font-weight="400">Apply pair + α to live input</text><path d="M734 310H770" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="266" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#a8701e" stroke-width="1.5"/><text x="786" y="296" font-size="17" fill="#172a43" font-weight="650">Frozen π0.5</text><text x="786" y="321" font-size="13" fill="#536781" font-weight="400">Fresh motor actions</text><path d="M1018 310H1054" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="266" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="1070" y="296" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="1070" y="321" font-size="13" fill="#536781" font-weight="400">Advance clock; observe again</text><text x="202" y="381" font-size="12" fill="#536781" font-weight="400">Astra disabled at evaluation · matched reset and noise · one attempt per case</text><text x="28" y="445" font-size="18" fill="#3166c5" font-weight="750">03</text><text x="28" y="471" font-size="15" fill="#172a43" font-weight="650">Text selector</text><rect x="202" y="414" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="218" y="444" font-size="17" fill="#172a43" font-weight="650">Native image/text features</text><text x="218" y="469" font-size="13" fill="#536781" font-weight="400">+ robot state</text><path d="M450 458H486" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="414" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#3166c5" stroke-width="1.5"/><text x="502" y="444" font-size="17" fill="#172a43" font-weight="650">Learned gate + choice</text><text x="502" y="469" font-size="13" fill="#536781" font-weight="400">Native or predicted TEI / TLI</text><path d="M734 458H770" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="414" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#3166c5" stroke-width="1.5"/><text x="786" y="444" font-size="17" fill="#172a43" font-weight="650">Frozen π0.5</text><text x="786" y="469" font-size="13" fill="#536781" font-weight="400">Fresh motor actions</text><path d="M1018 458H1054" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="414" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="1070" y="444" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="1070" y="469" font-size="13" fill="#536781" font-weight="400">Refresh selector every 25</text><text x="202" y="529" font-size="12" fill="#536781" font-weight="400">Astra disabled at evaluation · matched reset and noise · one attempt per case</text><text x="28" y="593" font-size="18" fill="#8055b6" font-weight="750">04</text><text x="28" y="619" font-size="15" fill="#172a43" font-weight="650">Flow head</text><rect x="202" y="562" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="218" y="592" font-size="17" fill="#172a43" font-weight="650">Original native inputs</text><text x="218" y="617" font-size="13" fill="#536781" font-weight="400">Live images, state, instruction</text><path d="M450 606H486" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="562" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#8055b6" stroke-width="1.5"/><text x="502" y="592" font-size="17" fill="#172a43" font-weight="650">Frozen action expert</text><text x="502" y="617" font-size="13" fill="#536781" font-weight="400">Native velocity + hidden h</text><path d="M734 606H770" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="562" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#8055b6" stroke-width="1.5"/><text x="786" y="592" font-size="17" fill="#172a43" font-weight="650">Add learned δv</text><text x="786" y="617" font-size="13" fill="#536781" font-weight="400">Bounded; always enabled</text><path d="M1018 606H1054" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="562" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="1070" y="592" font-size="17" fill="#172a43" font-weight="650">Integrate + execute</text><text x="1070" y="617" font-size="13" fill="#536781" font-weight="400">10 Euler steps; 5 actions</text><text x="202" y="677" font-size="12" fill="#536781" font-weight="400">Astra disabled at evaluation · matched reset and noise · one attempt per case</text><text x="28" y="741" font-size="18" fill="#147b72" font-weight="750">05</text><text x="28" y="767" font-size="15" fill="#172a43" font-weight="650">Gated head</text><rect x="202" y="710" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="218" y="740" font-size="17" fill="#172a43" font-weight="650">Original native inputs</text><text x="218" y="765" font-size="13" fill="#536781" font-weight="400">Selector predicts gate only</text><path d="M450 754H486" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="710" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#147b72" stroke-width="1.5"/><text x="502" y="740" font-size="17" fill="#172a43" font-weight="650">Frozen action expert</text><text x="502" y="765" font-size="13" fill="#536781" font-weight="400">Native velocity + hidden h</text><path d="M734 754H770" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="710" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#147b72" stroke-width="1.5"/><text x="786" y="740" font-size="17" fill="#172a43" font-weight="650">Gate the same δv</text><text x="786" y="765" font-size="13" fill="#536781" font-weight="400">Off: native; on: correction</text><path d="M1018 754H1054" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="710" width="248" height="89" rx="12" fill="#f6f8fc" stroke="#91a1b5" stroke-width="1.5"/><text x="1070" y="740" font-size="17" fill="#172a43" font-weight="650">Integrate + execute</text><text x="1070" y="765" font-size="13" fill="#536781" font-weight="400">No extra TEI / TLI edit</text><text x="202" y="825" font-size="12" fill="#536781" font-weight="400">Astra disabled at evaluation · matched reset and noise · one attempt per case</text></g></svg>
