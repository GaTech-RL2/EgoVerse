<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 667" role="img" aria-labelledby="title desc">
<title id="title">Learned TEI/TLI selector</title><desc id="desc">A small selector reads frozen native visual and instruction features plus robot state. It chooses native or a TEI/TLI operator, source pair and interpolation strength.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8091a7"/></marker></defs>
<rect width="1220" height="667" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="32" font-size="12" fill="#3166c5" font-weight="750">LEARN WHEN AND HOW TO EDIT TEXT</text><text x="28" y="62" font-size="14" fill="#536781" font-weight="400">Astra is offline. The robot receives new observations after every five executed actions.</text><text x="330" y="104" font-size="12" fill="#3166c5" font-weight="650">LEARNED OFFLINE · 1,000 updates · 535,321 parameters</text><rect x="28" y="237" width="240" height="112" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="44" y="267" font-size="17" fill="#172a43" font-weight="650">Live native inputs</text><text x="44" y="292" font-size="13" fill="#536781" font-weight="400">Images + original instruction</text><text x="44" y="313" font-size="13" fill="#536781" font-weight="400">+ robot state</text><rect x="330" y="237" width="240" height="133" rx="12" fill="#eff5ff" stroke="#3166c5" stroke-width="1.5"/><text x="346" y="267" font-size="17" fill="#172a43" font-weight="650">Learned selector</text><text x="346" y="292" font-size="13" fill="#536781" font-weight="400">Pool frozen native features</text><text x="346" y="313" font-size="13" fill="#536781" font-weight="400">Gate + operator + pair + α</text><text x="346" y="334" font-size="13" fill="#536781" font-weight="400">Refresh every 25 actions</text><rect x="650" y="148" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="666" y="178" font-size="17" fill="#172a43" font-weight="650">Native conditioning</text><text x="666" y="203" font-size="13" fill="#536781" font-weight="400">Use original inputs</text><rect x="650" y="350" width="230" height="100" rx="12" fill="#eff5ff" stroke="#3166c5" stroke-width="1.5"/><text x="666" y="380" font-size="17" fill="#172a43" font-weight="650">TEI / TLI conditioning</text><text x="666" y="405" font-size="13" fill="#536781" font-weight="400">Apply predicted pair and α</text><text x="666" y="426" font-size="13" fill="#536781" font-weight="400">Hold until next refresh</text><rect x="950" y="247" width="245" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="966" y="277" font-size="17" fill="#172a43" font-weight="650">Frozen π0.5</text><text x="966" y="302" font-size="13" fill="#536781" font-weight="400">Fresh action chunk</text><text x="966" y="323" font-size="13" fill="#536781" font-weight="400">10 Euler flow steps</text><rect x="950" y="485" width="245" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="966" y="515" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="966" y="540" font-size="13" fill="#536781" font-weight="400">Then observe again</text><path d="M268 293H330" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 271H610V198H650" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 335H610V400H650" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="170" font-size="12" fill="#536781" font-weight="400">gate ≤ 0.5</text><text x="588" y="436" font-size="12" fill="#3166c5" font-weight="400">gate &gt; 0.5</text><path d="M880 198H916V277H950" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M880 400H916V317H950" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1072 347V485" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1072 585V630H148V349" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="500" y="620" font-size="12" fill="#536781" font-weight="400">NO CLOCK INPUT · CURRENT OBSERVATIONS DRIVE SELECTION</text></g></svg>
