<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 505" role="img" aria-labelledby="title desc">
<title id="title">Recorded teacher schedule</title><desc id="desc">Look up a successful Astra teacher’s TEI/TLI choice by task instruction and executed-action count. π0.5 still generates new actions from live observations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8091a7"/></marker></defs>
<rect width="1220" height="505" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="32" font-size="12" fill="#a8701e" font-weight="750">REPLAY A STORED LANGUAGE PROGRAM</text><text x="28" y="62" font-size="14" fill="#536781" font-weight="400">Astra is offline. The robot receives new observations after every five executed actions.</text><rect x="28" y="106" width="255" height="100" rx="12" fill="#fff8ed" stroke="#a8701e" stroke-width="1.5"/><text x="44" y="136" font-size="17" fill="#172a43" font-weight="650">Earlier successful rollout</text><text x="44" y="161" font-size="13" fill="#536781" font-weight="400">Astra chooses TEI/TLI</text><text x="44" y="182" font-size="13" fill="#536781" font-weight="400">Save source pair + α + step</text><rect x="355" y="106" width="255" height="100" rx="12" fill="#fff8ed" stroke="#a8701e" stroke-width="1.5"/><text x="371" y="136" font-size="17" fill="#172a43" font-weight="650">Stored teacher schedule</text><text x="371" y="161" font-size="13" fill="#536781" font-weight="400">A fixed program for the task</text><text x="371" y="182" font-size="13" fill="#536781" font-weight="400">No new Astra decisions</text><rect x="725" y="106" width="350" height="100" rx="12" fill="#fff8ed" stroke="#a8701e" stroke-width="1.5"/><text x="741" y="136" font-size="17" fill="#172a43" font-weight="650">Task instruction + action clock</text><text x="741" y="161" font-size="13" fill="#536781" font-weight="400">Look up every 25 executed actions</text><text x="741" y="182" font-size="13" fill="#536781" font-weight="400">Unknown task → native</text><path d="M283 156H355" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 156H725" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="300" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="44" y="330" font-size="17" fill="#172a43" font-weight="650">Live observations</text><text x="44" y="355" font-size="13" fill="#536781" font-weight="400">Two cameras + robot state</text><rect x="355" y="300" width="255" height="100" rx="12" fill="#fff8ed" stroke="#a8701e" stroke-width="1.5"/><text x="371" y="330" font-size="17" fill="#172a43" font-weight="650">Apply stored text edit</text><text x="371" y="355" font-size="13" fill="#536781" font-weight="400">TEI or TLI, pair and α</text><text x="371" y="376" font-size="13" fill="#536781" font-weight="400">Keep raw camera observations</text><rect x="665" y="300" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="681" y="330" font-size="17" fill="#172a43" font-weight="650">Frozen π0.5</text><text x="681" y="355" font-size="13" fill="#536781" font-weight="400">Fresh actions for this state</text><text x="681" y="376" font-size="13" fill="#536781" font-weight="400">10 Euler flow steps</text><rect x="950" y="300" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="966" y="330" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="966" y="355" font-size="13" fill="#536781" font-weight="400">Advance the action clock</text><path d="M258 350H355" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 350H665" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M895 350H950" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 206V255H482V300" fill="none" stroke="#a8701e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M1065 400V465H143V400" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="365" y="455" font-size="12" fill="#536781" font-weight="400">LANGUAGE CHOICES ARE REPLAYED · MOTOR ACTIONS ARE GENERATED LIVE</text></g></svg>
