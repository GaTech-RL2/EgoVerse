<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 355" role="img" aria-labelledby="title desc">
<title id="title">Frozen native π0.5</title><desc id="desc">The original policy turns the current images, robot state and task instruction into fresh actions at every replan.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8091a7"/></marker></defs>
<rect width="1220" height="355" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="32" font-size="12" fill="#536781" font-weight="750">REFERENCE POLICY</text><text x="28" y="62" font-size="14" fill="#536781" font-weight="400">Astra is offline. The robot receives new observations after every five executed actions.</text><rect x="28" y="140" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="44" y="170" font-size="17" fill="#172a43" font-weight="650">Live observations</text><text x="44" y="195" font-size="13" fill="#536781" font-weight="400">Two cameras + robot state</text><rect x="335" y="140" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="351" y="170" font-size="17" fill="#172a43" font-weight="650">Native conditioning</text><text x="351" y="195" font-size="13" fill="#536781" font-weight="400">Original task instruction</text><text x="351" y="216" font-size="13" fill="#536781" font-weight="400">Original image/text features</text><rect x="642" y="140" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="658" y="170" font-size="17" fill="#172a43" font-weight="650">Frozen π0.5</text><text x="658" y="195" font-size="13" fill="#536781" font-weight="400">Native Gaussian noise</text><text x="658" y="216" font-size="13" fill="#536781" font-weight="400">10 Euler flow steps</text><rect x="950" y="140" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="966" y="170" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="966" y="195" font-size="13" fill="#536781" font-weight="400">Then observe again</text><path d="M258 190H335" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M565 190H642" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M872 190H950" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1065 240V315H143V240" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="470" y="305" font-size="12" fill="#536781" font-weight="400">CLOSED LOOP · FRESH OBSERVATIONS</text></g></svg>
