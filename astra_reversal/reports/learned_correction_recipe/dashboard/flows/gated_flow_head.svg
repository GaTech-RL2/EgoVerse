<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 718" role="img" aria-labelledby="title desc">
<title id="title">Selector-gated flow head</title><desc id="desc">The same learned selector enables the same learned flow head. Only the gate is used: this arm applies no TEI/TLI edit and keeps original conditioning.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8091a7"/></marker></defs>
<rect width="1220" height="718" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="32" font-size="12" fill="#147b72" font-weight="750">USE THE GATE TO LIMIT ACTION CORRECTIONS</text><text x="28" y="62" font-size="14" fill="#536781" font-weight="400">Astra is offline. The robot receives new observations after every five executed actions.</text><rect x="315" y="100" width="245" height="100" rx="12" fill="#eef9f6" stroke="#147b72" stroke-width="1.5"/><text x="331" y="130" font-size="17" fill="#172a43" font-weight="650">Learned selector: gate</text><text x="331" y="155" font-size="13" fill="#536781" font-weight="400">Native image/text features</text><text x="331" y="176" font-size="13" fill="#536781" font-weight="400">Refresh every 25 actions</text><path d="M143 240V150H315" fill="none" stroke="#147b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="28" y="127" font-size="12" fill="#147b72" font-weight="400">native features</text><rect x="28" y="240" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="44" y="270" font-size="17" fill="#172a43" font-weight="650">Original native inputs</text><text x="44" y="295" font-size="13" fill="#536781" font-weight="400">Live images + robot state</text><text x="44" y="316" font-size="13" fill="#536781" font-weight="400">Original instruction</text><rect x="315" y="240" width="245" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="331" y="270" font-size="17" fill="#172a43" font-weight="650">Frozen action expert</text><text x="331" y="295" font-size="13" fill="#536781" font-weight="400">At the current flow state</text><text x="331" y="316" font-size="13" fill="#536781" font-weight="400">Native velocity + hidden h</text><rect x="650" y="175" width="225" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="666" y="205" font-size="17" fill="#172a43" font-weight="650">Native velocity</text><text x="666" y="230" font-size="13" fill="#536781" font-weight="400">v native</text><rect x="650" y="360" width="225" height="132" rx="12" fill="#f7f1fc" stroke="#8055b6" stroke-width="1.5"/><text x="666" y="390" font-size="17" fill="#172a43" font-weight="650">Bounded residual head</text><text x="666" y="415" font-size="13" fill="#536781" font-weight="400">7,175 learned parameters</text><text x="666" y="436" font-size="13" fill="#536781" font-weight="400">First 5 rows × 7 channels</text><text x="666" y="457" font-size="13" fill="#536781" font-weight="400">δv = 0.5 tanh((Wh+b)/0.5)</text><rect x="960" y="240" width="235" height="100" rx="12" fill="#eef9f6" stroke="#147b72" stroke-width="1.5"/><text x="976" y="270" font-size="17" fill="#172a43" font-weight="650">Flow integration</text><text x="976" y="295" font-size="13" fill="#536781" font-weight="400">v = v native + g · δv</text><text x="976" y="316" font-size="13" fill="#536781" font-weight="400">Repeat for 10 Euler steps</text><rect x="960" y="525" width="235" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="976" y="555" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="976" y="580" font-size="13" fill="#536781" font-weight="400">Then observe again</text><path d="M258 290H315" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 275H606V225H650" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M437 340V423H650" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><text x="448" y="414" font-size="12" fill="#8055b6" font-weight="400">hidden h</text><path d="M875 225H918V265H960" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 425H918V315H960" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1078 340V525" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 150H585V385H650" fill="none" stroke="#147b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="651" y="521" font-size="12" fill="#147b72" font-weight="650">g = 1 if gate &gt; 0.5; else δv = 0</text><path d="M1078 625V680H143V340" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="395" y="670" font-size="12" fill="#536781" font-weight="400">ORIGINAL CONDITIONING · NO TEI / TLI IN EITHER HEAD ARM</text></g></svg>
