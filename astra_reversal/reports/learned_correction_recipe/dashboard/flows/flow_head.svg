<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 658" role="img" aria-labelledby="title desc">
<title id="title">Learned flow-velocity head</title><desc id="desc">A bounded residual changes the policy’s action vector field during each Euler step. Original camera inputs and language conditioning are preserved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8091a7"/></marker></defs>
<rect width="1220" height="658" fill="white"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="32" font-size="12" fill="#8055b6" font-weight="750">LEARN A SMALL ACTION CORRECTION</text><text x="28" y="62" font-size="14" fill="#536781" font-weight="400">Astra is offline. The robot receives new observations after every five executed actions.</text><rect x="28" y="180" width="230" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="44" y="210" font-size="17" fill="#172a43" font-weight="650">Original native inputs</text><text x="44" y="235" font-size="13" fill="#536781" font-weight="400">Live images + robot state</text><text x="44" y="256" font-size="13" fill="#536781" font-weight="400">Original instruction</text><rect x="315" y="180" width="245" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="331" y="210" font-size="17" fill="#172a43" font-weight="650">Frozen action expert</text><text x="331" y="235" font-size="13" fill="#536781" font-weight="400">At the current flow state</text><text x="331" y="256" font-size="13" fill="#536781" font-weight="400">Native velocity + hidden h</text><rect x="650" y="115" width="225" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="666" y="145" font-size="17" fill="#172a43" font-weight="650">Native velocity</text><text x="666" y="170" font-size="13" fill="#536781" font-weight="400">v native</text><rect x="650" y="300" width="225" height="132" rx="12" fill="#f7f1fc" stroke="#8055b6" stroke-width="1.5"/><text x="666" y="330" font-size="17" fill="#172a43" font-weight="650">Bounded residual head</text><text x="666" y="355" font-size="13" fill="#536781" font-weight="400">7,175 learned parameters</text><text x="666" y="376" font-size="13" fill="#536781" font-weight="400">First 5 rows × 7 channels</text><text x="666" y="397" font-size="13" fill="#536781" font-weight="400">δv = 0.5 tanh((Wh+b)/0.5)</text><rect x="960" y="180" width="235" height="100" rx="12" fill="#f7f1fc" stroke="#8055b6" stroke-width="1.5"/><text x="976" y="210" font-size="17" fill="#172a43" font-weight="650">Flow integration</text><text x="976" y="235" font-size="13" fill="#536781" font-weight="400">v = v native + δv</text><text x="976" y="256" font-size="13" fill="#536781" font-weight="400">Repeat for 10 Euler steps</text><rect x="960" y="465" width="235" height="100" rx="12" fill="#f6f8fc" stroke="#536781" stroke-width="1.5"/><text x="976" y="495" font-size="17" fill="#172a43" font-weight="650">Execute 5 actions</text><text x="976" y="520" font-size="13" fill="#536781" font-weight="400">Then observe again</text><path d="M258 230H315" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 215H606V165H650" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M437 280V363H650" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><text x="448" y="354" font-size="12" fill="#8055b6" font-weight="400">hidden h</text><path d="M875 165H918V205H960" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 365H918V255H960" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1078 280V465" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)"/><text x="651" y="459" font-size="12" fill="#8055b6" font-weight="650">Always enabled</text><path d="M1078 565V620H143V280" fill="none" stroke="#8091a7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="395" y="610" font-size="12" fill="#536781" font-weight="400">ORIGINAL CONDITIONING · NO TEI / TLI IN EITHER HEAD ARM</text></g></svg>
