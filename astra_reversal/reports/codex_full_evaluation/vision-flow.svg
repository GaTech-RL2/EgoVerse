<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="vision-title vision-desc">
<title id="vision-title">Five rescue arms with a shared native baseline</title><desc id="vision-desc">One native baseline per task. After baseline failure each of five arms receives up to two rescue rollouts. VEI mixes projected visual tokens with donor tokens, and VLI mixes visual slots at the fixed transformer blocks 0 through 16. All use raw camera inputs and the same frozen policy.</desc>
<defs><marker id="vision-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#698080"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#173d43" font-size="14"><g fill="#f0f4f0" stroke="#cbdad6"><rect x="20" y="90" width="178" height="104" rx="12"/><rect x="240" y="90" width="236" height="104" rx="12"/><rect x="518" y="60" width="252" height="75" rx="12"/><rect x="518" y="155" width="252" height="75" rx="12"/><rect x="812" y="90" width="208" height="104" rx="12"/></g>
<g text-anchor="middle"><text x="109" y="119" font-weight="700">Native revision 0</text><text x="109" y="143">one shared rollout</text><text x="109" y="170" font-size="12">success → all arms stop</text><text x="358" y="119" font-weight="700">After native failure</text><text x="358" y="143">≤2 rescues per arm</text><text x="358" y="170" font-size="12">stop arm at first success</text><text x="644" y="88" font-weight="700">VEI · embedding interpolation</text><text x="644" y="111" font-size="12">current + donor post-projector tokens</text><text x="644" y="183" font-weight="700">VLI · latent interpolation</text><text x="644" y="206" font-size="12">visual slots at fixed blocks 0–16</text><text x="916" y="119" font-weight="700">Frozen policy</text><text x="916" y="143">execute ≤5 actions</text><text x="916" y="170" font-size="12">300-action cap per rollout</text></g>
<g stroke="#698080" stroke-width="1.5" fill="none" marker-end="url(#vision-arrow)"><path d="M200 142H237"/><path d="M478 142H496V97H515"/><path d="M496 142V192H515"/><path d="M772 97H790V142H809"/><path d="M772 192H790V142"/></g>
<text x="20" y="30" font-weight="600" font-size="13">Five arms: native retry · random VEI · random VLI · Astra VEI · Astra VLI</text>
<text x="20" y="265" font-size="13">45 paired donor frames from 9 standard training demonstrations · same target instruction · no OOD demonstration donors</text><text x="20" y="289" font-size="12" fill="#617678">Astra selects a donor and mixing strength, or defers. VLI blocks are fixed. No text-slot writes or annotated System 1 images.</text></g></svg>
