<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" role="img" aria-labelledby="frs-title frs-desc">
<title id="frs-title">Frozen flow reversal with an Astra directional reference</title><desc id="frs-desc">Raw images condition the frozen policy. Astra sees a separate calibrated gripper guide and can choose a coarse direction or defer. A directional reference is reversed through frozen flow to infer noise, unused padding noise is refreshed, and forward flow generates a plan.</desc>
<defs><marker id="frs-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#698080"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#173d43" font-size="14"><g fill="#f0f4f0" stroke="#cbdad6"><rect x="20" y="94" width="172" height="94" rx="12"/><rect x="231" y="94" width="172" height="94" rx="12"/><rect x="442" y="94" width="172" height="94" rx="12"/><rect x="653" y="94" width="172" height="94" rx="12"/><rect x="864" y="94" width="156" height="94" rx="12"/></g>
<g text-anchor="middle"><text x="106" y="122" font-weight="700">Astra: direction</text><text x="106" y="144">or native deferral</text><text x="106" y="166" font-size="12">medium · every 10 actions</text><text x="317" y="122" font-weight="700">Coarse reference</text><text x="317" y="144">normalized translation</text><text x="317" y="166" font-size="12">zero rotation + gripper</text><text x="528" y="122" font-weight="700">Reverse frozen flow</text><text x="528" y="144">infer starting noise</text><text x="528" y="166" font-size="12">reference → noise</text><text x="739" y="122" font-weight="700">Refresh padding</text><text x="739" y="144">forward frozen flow</text><text x="739" y="166" font-size="12">noise → action chunk</text><text x="942" y="122" font-weight="700">Execute ≤10</text><text x="942" y="144">observe again</text><text x="942" y="166" font-size="12">300-action cap</text></g>
<g stroke="#698080" stroke-width="1.5" fill="none" marker-end="url(#frs-arrow)"><path d="M194 141H228"/><path d="M405 141H439"/><path d="M616 141H650"/><path d="M827 141H861"/><path d="M106 70V91"/><path d="M739 70V91"/></g>
<text x="22" y="40" font-size="13" font-weight="600">Separate Astra attachment</text><text x="22" y="61" font-size="12">external view + calibrated gripper plumb line</text><text x="525" y="40" font-size="13" font-weight="600">System 1 receives raw external + wrist pixels</text><text x="525" y="61" font-size="12">The guide overlay is never a policy input. Weights stay frozen.</text>
<text x="20" y="226" font-size="13">Matched controls: native Euler-10 and repeated-noise control · 10 paired resets per task · no rescue revisions</text><text x="20" y="250" font-size="12" fill="#617678">Astra supplies a coarse directional reference, not a dense trajectory or a learned actor. Native deferral bypasses reversal.</text></g></svg>
