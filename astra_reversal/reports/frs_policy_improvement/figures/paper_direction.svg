<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 410" role="img" aria-label="paper-direction"><title>paper-direction</title><defs><marker id="paper-direction-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#51717e"/></marker></defs><g font-family="system-ui,sans-serif" fill="#193c4d"><rect x="10" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="132.5" y="53" font-size="15" font-weight="700" text-anchor="middle">Astra sees external RGB</text><text x="132.5" y="77" font-size="12" text-anchor="middle">raw view + separate calibrated guide</text><text x="132.5" y="95" font-size="12" text-anchor="middle">original task; no wrist for this role</text><rect x="275" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="397.5" y="53" font-size="15" font-weight="700" text-anchor="middle">Choose coarse direction</text><text x="397.5" y="77" font-size="12" text-anchor="middle">three signs; less / more</text><text x="397.5" y="95" font-size="12" text-anchor="middle">fine manipulation → native deferral</text><rect x="540" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="662.5" y="53" font-size="15" font-weight="700" text-anchor="middle">Build action reference</text><text x="662.5" y="77" font-size="12" text-anchor="middle">normalized XYZ; zero raw rot/grip</text><text x="662.5" y="95" font-size="12" text-anchor="middle">ten rows; zero padding</text><rect x="805" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="927.5" y="53" font-size="15" font-weight="700" text-anchor="middle">Inverse Euler · 10 steps</text><text x="927.5" y="77" font-size="12" text-anchor="middle">native pi05 velocity, fixed weights</text><text x="927.5" y="95" font-size="12" text-anchor="middle">action at t=0 → noise at t=1</text><rect x="805" y="213" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="927.5" y="241" font-size="15" font-weight="700" text-anchor="middle">Preserve recovered noise</text><text x="927.5" y="265" font-size="12" text-anchor="middle">keep physical channels per row</text><text x="927.5" y="283" font-size="12" text-anchor="middle">redraw 25 padding channels</text><rect x="540" y="213" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="662.5" y="241" font-size="15" font-weight="700" text-anchor="middle">Forward Euler · 10 steps</text><text x="662.5" y="265" font-size="12" text-anchor="middle">same fresh policy condition</text><text x="662.5" y="283" font-size="12" text-anchor="middle">raw external + wrist; original task</text><rect x="275" y="213" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="397.5" y="241" font-size="15" font-weight="700" text-anchor="middle">Execute up to 10 actions</text><text x="397.5" y="265" font-size="12" text-anchor="middle">fresh observations at next replan</text><text x="397.5" y="283" font-size="12" text-anchor="middle">up to 300 actions per rollout</text><rect x="10" y="213" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="132.5" y="241" font-size="15" font-weight="700" text-anchor="middle">Native deferral</text><text x="132.5" y="265" font-size="12" text-anchor="middle">fine=true or rejected call</text><text x="132.5" y="283" font-size="12" text-anchor="middle">execute current native prediction</text><path d="M255 77H272" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M520 77H537" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M785 77H802" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M927 129V210" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M805 265H788" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M540 265H523" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M398 129V163H132V210" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><path d="M255 265H272" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#paper-direction-arrow)"/><text x="530" y="363" font-size="12" text-anchor="middle">Each replan starts with a fresh native prediction. The policy receives raw cameras throughout.</text><text x="530" y="386" font-size="12" text-anchor="middle">This is the frozen implementation plan. Corrected FRS development/evaluation results are pending.</text></g></svg>
