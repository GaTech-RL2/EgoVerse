<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" role="img" aria-label="critique-learning"><title>critique-learning</title><defs><marker id="critique-learning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#51717e"/></marker></defs><g font-family="system-ui,sans-serif" fill="#193c4d"><rect x="10" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="132.5" y="53" font-size="15" font-weight="700" text-anchor="middle">1 · Critique latest rollout</text><text x="132.5" y="77" font-size="12" text-anchor="middle">raw snapshots + state + all actions</text><text x="132.5" y="95" font-size="12" text-anchor="middle">up to five observable trigger rules</text><rect x="275" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="397.5" y="53" font-size="15" font-weight="700" text-anchor="middle">2 · Fresh native prediction</text><text x="397.5" y="77" font-size="12" text-anchor="middle">raw paired cameras, state, task</text><text x="397.5" y="95" font-size="12" text-anchor="middle">base or learned noise; frozen pi05</text><rect x="540" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="662.5" y="53" font-size="15" font-weight="700" text-anchor="middle">3 · Astra action editor</text><text x="662.5" y="77" font-size="12" text-anchor="middle">check triggers every ten actions</text><text x="662.5" y="95" font-size="12" text-anchor="middle">bounded XYZ / gripper, or defer</text><rect x="805" y="25" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="927.5" y="53" font-size="15" font-weight="700" text-anchor="middle">4 · Reverse and generate</text><text x="927.5" y="77" font-size="12" text-anchor="middle">inverse Euler10 → noise mean</text><text x="927.5" y="95" font-size="12" text-anchor="middle">repeat first seven; redraw padding</text><text x="927.5" y="113" font-size="12" text-anchor="middle">forward Euler10 → action chunk</text><rect x="805" y="230" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="927.5" y="258" font-size="15" font-weight="700" text-anchor="middle">5 · Execute and record</text><text x="927.5" y="282" font-size="12" text-anchor="middle">up to ten actions per chunk</text><text x="927.5" y="300" font-size="12" text-anchor="middle">300-action cap for the rollout</text><rect x="540" y="410" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="662.5" y="438" font-size="15" font-weight="700" text-anchor="middle">6 · Astra compares + gates</text><text x="662.5" y="462" font-size="12" text-anchor="middle">candidate vs promoted incumbent</text><text x="662.5" y="480" font-size="12" text-anchor="middle">valid critique + better → admit</text><text x="662.5" y="498" font-size="12" text-anchor="middle">raw evidence; no simulator score</text><rect x="275" y="410" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="397.5" y="438" font-size="15" font-weight="700" text-anchor="middle">7 · Fit auxiliary actor</text><text x="397.5" y="462" font-size="12" text-anchor="middle">admitted replay; 1,000 Adam steps</text><text x="397.5" y="480" font-size="12" text-anchor="middle">181,255 parameters; pi05 frozen</text><rect x="10" y="410" width="245" height="104" rx="12" fill="#edf5f7" stroke="#a4c5d1"/><text x="132.5" y="438" font-size="15" font-weight="700" text-anchor="middle">8 · Evaluate checkpoint</text><text x="132.5" y="462" font-size="12" text-anchor="middle">separate resets; no Astra calls</text><text x="132.5" y="480" font-size="12" text-anchor="middle">evaluate after each of three rounds</text><path d="M255 77H272" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M520 77H537" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M785 77H802" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M927 129V227" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M662 129V280H802" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M805 310H397V132" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M927 334V462H788" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M540 462H523" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M275 462H258" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><path d="M662 514V554H132V517" fill="none" stroke="#51717e" stroke-width="2" marker-end="url(#critique-learning-arrow)"/><text x="797" y="184" font-size="12" text-anchor="middle">defer / rejected: native prediction</text><text x="570" y="337" font-size="12" text-anchor="middle">continue rollout: fresh observation and prediction</text><text x="940" y="374" font-size="12" text-anchor="middle">rollout ends</text><text x="402" y="580" font-size="12" text-anchor="middle">not admitted: retain checkpoint and evaluate</text><text x="530" y="618" font-size="12" text-anchor="middle">Repeat three fixed adaptation rounds. Latest candidate feeds the next critique; only promotion changes the incumbent.</text><text x="530" y="641" font-size="12" text-anchor="middle">The no-learning arm retains rules and uses online edits at evaluation. Evaluation feedback never enters adaptation.</text></g></svg>
