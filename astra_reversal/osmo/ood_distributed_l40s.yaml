# Scheduling-only alternative to ood_steering_l40s.yaml.
# Require all explicit template values, and upload the SAME payload to EVERY task:
# worker0, worker1, worker2, worker3, worker4, worker5, worker6, worker7.
# Each task waits for /osmo/run/workspace/payload.tar.gz with PAYLOAD_SHA256.
# osmo workflow submit astra_reversal/osmo/ood_distributed_l40s.yaml --pool groot-l40s-01 --priority LOW \
#   --set-string "payload_sha256=${ASTRA_PAYLOAD_SHA256}" shard_groups=4 \
#   shard_group_index=2 methods=policy_fresh,policy_reused,reversal
# Add --dry-run for validation; use group 3 separately, never duplicate a running group.
workflow:
  name: astra-pi05-ood-distributed-20260924
  resources:
    default:
      cpu: 4
      gpu: 1
      memory: 48Gi
      storage: 60Gi
      platform: ovx-l40s
  timeout:
    queue_timeout: 4h
    exec_timeout: 12h
  tasks:
  - &worker
    name: worker0
    image: nvcr.io/nvidia/pytorch:25.06-py3
    command: [bash]
    args: [/tmp/astra-bootstrap.sh]
    environment: &worker_environment
      PAYLOAD_SHA256: "{{payload_sha256}}"
      ASTRA_RUN_ID: "{{workflow_id}}"
      ASTRA_ENTRY_MODULE: astra_reversal.osmo.ood_distributed
      ASTRA_OOD_METHODS: "{{methods}}"
      ASTRA_SHARD_GROUPS: "{{shard_groups}}"
      ASTRA_SHARD_GROUP_INDEX: "{{shard_group_index}}"
      ASTRA_WORKER_INDEX: "0"
      ASTRA_INCLUDE_OOD: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_TF32_OVERRIDE: "0"
    credentials:
      grabber-arc-r2-20260916:
        R2_ACCESS_KEY_ID: r2_access_key_id
        R2_SECRET_ACCESS_KEY: r2_secret_access_key
        R2_ENDPOINT_URL: r2_endpoint_url
      astra-reversal-inference-20260924:
        NVIDIA_INFERENCE_API_KEY: api_key
    files:
    - localpath: bootstrap.sh
      path: /tmp/astra-bootstrap.sh
  - <<: *worker
    name: worker1
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "1"
  - <<: *worker
    name: worker2
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "2"
  - <<: *worker
    name: worker3
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "3"
  - <<: *worker
    name: worker4
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "4"
  - <<: *worker
    name: worker5
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "5"
  - <<: *worker
    name: worker6
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "6"
  - <<: *worker
    name: worker7
    environment:
      <<: *worker_environment
      ASTRA_WORKER_INDEX: "7"
