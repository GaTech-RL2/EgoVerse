workflow:
  name: astra-pi05-input-skill-library-20260930
  resources:
    default:
      cpu: 6
      gpu: 1
      memory: 48Gi
      storage: 160Gi
      platform: ovx-l40s
  timeout:
    queue_timeout: 4h
    exec_timeout: 24h
  tasks:
    - name: worker0
      image: nvcr.io/nvidia/pytorch:25.06-py3
      command: [bash]
      args: [/tmp/astra-bootstrap.sh]
      environment:
        PAYLOAD_SHA256: '{{payload_sha256}}'
        ASTRA_RUN_ID: '{{workflow_id}}'
        ASTRA_ENTRY_MODULE: astra_reversal.osmo.demo_skill_library
        ASTRA_WORKER_INDEX: '0'
        ASTRA_INCLUDE_OOD: '1'
        ASTRA_DEMO_PILOT: '{{pilot}}'
        ASTRA_CODEX_RELAY_PORT: '8769'
        ASTRA_CODEX_RELAY_HOST: 127.0.0.1
        ASTRA_CODEX_RELAY_TOKEN_FILE: /tmp/astra-relay.token
        ASTRA_RETAIN_FAILED_WORKER: '0'
        NVIDIA_DRIVER_CAPABILITIES: all
        NVIDIA_TF32_OVERRIDE: '0'
      credentials: &storage_credentials
        grabber-arc-r2-20260916:
          R2_ACCESS_KEY_ID: r2_access_key_id
          R2_SECRET_ACCESS_KEY: r2_secret_access_key
          R2_ENDPOINT_URL: r2_endpoint_url
      files:
        - localpath: bootstrap.sh
          path: /tmp/astra-bootstrap.sh
        - localpath: '{{relay_token_file_0}}'
          path: /tmp/astra-relay.token
    - name: worker1
      image: nvcr.io/nvidia/pytorch:25.06-py3
      command: [bash]
      args: [/tmp/astra-bootstrap.sh]
      environment:
        PAYLOAD_SHA256: '{{payload_sha256}}'
        ASTRA_RUN_ID: '{{workflow_id}}'
        ASTRA_ENTRY_MODULE: astra_reversal.osmo.demo_skill_library
        ASTRA_WORKER_INDEX: '1'
        ASTRA_INCLUDE_OOD: '1'
        ASTRA_DEMO_PILOT: '{{pilot}}'
        ASTRA_CODEX_RELAY_PORT: '8769'
        ASTRA_CODEX_RELAY_HOST: 127.0.0.1
        ASTRA_CODEX_RELAY_TOKEN_FILE: /tmp/astra-relay.token
        ASTRA_RETAIN_FAILED_WORKER: '0'
        NVIDIA_DRIVER_CAPABILITIES: all
        NVIDIA_TF32_OVERRIDE: '0'
      credentials: *storage_credentials
      files:
        - localpath: bootstrap.sh
          path: /tmp/astra-bootstrap.sh
        - localpath: '{{relay_token_file_1}}'
          path: /tmp/astra-relay.token
