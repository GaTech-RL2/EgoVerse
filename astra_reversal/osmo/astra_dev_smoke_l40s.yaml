# Run from the repository root after packaging the frozen runtime diagnostic and
# the three astra-proposal-input files. Required template value: payload_sha256.
# osmo workflow submit astra_reversal/osmo/astra_dev_smoke_l40s.yaml \
#   --pool groot-l40s-03 --set-string "payload_sha256=${ASTRA_PAYLOAD_SHA256}"
workflow:
  name: astra-pi05-astra-dev-smoke-20260924
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 48Gi
      storage: 60Gi
      platform: ovx-l40s
  timeout:
    queue_timeout: 4h
    exec_timeout: 2h
  tasks:
  - name: libero
    image: nvcr.io/nvidia/pytorch:25.06-py3
    command: [bash]
    args: [/tmp/astra-bootstrap.sh]
    environment:
      PAYLOAD_SHA256: "{{payload_sha256}}"
      ASTRA_RUN_ID: "{{workflow_id}}"
      ASTRA_ENTRY_MODULE: astra_reversal.osmo.astra_dev_smoke
      ASTRA_INCLUDE_OOD: "0"
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_TF32_OVERRIDE: "0"
    credentials:
      grabber-arc-r2-20260916:
        R2_ACCESS_KEY_ID: r2_access_key_id
        R2_SECRET_ACCESS_KEY: r2_secret_access_key
        R2_ENDPOINT_URL: r2_endpoint_url
      astra-reversal-inference-20260924:
        NVIDIA_INFERENCE_API_KEY: api_key
    files:
    - localpath: bootstrap.sh
      path: /tmp/astra-bootstrap.sh
