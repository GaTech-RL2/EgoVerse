workflow:
  name: astra-pi05-recipe-evaluation-20260927
  resources:
    default:
      cpu: 4
      gpu: 1
      memory: 48Gi
      storage: 100Gi
      platform: ovx-l40s
      nodesExcluded:
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-5728
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-0485
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-7183
      - osmogroot-dgxc-k8s-forge-az41-prd1-w-2132
  timeout:
    queue_timeout: 4h
    exec_timeout: 6h
  tasks:
  - name: worker0
    image: nvcr.io/nvidia/pytorch:25.06-py3
    command:
    - bash
    args:
    - /tmp/astra-bootstrap.sh
    environment:
      PAYLOAD_SHA256: '{{payload_sha256}}'
      ASTRA_RUN_ID: '{{workflow_id}}'
      ASTRA_ENTRY_MODULE: astra_reversal.osmo.learned_recipe
      ASTRA_WORKER_INDEX: '0'
      ASTRA_INCLUDE_OOD: '1'
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_TF32_OVERRIDE: '0'
      ASTRA_RECIPE_PHASE: evaluation
      CUBLAS_WORKSPACE_CONFIG: :4096:8
      ASTRA_RECIPE_TRAINING_WORKFLOW: '{{training_workflow}}'
      ASTRA_RECIPE_BUNDLE_SHA256: '{{bundle_sha256}}'
    credentials:
      grabber-arc-r2-20260916:
        R2_ACCESS_KEY_ID: r2_access_key_id
        R2_SECRET_ACCESS_KEY: r2_secret_access_key
        R2_ENDPOINT_URL: r2_endpoint_url
    files:
    - localpath: bootstrap.sh
      path: /tmp/astra-bootstrap.sh
  - name: worker1
    image: nvcr.io/nvidia/pytorch:25.06-py3
