# All four template values are required; no OSMO template defaults are assumed.
# Validate with --dry-run, then submit each group index using the same payload:
# osmo workflow submit astra_reversal/osmo/ood_steering_l40s.yaml --pool groot-l40s-03 \
#   --set-string "payload_sha256=${ASTRA_PAYLOAD_SHA256}" shard_groups=4 \
#   shard_group_index=0 methods=policy_fresh,policy_reused,reversal
# Repeat for shard_group_index=1,2,3; aggregate disjoint assigned episode IDs.
workflow:
  name: astra-pi05-ood-steering-20260924
  resources:
    default:
      cpu: 32
      gpu: 8
      memory: 192Gi
      storage: 320Gi
      platform: ovx-l40s
  timeout:
    queue_timeout: 4h
    exec_timeout: 12h
  tasks:
  - name: libero
    image: nvcr.io/nvidia/pytorch:25.06-py3
    command: [bash]
    args: [/tmp/astra-bootstrap.sh]
    environment:
      PAYLOAD_SHA256: "{{payload_sha256}}"
      ASTRA_RUN_ID: "{{workflow_id}}"
      ASTRA_ENTRY_MODULE: astra_reversal.osmo.ood_steering
      ASTRA_OOD_METHODS: "{{methods}}"
      ASTRA_SHARD_GROUPS: "{{shard_groups}}"
      ASTRA_SHARD_GROUP_INDEX: "{{shard_group_index}}"
      ASTRA_INCLUDE_OOD: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_TF32_OVERRIDE: "0"
    credentials:
      grabber-arc-r2-20260916:
        R2_ACCESS_KEY_ID: r2_access_key_id
        R2_SECRET_ACCESS_KEY: r2_secret_access_key
        R2_ENDPOINT_URL: r2_endpoint_url
      astra-reversal-inference-20260924:
        NVIDIA_INFERENCE_API_KEY: api_key
    files:
    - localpath: bootstrap.sh
      path: /tmp/astra-bootstrap.sh
