_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.HNetFused
  # Fused-tokens variant: flat transformer over an interleaved
  # [c_0, BOS, c_1, a_0, c_2, a_1, ...] sequence of length 2T. No chunker,
  # no AdaLN — conditioning is fed in-band as obs tokens.

  d_cond: 128

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

  outer_stage:
    _target_: egomimic.algo.flat_fused_outer_stage.FlatFusedOuterStage
    action_dim: 2
    action_horizon: 1024
    d_model: 128
    d_cond: 128

    cond_encoder:
      _target_: egomimic.models.hnet_nets.cond_encoders.CondEncoderModule
      d_cond: 128
      output_key: "fused_cond"
      cond_proj_widths: [128, 128]
      obs_specs:
        state_agent_obj:
          input_dim: 5
          embed_dim: 64
          widths: [128]
      img_encoders:
        front_img_1:
          _target_: egomimic.models.hnet_nets.image_encoders.SimpleConv
          in_channels: 3
          channels: [32, 64, 128, 256]
          kernel_size: 3
          stride: 2
          embed_dim: 128
          norm_groups: 8

    arch_layout: "T8"
    num_heads: 4
    d_intermediate: 512
    dropout: 0.15
    resid_dropout: 0.2

  # FlatFused has no multi-stage chunker hierarchy, so the lr_multipliers /
  # init_weights_range knobs are no-ops here (HNet.__init__ skips them
  # when outer_stage.inner_stage is None). Kept for structural parallel
  # with the stage-based configs.
  init_weights_range: 0.02
  lr_multipliers: [1.0]
  use_parameter_groups: true
  weight_decay: 0.01

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 4e-5
  weight_decay: 0.0001

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 400
  warmup_steps: 24
  warmup_start_factor: 0.1
  eta_min: 4.0e-6
