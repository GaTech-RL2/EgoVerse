_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  # B-v2: identical to hnet_pushshapes_fused_windowed_resnet but with a HOTTER
  # peak LR (1.5e-4 = 1.5x B's flat 1e-4) + warmup->cosine decay (user request:
  # "go ~1.5x higher at first, then come down more"). Pair with GCLIP=1.0.
  _target_: egomimic.algo.hnet_closedloop.HNetFusedClosedLoop
  action_dim: 2
  action_horizon: 1024
  d_model: 128
  d_cond: 128
  obs_source: demo            # A=demo (teacher-forced obs, no sim) | B=sim (closed-loop)
  image_key: front_img_1
  k_schedule: [[0,1],[50,2],[100,4],[150,8],[250,16],[400,32]]
  max_windows: 128        # cap windows/batch (speed/mem vs coverage); 128 chosen
  cond_encoder:
    _target_: egomimic.models.hnet_nets.cond_encoders.CondEncoderModule
    d_cond: 128
    output_key: fused_cond
    cond_proj_widths: [128, 128]
    obs_specs:
      state_agent_obj:
        input_dim: 2
        embed_dim: 64
        widths: [128]
        input_slice: [0, 2]
    img_encoders:
      front_img_1:
        _target_: egomimic.models.hnet_nets.image_encoders.ResNetEncoder
        in_channels: 3
        embed_dim: 128
        resnet_model: resnet18
        pretrained: true
        spatial: true
  arch_layout: T8
  num_heads: 4
  d_intermediate: 512
  domains: [pushshapes_sim]
  ac_keys:
    pushshapes_sim: actions
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.5e-4
  weight_decay: 0.0001
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 4800   # 600 epochs x 8 batches/epoch
  warmup_steps: 240 # 5% warmup up to the 1.5e-4 peak
  warmup_start_factor: 0.1
  eta_min: 1.0e-6
