# BC-RNN-TRANSFORMER-CHUNK4-QUERIES: the CHUNK4 recipe (obs_stride=4/chunk_len=4
# on tx_cos) with ONE change -- the chunk readout is an ACT/HPT-style ACTION-QUERY
# DECODER instead of the flat wide-linear gmm_head projection.
#
# SINGLE-KNOB vs the chunk4 linear readout: same obs_stride=4/chunk_len=4 and
# everything else; ONLY chunk_head: queries (+ the query_decoder: slot). Isolates
# the READOUT SHAPE (linear vs action-queries) -- NOT capacity (the query decoder
# adds ~1-3M params).
#
# WHAT CHANGES (readout only):
#   linear  (chunk4): each obs-step feature h_k -> Linear(448 -> 4*per_step) -> 4
#       independent GMMs (4 disjoint slices of one projection of the SAME h_k).
#   queries (this):   4 LEARNABLE query embeddings refined by a small decoder
#       (self-attn among queries + causal cross-attn over h_0..h_k), then a SHARED
#       Linear(448 -> per_step) maps each refined query to its GMM params. The 4
#       GMMs (5 modes each, one 2-d action) are IDENTICAL semantics in both.
# extends bc_rnn_pushshapes_paperexact_tx_cos
defaults:
  - bc_rnn_pushshapes_paperexact_tx_cos
  - _self_

robomimic_model:
  # OBS STRIDING + ACTION CHUNKING (stride/chunk 4/4).
  obs_stride: 4
  chunk_len: 4
  # CHUNK READOUT SWAP (the ONLY deviation from the chunk4 linear readout):
  # ACT/HPT-style action-query decoder instead of the flat wide-linear gmm_head.
  chunk_head: queries

  # ACTION-QUERY DECODER (the readout for chunk_head: queries). Refines chunk_len
  # learnable queries via self-attn(queries) + causal cross-attn over the
  # transformer's per-obs-step features h_0..h_k, then a SHARED projection maps
  # each refined query to per_step GMM params.
  query_decoder:
    _target_: egomimic.models.bc_rnn_nets.QueryActionDecoder
    d_model: ${..core_net.d_model}   # = core.d_model 448 (the features it cross-attends)
    chunk_len: ${..chunk_len}        # MUST match robomimic_model.chunk_len (= 4)
    per_step: 25              # = gmm_head num_modes*(2*action_dim+1) = 5*(2*2+1)
    n_layers: 1               # 1 block = 3.24M added params (n_layers=2 -> 6.46M)
    n_heads: 8                # 448 / 8 = 56 dim/head
    ff_mult: 4                # FF hidden = 4*448 = 1792
    dropout: 0.0              # match the core (paper-exact dropout 0)
    max_window: ${..rnn_horizon}  # inherits the ONE window number (override only for capacity pre-allocation, e.g. window curriculum)

  gmm_head:
    chunk_len: ${..chunk_len}   # MUST match robomimic_model.chunk_len (= 4)
