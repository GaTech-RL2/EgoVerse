_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  # Path A/B unified windowed K-curriculum AR. obs_source=demo (A, fast) | sim (B).
  _target_: egomimic.algo.hnet_closedloop.HNetFusedClosedLoop
  action_dim: 2
  action_horizon: 1024
  d_model: 128
  d_cond: 128
  obs_source: demo            # A=demo (teacher-forced obs, no sim) | B=sim (closed-loop)
  image_key: front_img_1
  k_schedule: [[0,1],[50,2],[100,4],[150,8],[250,16],[400,32]]
  max_windows: 128        # cap windows/batch (speed/mem vs coverage); 128 chosen
  cond_encoder:
    _target_: egomimic.models.hnet_nets.cond_encoders.CondEncoderModule
    d_cond: 128
    output_key: fused_cond
    cond_proj_widths: [128, 128]
    obs_specs:
      state_agent_obj:
        input_dim: 2
        embed_dim: 64
        widths: [128]
        input_slice: [0, 2]
    img_encoders:
      front_img_1:
        _target_: egomimic.models.hnet_nets.image_encoders.SimpleConv
        in_channels: 3
        channels: [32, 64, 128, 256]
        kernel_size: 3
        stride: 2
        embed_dim: 128
        norm_groups: 8
        spatial: true
  arch_layout: T8
  num_heads: 4
  d_intermediate: 512
  domains: [pushshapes_sim]
  ac_keys:
    pushshapes_sim: actions
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001
scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
