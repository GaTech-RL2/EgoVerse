_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hnet.HNet

  # Scaled-up version of hnet_pushshapes.yaml:
  #   - d_model 128 -> 256, num_heads 4 -> 8
  #   - d_intermediate (MLP) 512 -> 1024 (enc/dec) and 768 -> 1536 (inner)
  #   - chunked dim 192 -> 384 (kept proportional, 1.5x of outer)
  # Expected param count: ~5.7M (baseline) -> ~22M (~4x).
  action_dim: 2
  action_horizon: 1024
  d_model: 256
  d_cond: 256

  cond_encoder:
    _target_: egomimic.models.hnet_nets.cond_encoders.CondEncoderModule
    d_cond: 256
    output_key: "fused_cond"
    cond_proj_widths: [256, 256]
    obs_specs:
      # DRIFT WARNING (provenance, NOT a bug): this HNet-algo config feeds the
      # FULL 5-dim state_agent_obj (input_dim: 5, no input_slice) -- DIVERGES from
      # the BC-RNN family base (_bcrnn_common / _bcrnn_paperexact_common), which
      # uses input_dim: 2 + input_slice: [0, 2] (agent xy only). Kept as-is to
      # preserve the original run; do NOT "fix" it to match the BC family.
      state_agent_obj:
        input_dim: 5
        embed_dim: 128
        widths: [256]
    img_encoders:
      front_img_1:
        _target_: egomimic.models.hnet_nets.image_encoders.SimpleConv
        in_channels: 3
        channels: [32, 64, 128, 256]
        kernel_size: 3
        stride: 2
        embed_dim: 256
        norm_groups: 8

  hnet:
    _target_: egomimic.models.hnet_nets.hnet.HNet
    stages:
      - _target_: egomimic.models.hnet_nets.stages.EncoderDecoderStage
        input_hidden_dim: 256
        output_hidden_dim: 256
        cond_key: "fused_cond"
        d_cond: 256
        causal: true
        encoder:
          arch_layout: "T4"
          d_model: 256
          d_intermediate: 1024
          num_heads: 8
          cond: true
        decoder:
          arch_layout: "T4"
          d_model: 256
          d_intermediate: 1024
          num_heads: 8
          cond: true
      - _target_: egomimic.models.hnet_nets.stages.ChunkerStage
        input_hidden_dim: 256
        output_hidden_dim: 384
        target_compression_ratio: 8.0
        ratio_loss_weight: 0.03
        cond_key: "fused_cond"
      - _target_: egomimic.models.hnet_nets.stages.ComputeStage
        input_hidden_dim: 384
        output_hidden_dim: 384
        cond_key: "fused_cond"
        d_cond: 256
        causal: true
        main_network:
          arch_layout: "T4"
          d_model: 384
          d_intermediate: 1536
          num_heads: 8
          cond: false

  domains: ["pushshapes_sim"]
  ac_keys:
    pushshapes_sim: "actions"

  init_weights_range: null
  lr_multipliers: null
  use_parameter_groups: false
  weight_decay: 0.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  start_factor: 1
  end_factor: 1
