<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
<title id="title">Astra hardware interface: JSON contracts and code architecture</title>
<desc id="desc">Three actor interfaces, shared execution proxy, native hardware adapters, private evaluation and replay. Full JSON examples and sensor tables accompany this diagram in the standalone HTML.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#49627d"/></marker></defs>
<rect width="1800" height="1440" fill="#f5f8fc"/>
<text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#142d46">Astra → hardware: interfaces, JSON and code</text>
<text x="48" y="89" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#49627d">Fresh actor per rollout • Fixed model weights • One selected interface • Same native robot authority</text>
<rect x="48" y="123" width="1704" height="103" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="68" y="157" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">1  runner.run_trial + provider.Session</text>
<text x="68" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Official task instruction + allowed tools → model function call {name, arguments} → strict JSON parsing → Router.dispatch(tool, arguments)</text>
<path d="M310,226 V264" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<path d="M898,226 V264" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<path d="M1488,226 V264" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<rect x="48" y="273" width="524" height="260" rx="15" fill="#eaf7f3" stroke="#087f70" stroke-width="1.6"/>
<text x="68" y="307" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#087f70">F  Typed hardware interface</text>
<text x="68" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">describe_device() → hardware-1 description</text>
<text x="68" y="367" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">read(channel, max_age_ms) / read_latest()</text>
<text x="68" y="394" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">act(envelope) → Proxy.act → Proxy.step</text>
<text x="68" y="421" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Envelope: channel, value, duration_steps,</text>
<text x="68" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">metadata {mode, units, episode_id,</text>
<text x="68" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">observation_step}; units/frames declared.</text>
<rect x="636" y="273" width="524" height="260" rx="15" fill="#fff5ea" stroke="#ab5e19" stroke-width="1.6"/>
<text x="656" y="307" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ab5e19">B0  Native codebase interface</text>
<text x="656" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">source tools reveal native conventions</text>
<text x="656" y="367" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">observe(keys) → native sensor dictionary</text>
<text x="656" y="394" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">step(action, repeat_steps, observation_step)</text>
<text x="656" y="421" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">→ Proxy.step with the same vector as F</text>
<text x="656" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">JSON input schema fixes action dimension;</text>
<text x="656" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">the actor discovers ordering in source.</text>
<rect x="1224" y="273" width="528" height="260" rx="15" fill="#f4eefb" stroke="#7750b3" stroke-width="1.6"/>
<text x="1244" y="307" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7750b3">B  Native interface + observer</text>
<text x="1244" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Same observe / step tools as B0</text>
<text x="1244" y="367" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">describe_visible(request_kind)</text>
<text x="1244" y="394" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">→ current camera images → Observer</text>
<text x="1244" y="421" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">JSON: frame_step, visible_facts,</text>
<text x="1244" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">uncertainties, occlusions</text>
<text x="1244" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Observer has no action tools or task plans.</text>
<rect x="48" y="555" width="1704" height="103" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="68" y="589" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">Available in every arm: source_search • source_read • scratch_execute • finish</text>
<text x="68" y="622" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">SourceView exposes audited robot/controller code. Isolated Python scratch can call only that arm’s proxy tools. No env handle or network.</text>
<path d="M310,533 V544 H22 V701 H68" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<path d="M898,533 V544 H1790 V701 H1732" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<path d="M1488,533 V544 H1790" fill="none" stroke="#49627d" stroke-width="2.1"/>
<rect x="78" y="684" width="1654" height="155" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="98" y="718" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">2  Router → shared Proxy: validate, execute, record</text>
<text x="98" y="751" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">runner.py: JSON Schema + allowed tool → proxy.py: finite vector, exact 7D/12D shape, bounds, repeat ≤ 10, current observation step</text>
<text x="98" y="778" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">F adds channel / mode / units / episode checks. Rejected commands apply no action. All arms execute the same normalized native controller.</text>
<text x="98" y="805" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Return {accepted, applied_action, applied_steps, simulator_step, timestamp, episode_ended}; read again before the next action.</text>
<path d="M468,839 V872" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="240" y="862" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#49627d">native actions ↓</text>
<text x="525" y="862" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#49627d">images / sensors ↑</text>
<path d="M1332,839 V872" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1104" y="862" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#49627d">native actions ↓</text>
<text x="1389" y="862" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#49627d">images / sensors ↑</text>
<rect x="48" y="879" width="816" height="196" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="68" y="913" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">3a  libero.Environment — fixed-base Panda</text>
<text x="68" y="946" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">7 values: Δx, Δy, Δz, axis-angle Δrotation (3), gripper</text>
<text x="68" y="973" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">OSC_POSE; pose commands in world frame; 20 Hz</text>
<text x="68" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">6 numeric channels: joints, end effector, gripper</text>
<text x="68" y="1027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">2 RGB cameras: front + wrist; upright PNG, 128 × 128</text>
<text x="68" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Readback: typed envelope (F) or native keys (B0/B)</text>
<rect x="936" y="879" width="816" height="196" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="956" y="913" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">3b  robocasa.Environment — mobile PandaOmron</text>
<text x="956" y="946" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">12 values: arm (6), gripper, base (3), torso, base mode</text>
<text x="956" y="973" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">HYBRID_MOBILE_BASE; native arm controller uses base frame</text>
<text x="956" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">5 numeric channels: base, end effector, gripper</text>
<text x="956" y="1027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">3 RGB cameras: left + right + wrist; upright PNG, 128 × 128</text>
<text x="956" y="1054" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Live controller resolves exact slices / scaling / control frequency</text>
<path d="M456,1075 V1111" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<path d="M1344,1075 V1095 H456" fill="none" stroke="#49627d" stroke-width="2.1"/>
<rect x="48" y="1118" width="816" height="180" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="68" y="1152" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">4  Private evaluator + common.Events</text>
<text x="68" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Official success predicate after each applied native step</text>
<text x="68" y="1212" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Stop at first success, horizon, finish, or infrastructure error</text>
<text x="68" y="1239" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">events.jsonl: chained hashes; actions, observations, model calls</text>
<text x="68" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">outcome.json: success, reason, steps, time, actor/observer usage</text>
<rect x="936" y="1118" width="816" height="180" rx="15" fill="white" stroke="#ccd9e6" stroke-width="1.6"/>
<text x="956" y="1152" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142d46">5  Worker replay + analysis</text>
<text x="956" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Separate process: same pinned reset + recorded native actions</text>
<text x="956" y="1212" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">Compare first-success step and terminal simulator state</text>
<text x="956" y="1239" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">independent-replay.json → verified evidence + analysis.json</text>
<text x="956" y="1266" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">No model calls during replay; it verifies live control.</text>
<path d="M864,1209 H927" fill="none" stroke="#49627d" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="883" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#49627d">logs</text>
<text x="48" y="1343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#49627d">IMPLEMENTED BOUNDARY</text>
<text x="48" y="1372" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#142d46">Actor sees robot sensors, camera images and audited source. Task internals, object state and evaluator labels stay private.</text>
<text x="48" y="1409" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#49627d">See standalone HTML for every channel, exact request / response JSON, complete generated tool schemas and module ownership.</text>
</svg>