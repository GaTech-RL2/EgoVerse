notes:
- Fresh Astra actor per rollout; no training or demonstration use.
- All 50 official target tasks; one scenario seed each is an exploratory breadth pilot,
  not a leaderboard submission.
- Use official native mobile controller and private per-native-step success predicate.
- Retain infrastructure failures; do not resample task scenarios or repeat completed
  trials.
- Three logged retries only for transient provider transport failures; no duplicate
  action dispatch.
- Record actual actor/observer usage with no experiment token, wall-time or call caps.
- Store request history item hashes instead of duplicating full input history; exact
  model responses and tool observations remain in private events.
- Keep RoboCasa outcomes separate from historical LIBERO cohorts.
