reference_horizon_steps: 400
termination: No voluntary early finish in scored trials. Continue the same episode
  until native success or all 1,000 control steps are used; do not pad or replay actions.
  Keep technical failures explicit. The unscored eight-action routing smoke may finish
  early. Report success within 400 steps as a secondary prefix of these extended-horizon
  policies, separately from the original 400-step-policy protocol.
video:
  selection: all_trials
  frame_stride: 1
  fps: 20
  cameras:
  - agentview
  - robot0_eye_in_hand
  scope: Initial frame and every native action through the actual terminal step; uncropped
    front/wrist side by side. Independent replay video excludes model reasoning waits
    and is outside actor timing. Save exact frame-count and duration receipts.
additional_settling_steps: 0
success: Unmodified native Threading_D0._check_success after each native control step;
  private to evaluator.
adaptation: Fresh per trial; hardware sensors, calibration, bounded dynamics probes,
  notes and read-only observation/coordinate helpers in all four cells. CAP additionally
  runs generated robot-control programs through scratch_execute. Direct issues native
  act commands through model calls.
command_api: CAP receives the exact nested act envelope JSON Schema and read-packet
  freshness fields; direct receives that same schema through its act tool. Version-1
  attempts hid the CAP command schema and are diagnostic only, excluded from this
  comparison.
model_output_contract: Exactly one tool call per response. Reject the entire zero-call
  or multi-call output without dispatch and return validation feedback; the actor
  may correct its next response within the same trial. All elapsed time, model usage,
  and rejection counts are retained. No rejected action is executed or automatically
  redispatched. Version-2 attempts halted on this recoverable format error and were
  interrupted by node maintenance; retain them separately.
image_transport: Only complete, decodable RGB PNGs with matching integer height/width/channel
  shapes become image attachments. Image-shaped debug summaries and truncated base64
  remain exact JSON text. Preserve valid camera bytes unchanged in all four cells.
  Version-3 collection halted when a generated debug preview was misidentified as
  an image; retain that attempt separately. Version 4 starts a fresh matched cohort
  after repair, with no model, task, controller, seed, or horizon changes.
pairing: Identical seeded native reset state, model and initial sensor hashes for
  every cell; independent fresh-process action replay.
restart_policy: No automatic trial reruns or action redispatch. Archive completed
  trials and halt on unresolved infrastructure failure.
timing: Actor start to first native success; excludes provisioning/reset/replay. Provider
  round trips include actual server queue/compute; client backoff separately recorded.
  Cross-model timing includes different serving systems and reasoning settings.
conditions_analysis: Pilot only, ten starts; no confirmatory performance claim.
