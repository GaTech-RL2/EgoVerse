# @package _global_
defaults:
- /fold_moving_common
- _self_
description: b96_op8_v1
callbacks:
  moving_opscale_evaluation:
    split_name: fold_moving_b96_op8
logger:
  wandb:
    name: fold_clothes_b96_op8_rdt300m_v1
    tags:
    - fold_clothes_moving_opscale
    - v1
    - budget_hours=96
    - operators=8
data:
  train_operators: ${mecka_private:fold_moving_b96_op8,operators}
  video_episodes:
    valid: ${mecka_private:fold_moving_b96_op8,video_seen_matched}
    extra_valid: ${mecka_private:fold_moving_b96_op8,video_seen_perlevel}
    unseen_op_valid: ${mecka_private:fold_moving_b96_op8,video_unseen}
  train_datasets:
    human_bimanual:
      filters:
        episode_hashes: ${mecka_private:fold_moving_b96_op8,train}
  valid_datasets:
    human_bimanual:
      filters:
        episode_hashes: ${mecka_private:fold_moving_b96_op8,seen_matched}
  extra_valid_datasets:
    human_bimanual:
      filters:
        episode_hashes: ${mecka_private:fold_moving_b96_op8,seen_perlevel}
  unseen_op_valid_datasets:
    human_bimanual:
      filters:
        episode_hashes: ${mecka_private:fold_moving_b96_op8,unseen}
