  - 600
  - 1200
  - 1800
  - 3600
  - 7200
  - 14400
  - 28800
  report_times_are_limits: false
  server_queue_and_decode_separable: false
  server_metrics: Archive vLLM Prometheus snapshots. Per-request round trips remain
    the measured actor latency; aggregate server metrics cannot be subtracted from
    individual concurrent requests.
