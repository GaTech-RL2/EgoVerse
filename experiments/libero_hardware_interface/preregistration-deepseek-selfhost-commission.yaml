model_replication:
  requested_model: deepseek-ai/DeepSeek-V4.1-Flash-1017
  requested_hf_revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  reference_source_commit: 9c2278d2b9e52434ff06950b6b2a5b94071a971c
  pool_with_astra: false
  checkpoint_identity: Hugging Face download pinned to requested_hf_revision; server
    receipt verifies revision, index, shard sizes and image identity before actors
    start.
  identity_source: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017/tree/1bae0e1088993b9b82de08f59de5be5a34e42170
  transport_source: https://github.com/vllm-project/recipes/blob/main/models/deepseek-ai/DeepSeek-V4.1-Flash.yaml
  thinking_source: https://api-docs.deepseek.com/guides/thinking_mode/
  transport_amendments:
  - Keep plain-text reasoning output verbatim in subsequent input; omit unsupported
    encrypted reasoning, store and truncation fields.
  - Native API always enables parallel tool calls. Add exactly-one-tool-call instruction
    in all actor arms, preserve strict one-call execution validation; smoke must pass
    before trials.
  - Keep full context; native API does not support automatic truncation. Context/vision
    limits are infrastructure failures, never silent history dropping.
  - 'Use explicit high reasoning: DeepSeek maps medium/high/xhigh to high. Reasoning
    compute is not matched to Astra medium.'
  - Keep current task in instructions, matching Astra's automatic-truncation prompt.
    Observer remains stateless and uses the same DeepSeek model.
  - Self-hosted vLLM 0.31.0 Responses API through a credential-free loopback relay
    inside one private OSMO group. Hosted API credentials are not read or forwarded.
  - Numeric reasoning effort 75 matches the official API high mapping documented in
    the vLLM recipe; preserve prior reasoning explicitly (drop_thinking=false). Sampling
    is temperature=1, top_p=1, seed=42 in all arms.
  - One TP8 H100 server with Engram CPU offload, DSpark speculative decoding, 1M context
    and 4096 batched tokens. Serving configuration is identical in all arms.
  - The pool requires whole eight-GPU nodes. Eight evaluator workers receive one H100
    each on a separate node; the TP8 server receives its own eight H100s. Model serving
    and simulator rendering are separate tasks.
  - 'No external-provider rate limit or artificial client request pacing: eight actor
    workers use vLLM continuous batching (max_num_seqs=8). Provider round trips include
    actual model queue/compute; retry backoff remains separately timed.'
  historical_comparison: Astra is a historical reference only. Different providers,
    dates, reasoning levels and load preclude a controlled cross-model wall-clock
    speed claim.
  self_hosted: true
  serving_image: docker.io/vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
