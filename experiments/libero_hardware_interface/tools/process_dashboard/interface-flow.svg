<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Three Astra interfaces to the same robot</title><desc id="desc">F uses typed device channels, B0 reads source to discover native conventions, and B adds a stateless visual observer. All execute through the same validated proxy and receive the same cameras and robot state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#78909e" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="650" rx="12" fill="#fff"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#152e3c">
<text x="30" y="36" font-size="11" letter-spacing="1.7" fill="#637684">SAME MODEL · SAME TASK / INITIAL STATE · SAME AVAILABLE SENSORS AND CONTROL AUTHORITY</text>
<rect x="25" y="65" width="770" height="130" rx="10" fill="#f1f9f6" stroke="#d3e9e2"/><rect x="25" y="215" width="770" height="130" rx="10" fill="#fdf7f0" stroke="#ecdfcf"/><rect x="25" y="365" width="770" height="180" rx="10" fill="#f7f3fb" stroke="#e3d9ed"/>
<text x="45" y="93" font-size="17" fill="#007b73" font-weight="700">F</text><text x="45" y="114" font-size="11" fill="#637684">hardware interface</text>
<text x="45" y="243" font-size="17" fill="#ac611c" font-weight="700">B0</text><text x="45" y="264" font-size="11" fill="#637684">source discovery</text>
<text x="45" y="393" font-size="17" fill="#7955b2" font-weight="700">B</text><text x="45" y="414" font-size="11" fill="#637684">discovery + observer</text>
<g fill="#fff" stroke="#d5e0e6"><rect x="200" y="89" width="155" height="80" rx="8"/><rect x="410" y="89" width="335" height="80" rx="8"/><rect x="200" y="239" width="155" height="80" rx="8"/><rect x="410" y="239" width="335" height="80" rx="8"/><rect x="200" y="389" width="155" height="80" rx="8"/><rect x="410" y="389" width="335" height="80" rx="8"/></g>
<g font-size="14" font-weight="600"><text x="231" y="122">Astra actor</text><text x="231" y="272">Astra actor</text><text x="231" y="422">Astra actor</text></g>
<g font-size="11" fill="#637684"><text x="219" y="145">Task + device contract</text><text x="219" y="295">Task + source entry</text><text x="219" y="445">Task + source entry</text></g>
<g font-size="13" font-weight="600"><text x="430" y="120">Discoverable hardware JSON</text><text x="430" y="270">Native tools + code inspection</text><text x="430" y="420">Native tools + code inspection</text></g>
<g font-size="11" fill="#637684"><text x="430" y="143">describe_device · read · read_latest · act</text><text x="430" y="161">Channels · units · frames · bounds · freshness</text><text x="430" y="294">observe(keys) · step(action, repeat, step)</text><text x="430" y="311">Discover sensor names and controller conventions</text><text x="430" y="444">observe(keys) · step(action, repeat, step)</text><text x="430" y="461">Same native controls as B0</text></g>
<g fill="none" stroke="#78909e" stroke-width="1.6" marker-end="url(#arrow)"><path d="M355 129H407"/><path d="M355 279H407"/><path d="M355 429H407"/><path d="M745 129H853V244H903"/><path d="M745 279H903"/><path d="M745 429H853V315H903"/></g>
<rect x="410" y="487" width="335" height="40" rx="7" fill="#ede5f7" stroke="#d9cbea"/><text x="425" y="504" font-size="12" fill="#7955b2" font-weight="600">Separate Astra observer · describe_visible</text><text x="425" y="519" font-size="10" fill="#637684">Current images → facts / uncertainties / occlusions</text><path d="M278 472V507H407" fill="none" stroke="#7955b2" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="905" y="208" width="265" height="155" rx="10" fill="#edf4f8" stroke="#c4d9e5"/><text x="930" y="239" font-size="15" font-weight="650">Shared execution proxy</text><g font-size="12" fill="#496574"><text x="930" y="266">Same cameras and robot state</text><text x="930" y="288">Same controller and action bounds</text><text x="930" y="310">Current observation-step check</text><text x="930" y="332">Physics advances on accepted steps</text></g>
<path d="M1038 365V416" fill="none" stroke="#78909e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="905" y="420" width="265" height="98" rx="10" fill="#152e3c"/><text x="928" y="451" fill="#fff" font-size="15" font-weight="600">Robot benchmark</text><text x="928" y="476" fill="#bbcdd8" font-size="12">LIBERO Panda / RoboCasa robot</text><text x="928" y="497" fill="#bbcdd8" font-size="11">RGB + proprioception ↔ native actions</text>
<rect x="25" y="570" width="1145" height="54" rx="8" fill="#f5f7f8"/><text x="45" y="592" font-size="12" font-weight="600">Shared tools: source_search · source_read · scratch_execute · finish</text><text x="45" y="612" font-size="11" fill="#637684">All three actors see images directly. B’s helper provides descriptions only: no plans, robot commands or evaluator success labels.</text>
</g></svg>
