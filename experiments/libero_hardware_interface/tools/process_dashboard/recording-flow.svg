<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Astra code, JSON and evidence flow</title><desc id="desc">Provider generates tool calls, runner routes them through validation and benchmark adapters, and private evaluator evidence is logged and independently replayed before being archived. The dashboard reads the archive without rerunning Astra.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#78909e" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="540" rx="12" fill="#fff"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#152e3c">
<text x="28" y="35" font-size="11" letter-spacing="1.7" fill="#637684">IMPLEMENTATION: astra_reversal/hardware_interface/</text>
<g fill="#f3f7f9" stroke="#d3e0e7"><rect x="28" y="68" width="230" height="145" rx="10"/><rect x="332" y="68" width="230" height="145" rx="10"/><rect x="637" y="68" width="230" height="145" rx="10"/><rect x="942" y="68" width="230" height="145" rx="10"/></g>
<g font-size="16" font-weight="650"><text x="48" y="98">provider.py</text><text x="352" y="98">runner.py</text><text x="657" y="98">proxy.py</text><text x="962" y="98">Benchmark adapter</text></g>
<g font-size="12" fill="#496574"><text x="48" y="125">Prompt + history + tool schemas</text><text x="48" y="147">PNG → actual image input</text><text x="48" y="169">Astra → function call JSON</text><text x="48" y="192">Usage + transport errors logged</text><text x="352" y="125">Tool-name dispatch</text><text x="352" y="147">Source reads / scratch Python</text><text x="352" y="169">F: read / act envelopes</text><text x="352" y="192">B0, B: observe / step vectors</text><text x="657" y="125">Schema + bounds + freshness</text><text x="657" y="147">Accepted → native env.step</text><text x="657" y="169">Rejected → reason returned</text><text x="657" y="192">Private success check each step</text><text x="962" y="125">libero.py / robocasa.py</text><text x="962" y="147">Native controller + sensor map</text><text x="962" y="169">Reset identity + environment</text><text x="962" y="192">Same physical execution</text></g>
<g stroke="#78909e" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M259 130H329"/><path d="M563 130H633"/><path d="M868 130H939"/><path d="M1060 214V253H143V216"/></g>
<text x="407" y="274" font-size="11" fill="#637684">Allowed observations return to actor history · evaluator labels never returned to the actor</text>
<path d="M447 216V291H205V309" fill="none" stroke="#78909e" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/>
<rect x="28" y="313" width="355" height="150" rx="10" fill="#f3f8f5" stroke="#d4e4dc"/><rect x="423" y="313" width="355" height="150" rx="10" fill="#f3f8f5" stroke="#d4e4dc"/><rect x="818" y="313" width="355" height="150" rx="10" fill="#edf4f8" stroke="#c4d9e5"/>
<text x="49" y="342" font-size="15" font-weight="650">Append-only evidence</text><text x="444" y="342" font-size="15" font-weight="650">Independent replay + R2 archive</text><text x="839" y="342" font-size="15" font-weight="650">Offline process dashboard</text>
<g font-size="12" fill="#496574"><text x="49" y="370">events.jsonl · hash-chained event order</text><text x="49" y="392">trial.json · reset / source / config identity</text><text x="49" y="414">outcome.json · steps / outcome / usage</text><text x="49" y="436">Recorded calls, results and camera PNGs</text><text x="444" y="370">Replay original native action sequence</text><text x="444" y="392">independent-replay.json · trace receipt</text><text x="444" y="414">archive-receipt.json · per-file SHA-256</text><text x="444" y="436">Immutable trial archive; raw logs retained</text><text x="839" y="370">Verify hashes and event chain</text><text x="839" y="392">Extract original PNGs + exact prompts</text><text x="839" y="414">Build observation videos and event viewer</text><text x="839" y="436">No new policy or model calls</text></g>
<g stroke="#78909e" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M384 388H420"/><path d="M779 388H815"/></g>
<text x="28" y="506" font-size="11" fill="#637684">build_process_dashboard.py produces index.html + local recordings + PNGs + MP4s + SHA256SUMS.json in a self-contained ZIP.</text>
